<style>
:root {
  color-scheme: dark;
  --bg: #0b0a0d; --text: #f1e8d6; --dim: #bdb098; --gold: #f2dca2; --panel: rgba(18, 13, 10, 0.88);
  --line: rgba(201, 163, 92, 0.6); --btn: #2a1c10; --btn-on: #c99a4a; --ink: #140d06; --shadow: #000;
  --warn: #ffb08a;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--text); font: 14px/1.35 "Source Sans 3", "Segoe UI", Arial, sans-serif; }
#pvCanvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#pvLabels { position: fixed; inset: 0; pointer-events: none; }
.pv-label { position: absolute; transform: translate(-50%, 0); font-size: 11px; line-height: 1.15; text-align: center; color: var(--text); text-shadow: 0 1px 2px var(--shadow), 0 0 4px var(--shadow); white-space: nowrap; }
.pv-label b { color: var(--gold); font-weight: 600; font-size: 12px; }
.pv-label i { color: var(--dim); font-style: normal; }
.pv-label .pv-flag { color: var(--warn); }
#pvInfo { position: fixed; left: 12px; top: 12px; width: min(400px, calc(100vw - 24px)); max-height: calc(100vh - 24px); overflow: auto; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; font-size: 13px; box-sizing: border-box; }
#pvInfo h1 { margin: 0 0 6px; font: 600 24px/1 "Cormorant Garamond", Garamond, serif; color: var(--gold); }
#pvInfo h2 { margin: 10px 0 4px; font: 600 16px/1 "Cormorant Garamond", Garamond, serif; color: var(--gold); }
#pvInfo table { border-collapse: collapse; width: 100%; font-size: 12px; }
#pvInfo td { padding: 1px 4px 1px 0; vertical-align: top; }
#pvInfo td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
#pvInfo ul { margin: 2px 0 0; padding-left: 16px; color: var(--dim); font-size: 12px; }
#pvButtons button { margin: 6px 6px 0 0; padding: 4px 10px; background: var(--btn); color: var(--text); border: 1px solid var(--line); border-radius: 4px; cursor: pointer; font: inherit; }
#pvButtons button[aria-pressed="true"] { background: var(--btn-on); color: var(--ink); }
#pvButtons button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
#pvFocus { position: fixed; right: 12px; bottom: 12px; max-width: min(420px, calc(100vw - 24px)); padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
#pvFocus h2 { margin: 0 0 4px; font: 600 22px/1.1 "Cormorant Garamond", Garamond, serif; color: var(--gold); }
#pvFocus p { margin: 0; color: var(--dim); font-size: 13px; }
body.pv-shot #pvInfo, body.pv-shot #pvFocus { display: none; }
</style>
</head>

/* ---- 22-figures-geo.js ---- */
/* ==== 22-figures-geo.js — figure geometry: packed vertex layout, baked-figure decoding, placeholders, the round display
   base (three LODs), metrics and the category symbols. Figures are sculpted and baked offline (tools/figbake, see
   figura-minta/TECHNIQUE.md); the page only decodes assets/figures-baked/<id>.json. ==== */

/*
 * Packed vertex layout shared by every figure and base (TECHNIQUE.md 8 and 10):
 *   position  u16x3 normalised (dequantised by the per-LOD local matrix) or float32x3 (code-built meshes)
 *   aOct      i16x2 octahedral normal          aCol  u8x4 sRGB paint + front AO
 *   aPbr      u8x4 roughness, metalness, clearcoat, back-face AO (bases: a = 255 enamel ring, 128 medallion field)
 */

/** Level-of-detail indices and switching distances in metres (scaled per design size and quality preset). */
const FIG_LOD = { NEAR: 0, MID: 1, FAR: 2, nearDist: 1.45, midDist: 4.6, hysteresis: 0.12 };
const FIG_BAKED_URL = 'assets/figures-baked/';
/** Base geometry in bake cm: radius 3.0, height 1.5 (FIG_BASE_H), medallion centre on the front. */
const FIG_BASE_DIM = { r: 3.0, h: 1.5, medY: 0.72, medZ: 2.93, medR: 0.43 };

function figOctEncode(x, y, z, out, o) {
  const l1 = Math.abs(x) + Math.abs(y) + Math.abs(z) || 1;
  let u = x / l1;
  let v = y / l1;
  if (z < 0) {
    const ou = u;
    u = (1 - Math.abs(v)) * (ou >= 0 ? 1 : -1);
    v = (1 - Math.abs(ou)) * (v >= 0 ? 1 : -1);
  }
  out[o] = Math.round(Math.max(-1, Math.min(1, u)) * 32767);
  out[o + 1] = Math.round(Math.max(-1, Math.min(1, v)) * 32767);
}

function figOctDecode(a, b, out, o) {
  let x = a / 32767;
  let y = b / 32767;
  const z = 1 - Math.abs(x) - Math.abs(y);
  if (z < 0) {
    const ox = x;
    x = (1 - Math.abs(y)) * (ox >= 0 ? 1 : -1);
    y = (1 - Math.abs(ox)) * (y >= 0 ? 1 : -1);
  }
  const l = Math.hypot(x, y, z) || 1;
  out[o] = x / l;
  out[o + 1] = y / l;
  out[o + 2] = z / l;
}

/** Builds a packed BufferGeometry from typed arrays. */
function figPackedGeometry(position, posNormalized, oct, col, pbr, index) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(position, 3, posNormalized));
  g.setAttribute('aOct', new THREE.BufferAttribute(oct, 2, true));
  g.setAttribute('aCol', new THREE.BufferAttribute(col, 4, true));
  g.setAttribute('aPbr', new THREE.BufferAttribute(pbr, 4, true));
  g.setIndex(new THREE.BufferAttribute(index, 1));
  return g;
}

function figB64(s) {
  const bin = atob(s);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

/**
 * Decodes one mesh block of the sdf-figure format. Returns { geometry, dequant (cm -> cm matrix), tris, verts,
 * far (float copy for the far batch, only when keepFloat) }.
 */
function figDecodeBlock(block, materials, keepFloat) {
  const nV = block.counts.vertices;
  const { min, max } = block.bounds;
  const pos = new Uint16Array(figB64(block.attributes.position.data).buffer);
  const oct = new Int16Array(figB64(block.attributes.normal.data).buffer);
  const col = figB64(block.attributes.color.data);
  const mat = figB64(block.attributes.material.data);
  const back = block.attributes.aoBack ? figB64(block.attributes.aoBack.data) : new Uint8Array(nV);
  const idxBytes = figB64(block.index.data);
  const index = block.index.type === 'u16' ? new Uint16Array(idxBytes.buffer) : new Uint32Array(idxBytes.buffer);
  const pbr = new Uint8Array(nV * 4);
  for (let i = 0; i < nV; i++) {
    const m = materials[mat[i]] || materials[0];
    pbr[i * 4] = Math.round(m.rough * 255);
    pbr[i * 4 + 1] = Math.round((m.metal || 0) * 255);
    pbr[i * 4 + 2] = Math.round((m.coat ?? 0.5) * 255);
    pbr[i * 4 + 3] = figPbrByte(m, back[i]);
  }
  const geometry = figPackedGeometry(pos, true, oct, col, pbr, index);
  const dequant = new THREE.Matrix4().makeTranslation(min[0], min[1], min[2]).multiply(new THREE.Matrix4().makeScale(max[0] - min[0], max[1] - min[1], max[2] - min[2]));
  const out = { geometry, dequant, tris: index.length / 3, verts: nV, far: null };
  if (keepFloat) {
    const fp = new Float32Array(nV * 3);
    const fn = new Float32Array(nV * 3);
    for (let v = 0; v < nV; v++) {
      for (let c = 0; c < 3; c++) fp[v * 3 + c] = min[c] + (pos[v * 3 + c] / 65535) * (max[c] - min[c]);
      figOctDecode(oct[v * 2], oct[v * 2 + 1], fn, v * 3);
    }
    out.far = { pos: fp, nrm: fn, col, pbr, index };
  }
  return out;
}

/** Code-built meshes (bases, placeholders) packed into the shared layout. Positions in cm. */
class FigPaint {
  constructor() {
    this.items = [];
  }

  /** flag goes to aPbr.a (bases: 255 = enamel ring, 128 = medallion field). */
  add(geo, hex, rough = 0.5, metal = 0, coat = 0.5, flag = 0) {
    const g = geo.index ? geo.toNonIndexed() : geo;
    if (!g.attributes.normal) g.computeVertexNormals();
    const c = new THREE.Color(hex);
    this.items.push({ g, rgb: [Math.round(c.r * 255), Math.round(c.g * 255), Math.round(c.b * 255)], rough, metal, coat, flag });
    if (g !== geo) geo.dispose();
    return this;
  }

  /** Returns { geometry, far } with float positions (dequant = identity). */
  build() {
    let n = 0;
    for (const it of this.items) n += it.g.attributes.position.count;
    const pos = new Float32Array(n * 3);
    const nrm = new Float32Array(n * 3);
    const oct = new Int16Array(n * 2);
    const col = new Uint8Array(n * 4);
    const pbr = new Uint8Array(n * 4);
    const index = n < 65536 ? new Uint16Array(n) : new Uint32Array(n);
    let o = 0;
    for (const it of this.items) {
      const p = it.g.attributes.position;
      const nn = it.g.attributes.normal;
      for (let i = 0; i < p.count; i++, o++) {
        pos[o * 3] = p.getX(i);
        pos[o * 3 + 1] = p.getY(i);
        pos[o * 3 + 2] = p.getZ(i);
        nrm[o * 3] = nn.getX(i);
        nrm[o * 3 + 1] = nn.getY(i);
        nrm[o * 3 + 2] = nn.getZ(i);
        figOctEncode(nn.getX(i), nn.getY(i), nn.getZ(i), oct, o * 2);
        col[o * 4] = it.rgb[0];
        col[o * 4 + 1] = it.rgb[1];
        col[o * 4 + 2] = it.rgb[2];
        col[o * 4 + 3] = 255;
        pbr[o * 4] = it.rough * 255;
        pbr[o * 4 + 1] = it.metal * 255;
        pbr[o * 4 + 2] = it.coat * 255;
        pbr[o * 4 + 3] = it.flag;
        index[o] = o;
      }
      it.g.dispose();
    }
    this.items = [];
    const geometry = figPackedGeometry(pos, false, oct, col, pbr, index);
    return { geometry, dequant: new THREE.Matrix4(), tris: n / 3, verts: n, far: { pos, nrm, col, pbr, index } };
  }
}

function figXf(g, p = [0, 0, 0], r = [0, 0, 0], s = [1, 1, 1]) {
  const m = new THREE.Matrix4().compose(new THREE.Vector3(p[0], p[1], p[2]), new THREE.Quaternion().setFromEuler(new THREE.Euler(r[0], r[1], r[2])), new THREE.Vector3(s[0], s[1], s[2]));
  g.applyMatrix4(m);
  return g;
}

function figLathe(points, segs) {
  const g = new THREE.LatheGeometry(points.map(([r, y]) => new THREE.Vector2(Math.max(r, 0), y)), segs);
  g.computeVertexNormals();
  return g;
}

/* ---- the round display base ------------------------------------------------------------------- */

const FIG_GOLD = 0xe2b866;
const FIG_LACQUER = 0x1b120c;
const figBaseCache = [null, null, null];

/**
 * The shared base in bake cm (origin at the bottom centre, radius 3.0, height 1.5): black lacquered walnut, gilt
 * bezels, the enamel band (flag 255, coloured per category in the shader) and the front medallion (flag 128, the
 * category symbol from the atlas). lod 0 about 2k triangles, 1 about 600, 2 about 130.
 */
function figBuildBase(lod) {
  if (figBaseCache[lod]) return figBaseCache[lod];
  const segs = [48, 20, 10][lod];
  const P = new FigPaint();
  const D = FIG_BASE_DIM;
  const k = D.r / 3.53;
  const ky = D.h / 1.8;
  const S = (pts) => pts.map(([r, y]) => [r * k, y * ky]);
  const bands = lod === 2
    ? [
      [FIG_LACQUER, 0.24, 0, 0.8, 0, [[3.3, 0.0], [3.5, 0.08], [3.53, 0.5]]],
      [0xffffff, 0.15, 0, 1, 255, [[3.53, 0.5], [3.45, 1.2]]],
      [FIG_LACQUER, 0.24, 0, 0.8, 0, [[3.45, 1.2], [3.3, 1.65], [2.9, 1.8], [0.0, 1.8]]],
    ]
    : [
      [FIG_LACQUER, 0.22, 0, 1, 0, [[3.3, 0.0], [3.5, 0.08], [3.53, 0.42], [3.36, 0.535]]],
      [FIG_GOLD, 0.26, 1, 0, 0, [[3.36, 0.535], [3.425, 0.58], [3.36, 0.625]]],
      [0xffffff, 0.12, 0, 1, 255, [[3.36, 0.625], [3.43, 0.75], [3.43, 1.05], [3.36, 1.175]]],
      [FIG_GOLD, 0.26, 1, 0, 0, [[3.36, 1.175], [3.425, 1.22], [3.36, 1.265]]],
      [FIG_LACQUER, 0.22, 0, 1, 0, [[3.36, 1.265], [3.37, 1.42], [3.24, 1.68], [2.96, 1.8], [2.78, 1.8]]],
      [FIG_GOLD, 0.26, 1, 0, 0, [[2.78, 1.8], [2.72, 1.836], [2.66, 1.8]]],
      [FIG_LACQUER, 0.22, 0, 1, 0, [[2.66, 1.8], [0.0, 1.8]]],
    ];
  for (const [hex, rough, metal, coat, flag, pts] of bands) P.add(figLathe(S(pts), segs), hex, rough, metal, coat, flag);
  if (lod < 2) {
    /* Medallion: gilt rim and a lacquer field whose symbol comes from the atlas (flag 128) */
    const ms = lod === 0 ? 28 : 14;
    P.add(figXf(new THREE.TorusGeometry(D.medR, 0.06, lod === 0 ? 6 : 4, ms), [0, D.medY, D.medZ]), FIG_GOLD, 0.24, 1, 0, 0);
    P.add(figXf(new THREE.CircleGeometry(D.medR, ms), [0, D.medY, D.medZ + 0.025]), 0x16100c, 0.2, 0, 1, 128);
    P.add(figXf(new THREE.CylinderGeometry(D.medR, D.medR, 0.1, ms, 1, true), [0, D.medY, D.medZ - 0.03], [Math.PI / 2, 0, 0]), FIG_GOLD, 0.3, 1, 0, 0);
  }
  figBaseCache[lod] = P.build();
  return figBaseCache[lod];
}

/** DESIGN.md 16.5: shared round base (lod 0), origin at the base bottom centre, in metres. */
function buildBaseGeometry() {
  const b = figBuildBase(0);
  if (!b.geometryM) {
    b.geometryM = b.geometry.clone();
    b.geometryM.scale(FIG_CM, FIG_CM, FIG_CM);
  }
  return b.geometryM;
}

/* ---- placeholders (shown only until the baked file of a design has arrived, or if it fails) ------- */

function figPlaceholder(d) {
  const P = new FigPaint();
  const h = d.nominalH;
  const tint = d.category === 'tower' ? FIG_CATEGORIES[FIG_CATEGORY_INDEX[d.house]]?.color || '#d4a84a'
    : d.category === 'special' ? '#6b5a48' : FIG_CATEGORIES[FIG_CATEGORY_INDEX[d.category]].color;
  const houses = ['gryffindor', 'slytherin', 'ravenclaw', 'hufflepuff', 'special'];
  if (houses.includes(d.category) || d.category === 'ghosts_elves') {
    P.add(figLathe([[0, 0], [1.6, 0], [1.4, h * 0.35], [1.0, h * 0.72], [0.4, h * 0.8], [0, h * 0.8]], 14), 0x1d1d23, 0.7, 0, 0);
    P.add(figXf(new THREE.SphereGeometry(h * 0.075, 12, 8), [0, h * 0.89, 0]), 0xeab896, 0.6, 0, 0);
    P.add(figXf(new THREE.TorusGeometry(1.2, 0.18, 6, 16), [0, h * 0.74, 0], [Math.PI / 2, 0, 0]), tint, 0.6, 0, 0);
  } else if (d.category === 'creatures' || d.category === 'pets') {
    P.add(figXf(new THREE.SphereGeometry(1, 14, 10), [0, h * 0.45, 0], [0, 0, 0], [h * 0.28, h * 0.42, h * 0.4]), tint, 0.6, 0, 0.2);
    P.add(figXf(new THREE.SphereGeometry(h * 0.18, 12, 8), [0, h * 0.85, h * 0.12]), tint, 0.6, 0, 0.2);
  } else {
    P.add(figLathe([[0, 0], [1.4, 0], [1.2, h * 0.2], [0.6, h * 0.5], [1.3, h * 0.85], [0, h]], 14), tint, 0.35, 0.6, 0.5);
  }
  return P.build();
}

/* ---- per-design geometry store ------------------------------------------------------------------ */

/** id -> { lods: [entry, entry, entry], baked, ghost, materials }; entry = figDecodeBlock() result. */
const FIG_GEO = {};
const FIG_LOAD = { started: false, done: false, loaded: 0, failed: [], total: 0, listeners: new Set(), promise: null, resolve: null, ms: 0 };

function figGeo(id) {
  let g = FIG_GEO[id];
  if (!g) {
    const ph = figPlaceholder(FIG_BY_ID[id]);
    g = FIG_GEO[id] = { lods: [ph, ph, ph], baked: false, ghost: !!FIG_BY_ID[id].translucent };
  }
  return g;
}

/** Starts fetching every baked design (3 at a time, cheapest-first by shelf order). Never rejects. */
function figStartLoading() {
  if (FIG_LOAD.started) return FIG_LOAD.promise;
  FIG_LOAD.started = true;
  FIG_LOAD.promise = new Promise((res) => {
    FIG_LOAD.resolve = res;
  });
  const ids = FIG_DESIGNS.map((d) => d.id).filter((id) => typeof FIG_BAKED_META !== 'undefined' && FIG_BAKED_META[id]);
  FIG_LOAD.total = ids.length;
  const t0 = performance.now();
  let next = 0;
  let active = 0;
  const finish = () => {
    if (FIG_LOAD.done) return;
    FIG_LOAD.done = true;
    FIG_LOAD.ms = Math.round(performance.now() - t0);
    for (const l of FIG_LOAD.listeners) l.onAllLoaded?.();
    FIG_LOAD.resolve(FIG_LOAD.loaded);
  };
  const pump = () => {
    while (active < 3 && next < ids.length) {
      const id = ids[next++];
      active++;
      fetch(FIG_BAKED_URL + id + '.json')
        .then((r) => {
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          return r.json();
        })
        .then((json) => figAcceptBaked(id, json))
        .catch((err) => {
          FIG_LOAD.failed.push(id);
          console.warn('[figures] baked figure failed', id, err);
        })
        .finally(() => {
          active--;
          if (next >= ids.length && active === 0) finish();
          else pump();
        });
    }
  };
  if (!ids.length) finish();
  else pump();
  return FIG_LOAD.promise;
}

/** Resolves (never rejects) once every baked figure has arrived or failed; the page may await it while loading. */
function figWhenLoaded() {
  return figStartLoading();
}

function figAcceptBaked(id, json) {
  const lods = [figDecodeBlock(json, json.materials, false)];
  const blocks = json.lods || [];
  lods.push(blocks[0] ? figDecodeBlock(blocks[0], json.materials, false) : lods[0]);
  lods.push(blocks[1] ? figDecodeBlock(blocks[1], json.materials, true) : figDecodeBlock(blocks[0] || json, json.materials, true));
  const g = figGeo(id);
  g.lods = lods;
  g.baked = true;
  FIG_LOAD.loaded++;
  for (const l of FIG_LOAD.listeners) l.onDesignLoaded?.(id);
}

/** DESIGN.md 16.5: geometry of one design without the base, in metres, origin at the base top. Never throws. */
function buildFigureGeometry(designId) {
  figStartLoading();
  const d = FIG_BY_ID[designId];
  if (!d) throw new Error(`[figures] unknown design ${designId}`);
  const g = figGeo(designId);
  const e = g.lods[0];
  if (!e.geometryM) {
    e.geometryM = e.geometry.clone();
    e.geometryM.applyMatrix4(new THREE.Matrix4().makeScale(FIG_CM, FIG_CM, FIG_CM).multiply(e.dequant));
    e.geometryM.computeBoundingSphere();
  }
  const met = getFigureMetrics(designId);
  return { opaque: g.ghost ? null : e.geometryM, translucent: g.ghost ? e.geometryM : null, height: met.figH, radius: met.radius, tris: e.tris, baked: g.baked };
}

const figMetricsCache = {};

/** DESIGN.md 16.5: layout and picking metrics in pose space (metres, relative to the base bottom centre). */
function getFigureMetrics(designId) {
  const c = figMetricsCache[designId];
  if (c) return c;
  const d = FIG_BY_ID[designId];
  const m = typeof FIG_BAKED_META !== 'undefined' ? FIG_BAKED_META[designId] : null;
  const hCm = m ? m.h : d.nominalH;
  const rCm = m ? Math.min(m.r, Math.max(m.rx, m.rz)) : d.nominalH * 0.22;
  const baseH = d.ownBase ? 0 : FIG_BASE_H;
  const baseR = d.ownBase ? 0 : d.baseR * FIG_MM;
  const figH = hCm * FIG_CM;
  const totalH = baseH + figH;
  const radius = Math.max(baseR, rCm * FIG_CM);
  const pickR = Math.max(0.05, Math.min(0.12, 0.5 * Math.hypot(totalH, radius * 2)));
  const res = { totalH, figH, baseR, baseH, radius, centerY: totalH * 0.5, pickR };
  figMetricsCache[designId] = res;
  return res;
}

/* ---- category symbols ------------------------------------------------------------------------- */

/** Draws a category symbol into a 2D canvas: (x, y) = top-left corner, size = edge length in px. */
function drawCategorySymbol(ctx, key, x, y, size, opts = {}) {
  const path = FIG_SYMBOL_PATHS[key];
  if (!path) return;
  const pad = opts.padding || 0;
  const s = (size - pad * 2) / 24;
  ctx.save();
  ctx.translate(x + pad, y + pad);
  ctx.scale(s, s);
  const p = new Path2D(path);
  const cat = FIG_CATEGORIES[FIG_CATEGORY_INDEX[key]];
  if (cat && cat.symbolStyle === 'stroke') {
    ctx.strokeStyle = opts.color || '#ffffff';
    ctx.lineWidth = (opts.lineWidth || size / 15) / s;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke(p);
  } else {
    ctx.fillStyle = opts.color || '#ffffff';
    ctx.fill(p, 'evenodd');
  }
  ctx.restore();
}

let figAtlasTex = null;

/** 1024 x 256 symbol atlas: 8 x 2 cells of 128 px, cell index = category index, white symbols on black. */
function figSymbolAtlas() {
  if (figAtlasTex) return figAtlasTex;
  const c = document.createElement('canvas');
  c.width = 1024;
  c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, 1024, 256);
  for (const cat of FIG_CATEGORIES) {
    const cx = (cat.index % 8) * 128;
    const cy = Math.floor(cat.index / 8) * 128;
    drawCategorySymbol(ctx, cat.key, cx, cy, 128, { color: '#fff', padding: 14, lineWidth: 128 / 11 });
  }
  figAtlasTex = new THREE.CanvasTexture(c);
  figAtlasTex.colorSpace = THREE.NoColorSpace;
  figAtlasTex.anisotropy = 4;
  figAtlasTex.generateMipmaps = true;
  figAtlasTex.minFilter = THREE.LinearMipmapLinearFilter;
  return figAtlasTex;
}

/* ---- 23-figures-mat.js ---- */
/* ==== 23-figures-mat.js — figure materials: the shared painted-resin material (TECHNIQUE.md 10), the ghost material
   and the base material (category enamel band + embossed-looking gold symbol from the atlas). All read the packed
   attributes; per instance `figInst` = (unused, Lumos glow, flash, shelf shimmer). ==== */

const FIG_MATERIALS = {};
/** Shared uniforms: animation time (shimmer) and the ghost opacity. */
const FIG_UNIFORMS = { time: { value: 0 }, ghostAlpha: { value: 1 } };

const FIG_SHADER_VERT_HEAD = [
  'attribute vec2 aOct;',
  'attribute vec4 aCol;',
  'attribute vec4 aPbr;',
  'attribute vec4 figInst;',
  'varying vec4 vFigCol;',
  'varying vec4 vFigPbr;',
  'varying vec4 vFigInst;',
  'vec3 figOctDecode(vec2 e) {',
  '  vec3 v = vec3(e, 1.0 - abs(e.x) - abs(e.y));',
  '  if (v.z < 0.0) v.xy = (1.0 - abs(v.yx)) * vec2(v.x >= 0.0 ? 1.0 : -1.0, v.y >= 0.0 ? 1.0 : -1.0);',
  '  return normalize(v);',
  '}',
].join('\n');

/**
 * Patches a MeshStandardMaterial / MeshPhysicalMaterial for the packed layout. kind: 'figure' | 'ghost' | 'base'.
 * aPbr.a: figures = back-face AO (0..200) or glow (201..255); bases = 1.0 enamel ring, 0.5 medallion field.
 */
function figPatchMaterial(mat, kind) {
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uFigTime = FIG_UNIFORMS.time;
    if (kind === 'base') sh.uniforms.uFigAtlas = { value: figSymbolAtlas() };
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', [
        '#include <common>',
        FIG_SHADER_VERT_HEAD,
        kind === 'base' ? 'attribute vec4 figBaseCat;\nvarying vec4 vFigBaseCat;\nvarying vec3 vFigLocal;' : '',
      ].join('\n'))
      .replace('#include <beginnormal_vertex>', 'vec3 objectNormal = figOctDecode(aOct);')
      .replace('#include <begin_vertex>', [
        '#include <begin_vertex>',
        'vFigCol = aCol;',
        'vFigPbr = aPbr;',
        'vFigInst = figInst;',
        kind === 'base' ? 'vFigBaseCat = figBaseCat;\nvFigLocal = position;' : '',
      ].join('\n'));
    const D = FIG_BASE_DIM;
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', [
        '#include <common>',
        'varying vec4 vFigCol;',
        'varying vec4 vFigPbr;',
        'varying vec4 vFigInst;',
        'uniform float uFigTime;',
        kind === 'base' ? 'varying vec4 vFigBaseCat;\nvarying vec3 vFigLocal;\nuniform sampler2D uFigAtlas;' : '',
      ].join('\n'))
      .replace('#include <color_fragment>', [
        '#include <color_fragment>',
        /* clamp: with MSAA the varyings are extrapolated at triangle edges, and pow() of a negative base gives NaN, which
           the bloom blur would then smear over the whole frame */
        'vec3 figSrgb = clamp(vFigCol.rgb, 0.0, 1.0);',
        'vec3 figLin = mix(figSrgb / 12.92, pow((figSrgb + 0.055) / 1.055, vec3(2.4)), step(0.04045, figSrgb));',
        'float figPa = vFigPbr.a * 255.0;',
        kind === 'base'
          ? [
            'float figRing = step(0.9, vFigPbr.a);',
            'float figMed = step(0.4, vFigPbr.a) * (1.0 - figRing);',
            'float figSym = 0.0;',
            'if (figMed > 0.5) {',
            `  vec2 lu = vec2(vFigLocal.x / ${(2 * D.medR).toFixed(4)} + 0.5, (vFigLocal.y - ${D.medY.toFixed(4)}) / ${(2 * D.medR).toFixed(4)} + 0.5);`,
            '  lu = clamp(lu, 0.02, 0.98);',
            '  float cell = floor(vFigBaseCat.w + 0.5);',
            '  vec2 au = vec2((mod(cell, 8.0) + lu.x) / 8.0, 1.0 - (floor(cell / 8.0) + 1.0) * 0.5 + lu.y * 0.5);',
            '  figSym = smoothstep(0.35, 0.65, texture2D(uFigAtlas, au).r);',
            '}',
            'figLin = mix(figLin, vFigBaseCat.rgb, figRing);',
            'figLin = mix(figLin, vec3(0.80, 0.56, 0.24), figSym);',
          ].join('\n')
          : '',
        kind === 'ghost' ? 'figLin = mix(figLin, vec3(0.62, 0.74, 1.0), 0.55);' : '',
        'diffuseColor.rgb *= figLin;',
      ].join('\n'))
      .replace('#include <roughnessmap_fragment>', [
        '#include <roughnessmap_fragment>',
        'roughnessFactor = max(vFigPbr.x, 0.04);',
        kind === 'base' ? 'roughnessFactor = mix(roughnessFactor, 0.22, figSym);' : '',
      ].join('\n'))
      .replace('#include <metalnessmap_fragment>', [
        '#include <metalnessmap_fragment>',
        'metalnessFactor = vFigPbr.y;',
        kind === 'base' ? 'metalnessFactor = mix(metalnessFactor, 1.0, figSym);' : '',
      ].join('\n'))
      .replace('#include <normal_fragment_maps>', [
        '#include <normal_fragment_maps>',
        kind === 'base' ? 'if (figMed > 0.5) { vec2 g = vec2(dFdx(figSym), dFdy(figSym)); normal = normalize(normal - vec3(g * 1.4, 0.0)); }' : '',
      ].join('\n'))
      .replace('#include <lights_physical_fragment>', [
        '#include <lights_physical_fragment>',
        '#ifdef USE_CLEARCOAT',
        kind === 'base' ? 'material.clearcoat = vFigPbr.z * (1.0 - figSym);' : 'material.clearcoat = vFigPbr.z;',
        '#endif',
      ].join('\n'))
      .replace('#include <aomap_fragment>', [
        '#include <aomap_fragment>',
        '{',
        kind === 'base'
          ? '  float bakedAo = 1.0;'
          : '  float bakedAo = clamp(gl_FrontFacing ? vFigCol.a : min(figPa / 200.0, 1.0), 0.0, 1.0);',
        '  reflectedLight.indirectDiffuse *= bakedAo;',
        '  float bakedNV = saturate(dot(geometryNormal, geometryViewDir));',
        '  reflectedLight.indirectSpecular *= computeSpecularOcclusion(bakedNV, bakedAo, material.roughness);',
        '  float bakedDirect = mix(1.0, bakedAo, 0.4);',
        '  reflectedLight.directDiffuse *= bakedDirect;',
        '  reflectedLight.directSpecular *= bakedDirect;',
        '  float matt = smoothstep(0.62, 0.9, vFigPbr.x);',
        '  reflectedLight.indirectSpecular *= mix(1.0, 0.2, matt);',
        '  reflectedLight.directSpecular *= mix(1.0, 0.4, matt);',
        '  #ifdef USE_CLEARCOAT',
        '    clearcoatSpecularIndirect *= mix(1.0, bakedAo, 0.85);',
        '    clearcoatSpecularDirect *= bakedDirect;',
        '  #endif',
        '}',
      ].join('\n'))
      .replace('#include <emissivemap_fragment>', [
        '#include <emissivemap_fragment>',
        /* bases: a gentle self-lit lift on the enamel band so dark category colours (Ravenclaw blue, Hallows black)
           still read on the black lacquer at TV distance */
        kind === 'base' ? 'totalEmissiveRadiance += vFigBaseCat.rgb * figRing * 0.45 + vec3(0.02) * figRing;' : 'totalEmissiveRadiance += figLin * max(figPa - 200.0, 0.0) / 55.0 * 2.2;',
        kind === 'ghost' ? 'totalEmissiveRadiance += figLin * 0.22;' : '',
        'totalEmissiveRadiance += vFigInst.y * vec3(1.0, 0.82, 0.45) * 0.55 + vFigInst.z * vec3(1.2);',
        'totalEmissiveRadiance += vFigInst.w * vec3(1.0, 0.78, 0.35) * 0.6 * (0.5 + 0.5 * sin(uFigTime * 6.0 + vViewPosition.y * 40.0));',
      ].join('\n'));
    if (kind === 'ghost') {
      sh.fragmentShader = sh.fragmentShader.replace('#include <opaque_fragment>', [
        '#include <opaque_fragment>',
        '{',
        '  float fr = pow(clamp(1.0 - abs(dot(normalize(normal), normalize(vViewPosition))), 0.0, 1.0), 2.0);',
        '  gl_FragColor.rgb += vec3(0.45, 0.6, 1.0) * fr * 0.45;',
        '  gl_FragColor.a = clamp(0.34 + 0.6 * fr, 0.0, 0.92);',
        '}',
      ].join('\n'));
    }
  };
  mat.customProgramCacheKey = () => `fig-packed-${kind}-v1`;
  return mat;
}

function figMakeMaterial(kind, physical) {
  /* Figures are double-sided: robes, sleeves and cloaks are open cloth sheets with their own back-face AO */
  const common = { roughness: 0.5, metalness: 0, envMapIntensity: 1.0, side: kind === 'figure' ? THREE.DoubleSide : THREE.FrontSide };
  let m;
  if (kind === 'ghost') m = new THREE.MeshStandardMaterial({ ...common, transparent: true, depthWrite: true });
  else if (physical) m = new THREE.MeshPhysicalMaterial({ ...common, clearcoat: 1, clearcoatRoughness: 0.12 });
  else m = new THREE.MeshStandardMaterial(common);
  return figPatchMaterial(m, kind);
}

/**
 * Depth-only pre-pass for translucent figures (ghosts, the cloak): drawn just before the ghost colour pass (both in
 * the transparent list), so only the frontmost ghost surface is shaded and inner faces no longer shine through as
 * hard-edged shards.
 */
function figGhostDepthMaterial() {
  if (!FIG_MATERIALS.ghostDepth) {
    FIG_MATERIALS.ghostDepth = new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: true, transparent: true, side: THREE.FrontSide });
  }
  return FIG_MATERIALS.ghostDepth;
}

/** DESIGN.md 16.5: creates the shared materials once. Keys: figure, figureKit, glass, glassKit, base. */
function initFigureMaterials(opts = { quality: 'magas' }) {
  if (!FIG_MATERIALS.figurePhys) {
    FIG_MATERIALS.figurePhys = figMakeMaterial('figure', true);
    FIG_MATERIALS.figureStd = figMakeMaterial('figure', false);
    FIG_MATERIALS.basePhys = figMakeMaterial('base', true);
    FIG_MATERIALS.baseStd = figMakeMaterial('base', false);
    FIG_MATERIALS.glass = figMakeMaterial('ghost', false);
    FIG_MATERIALS.glassKit = FIG_MATERIALS.glass;
  }
  figApplyQuality(opts.quality || FIG_MATERIALS.quality || 'magas');
  return FIG_MATERIALS;
}

/** 'xbox' uses MeshStandardMaterial (no clearcoat lobe); 'magas' the physical clearcoat version. */
function figApplyQuality(q) {
  const phys = q !== 'xbox';
  FIG_MATERIALS.quality = q;
  FIG_MATERIALS.figure = phys ? FIG_MATERIALS.figurePhys : FIG_MATERIALS.figureStd;
  FIG_MATERIALS.figureKit = FIG_MATERIALS.figure;
  FIG_MATERIALS.base = phys ? FIG_MATERIALS.basePhys : FIG_MATERIALS.baseStd;
}

/** Packs a palette material table into the aPbr bytes (glow wins over back-face AO). */
function figPbrByte(m, back) {
  if (m && m.glow > 0) return 201 + Math.round(Math.min(1, m.glow) * 54);
  return Math.round((back / 255) * 200);
}

/* ---- 24-figures-kit.js ---- */
/* ==== 24-figures-kit.js — figure rendering: the LOD kit for every figurine in the game, the single-design instancer,
   external (artist-made) model support and the free-flying Snitch.

   Rendering per frame (DECISIONS.md 5):
   - every visible handle gets a LOD by camera distance (with hysteresis, scaled by figure size and quality preset);
   - near and mid instances are CPU frustum-culled and written into one InstancedMesh per design and LOD (draw calls =
     designs in view), plus one base InstancedMesh per LOD;
   - far instances (and their bases) live in one CPU-transformed batch mesh (1 draw, 2 with ghosts): a handle's slot is
     rewritten only when it enters the far range or moves while far. ==== */

const figM1 = new THREE.Matrix4();
const figM2 = new THREE.Matrix4();
const figM3 = new THREE.Matrix4();
const figV1 = new THREE.Vector3();
const figV2 = new THREE.Vector3();
const figS1 = new THREE.Vector3();
const figQ1 = new THREE.Quaternion();
const figPS = new THREE.Matrix4();
const figFrustum = new THREE.Frustum();
const figSphere = new THREE.Sphere();
const figCol1 = new THREE.Color();

/** Geometry for one InstancedMesh: shares the packed attributes of `src` and adds its own instance attributes. */
function figInstGeometry(src, attrs) {
  const g = new THREE.BufferGeometry();
  for (const k of ['position', 'aOct', 'aCol', 'aPbr']) g.setAttribute(k, src.attributes[k]);
  g.setIndex(src.index);
  for (const k of Object.keys(attrs)) g.setAttribute(k, attrs[k]);
  g.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 1e4);
  return g;
}

function figInstAttr(cap, size) {
  const a = new THREE.InstancedBufferAttribute(new Float32Array(Math.max(1, cap) * size), size);
  a.setUsage(THREE.DynamicDrawUsage);
  return a;
}

function figInstanced(geo, mat, cap) {
  const m = new THREE.InstancedMesh(geo, mat, Math.max(1, cap));
  m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  m.count = 0;
  m.frustumCulled = false;
  m.castShadow = false;
  m.receiveShadow = true;
  m.matrixAutoUpdate = false;
  return m;
}

/** Marks the first `n` instances of an attribute for upload (only the used range goes to the GPU). */
function figUpload(attr, n, itemSize) {
  if (n <= 0) return;
  attr.clearUpdateRanges();
  attr.addUpdateRange(0, n * itemSize);
  attr.needsUpdate = true;
}

/** Local matrix of a design LOD: lift onto the base, cm -> m, dequantisation. */
function figLocalMatrix(entry, baseH, out = new THREE.Matrix4()) {
  out.makeTranslation(0, baseH, 0);
  figM3.makeScale(FIG_CM, FIG_CM, FIG_CM);
  out.multiply(figM3).multiply(entry.dequant);
  return out;
}

/* ---- far batch ----------------------------------------------------------------------------------- */

/**
 * One non-instanced mesh holding the far LOD of many handles. slots: [{ h, parts: [{ src: far data, local: Matrix4,
 * ring: [r, g, b] | null }] }]. Each slot is written (transformed) or collapsed independently.
 */
function figCreateFarBatch(material, slots, n) {
  let nv = 0;
  let ni = 0;
  for (const s of slots) {
    s.start = nv;
    for (const p of s.parts) {
      p.start = nv;
      nv += p.src.pos.length / 3;
      ni += p.src.index.length;
    }
    s.count = nv - s.start;
  }
  const pos = new Float32Array(Math.max(3, nv * 3));
  const oct = new Int16Array(Math.max(2, nv * 2));
  const col = new Uint8Array(Math.max(4, nv * 4));
  const pbr = new Uint8Array(Math.max(4, nv * 4));
  const fx = new Uint8Array(Math.max(4, nv * 4));
  const index = nv < 65536 ? new Uint16Array(Math.max(3, ni)) : new Uint32Array(Math.max(3, ni));
  let io = 0;
  for (const s of slots) {
    for (const p of s.parts) {
      const src = p.src;
      const cnt = src.pos.length / 3;
      col.set(src.col.subarray(0, cnt * 4), p.start * 4);
      pbr.set(src.pbr.subarray(0, cnt * 4), p.start * 4);
      if (p.ring) {
        /* Base: enamel band in the category colour, flags cleared (the figure shader would read them as glow) */
        for (let v = 0; v < cnt; v++) {
          const o = (p.start + v) * 4;
          if (src.pbr[v * 4 + 3] === 255) {
            col[o] = p.ring[0];
            col[o + 1] = p.ring[1];
            col[o + 2] = p.ring[2];
          }
          pbr[o + 3] = 200;
        }
      }
      for (let i = 0; i < src.index.length; i++) index[io++] = src.index[i] + p.start;
    }
  }
  const g = new THREE.BufferGeometry();
  const aPos = new THREE.BufferAttribute(pos, 3);
  const aOct = new THREE.BufferAttribute(oct, 2, true);
  const aFx = new THREE.BufferAttribute(fx, 4, true);
  for (const a of [aPos, aOct, aFx]) a.setUsage(THREE.DynamicDrawUsage);
  g.setAttribute('position', aPos);
  g.setAttribute('aOct', aOct);
  g.setAttribute('aCol', new THREE.BufferAttribute(col, 4, true));
  g.setAttribute('aPbr', new THREE.BufferAttribute(pbr, 4, true));
  g.setAttribute('figInst', aFx);
  g.setIndex(new THREE.BufferAttribute(index, 1));
  g.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 1e4);
  const mesh = new THREE.Mesh(g, material);
  mesh.frustumCulled = false;
  mesh.matrixAutoUpdate = false;
  mesh.receiveShadow = true;
  const slotOf = new Int32Array(n).fill(-1);
  slots.forEach((s, i) => {
    slotOf[s.h] = i;
  });
  const dirty = [];
  const on = new Uint8Array(slots.length);
  const batch = {
    mesh, slots, slotOf, tris: io / 3, verts: nv, liveTris: 0,
    has(h) {
      return slotOf[h] >= 0;
    },
    /** Writes handle h with world matrix hm (pose space -> world) and fx bytes. */
    write(h, hm, glow, flash, shimmer) {
      const si = slotOf[h];
      if (si < 0) return;
      const s = slots[si];
      for (const p of s.parts) {
        figM1.multiplyMatrices(hm, p.local);
        const e = figM1.elements;
        const src = p.src;
        const cnt = src.pos.length / 3;
        for (let v = 0; v < cnt; v++) {
          const x = src.pos[v * 3];
          const y = src.pos[v * 3 + 1];
          const z = src.pos[v * 3 + 2];
          const o = (p.start + v) * 3;
          pos[o] = e[0] * x + e[4] * y + e[8] * z + e[12];
          pos[o + 1] = e[1] * x + e[5] * y + e[9] * z + e[13];
          pos[o + 2] = e[2] * x + e[6] * y + e[10] * z + e[14];
          const nx = src.nrm[v * 3];
          const ny = src.nrm[v * 3 + 1];
          const nz = src.nrm[v * 3 + 2];
          figOctEncode(e[0] * nx + e[4] * ny + e[8] * nz, e[1] * nx + e[5] * ny + e[9] * nz, e[2] * nx + e[6] * ny + e[10] * nz, oct, (p.start + v) * 2);
        }
      }
      const g8 = Math.round(glow * 255);
      const f8 = Math.round(flash * 255);
      const s8 = Math.round(shimmer * 255);
      for (let v = s.start; v < s.start + s.count; v++) {
        fx[v * 4 + 1] = g8;
        fx[v * 4 + 2] = f8;
        fx[v * 4 + 3] = s8;
      }
      if (!on[si]) batch.liveTris += s.tris || 0;
      on[si] = 1;
      dirty.push(si);
    },
    collapse(h) {
      const si = slotOf[h];
      if (si < 0 || !on[si]) return;
      const s = slots[si];
      pos.fill(0, s.start * 3, (s.start + s.count) * 3);
      on[si] = 0;
      batch.liveTris -= s.tris || 0;
      dirty.push(si);
    },
    isOn(h) {
      const si = slotOf[h];
      return si >= 0 && on[si] === 1;
    },
    flush() {
      if (!dirty.length) return;
      if (dirty.length > slots.length * 0.3) {
        for (const a of [aPos, aOct, aFx]) {
          a.clearUpdateRanges();
          a.needsUpdate = true;
        }
      } else {
        for (const si of dirty) {
          const s = slots[si];
          aPos.addUpdateRange(s.start * 3, s.count * 3);
          aOct.addUpdateRange(s.start * 2, s.count * 2);
          aFx.addUpdateRange(s.start * 4, s.count * 4);
        }
        aPos.needsUpdate = true;
        aOct.needsUpdate = true;
        aFx.needsUpdate = true;
      }
      dirty.length = 0;
    },
    dispose() {
      g.dispose();
    },
  };
  for (const s of slots) {
    let t = 0;
    for (const p of s.parts) t += p.src.index.length / 3;
    s.tris = t;
  }
  return batch;
}

/* ---- external material patch (glow / flash / shimmer on artist-made models) -------------------------- */

function figPatchExternal(mat) {
  mat.envMapIntensity = 1.0;
  for (const k of ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'aoMap', 'emissiveMap']) if (mat[k]) mat[k].anisotropy = 8;
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uFigTime = FIG_UNIFORMS.time;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nattribute vec4 figInst;\nvarying vec4 vFigInst;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvFigInst = figInst;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying vec4 vFigInst;\nuniform float uFigTime;')
      .replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\ntotalEmissiveRadiance += vFigInst.y * vec3(1.0, 0.82, 0.45) * 0.55 + vFigInst.z * vec3(1.2) + vFigInst.w * vec3(1.0, 0.78, 0.35) * 0.6 * (0.5 + 0.5 * sin(uFigTime * 6.0 + vViewPosition.y * 40.0));');
  };
  mat.customProgramCacheKey = () => `fig-ext-${mat.uuid}`;
  mat.needsUpdate = true;
  return mat;
}

/* ---- the kit -------------------------------------------------------------------------------------- */

/**
 * DESIGN.md 16.5 high-level renderer. designOf[h] = design id of handle h. Every handle starts HIDDEN.
 * opts: { quality: 'xbox' | 'magas' }. Extras beyond the design API: setCamera(camera), update(t, camera),
 * registerExternalFigure(designId, { meshesByMaterial }), whenLoaded().
 */
function createFigureKit(scene, designOf, opts = {}) {
  initFigureMaterials(opts);
  figStartLoading();
  const n = designOf.length;
  const recs = [];
  const recById = {};
  const designIdx = new Int16Array(n);
  for (let h = 0; h < n; h++) {
    const id = designOf[h];
    let r = recById[id];
    if (!r) {
      const d = FIG_BY_ID[id];
      if (!d) throw new Error(`[figures] unknown design ${id}`);
      const cat = FIG_CATEGORIES[FIG_CATEGORY_INDEX[d.category]];
      const catHex = cat ? cat.color : (d.house ? FIG_CATEGORIES[FIG_CATEGORY_INDEX[d.house]].color : '#8e8169');
      figCol1.set(catHex);
      const srgb = [Math.round(figCol1.r * 255), Math.round(figCol1.g * 255), Math.round(figCol1.b * 255)];
      figCol1.convertSRGBToLinear();
      r = recById[id] = {
        id, d, met: getFigureMetrics(id), ghost: !!d.translucent, handles: [], index: recs.length, meshes: [null, null], cnt: [0, 0],
        sig: [0, 0], prevSig: [0, 0], dirty: [0, 0], force: [1, 1],
        local: [new THREE.Matrix4(), new THREE.Matrix4(), new THREE.Matrix4()], ext: null, catIndex: cat ? cat.index : 0,
        ringLin: [figCol1.r, figCol1.g, figCol1.b], ringSrgb: srgb, hasBase: !d.ownBase, baseScale: d.ownBase ? 1 : d.baseR / 30,
      };
      recs.push(r);
    }
    designIdx[h] = r.index;
    r.handles.push(h);
  }
  const quality = { q: opts.quality || 'magas', dist: opts.quality === 'xbox' ? 1 : 1.3 };
  const mode = new Uint8Array(n);
  const hm = new Float32Array(n * 16);
  const pos = new Float32Array(n * 3);
  const quat = new Float32Array(n * 4);
  const scl = new Float32Array(n).fill(1);
  const poseDirty = new Uint8Array(n).fill(1);
  const fx = new Float32Array(n * 2);
  const fxDirty = new Uint8Array(n);
  const baseOn = new Uint8Array(n).fill(1);
  const lod = new Int8Array(n).fill(-1);
  const center = new Float32Array(n * 4);
  const shimmer = new Float32Array(FIG_CATEGORIES.length);
  const shimmerPrev = new Float32Array(FIG_CATEGORIES.length);
  for (let h = 0; h < n; h++) {
    quat[h * 4 + 3] = 1;
  }
  const meshes = [];
  const group = new THREE.Group();
  group.name = 'figures';
  group.matrixAutoUpdate = false;
  scene.add(group);

  function figMat(r) {
    return r.ghost ? FIG_MATERIALS.glass : FIG_MATERIALS.figure;
  }

  function buildRecMeshes(r) {
    const geo = figGeo(r.id);
    for (let l = 0; l < 2; l++) {
      const e = geo.lods[l];
      figLocalMatrix(e, r.met.baseH, r.local[l]);
      const inst = r.meshes[l] ? r.meshes[l].geometry.attributes.figInst : figInstAttr(r.handles.length, 4);
      const g = figInstGeometry(e.geometry, { figInst: inst });
      if (r.meshes[l]) {
        r.meshes[l].geometry.dispose();
        r.meshes[l].geometry = g;
        if (r.depth) r.depth[l].geometry = g;
      } else {
        const m = figInstanced(g, figMat(r), r.handles.length);
        m.name = `fig:${r.id}:${l}`;
        m.renderOrder = r.ghost ? 2 : 0;
        m.visible = false;
        r.meshes[l] = m;
        meshes.push(m);
        group.add(m);
        if (r.ghost) {
          // Depth pre-pass twin: shares the geometry and the instance matrices of the ghost mesh.
          const dm = figInstanced(g, figGhostDepthMaterial(), 1);
          dm.instanceMatrix = m.instanceMatrix;
          dm.name = `fig:${r.id}:${l}:depth`;
          dm.renderOrder = 1;
          dm.visible = false;
          dm.receiveShadow = false;
          if (!r.depth) r.depth = [null, null];
          r.depth[l] = dm;
          group.add(dm);
        }
      }
      r.tris[l] = e.tris;
      r.force[l] = 1;
    }
    figLocalMatrix(geo.lods[2], r.met.baseH, r.local[2]);
    r.tris[2] = geo.lods[2].tris;
  }
  for (const r of recs) {
    r.tris = [0, 0, 0];
    buildRecMeshes(r);
  }

  /* Bases: near and mid instanced meshes (the far base is part of the far batch) */
  const bases = [0, 1].map((l) => {
    const b = figBuildBase(l);
    const cat = figInstAttr(n, 4);
    const inst = figInstAttr(n, 4);
    const m = figInstanced(figInstGeometry(b.geometry, { figBaseCat: cat, figInst: inst }), FIG_MATERIALS.base, n);
    m.name = `fig:base:${l}`;
    m.visible = false;
    meshes.push(m);
    group.add(m);
    return { mesh: m, cat, inst, cnt: 0, tris: b.tris, sig: 0, prevSig: 0, dirty: 0, force: 1 };
  });
  const baseLocal = new THREE.Matrix4();

  /* Warm-up meshes: one per program, always visible with count 0, so compileAsync compiles every variant */
  const warm = [FIG_MATERIALS.figurePhys, FIG_MATERIALS.figureStd, FIG_MATERIALS.glass, FIG_MATERIALS.basePhys, FIG_MATERIALS.baseStd].map((mat) => {
    const isBase = mat === FIG_MATERIALS.basePhys || mat === FIG_MATERIALS.baseStd;
    const src = isBase ? figBuildBase(2).geometry : figBuildBase(2).geometry;
    const attrs = { figInst: figInstAttr(1, 4) };
    if (isBase) attrs.figBaseCat = figInstAttr(1, 4);
    const m = figInstanced(figInstGeometry(src, attrs), mat, 1);
    m.visible = true;
    m.name = 'fig:warm';
    group.add(m);
    return m;
  });

  /* Far batches */
  let far = null;
  let farGhost = null;
  let farRebuildAt = 0;
  function buildFar() {
    if (far) {
      group.remove(far.mesh);
      far.dispose();
    }
    if (farGhost) {
      group.remove(farGhost.mesh);
      if (farGhost.depthMesh) group.remove(farGhost.depthMesh);
      farGhost.dispose();
    }
    const baseFar = figBuildBase(2);
    const slots = [];
    const gslots = [];
    for (let h = 0; h < n; h++) {
      const r = recs[designIdx[h]];
      if (r.ext) continue;
      const geo = figGeo(r.id);
      const e = geo.lods[2];
      if (!e.far) e.far = figFloatCopy(e);
      const figPart = { src: e.far, local: new THREE.Matrix4().makeTranslation(0, r.met.baseH, 0).multiply(figM3.makeScale(FIG_CM, FIG_CM, FIG_CM)).multiply(e.far.dequant || figIdentity) };
      const parts = [];
      if (r.ghost) gslots.push({ h, parts: [figPart] });
      else parts.push(figPart);
      if (r.hasBase) parts.push({ src: baseFar.far, local: new THREE.Matrix4().makeScale(r.baseScale * FIG_CM, FIG_CM, r.baseScale * FIG_CM), ring: r.ringSrgb });
      if (parts.length) slots.push({ h, parts });
    }
    far = figCreateFarBatch(FIG_MATERIALS.figure, slots, n);
    far.mesh.name = 'fig:far';
    group.add(far.mesh);
    farGhost = gslots.length ? figCreateFarBatch(FIG_MATERIALS.glass, gslots, n) : null;
    if (farGhost) {
      farGhost.mesh.name = 'fig:far-ghost';
      farGhost.mesh.renderOrder = 2;
      group.add(farGhost.mesh);
      const dm = new THREE.Mesh(farGhost.mesh.geometry, figGhostDepthMaterial());
      dm.name = 'fig:far-ghost:depth';
      dm.renderOrder = 1;
      dm.frustumCulled = farGhost.mesh.frustumCulled;
      dm.matrixAutoUpdate = false;
      farGhost.depthMesh = dm;
      group.add(dm);
    }
    lod.fill(-1);
  }
  buildFar();

  /* Baked figures arriving after the kit was built: swap geometries, rebuild the far batch (debounced) */
  let farStale = false;
  const listener = {
    onDesignLoaded(id) {
      const r = recById[id];
      if (!r) return;
      r.met = getFigureMetrics(id);
      buildRecMeshes(r);
      farStale = true;
    },
    onAllLoaded() {
      farStale = true;
      farRebuildAt = 0;
    },
  };
  FIG_LOAD.listeners.add(listener);

  let cam = null;
  const camPos = new THREE.Vector3();
  const info = { meshes: 0, drawCallsMax: 0, instances: n, loose: 0, shelf: 0, externalIds: [], trisEstimate: 0, near: 0, mid: 0, far: 0, culled: 0, loaded: 0, baked: 0 };
  const extList = [];
  let lastT = 0;
  let forceLod = -1;

  function lodFor(h, r, dist) {
    const sf = Math.max(0.6, Math.min(1.8, (r.met.totalH * scl[h]) / 0.14));
    const tn = FIG_LOD.nearDist * sf * quality.dist;
    const tm = FIG_LOD.midDist * sf * quality.dist;
    const hy = FIG_LOD.hysteresis;
    const prev = lod[h];
    if (prev === 0) return dist < tn * (1 + hy) ? 0 : dist < tm ? 1 : 2;
    if (prev === 1) return dist < tn * (1 - hy) ? 0 : dist > tm * (1 + hy) ? 2 : 1;
    if (prev === 2) return dist < tn ? 0 : dist < tm * (1 - hy) ? 1 : 2;
    return dist < tn ? 0 : dist < tm ? 1 : 2;
  }

  const kit = {
    group,
    setPose(h, position, quaternion, scale = 1) {
      const o = h * 3;
      pos[o] = position.x;
      pos[o + 1] = position.y;
      pos[o + 2] = position.z;
      const q = h * 4;
      quat[q] = quaternion.x;
      quat[q + 1] = quaternion.y;
      quat[q + 2] = quaternion.z;
      quat[q + 3] = quaternion.w;
      scl[h] = scale;
      poseDirty[h] = 1;
    },
    setMode(h, m) {
      if (mode[h] === m) return;
      mode[h] = m;
      fxDirty[h] = 1;
    },
    setBaseVisible(h, visible) {
      const v = visible ? 1 : 0;
      if (baseOn[h] === v) return;
      baseOn[h] = v;
      poseDirty[h] = 1;
    },
    setFx(h, glow, flash) {
      if (fx[h * 2] === glow && fx[h * 2 + 1] === flash) return;
      fx[h * 2] = glow;
      fx[h * 2 + 1] = flash;
      fxDirty[h] = 1;
    },
    setCategoryShimmer(categoryKey, amount) {
      const i = FIG_CATEGORY_INDEX[categoryKey];
      if (i === undefined) return;
      shimmer[i] = amount;
    },
    setCamera(camera) {
      cam = camera;
    },
    /** Development / preview: draw every handle at one LOD (0, 1, 2), or -1 for distance-based LOD. */
    setForceLod(l) {
      forceLod = l;
      for (let h = 0; h < n; h++) poseDirty[h] = 1;
    },
    /** Once per frame after all pose / mode changes. */
    update(t = lastT, camera = null) {
      lastT = t;
      FIG_UNIFORMS.time.value = t;
      if (camera) cam = camera;
      if (farStale && (FIG_LOAD.done || t - farRebuildAt > 1.5)) {
        farStale = false;
        farRebuildAt = t;
        buildFar();
      }
      const haveCam = !!cam;
      if (haveCam) {
        cam.updateMatrixWorld();
        figPS.multiplyMatrices(cam.projectionMatrix, cam.matrixWorldInverse);
        figFrustum.setFromProjectionMatrix(figPS);
        camPos.setFromMatrixPosition(cam.matrixWorld);
      }
      // Upload tracking: each instanced mesh keeps a signature of the handles it drew (in order) plus a dirty flag
      // for changed poses / effects, so an unchanged view uploads nothing.
      for (const r of recs) {
        r.cnt[0] = 0;
        r.cnt[1] = 0;
        r.sig[0] = 0;
        r.sig[1] = 0;
        r.dirty[0] = r.force[0];
        r.dirty[1] = r.force[1];
      }
      for (const b of bases) {
        b.cnt = 0;
        b.sig = 0;
        b.dirty = b.force;
      }
      for (const e of extList) {
        e.cnt = 0;
        e.sig = 0;
        e.dirty = e.force === 0 ? 0 : 1;
      }
      let nNear = 0;
      let nMid = 0;
      let nFar = 0;
      let nCull = 0;
      let loose = 0;
      let shelf = 0;
      let tris = 0;
      for (let i = 0; i < shimmer.length; i++) {
        if (shimmer[i] !== shimmerPrev[i]) {
          shimmerPrev[i] = shimmer[i];
          for (const r of recs) if (r.catIndex === i) for (const h of r.handles) if (mode[h] === FIG_MODE.SHELF) fxDirty[h] = 1;
        }
      }
      for (let h = 0; h < n; h++) {
        const m = mode[h];
        if (m === FIG_MODE.HIDDEN) {
          if (lod[h] === 2) {
            far.collapse(h);
            if (farGhost) farGhost.collapse(h);
          }
          lod[h] = -1;
          continue;
        }
        if (m === FIG_MODE.LOOSE) loose++;
        else shelf++;
        const r = recs[designIdx[h]];
        const s = scl[h];
        const dirtyH = poseDirty[h] | fxDirty[h];
        if (poseDirty[h]) {
          figV1.set(pos[h * 3], pos[h * 3 + 1], pos[h * 3 + 2]);
          figQ1.set(quat[h * 4], quat[h * 4 + 1], quat[h * 4 + 2], quat[h * 4 + 3]);
          figM2.compose(figV1, figQ1, figS1.set(s, s, s));
          figM2.toArray(hm, h * 16);
          figV2.set(0, r.met.centerY, 0).applyMatrix4(figM2);
          center[h * 4] = figV2.x;
          center[h * 4 + 1] = figV2.y;
          center[h * 4 + 2] = figV2.z;
          center[h * 4 + 3] = Math.max(r.met.totalH * 0.6, r.met.radius * 1.2) * s;
        }
        const glow = fx[h * 2];
        const flash = fx[h * 2 + 1];
        const shim = m === FIG_MODE.SHELF ? shimmer[r.catIndex] : 0;
        let L = 1;
        if (haveCam) {
          const dx = center[h * 4] - camPos.x;
          const dy = center[h * 4 + 1] - camPos.y;
          const dz = center[h * 4 + 2] - camPos.z;
          L = lodFor(h, r, Math.sqrt(dx * dx + dy * dy + dz * dz));
        }
        if (forceLod >= 0) L = forceLod;
        if (r.ext) L = Math.min(L, 1);
        const wasFar = lod[h] === 2;
        lod[h] = L;
        if (L === 2) {
          if (!wasFar || poseDirty[h] || fxDirty[h]) {
            figM2.fromArray(hm, h * 16);
            if (!baseOn[h] && r.hasBase) {
              /* No base wanted (actors): only the ghost batch can skip it, so draw this handle at mid instead */
              lod[h] = 1;
              L = 1;
              far.collapse(h);
            } else {
              far.write(h, figM2, glow, flash, shim);
              if (farGhost) farGhost.write(h, figM2, glow, flash, shim);
            }
          }
          poseDirty[h] = 0;
          fxDirty[h] = 0;
          if (L === 2) {
            nFar++;
            continue;
          }
        } else if (wasFar) {
          far.collapse(h);
          if (farGhost) farGhost.collapse(h);
        }
        poseDirty[h] = 0;
        fxDirty[h] = 0;
        if (haveCam) {
          figSphere.center.set(center[h * 4], center[h * 4 + 1], center[h * 4 + 2]);
          figSphere.radius = center[h * 4 + 3];
          if (!figFrustum.intersectsSphere(figSphere)) {
            nCull++;
            continue;
          }
        }
        figM2.fromArray(hm, h * 16);
        if (r.ext) {
          const e = r.ext;
          const k = e.cnt++;
          e.sig = (Math.imul(e.sig, 31) + h + 1) | 0;
          if (dirtyH) e.dirty = 1;
          for (const em of e.meshes) {
            figM2.toArray(em.instanceMatrix.array, k * 16);
            const a = em.geometry.attributes.figInst.array;
            a[k * 4 + 1] = glow;
            a[k * 4 + 2] = flash;
            a[k * 4 + 3] = shim;
          }
          tris += e.tris;
        } else {
          const k = r.cnt[L]++;
          r.sig[L] = (Math.imul(r.sig[L], 31) + h + 1) | 0;
          if (dirtyH) r.dirty[L] = 1;
          const mesh = r.meshes[L];
          figM1.multiplyMatrices(figM2, r.local[L]);
          figM1.toArray(mesh.instanceMatrix.array, k * 16);
          const a = mesh.geometry.attributes.figInst.array;
          a[k * 4] = 0;
          a[k * 4 + 1] = glow;
          a[k * 4 + 2] = flash;
          a[k * 4 + 3] = shim;
          tris += r.tris[L];
        }
        if (L === 0) nNear++;
        else nMid++;
        if (r.hasBase && baseOn[h]) {
          const b = bases[L];
          const k = b.cnt++;
          b.sig = (Math.imul(b.sig, 31) + h + 1) | 0;
          if (dirtyH) b.dirty = 1;
          baseLocal.makeScale(r.baseScale * FIG_CM, FIG_CM, r.baseScale * FIG_CM);
          figM1.multiplyMatrices(figM2, baseLocal);
          figM1.toArray(b.mesh.instanceMatrix.array, k * 16);
          const c = b.cat.array;
          c[k * 4] = r.ringLin[0];
          c[k * 4 + 1] = r.ringLin[1];
          c[k * 4 + 2] = r.ringLin[2];
          c[k * 4 + 3] = r.catIndex;
          const a = b.inst.array;
          a[k * 4 + 1] = glow * 0.5;
          a[k * 4 + 2] = flash * 0.5;
          a[k * 4 + 3] = 0;
          tris += b.tris;
        }
      }
      let draws = 0;
      for (const r of recs) {
        for (let l = 0; l < 2; l++) {
          const mesh = r.meshes[l];
          const c = r.cnt[l];
          mesh.count = c;
          mesh.visible = c > 0 && !r.ext;
          if (r.depth) {
            r.depth[l].count = c;
            r.depth[l].visible = mesh.visible;
          }
          if (c > 0) {
            if (r.dirty[l] || r.sig[l] !== r.prevSig[l]) {
              figUpload(mesh.instanceMatrix, c, 16);
              figUpload(mesh.geometry.attributes.figInst, c, 4);
              r.prevSig[l] = r.sig[l];
              r.force[l] = 0;
            }
            draws++;
          } else r.force[l] = 1; // handles may move while undrawn: upload again when the mesh reappears
        }
      }
      for (const e of extList) {
        const up = e.dirty || e.sig !== e.prevSig;
        for (const em of e.meshes) {
          em.count = e.cnt;
          em.visible = e.cnt > 0;
          if (e.cnt > 0) {
            if (up) {
              figUpload(em.instanceMatrix, e.cnt, 16);
              figUpload(em.geometry.attributes.figInst, e.cnt, 4);
            }
            draws++;
          }
        }
        if (up && e.cnt > 0) {
          e.prevSig = e.sig;
          e.force = 0;
        } else if (e.cnt === 0) e.force = 1;
      }
      for (const b of bases) {
        b.mesh.count = b.cnt;
        b.mesh.visible = b.cnt > 0;
        if (b.cnt > 0) {
          if (b.dirty || b.sig !== b.prevSig) {
            figUpload(b.mesh.instanceMatrix, b.cnt, 16);
            figUpload(b.cat, b.cnt, 4);
            figUpload(b.inst, b.cnt, 4);
            b.prevSig = b.sig;
            b.force = 0;
          }
          draws++;
        } else b.force = 1;
      }
      far.flush();
      if (farGhost) farGhost.flush();
      draws += 1 + (farGhost ? 1 : 0);
      tris += far.liveTris + (farGhost ? farGhost.liveTris : 0);
      info.near = nNear;
      info.mid = nMid;
      info.far = nFar;
      info.culled = nCull;
      info.loose = loose;
      info.shelf = shelf;
      info.trisEstimate = tris;
      info.drawCallsMax = draws;
    },
    setQuality(q) {
      figApplyQuality(q);
      quality.q = q;
      quality.dist = q === 'xbox' ? 1 : 1.3;
      for (const r of recs) for (const m of r.meshes) if (m) m.material = figMat(r);
      for (const b of bases) b.mesh.material = FIG_MATERIALS.base;
      if (far) far.mesh.material = FIG_MATERIALS.figure;
    },
    /** Replaces the procedural figure of a design with an external one (pose-space geometry, metres). */
    registerExternalFigure(designId, ext) {
      const r = recById[designId];
      if (!r || !ext || !ext.meshesByMaterial || !ext.meshesByMaterial.length) return false;
      if (r.ext) return true;
      const cap = r.handles.length;
      const e = { id: designId, meshes: [], cnt: 0, tris: ext.tris || 0 };
      for (const part of ext.meshesByMaterial) {
        const g = part.geometry.clone();
        g.setAttribute('figInst', figInstAttr(cap, 4));
        g.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 1e4);
        figPatchExternal(part.material);
        const m = figInstanced(g, part.material, cap);
        m.name = `fig:ext:${designId}`;
        m.visible = false;
        e.meshes.push(m);
        meshes.push(m);
        group.add(m);
      }
      r.ext = e;
      extList.push(e);
      for (const h of r.handles) {
        far.collapse(h);
        if (farGhost) farGhost.collapse(h);
        lod[h] = -1;
        poseDirty[h] = 1;
      }
      farStale = true;
      info.externalIds.push(designId);
      return true;
    },
    /** Loads the models listed in assets/figures/index.json one at a time. Resolves the applied ids; never rejects. */
    async loadExternalModels() {
      const applied = [];
      try {
        const index = await loadExternalFigureIndex();
        for (const id of Object.keys(index)) {
          if (!recById[id] || recById[id].ext) continue;
          const ext = await loadExternalFigure(id);
          if (ext && kit.registerExternalFigure(id, ext)) applied.push(id);
          await new Promise((res) => requestAnimationFrame(() => res()));
        }
      } catch (err) {
        console.warn('[figures] external models', err);
      }
      return applied;
    },
    whenLoaded() {
      return figWhenLoaded();
    },
    getInfo() {
      let m = recs.length * 2;
      m += bases.length + 1 + (farGhost ? 1 : 0) + extList.reduce((s, e) => s + e.meshes.length, 0);
      info.meshes = m;
      info.loaded = FIG_LOAD.loaded;
      info.baked = FIG_LOAD.total;
      return info;
    },
    dispose() {
      FIG_LOAD.listeners.delete(listener);
      scene.remove(group);
      for (const ms of meshes) {
        ms.geometry.dispose();
        ms.dispose();
      }
      for (const w of warm) {
        w.geometry.dispose();
        w.dispose();
      }
      far.dispose();
      if (farGhost) farGhost.dispose();
    },
  };
  return kit;
}

const figIdentity = new THREE.Matrix4();

/** Float copy of a decoded LOD entry (for the far batch), positions and normals already dequantised to cm. */
function figFloatCopy(e) {
  if (e.far) return e.far;
  const g = e.geometry;
  const p = g.attributes.position;
  const nV = p.count;
  const fp = new Float32Array(nV * 3);
  const fn = new Float32Array(nV * 3);
  const oct = g.attributes.aOct.array;
  for (let v = 0; v < nV; v++) {
    figV1.set(p.getX(v), p.getY(v), p.getZ(v)).applyMatrix4(e.dequant);
    fp[v * 3] = figV1.x;
    fp[v * 3 + 1] = figV1.y;
    fp[v * 3 + 2] = figV1.z;
    figOctDecode(oct[v * 2], oct[v * 2 + 1], fn, v * 3);
  }
  e.far = { pos: fp, nrm: fn, col: g.attributes.aCol.array, pbr: g.attributes.aPbr.array, index: g.index.array };
  return e.far;
}

/**
 * DESIGN.md 16.5 low-level instancer: full-detail figure (+ base) of one design, capacity maxCount.
 * setInstance(i, matrix) takes a pose-space -> world matrix (base bottom centre).
 */
function createFigureInstancer(scene, designId, maxCount, opts = { withBase: true }) {
  initFigureMaterials();
  figStartLoading();
  const d = FIG_BY_ID[designId];
  if (!d) throw new Error(`[figures] unknown design ${designId}`);
  const cap = Math.max(1, maxCount);
  const mats = new Float32Array(cap * 16);
  const local = new THREE.Matrix4();
  const inst = figInstAttr(cap, 4);
  const geo = figGeo(designId);
  let met = getFigureMetrics(designId);
  figLocalMatrix(geo.lods[0], met.baseH, local);
  const fig = figInstanced(figInstGeometry(geo.lods[0].geometry, { figInst: inst }), d.translucent ? FIG_MATERIALS.glass : FIG_MATERIALS.figure, cap);
  fig.name = `fig:instancer:${designId}`;
  const meshes = [fig];
  let depth = null;
  if (d.translucent) {
    // Same depth pre-pass as in the kit (see figGhostDepthMaterial).
    fig.renderOrder = 2;
    depth = figInstanced(fig.geometry, figGhostDepthMaterial(), 1);
    depth.instanceMatrix = fig.instanceMatrix;
    depth.renderOrder = 1;
    depth.name = `fig:instancer-depth:${designId}`;
    meshes.push(depth);
  }
  let base = null;
  let baseCat = null;
  if (opts.withBase !== false && !d.ownBase) {
    baseCat = figInstAttr(cap, 4);
    const cat = FIG_CATEGORIES[FIG_CATEGORY_INDEX[d.category]];
    figCol1.set(cat ? cat.color : '#8e8169').convertSRGBToLinear();
    for (let i = 0; i < cap; i++) baseCat.setXYZW(i, figCol1.r, figCol1.g, figCol1.b, cat ? cat.index : 0);
    base = figInstanced(figInstGeometry(figBuildBase(0).geometry, { figBaseCat: baseCat, figInst: figInstAttr(cap, 4) }), FIG_MATERIALS.base, cap);
    base.name = `fig:instancer-base:${designId}`;
    meshes.push(base);
  }
  for (const m of meshes) scene.add(m);
  const baseLocal = new THREE.Matrix4().makeScale((d.baseR / 30) * FIG_CM, FIG_CM, (d.baseR / 30) * FIG_CM);
  let count = 0;
  let maxSet = 0;
  function writeAll() {
    for (let i = 0; i < maxSet; i++) {
      figM2.fromArray(mats, i * 16);
      figM1.multiplyMatrices(figM2, local).toArray(fig.instanceMatrix.array, i * 16);
      if (base) figM1.multiplyMatrices(figM2, baseLocal).toArray(base.instanceMatrix.array, i * 16);
    }
    fig.instanceMatrix.needsUpdate = true;
    if (base) base.instanceMatrix.needsUpdate = true;
  }
  const listener = {
    onDesignLoaded(id) {
      if (id !== designId) return;
      met = getFigureMetrics(designId);
      figLocalMatrix(geo.lods[0], met.baseH, local);
      const old = fig.geometry;
      fig.geometry = figInstGeometry(geo.lods[0].geometry, { figInst: inst });
      if (depth) depth.geometry = fig.geometry;
      old.dispose();
      writeAll();
    },
  };
  FIG_LOAD.listeners.add(listener);
  return {
    meshes,
    get count() {
      return count;
    },
    set count(v) {
      count = Math.max(0, Math.min(cap, v));
      for (const m of meshes) m.count = count;
    },
    setInstance(i, matrix) {
      if (i < 0 || i >= cap) return;
      matrix.toArray(mats, i * 16);
      if (i + 1 > maxSet) maxSet = i + 1;
      figM1.multiplyMatrices(matrix, local).toArray(fig.instanceMatrix.array, i * 16);
      if (base) figM1.multiplyMatrices(matrix, baseLocal).toArray(base.instanceMatrix.array, i * 16);
    },
    setFx(i, glow, flash) {
      inst.setXYZW(i, 0, glow, flash, 0);
      inst.needsUpdate = true;
    },
    commit() {
      fig.instanceMatrix.needsUpdate = true;
      if (base) base.instanceMatrix.needsUpdate = true;
    },
    dispose() {
      FIG_LOAD.listeners.delete(listener);
      for (const m of meshes) {
        scene.remove(m);
        m.geometry.dispose();
        m.dispose();
      }
    },
  };
}

/* ---- external models --------------------------------------------------------------------------- */

let figExtIndexPromise = null;
let figGltfLoaderPromise = null;

/** Fetches assets/figures/index.json once. Resolves { [designId]: { file, tris, materials } } ({} on any failure). */
function loadExternalFigureIndex() {
  if (!figExtIndexPromise) {
    figExtIndexPromise = fetch('assets/figures/index.json', { cache: 'no-cache' })
      .then((r) => (r.ok ? r.json() : { models: {} }))
      .then((j) => (j && j.models) || {})
      .catch(() => ({}));
  }
  return figExtIndexPromise;
}

/**
 * Loads and normalises one external model: bottom centre at the origin, height = the procedural figure height,
 * lifted onto the game's base (ownBase designs: scaled to the total height, no lift), merged per material.
 * Resolves null on any failure (console.warn only).
 */
async function loadExternalFigure(designId) {
  try {
    const index = await loadExternalFigureIndex();
    const entry = index[designId];
    if (!entry) return null;
    if (!figGltfLoaderPromise) figGltfLoaderPromise = import('three/addons/loaders/GLTFLoader.js').then((m) => new m.GLTFLoader());
    const loader = await figGltfLoaderPromise;
    const gltf = await loader.loadAsync(`assets/figures/${entry.file}`);
    const d = FIG_BY_ID[designId];
    const met = getFigureMetrics(designId);
    const root = gltf.scene;
    root.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(root);
    const size = box.getSize(new THREE.Vector3());
    if (!(size.y > 1e-6)) throw new Error('empty model');
    const targetH = d.ownBase ? met.totalH : met.figH;
    const s = targetH / size.y;
    const norm = new THREE.Matrix4().makeTranslation(0, d.ownBase ? 0 : met.baseH, 0)
      .multiply(new THREE.Matrix4().makeScale(s, s, s))
      .multiply(new THREE.Matrix4().makeTranslation(-(box.min.x + box.max.x) / 2, -box.min.y, -(box.min.z + box.max.z) / 2));
    const byMat = new Map();
    let tris = 0;
    root.traverse((o) => {
      if (!o.isMesh) return;
      if (o.isSkinnedMesh || Array.isArray(o.material)) throw new Error('skinned or multi-material mesh');
      const g = o.geometry.clone();
      for (const k of Object.keys(g.attributes)) if (!['position', 'normal', 'uv', 'color'].includes(k)) g.deleteAttribute(k);
      g.morphAttributes = {};
      g.applyMatrix4(new THREE.Matrix4().multiplyMatrices(norm, o.matrixWorld));
      if (!g.attributes.normal) g.computeVertexNormals();
      tris += (g.index ? g.index.count : g.attributes.position.count) / 3;
      if (!byMat.has(o.material)) byMat.set(o.material, []);
      byMat.get(o.material).push(g);
    });
    if (!byMat.size) throw new Error('no meshes');
    if (byMat.size > 4) throw new Error(`${byMat.size} materials (at most 4)`);
    const meshesByMaterial = [];
    for (const [material, geos] of byMat) {
      if (!material.isMeshStandardMaterial) throw new Error('unsupported material type');
      const common = Object.keys(geos[0].attributes).filter((k) => geos.every((g) => g.attributes[k]));
      for (const g of geos) for (const k of Object.keys(g.attributes)) if (!common.includes(k)) g.deleteAttribute(k);
      const list = geos.every((g) => g.index) ? geos : geos.map((g) => (g.index ? g.toNonIndexed() : g));
      const merged = list.length > 1 ? mergeGeometries(list, false) : list[0];
      if (!merged) throw new Error('merge failed');
      meshesByMaterial.push({ geometry: merged, material });
    }
    return { meshesByMaterial, height: targetH, tris };
  } catch (err) {
    console.warn('[figures] external model failed', designId, err);
    return null;
  }
}

/* ---- the free-flying Snitch ------------------------------------------------------------------------ */

/** DESIGN.md 16.5: walnut-sized polished gold ball with two fluttering feather wings (2 draws, no base). */
function createSnitchFlyer(scene) {
  const group = new THREE.Group();
  group.name = 'fig:snitch';
  const gold = new THREE.MeshPhysicalMaterial({ color: 0xe0b24a, metalness: 1, roughness: 0.16, clearcoat: 0.6, emissive: 0x3a2606, emissiveIntensity: 0.6 });
  const R = 0.017;
  const ballGeo = new THREE.SphereGeometry(R, 24, 16);
  const seam1 = new THREE.TorusGeometry(R * 1.01, R * 0.05, 6, 32);
  const seam2 = seam1.clone().rotateY(Math.PI / 2);
  const ball = new THREE.Mesh(mergeGeometries([ballGeo, seam1, seam2].map((g) => (g.index ? g.toNonIndexed() : g)), false), gold);
  group.add(ball);
  /* Feather wing: a curved blade with scalloped trailing edge, ribs from vertex shading */
  const shape = new THREE.Shape();
  shape.moveTo(0, 0);
  shape.bezierCurveTo(0.012, 0.012, 0.05, 0.02, 0.075, 0.012);
  const scallops = 6;
  for (let i = 0; i < scallops; i++) {
    const t0 = i / scallops;
    const t1 = (i + 1) / scallops;
    const x0 = 0.075 * (1 - t0);
    const x1 = 0.075 * (1 - t1);
    shape.quadraticCurveTo((x0 + x1) / 2, -0.012 - 0.004 * Math.sin(Math.PI * t0), x1, -0.002 * (1 - t1));
  }
  const wingGeo = new THREE.ShapeGeometry(shape, 6);
  const wingMat = new THREE.MeshStandardMaterial({ color: 0xf6ecd2, metalness: 0.35, roughness: 0.35, side: THREE.DoubleSide, transparent: true, opacity: 0.88, emissive: 0x2a2008 });
  const wingL = new THREE.Mesh(wingGeo, wingMat);
  const wingR = new THREE.Mesh(wingGeo, wingMat);
  const pivotL = new THREE.Group();
  const pivotR = new THREE.Group();
  pivotL.position.set(R * 0.8, R * 0.3, -R * 0.2);
  pivotR.position.set(-R * 0.8, R * 0.3, -R * 0.2);
  wingR.scale.x = -1;
  pivotL.add(wingL);
  pivotR.add(wingR);
  group.add(pivotL, pivotR);
  scene.add(group);
  return {
    object3D: group,
    update(t, flapping = true) {
      const a = flapping ? 0.25 + 0.55 * Math.sin(t * 62) : 0.5;
      pivotL.rotation.set(-0.35, 0.25, a);
      pivotR.rotation.set(-0.35, -0.25, -a);
    },
    dispose() {
      scene.remove(group);
      ball.geometry.dispose();
      wingGeo.dispose();
      gold.dispose();
      wingMat.dispose();
    },
  };
}

function pvRows() {
  const only = (pvQS.get('only') || '').split(',').map((s) => s.trim()).filter((s) => FIG_BY_ID[s]);
  if (only.length) return [only];
  const cat = pvQS.get('cat');
