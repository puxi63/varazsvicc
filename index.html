   Physics-lite: thrown, dropped and scattered figurines (at most 80 simulate at once)
   ------------------------------------------------------------------------------------------------ */

/** Starts simulating a record; rec.pos is the centre of the figure while it flies. */
function startSim(rec) {
  if (rec.state === ST.SCRIPT) {
    const i = SCRIPTS.indexOf(rec);
    if (i >= 0) SCRIPTS.splice(i, 1);
  }
  if (rec.slot) unseat(rec);
  setState(rec, ST.FLYING);
  KIT.setMode(rec.h, FIG_MODE.LOOSE);
  rec.bounces = 0;
  rec.simT = 0;
  leavePile(rec);
  rec.viewScale = 0;
  if (SIMS.length >= PHYS.maxSim) {
    settleNow(SIMS.shift(), true);
  }
  SIMS.push(rec);
}

const SIM_Q = new THREE.Quaternion();
function stepPhysics(dt) {
  for (let i = SIMS.length - 1; i >= 0; i--) {
    const rec = SIMS[i];
    rec.simT += dt;
    const v = rec.vel;
    v.y -= PHYS.g * dt;
    v.multiplyScalar(1 - PHYS.drag * dt);
    const px = rec.pos.x;
    const py = rec.pos.y;
    const pz = rec.pos.z;
    rec.pos.addScaledVector(v, dt);
    const sl = rec.spin.length();
    if (sl > 0.01) {
      SIM_Q.setFromAxisAngle(tv3.copy(rec.spin).divideScalar(sl), sl * dt);
      rec.quat.premultiply(SIM_Q);
    }
    const rad = Math.max(0.03, rec.met.radius * rec.scale);
    // Homing capture: entering the correct unit or tower sector with a free position.
    if (rec.homing && tryHomingCapture(rec)) {
      SIMS.splice(i, 1);
      continue;
    }
    // Colliders (walls, furniture): land on tops from above, otherwise bounce horizontally.
    for (const c of WORLD.colliders) {
      let inside = false;
      if (c.type === 'ellipse') continue;
      if (c.type === 'box') inside = rec.pos.x > c.minX && rec.pos.x < c.maxX && rec.pos.z > c.minZ && rec.pos.z < c.maxZ;
      else inside = (rec.pos.x - c.x) * (rec.pos.x - c.x) + (rec.pos.z - c.z) * (rec.pos.z - c.z) < c.r * c.r;
      if (!inside || rec.pos.y - rad > c.top) continue;
      if (py - rad >= c.top - 0.02 && c.top < 2) {
        rec.pos.y = c.top + rad;
        if (v.y < 0) v.y = -v.y * PHYS.restitution;
        v.x *= 1 - PHYS.friction * 0.5;
        v.z *= 1 - PHYS.friction * 0.5;
        rec.bounces++;
      } else {
        rec.pos.x = px;
        rec.pos.z = pz;
        if (c.type === 'box') {
          const wasX = px > c.minX && px < c.maxX;
          if (!wasX) v.x = -v.x * PHYS.restitution;
          else v.z = -v.z * PHYS.restitution;
        } else {
          tv3.set(px - c.x, 0, pz - c.z).normalize();
          const dot = v.x * tv3.x + v.z * tv3.z;
          v.x -= (1 + PHYS.restitution) * dot * tv3.x;
          v.z -= (1 + PHYS.restitution) * dot * tv3.z;
        }
        rec.bounces++;
      }
    }
    if (!inRoom(rec.pos.x, rec.pos.z)) {
      rec.pos.x = px;
      rec.pos.z = pz;
      v.x = -v.x * PHYS.restitution;
      v.z = -v.z * PHYS.restitution;
      rec.bounces++;
    }
    if (rec.pos.y + rad > HALL.h - 0.05) {
      rec.pos.y = HALL.h - 0.05 - rad;
      v.y = -Math.abs(v.y) * PHYS.restitution;
    }
    const g = groundAt(rec.pos.x, rec.pos.z, py - rad);
    if (rec.pos.y - rad < g) {
      rec.pos.y = g + rad;
      if (v.y < 0) v.y = -v.y * PHYS.restitution;
      v.x *= 1 - PHYS.friction * 0.35;
      v.z *= 1 - PHYS.friction * 0.35;
      rec.spin.multiplyScalar(0.6);
      rec.bounces++;
      if (rec.bounces === 1) sfx('thud', 0.5);
    }
    tv4.set(0, -rec.met.centerY * rec.scale, 0).applyQuaternion(rec.quat).add(rec.pos);
    KIT.setPose(rec.h, tv4, rec.quat, rec.scale);
    const speed = v.length();
    if ((rec.bounces > 0 && speed < PHYS.settleSpeed && rec.pos.y - rad <= g + 0.02) || rec.simT > 6) {
      SIMS.splice(i, 1);
      settleNow(rec, false);
    }
  }
}

/** Chooses a resting pose at the current spot (35 % upright, 65 % on the side). */
function settleNow(rec, instant) {
  if (!rec) return;
  let x = rec.pos.x;
  let z = rec.pos.z;
  if (!inRoom(x, z) || insideCollider(x, z, 0.05)) {
    const hp = nearestHeap(x, z);
    x = hp.x + (Math.random() - 0.5) * hp.rx;
    z = hp.z + (Math.random() - 0.5) * hp.rz;
  }
  const g = groundAt(x, z, rec.pos.y + 0.05);
  const yaw = Math.atan2(rec.vel.x, rec.vel.z) + (Math.random() - 0.5);
  const hp = heapAt(x, z, 0.98);
  if (hp) joinPile(rec, hp, x, z, Math.random() < 0.2 ? 'upright' : 'lying', yaw);
  else if (rec.d.ownBase || Math.random() < 0.35) poseUpright(rec, x, g, z, yaw);
  else poseLying(rec, x, g, z, yaw, Math.random());
  rec.vel.set(0, 0, 0);
  rec.homing = false;
  const i = SIMS.indexOf(rec);
  if (i >= 0) SIMS.splice(i, 1);
  rec.state = -1;
  setState(rec, ST.LOOSE);
  syncRec(rec);
  hashUpdate(rec);
  if (!instant) markDirty();
}

function nearestHeap(x, z) {
  let best = WORLD.heaps[0];
  let bd = 1e9;
  for (const hp of WORLD.heaps) {
    if (hp.crate) continue;
    const d = (hp.x - x) * (hp.x - x) + (hp.z - z) * (hp.z - z);
    if (d < bd) {
      bd = d;
      best = hp;
    }
  }
  return best;
}

function tryHomingCapture(rec) {
  const slot = slotFor(rec);
  if (!slot || slot.id === 'honor') return false;
  const posIdx = freePosition(slot);
  if (posIdx < 0) return false;
  let inside = false;
  const p = rec.pos;
  if (slot.kind === 'unit') {
    const u = WORLD.units[slot.unit];
    const b = u.aabb;
    inside = p.x > b.minX - 0.4 && p.x < b.maxX + 0.4 && p.z > b.minZ - 0.4 && p.z < b.maxZ + 0.4 && p.y < 2.2;
  } else {
    const dx = p.x - TOWER.x;
    const dz = p.z - TOWER.z;
    const r = Math.hypot(dx, dz);
    if (r < TOWER.outerR + 0.5 && p.y < TOWER.topY + 0.5) {
      if (slot.kind === 'top') inside = true;
      else {
        const a = Math.atan2(dx, dz);
        let da = a - slot.yaw;
        while (da > Math.PI) da -= Math.PI * 2;
        while (da < -Math.PI) da += Math.PI * 2;
        inside = Math.abs(da) < Math.PI / 4;
      }
    }
  }
  if (!inside) return false;
  tv4.set(0, -rec.met.centerY * rec.scale, 0).applyQuaternion(rec.quat).add(rec.pos);
  rec.pos.copy(tv4);
  flyIntoSlot(rec, slot, posIdx, 0.35, true);
  return true;
}

/* ------------------------------------------------------------------------------------------------
   Recovery: every 2 s, lost figurines (fallen through, outside, stuck in furniture) return to a heap
   ------------------------------------------------------------------------------------------------ */
let recoveryT = 0;

function recoverLost(force) {
  let n = 0;
  for (const rec of REC) {
    // Hidden legendary copies rest on purpose on furniture (stair tread, coat stand); never "recover" them.
    if (rec.state !== ST.LOOSE || rec.actor || rec.spot) continue;
    const bad = rec.pos.y < -0.3 || !inRoom(rec.pos.x, rec.pos.z) || insideCollider(rec.pos.x, rec.pos.z, rec.pos.y + 0.02);
    if (!bad) {
      rec.oobT = 0;
      continue;
    }
    rec.oobT += force ? 99 : 2;
    if (rec.oobT < 2 && !force) continue;
    const hp = nearestHeap(rec.pos.x, rec.pos.z);
    const a = Math.random() * Math.PI * 2;
    const rr = Math.random() * 0.5;
    const x = hp.x + Math.cos(a) * rr * hp.rx;
    const z = hp.z + Math.sin(a) * rr * hp.rz;
    joinPile(rec, hp, x, z, 'lying');
    rec.oobT = 0;
    syncRec(rec);
    hashUpdate(rec);
    n++;
  }
  if (n) markDirty();
  return n;
}

function updateRecovery(dt) {
  recoveryT += dt;
  if (recoveryT < 2) return;
  recoveryT = 0;
  recoverLost(false);
}

/* ------------------------------------------------------------------------------------------------
   Blob shadows (rebuilt only when something moved)
   ------------------------------------------------------------------------------------------------ */
function updateBlobs() {
  if (!BLOB_DIRTY.v || !BLOBS.mesh) return;
  BLOB_DIRTY.v = false;
  let n = 0;
  for (const rec of REC) {
    const s = rec.state;
    if (s !== ST.LOOSE && s !== ST.SHELF_OK && s !== ST.SHELF_WRONG && s !== ST.WILD) continue;
    if (KIT.ext && KIT.ext.hiddenBase(rec.h)) continue;
    // Figurines in a straw pile rest on its curved surface or on each other: no flat contact shadow.
    if (rec.heap >= 0 && rec.state === ST.LOOSE && !WORLD.heaps[rec.heap].crate) continue;
    const r = (rec.lying ? rec.met.pickR * 1.1 : Math.max(0.03, rec.met.baseR || rec.met.radius) * 1.7) * rec.scale;
    tm1.compose(tv1.set(rec.lying ? rec.pickC.x : rec.pos.x, rec.groundY + 0.003, rec.lying ? rec.pickC.z : rec.pos.z), tq1.identity(), tv2.set(r * 2, 1, r * 2));
    BLOBS.mesh.setMatrixAt(n++, tm1);
    if (n >= BLOBS.cap) break;
  }
  BLOBS.mesh.count = n;
  BLOBS.mesh.instanceMatrix.needsUpdate = true;
}

/* ------------------------------------------------------------------------------------------------
   Csokibéka cards
   ------------------------------------------------------------------------------------------------ */
function cardCount() {
  let n = 0;
  for (let i = 0; i < 10; i++) if (GAME.cards & (1 << i)) n++;
  return n;
}

function collectCard(i) {
  if (GAME.cards & (1 << i)) return;
  GAME.cards |= 1 << i;
  hideCard(i);
  const n = cardCount();
  pay(BONUS.card, true);
  toast(fmt(TXT.toastCard, { n }), 'gold');
  sfx('card');
  tipOnce('tipCard');
  if (n >= 10 && !GAME.paidBonus.allCards) {
    GAME.paidBonus.allCards = true;
    pay(BONUS.allCards, true);
    toast(TXT.toastAllCards, 'gold');
    revealShopkeeper(true);
  }
  UI_DIRTY.hud = true;
  markDirty();
}

/** The personal figurine appears on the Díszhely (all 10 cards). */
function revealShopkeeper(fresh) {
  if (shopkeeperHandle < 0) return;
  const rec = REC[shopkeeperHandle];
  if (rec.state !== ST.HIDDEN) return;
  const slot = WORLD.slotById.honor;
  if (!slot) return;
  const posIdx = freePosition(slot);
  if (posIdx < 0) return;
  seatInSlot(rec, slot, posIdx);
  if (fresh) {
    puff(rec.pos.x, rec.pos.y + 0.1, rec.pos.z, 0.5);
    sfx('sparkle');
  }
}

/* ------------------------------------------------------------------------------------------------
   Interactables
   ------------------------------------------------------------------------------------------------ */
function interact(target) {
  switch (target.id) {
    case 'lectern':
      openMenu('lectern');
      sfx('open');
      break;
    case 'cauldron':
      openMenu('cauldron');
      sfx('open');
      break;
    case 'register':
      GAME.register++;
      sfx('bell');
      if (GAME.register >= 10 && !GAME.paidBonus.register) {
        GAME.paidBonus.register = true;
        pay(BONUS.register, true);
        toast(TXT.toastRegister, 'gold');
      }
      markDirty();
      break;
    case 'musicbox':
      cycleMusic();
      break;
    case 'portrait':
      openMenu('letter', { text: TXT.letterIntro, title: TXT.letterTitle });
      break;
    case 'honor': {
      const top = stackTop();
      if (top && top.id === 'shopkeeper') {
        AIM.slot = WORLD.slotById.honor;
        actionPlace();
      } else toast(shopkeeperHandle >= 0 && REC[shopkeeperHandle].state !== ST.HIDDEN ? TXT.honorNeed : TXT.honorEmpty);
      break;
    }
    case 'mould':
      useMould();
      break;
    case 'door':
      toast(TXT.doorLocked);
      sfx('knock');
      break;
    default:
      break;
  }
}

function interactLabel(target) {
  if (target.id === 'cauldron') return GAME.deckPos >= DECK.length ? TXT.useCauldronEmpty : fmt(TXT.useCauldron, { n: CAULDRON_PRICE });
  if (target.id === 'mould') {
    if (!GAME.flags.finaleDone) return TXT.useMould;
    if (CASTING.active || CASTING.count > 0) return TXT.useMouldSweep;
    return TXT.useMouldCast;
  }
  return TXT[target.nameKey] || target.id;
}

/* ------------------------------------------------------------------------------------------------
   Tips (each once per save)
   ------------------------------------------------------------------------------------------------ */
function tipOnce(key) {
  if (GAME.tipsShown.has(key)) return;
  GAME.tipsShown.add(key);
  showTip(key);
}

let affordTipDone = false;
function checkAffordTip() {
  if (affordTipDone) return;
  let cheapest = 1e9;
  for (const k of UPGRADE_ORDER) {
    const p = UPGRADES[k].prices[GAME.up[k]];
    if (p !== undefined) cheapest = Math.min(cheapest, p);
  }
  if (GAME.galleons >= cheapest) {
    affordTipDone = true;
    tipOnce('tipLectern');
  }
}

function markDirty() {
  GAME.dirty = true;
  UI_DIRTY.hud = true;
}

/* ---- 51-wild.js ---- */
/* ==== 51-wild.js — the Snitch flyer, runaway nifflers, Hóborc's water bomb, house-elf helpers, glints and puffs ==== */

/* ------------------------------------------------------------------------------------------------
   Puffs and sparkle bursts (one additive billboard batch)
   ------------------------------------------------------------------------------------------------ */
const PUFFS = { batch: null, parts: [] };

function buildPuffs() {
  PUFFS.batch = new BillboardBatch(160, TEX.glow, { additive: true, order: 7 });
  for (let i = 0; i < 160; i++) {
    PUFFS.batch.add(0, -10, 0, 0, 0, 0, 0, 0, 0);
    PUFFS.parts.push({ life: 0, max: 1, x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, s: 0.1, r: 1, g: 1, b: 1 });
  }
  PUFFS.next = 0;
}

/** A small burst of glowing motes (house-elf pop, card, Hóborc). */
function puff(x, y, z, size = 0.3, color = [1.0, 0.85, 0.55], count = 10) {
  if (!PUFFS.batch) return;
  for (let k = 0; k < count; k++) {
    const p = PUFFS.parts[PUFFS.next];
    PUFFS.next = (PUFFS.next + 1) % PUFFS.parts.length;
    const a = Math.random() * Math.PI * 2;
    const e = (Math.random() - 0.3) * 1.4;
    const sp = size * (0.6 + Math.random() * 1.2);
    p.x = x;
    p.y = y;
    p.z = z;
    p.vx = Math.cos(a) * Math.cos(e) * sp;
    p.vy = Math.sin(e) * sp + size * 0.4;
    p.vz = Math.sin(a) * Math.cos(e) * sp;
    p.life = p.max = 0.5 + Math.random() * 0.5;
    p.s = size * (0.25 + Math.random() * 0.3);
    p.r = color[0];
    p.g = color[1];
    p.b = color[2];
  }
}

function updatePuffs(dt) {
  if (!PUFFS.batch) return;
  const B = PUFFS.batch;
  for (let i = 0; i < PUFFS.parts.length; i++) {
    const p = PUFFS.parts[i];
    if (p.life <= 0) continue;
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.z += p.vz * dt;
    p.vx *= 1 - 2 * dt;
    p.vy *= 1 - 2 * dt;
    p.vz *= 1 - 2 * dt;
    const k = Math.max(0, p.life / p.max);
    B.setCenter(i, p.x, p.y, p.z);
    B.setSize(i, p.s * (1.4 - 0.4 * k), p.s * (1.4 - 0.4 * k));
    B.setColor(i, p.r * k, p.g * k, p.b * k, 1);
    if (p.life <= 0) B.setSize(i, 0, 0);
  }
  B.commit();
}

/* ------------------------------------------------------------------------------------------------
   Legendary glints (hidden copies sparkle every 6 s; every loose legendary pulses softly) and shudders
   ------------------------------------------------------------------------------------------------ */
const SHUDDERS = [];

function startShudder(rec) {
  rec.shudderT = 0.4;
  rec.shudderYaw = rec.slot ? rec.slot.yaws[rec.slotPos] : 0;
  if (!SHUDDERS.includes(rec)) SHUDDERS.push(rec);
}

function updateShudders(dt) {
  for (let i = SHUDDERS.length - 1; i >= 0; i--) {
    const rec = SHUDDERS[i];
    rec.shudderT -= dt;
    if (rec.state !== ST.SHELF_WRONG || rec.shudderT <= 0) {
      if (rec.state === ST.SHELF_WRONG) {
        rec.quat.setFromAxisAngle(UP_AXIS, rec.shudderYaw);
        KIT.setPose(rec.h, rec.pos, rec.quat, rec.scale);
      }
      SHUDDERS.splice(i, 1);
      continue;
    }
    rec.quat.setFromAxisAngle(UP_AXIS, rec.shudderYaw + Math.sin(rec.shudderT * 60) * 0.12 * (rec.shudderT / 0.4));
    KIT.setPose(rec.h, rec.pos, rec.quat, rec.scale);
  }
}

const SPOT_GLINTS = { idx: new Map() };

function updateGlints(t) {
  if (!GLINTS.batch) return;
  for (const rec of REC) {
    if (rec.d.rarity !== 'legendary' || rec.actor) continue;
    const loose = rec.state === ST.LOOSE || rec.state === ST.WILD;
    const ph = ((t + rec.h * 0.73) % 6) / 6;
    const pulse = loose && ph < 0.06 ? Math.sin((ph / 0.06) * Math.PI) : 0;
    const flash = pulse * (rec.spot ? 0.9 : 0.35);
    if (Math.abs(flash - rec.flash) > 0.02 || (flash === 0 && rec.flash !== 0)) {
      rec.flash = flash;
      KIT.setFx(rec.h, rec.glow, flash);
    }
    if (rec.spot) {
      let gi = SPOT_GLINTS.idx.get(rec.h);
      if (gi === undefined) {
        gi = GLINTS.batch.add(0, -10, 0, 0, 0, 1, 0.92, 0.65, 1);
        SPOT_GLINTS.idx.set(rec.h, gi);
      }
      GLINTS.batch.setCenter(gi, rec.pickC.x, rec.pickC.y + rec.met.totalH * 0.35, rec.pickC.z);
      GLINTS.batch.setSize(gi, 0.07 * FIG_SCALE * pulse, 0.07 * FIG_SCALE * pulse);
    } else if (SPOT_GLINTS.idx.has(rec.h)) {
      GLINTS.batch.setSize(SPOT_GLINTS.idx.get(rec.h), 0, 0);
    }
  }
  GLINTS.batch.commit();
}

/* ------------------------------------------------------------------------------------------------
   The Aranycikesz: a separate flyer that perches about every 20 s (DESIGN.md 6.2)
   ------------------------------------------------------------------------------------------------ */
const SNITCH = { flyer: null, rec: null, state: 'off', perch: 0, t: 0, curve: null, u: 0, len: 1, pos: new THREE.Vector3(), tan: new THREE.Vector3(), buzzT: 0 };

/** The record of the flying Snitch copy (copy 0 of the 'flyer' design); spawnAll gives it its wild state later. */
function snitchRecord() {
  return REC.find((r) => r.d.wild === 'flyer' && r.copy === 0) || null;
}

function initSnitch() {
  SNITCH.rec = snitchRecord();
  if (!SNITCH.flyer) {
    try {
      SNITCH.flyer = createSnitchFlyer(scene);
    } catch (err) {
      console.warn('[wild] snitch flyer unavailable', err);
      SNITCH.flyer = null;
    }
  }
  resetSnitch();
}

function resetSnitch() {
  // Look the record up again: initSnitch runs at boot before spawnAll / applySaveData set the wild state.
  SNITCH.rec = snitchRecord();
  const active = SNITCH.rec && !GAME.snitch.caught && SNITCH.rec.state === ST.HIDDEN;
  SNITCH.state = active ? 'perch' : 'off';
  SNITCH.perch = 0;
  SNITCH.t = 6 + Math.random() * 4;
  if (SNITCH.flyer) SNITCH.flyer.object3D.visible = !!active;
  if (active) {
    SNITCH.pos.copy(WORLD.snitchPerches[0]);
    placeFlyer(0);
  }
}

function placeFlyer(t) {
  const o = SNITCH.flyer && SNITCH.flyer.object3D;
  if (!o) return;
  o.position.copy(SNITCH.pos);
  if (SNITCH.state === 'fly') {
    tv1.copy(SNITCH.pos).add(SNITCH.tan);
    o.lookAt(tv1);
  }
  SNITCH.flyer.update(t, SNITCH.state === 'fly');
}

function snitchWaypoint(r) {
  for (let tries = 0; tries < 30; tries++) {
    const x = -6.8 + r() * 13.6;
    const z = -5.0 + r() * 10.2;
    const y = 1.4 + r() * 1.4;
    let ok = true;
    for (const c of WORLD.colliders) {
      if (c.top < y - 0.5) continue;
      if (c.type === 'box' && x > c.minX - 0.5 && x < c.maxX + 0.5 && z > c.minZ - 0.5 && z < c.maxZ + 0.5) ok = false;
      if (c.type === 'circle' && Math.hypot(x - c.x, z - c.z) < c.r + 0.5) ok = false;
      if (!ok) break;
    }
    if (ok) return vec3(x, y, z);
  }
  return vec3(0, 2.4, 1.5);
}

function startSnitchFlight() {
  const r = Math.random;
  let next = SNITCH.perch;
  while (next === SNITCH.perch) next = Math.floor(r() * WORLD.snitchPerches.length);
  const pts = [SNITCH.pos.clone()];
  const lift = SNITCH.pos.clone();
  lift.y += 0.4;
  pts.push(lift);
  const target = WORLD.snitchPerches[next];
  const wanted = 16 + r() * 8;
  let len = 0;
  let last = lift;
  while (len / 2.5 < wanted - 3 && pts.length < 12) {
    const w = snitchWaypoint(r);
    len += w.distanceTo(last);
    last = w;
    pts.push(w);
  }
  const above = target.clone();
  above.y += 0.5;
  pts.push(above, target.clone());
  SNITCH.curve = new THREE.CatmullRomCurve3(pts, false, 'centripetal');
  SNITCH.len = SNITCH.curve.getLength();
  SNITCH.u = 0;
  SNITCH.perch = next;
  SNITCH.state = 'fly';
}

function updateSnitch(dt, t) {
  if (SNITCH.state === 'off' || !SNITCH.flyer) return;
  if (SNITCH.state === 'perch') {
    if (!SETTINGS.wild) {
      if (SNITCH.perch !== 0) {
        SNITCH.perch = 0;
        SNITCH.pos.copy(WORLD.snitchPerches[0]);
      }
    } else {
      SNITCH.t -= dt;
      if (SNITCH.t <= 0) startSnitchFlight();
    }
  } else if (SNITCH.state === 'fly') {
    SNITCH.u += (dt * 2.5) / SNITCH.len;
    if (SNITCH.u >= 1) {
      SNITCH.u = 1;
      SNITCH.state = 'perch';
      SNITCH.t = 8;
    }
    SNITCH.curve.getPointAt(Math.min(1, SNITCH.u), SNITCH.pos);
    SNITCH.curve.getTangentAt(Math.min(1, SNITCH.u), SNITCH.tan);
    SNITCH.buzzT -= dt;
    if (SNITCH.buzzT <= 0) {
      SNITCH.buzzT = 0.9;
      const d = SNITCH.pos.distanceTo(camera.position);
      if (d < 7) voice('buzz', 0.35 * (1 - d / 7));
    }
  }
  placeFlyer(t);
}

/** Aim score of the Snitch (perched: cone x1.6; flying: within 1 m of the view ray and in reach). */
function snitchTargetScore(eye, dir, reach, cone) {
  if (SNITCH.state === 'off' || !SNITCH.flyer) return 1e9;
  if (SNITCH.state === 'perch') {
    const { a, dist } = angleTo(eye, dir, SNITCH.pos, 0.04 * FIG_SCALE);
    if (dist > reach || a > cone * 1.6) return 1e9;
    return a / (cone * 1.6) + 0.25 * dist / reach - 0.15;
  }
  tv2.subVectors(SNITCH.pos, eye);
  const along = tv2.dot(dir);
  if (along < 0.2 || along > reach) return 1e9;
  tv3.copy(dir).multiplyScalar(along);
  const off = tv3.distanceTo(tv2);
  if (off > 1.0 || Math.atan2(off, along) > cone * 2.2) return 1e9;
  return 0.4 + off;
}

/** @returns {boolean} true when the Snitch was caught into the stack */
function catchSnitch() {
  const rec = SNITCH.rec;
  if (!rec || SNITCH.state === 'off') return false;
  if (GAME.stack.length >= stackCapacity()) {
    toast(TXT.toastHandsFull, 'bad');
    return false;
  }
  SNITCH.state = 'off';
  if (SNITCH.flyer) SNITCH.flyer.object3D.visible = false;
  GAME.snitch.caught = true;
  rec.wild = null;
  rec.pos.copy(SNITCH.pos);
  rec.pos.y -= rec.met.centerY * rec.scale;
  rec.quat.identity();
  rec.viewScale = 0;
  puff(SNITCH.pos.x, SNITCH.pos.y, SNITCH.pos.z, 0.25);
  startHandFlight(rec);
  pushStack(rec);
  toast(TXT.toastSnitch, 'gold');
  sfx('sparkle');
  recount();
  markDirty();
  return true;
}

/* ------------------------------------------------------------------------------------------------
   Runaway nifflers (SNIFF → RUN → sometimes DIG)
   ------------------------------------------------------------------------------------------------ */

/** A niffler that dug into a heap pops out at its foot, on free floor. */
function nifflerPopOut(rec) {
  const hp = nearestHeap(rec.pos.x, rec.pos.z);
  for (let t = 0; t < 10; t++) {
    const a = Math.random() * Math.PI * 2;
    const x = hp.x + Math.cos(a) * hp.rx * 1.1;
    const z = hp.z + Math.sin(a) * hp.rz * 1.1;
    if (!inRoom(x, z) || insideCollider(x, z, 0.05)) continue;
    rec.pos.set(x, 0, z);
    break;
  }
  rec.pos.y = groundAt(rec.pos.x, rec.pos.z, 0.3);
}
function updateNifflers(dt, t) {
  const lure = GAME.boons.nifflerLure;
  for (const rec of REC) {
    const w = rec.wild;
    if (!w || w.kind !== 'scurrier' || rec.state !== ST.WILD) continue;
    if (!SETTINGS.wild && w.mode !== 'sniff') {
      if (w.mode === 'dig') {
        // Pop a digging niffler back out (as the dig end does) so it is visible and aimable again.
        nifflerPopOut(rec);
        KIT.setMode(rec.h, FIG_MODE.LOOSE);
      }
      w.mode = 'sniff';
      w.t = 2;
    }
    if (w.mode === 'sniff') {
      w.t -= dt;
      w.hop = (w.hop + dt * 9) % (Math.PI * 2);
      const wob = Math.sin(t * 7 + rec.h) * 0.25;
      rec.quat.setFromAxisAngle(UP_AXIS, w.yaw || 0).multiply(tq1.setFromAxisAngle(Z_AXIS, wob * 0.2));
      rec.pos.y = groundAt(rec.pos.x, rec.pos.z, 1) + Math.max(0, Math.sin(w.hop)) * 0.012 * FIG_SCALE;
      if (w.t <= 0 && SETTINGS.wild) {
        if (Math.random() < 0.25) {
          w.mode = 'dig';
          w.t = 4;
          hashRemove(rec);
          KIT.setMode(rec.h, FIG_MODE.HIDDEN);
          puff(rec.pos.x, rec.pos.y + 0.03, rec.pos.z, 0.15, [0.7, 0.55, 0.35], 6);
          continue;
        }
        const cands = WORLD.nifflerWaypoints.filter((p) => {
          const d = Math.hypot(p.x - rec.pos.x, p.z - rec.pos.z);
          return d >= 2 && d <= 6 && (GAME.playS < 60 || p.z > -5.8);
        });
        const p = cands.length ? cands[Math.floor(Math.random() * cands.length)] : WORLD.nifflerWaypoints[Math.floor(Math.random() * 5)];
        w.tx = p.x + (Math.random() - 0.5) * 0.6;
        w.tz = p.z + (Math.random() - 0.5) * 0.6;
        w.mode = 'run';
      }
    } else if (w.mode === 'run') {
      const speed = lure ? 0.55 : 1.1;
      const dx = w.tx - rec.pos.x;
      const dz = w.tz - rec.pos.z;
      const d = Math.hypot(dx, dz);
      if (d < 0.08) {
        w.mode = 'sniff';
        w.t = lure ? 6 + Math.random() * 3 : 3 + Math.random() * 2;
      } else {
        const nx = rec.pos.x + (dx / d) * speed * dt;
        const nz = rec.pos.z + (dz / d) * speed * dt;
        if (insideCollider(nx, nz, 0.05) || !inRoom(nx, nz) || heapAt(nx, nz, 1.02)) {
          w.mode = 'sniff';
          w.t = 0.5;
        } else {
          rec.pos.x = nx;
          rec.pos.z = nz;
        }
        w.yaw = Math.atan2(dx, dz);
        rec.pos.y = groundAt(rec.pos.x, rec.pos.z, 1) + Math.abs(Math.sin(t * 16 + rec.h)) * 0.01 * FIG_SCALE;
        rec.quat.setFromAxisAngle(UP_AXIS, w.yaw);
      }
    } else if (w.mode === 'dig') {
      w.t -= dt;
      if (w.t <= 0) {
        nifflerPopOut(rec);
        w.mode = 'sniff';
        w.t = 2 + Math.random() * 2;
        KIT.setMode(rec.h, FIG_MODE.LOOSE);
        puff(rec.pos.x, rec.pos.y + 0.03, rec.pos.z, 0.15, [0.7, 0.55, 0.35], 6);
      } else continue;
    }
    rec.groundY = rec.pos.y;
    KIT.setPose(rec.h, rec.pos, rec.quat, rec.scale);
    updatePickCenter(rec);
    hashUpdate(rec);
    BLOB_DIRTY.v = true;
  }
}

/* ------------------------------------------------------------------------------------------------
   Hóborc's water bomb (cauldron card and the 25 % / 60 % ambient events)
   ------------------------------------------------------------------------------------------------ */
const BOMB = { active: false, t: 0, heap: -1, balloon: null, x: 0, z: 0, thrown: false, splashed: false, paid: false };

function checkBombThresholds() {
  const f = GAME.sorted / Math.max(1, GAME.totalCounted);
  if (!GAME.events.bomb25 && f >= 0.25) {
    GAME.events.bomb25 = true;
    if (SETTINGS.bombs) startWaterBomb();
  } else if (!GAME.events.bomb60 && f >= 0.6) {
    GAME.events.bomb60 = true;
    if (SETTINGS.bombs) startWaterBomb();
  }
}

function startWaterBomb() {
  if (BOMB.active) return;
  const counts = WORLD.heaps.map(() => 0);
  for (const rec of REC) if (rec.state === ST.LOOSE && rec.heap >= 0) counts[rec.heap]++;
  let best = -1;
  let bc = 0;
  WORLD.heaps.forEach((hp, i) => {
    if (!hp.crate && counts[i] > bc) {
      bc = counts[i];
      best = i;
    }
  });
  BOMB.active = true;
  BOMB.t = 0;
  BOMB.heap = best;
  BOMB.thrown = false;
  BOMB.splashed = false;
  const hp = best >= 0 ? WORLD.heaps[best] : WORLD.heaps[0];
  BOMB.x = hp.x;
  BOMB.z = hp.z;
  if (!BOMB.balloon) {
    BOMB.balloon = new THREE.Mesh(new THREE.SphereGeometry(0.11, 16, 12), new THREE.MeshStandardMaterial({ color: 0x5aa0ff, transparent: true, opacity: 0.6, roughness: 0.1, envMapIntensity: 1.5 }));
    BOMB.balloon.visible = false;
    scene.add(BOMB.balloon);
  }
  voice('cackle', 1);
}

function updateWaterBomb(dt, t) {
  if (!BOMB.active) return;
  BOMB.t += dt;
  const h = actorHandle;
  const ax = BOMB.x;
  const az = BOMB.z;
  const appear = clamp01(BOMB.t / 0.5) * (1 - clamp01((BOMB.t - 4.4) / 0.4));
  if (h >= 0) {
    const rec = REC[h];
    rec.pos.set(ax + 0.6, 2.0 + Math.sin(t * 2.2) * 0.08, az + 0.3);
    tv1.subVectors(camera.position, rec.pos);
    rec.quat.setFromAxisAngle(UP_AXIS, Math.atan2(tv1.x, tv1.z));
    KIT.setPose(h, rec.pos, rec.quat, (6 / FIG_SCALE) * Math.max(0.01, appear));
    KIT.setMode(h, appear > 0.01 ? FIG_MODE.LOOSE : FIG_MODE.HIDDEN);
  }
  if (BOMB.t > 1.4 && !BOMB.thrown) {
    BOMB.thrown = true;
    BOMB.balloon.visible = true;
  }
  if (BOMB.thrown && !BOMB.splashed) {
    const k = clamp01((BOMB.t - 1.4) / 0.8);
    BOMB.balloon.position.set(lerp(ax + 0.6, ax, k), lerp(2.6, 0.2, k) + Math.sin(k * Math.PI) * 0.5, lerp(az + 0.3, az, k));
    if (k >= 1) {
      BOMB.splashed = true;
      BOMB.balloon.visible = false;
      splashHeap();
    }
  }
  if (BOMB.t > 4.8) {
    BOMB.active = false;
    if (h >= 0) KIT.setMode(h, FIG_MODE.HIDDEN);
    puff(ax + 0.6, 2.2, az + 0.3, 0.6, [0.7, 0.85, 1.0], 14);
    sfx('pop');
    pay(BONUS.bomb, true);
    toast(fmt(TXT.toastPeeves, { n: BONUS.bomb }), 'gold');
    markDirty();
  }
}

function splashHeap() {
  sfx('splash');
  puff(BOMB.x, 0.3, BOMB.z, 0.9, [0.5, 0.75, 1.0], 24);
  if (BOMB.heap < 0) return;
  const list = REC.filter((r) => r.state === ST.LOOSE && r.heap === BOMB.heap);
  // The whole pile flies apart: drop its links at once instead of settling it figurine by figurine.
  const hp = WORLD.heaps[BOMB.heap];
  if (hp.pile) hp.pile.length = 0;
  for (const rec of list) {
    rec.heap = -1;
    rec.under = [];
    rec.over = [];
    KIT.setBaseVisible(rec.h, true);
  }
  // The surface is bare straw again: the scattered figurines land on it (or on each other) afresh.
  if (hp.grid) pileGridReset(hp);
  let simulated = 0;
  for (const rec of list) {
    const a = Math.random() * Math.PI * 2;
    const sp = 1 + Math.random() * 2;
    if (simulated < PHYS.maxSim - SIMS.length) {
      updatePickCenter(rec);
      rec.pos.copy(rec.pickC);
      rec.vel.set(Math.cos(a) * sp, 2 + Math.random(), Math.sin(a) * sp);
      rec.spin.set((Math.random() - 0.5) * 9, (Math.random() - 0.5) * 9, (Math.random() - 0.5) * 9);
      rec.homing = false;
      startSim(rec);
      simulated++;
    } else {
      const d = 0.8 + Math.random() * 1.8;
      let x = BOMB.x + Math.cos(a) * d;
      let z = BOMB.z + Math.sin(a) * d;
      if (!inRoom(x, z) || insideCollider(x, z, 0.05)) {
        x = BOMB.x + Math.cos(a) * 0.5;
        z = BOMB.z + Math.sin(a) * 0.5;
      }
      const onHeap = heapAt(x, z, 0.98);
      if (onHeap) joinPile(rec, onHeap, x, z);
      else poseRandom(rec, x, groundAt(x, z, 0.3), z, Math.random, 0.3, 0.6);
      syncRec(rec);
      hashUpdate(rec);
    }
  }
  markDirty();
}

/* ------------------------------------------------------------------------------------------------
   House-elf helpers (bought at the Varázslatpult): every interval each elf shelves one loose figurine
   ------------------------------------------------------------------------------------------------ */
const ELVES = { t: 0 };

function updateElves(dt) {
  const lvl = GAME.up.elves;
  if (!lvl || !GAME.flags.elvesOn) return;
  const cfg = UPGRADES.elves.values[lvl];
  ELVES.t += dt;
  if (ELVES.t < cfg.every) return;
  ELVES.t = 0;
  for (let k = 0; k < cfg.n; k++) elfShelveOne();
}

function elfShelveOne() {
  const cands = [];
  for (const rec of REC) {
    if (rec.state !== ST.LOOSE || rec.actor || rec.wild || !rec.counted) continue;
    if (rec.pos.z < HALL.minZ || isCovered(rec)) continue;
    const slot = slotFor(rec);
    if (!slot || slot.id === 'honor' || freePosition(slot) < 0) continue;
    cands.push(rec);
  }
  if (!cands.length) return false;
  const rec = cands[Math.floor(Math.random() * cands.length)];
  const slot = slotFor(rec);
  const posIdx = freePosition(slot);
  puff(rec.pickC.x, rec.pickC.y, rec.pickC.z, 0.25, [1.0, 0.9, 0.65], 10);
  sfx('pop');
  rec.spot = false;
  slot.occupants[posIdx] = rec.h;
  const p = slot.positions[posIdx];
  startScript(rec, p.x, p.y, p.z, slot.yaws[posIdx], 1.4, 'elf', { slot, posIdx });
  if (Math.random() < 0.25) toast(fmt(TXT.toastElf, { name: rec.d.nameHu }));
  return true;
}
