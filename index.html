/* ------------------------------------------------------------------------------------------------
   Candles: instanced wax bodies, flames and halos in two billboard batches (one draw call each)
   ------------------------------------------------------------------------------------------------ */
const CANDLES = { recs: [], mesh: null, flames: null, halos: null, fx: [] };
const candleRng = rng(2700);

function initCandleBatches() {
  CANDLES.flames = new BillboardBatch(140, TEX.flame, { additive: true, order: 6 });
  CANDLES.halos = new BillboardBatch(140, TEX.glow, { additive: true, order: 6 });
}

/** A candle: wax body (instanced later), flame and halo sprites. lit = false keeps the flame at zero size. */
function addCandle(x, y, z, height, radius, opts = {}) {
  const rec = {
    x, y, z, baseY: y, h: height, r: radius, floating: !!opts.floating, lit: opts.lit !== false, glow: opts.glow || 0.42,
    phase: candleRng() * 10, flame: -1, halo: -1, body: -1, litT: opts.lit === false ? 0 : 1,
  };
  rec.flame = CANDLES.flames.add(x, y + height + 0.024, z, 0.011, 0.028, 4.2, 2.7, 1.3, 1);
  rec.halo = CANDLES.halos.add(x, y + height + 0.026, z, rec.glow / 2, rec.glow / 2, 0.34, 0.18, 0.07, 1);
  CANDLES.recs.push(rec);
  return rec;
}

/** Free-standing flame effect (fireplace, lantern, cauldron): tinted flame + halo, flickering. */
function addFlameFx(x, y, z, w, h, col, haloSize, haloCol) {
  const fx = { x, y, z, w, h, phase: candleRng() * 10, flame: -1, halo: -1, col, haloSize, haloCol, on: true };
  fx.flame = CANDLES.flames.add(x, y, z, w, h, col[0], col[1], col[2], 1);
  fx.halo = haloSize > 0 ? CANDLES.halos.add(x, y, z, haloSize, haloSize, haloCol[0], haloCol[1], haloCol[2], 1) : -1;
  CANDLES.fx.push(fx);
  return fx;
}

function finishCandles() {
  const n = CANDLES.recs.length;
  const geo = new THREE.CylinderGeometry(0.96, 1, 1, 14, 1);
  geo.translate(0, 0.5, 0);
  const mesh = new THREE.InstancedMesh(geo, M.wax, Math.max(1, n));
  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  mesh.frustumCulled = false;
  CANDLES.recs.forEach((c, i) => {
    c.body = i;
    tm1.compose(tv1.set(c.x, c.y, c.z), tq1.identity(), tv2.set(c.r, c.h, c.r));
    mesh.setMatrixAt(i, tm1);
  });
  mesh.count = n;
  scene.add(mesh);
  CANDLES.mesh = mesh;
}

function animateCandles(t) {
  const F = CANDLES.flames;
  const H = CANDLES.halos;
  const mesh = CANDLES.mesh;
  let moved = false;
  for (let i = 0; i < CANDLES.recs.length; i++) {
    const c = CANDLES.recs[i];
    const p = c.phase;
    const f = 0.84 + 0.08 * Math.sin(t * 11.3 + p) + 0.05 * Math.sin(t * 23.1 + p * 2.3) + 0.03 * Math.sin(t * 41.7 + p * 0.7);
    const target = c.lit ? 1 : 0;
    if (c.litT !== target) c.litT = clamp01(c.litT + (target > c.litT ? 0.05 : -0.05));
    const k = c.litT;
    if (c.floating) {
      c.y = c.baseY + 0.07 * Math.sin(t * 0.55 + p);
      tm1.compose(tv1.set(c.x, c.y, c.z), tq1.setFromEuler(te1.set(0.025 * Math.sin(t * 0.33 + p), 0, 0.03 * Math.sin(t * 0.4 + p * 2))), tv2.set(c.r, c.h, c.r));
      mesh.setMatrixAt(c.body, tm1);
      moved = true;
    }
    const fy = c.y + c.h + 0.024;
    F.setCenter(c.flame, c.x + 0.0015 * Math.sin(t * 6.1 + p), fy, c.z);
    F.setSize(c.flame, 0.011 * (0.94 + 0.08 * f) * k, 0.028 * f * k);
    H.setCenter(c.halo, c.x, fy + 0.002, c.z);
    const hs = c.glow * 0.5 * (0.9 + 0.12 * f) * k;
    H.setSize(c.halo, hs, hs);
  }
  for (const fx of CANDLES.fx) {
    const p = fx.phase;
    const f = 0.8 + 0.12 * Math.sin(t * 9.7 + p) + 0.08 * Math.sin(t * 17.3 + p * 1.9);
    const on = fx.on ? 1 : 0;
    F.setSize(fx.flame, fx.w * (0.92 + 0.1 * f) * on, fx.h * f * on);
    if (fx.halo >= 0) H.setSize(fx.halo, fx.haloSize * (0.92 + 0.1 * f) * on, fx.haloSize * (0.92 + 0.1 * f) * on);
  }
  if (moved) mesh.instanceMatrix.needsUpdate = true;
  F.commit();
  H.commit();
}

/* ------------------------------------------------------------------------------------------------
   Plates (frame, coloured background, name from the atlas, state icon) and empty-position markers
   ------------------------------------------------------------------------------------------------ */
const PLATES = { list: [], frame: null, bg: null, name: null, icon: null, nameRect: null, iconCell: null, pulse: -1, pulseT: 0 };
const PLATE_STATE = { EMPTY: 0, ROOM: 1, DONE: 2, WRONG: 3 };
const PLATE_BG = [new THREE.Color(0x8e8169), new THREE.Color(0xf3ead3), new THREE.Color(0xe8a33c), new THREE.Color(0xc8322a)];
const PLATE_INK = [new THREE.Color(0x231a10), new THREE.Color(0x2a1c10), new THREE.Color(0x2a1606), new THREE.Color(0xfff4e6)];

/** Registers a plate (pose in world space); the meshes are created once all plates are known. */
function addPlate(slot, x, y, z, yaw, tilt, w = 0.22, h = 0.055) {
  const p = { slot, pos: vec3(x, y, z), quat: new THREE.Quaternion().setFromEuler(new THREE.Euler(-tilt, yaw, 0, 'YXZ')), w, h, state: -1, cell: -1, text: '' };
  PLATES.list.push(p);
  slot.plate = PLATES.list.length - 1;
  return p;
}

function plateUvPatch(attrName) {
  return (shader) => {
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', `#include <common>\nattribute vec4 ${attrName};`)
      .replace('#include <uv_vertex>', `#include <uv_vertex>\n#ifdef USE_MAP\nvMapUv = ${attrName}.xy + uv * ${attrName}.zw;\n#endif`);
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\ntotalEmissiveRadiance += diffuseColor.rgb * 0.3;');
  };
}

function buildPlates() {
  const n = PLATES.list.length;
  const frameGeo = new THREE.BoxGeometry(1, 1, 1);
  const bgGeo = new THREE.PlaneGeometry(1, 1);
  const nameGeo = new THREE.PlaneGeometry(1, 1);
  const iconGeo = new THREE.PlaneGeometry(1, 1);
  const bgMat = new THREE.MeshStandardMaterial({ roughness: 0.7, metalness: 0, envMapIntensity: 0.4 });
  bgMat.onBeforeCompile = (shader) => {
    shader.fragmentShader = shader.fragmentShader.replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\ntotalEmissiveRadiance += diffuseColor.rgb * 0.22;');
  };
  bgMat.customProgramCacheKey = () => 'plate-bg';
  const nameMat = new THREE.MeshStandardMaterial({ map: PLATE_ATLAS.tex, transparent: true, depthWrite: false, roughness: 0.8, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1 });
  nameMat.onBeforeCompile = plateUvPatch('nameRect');
  nameMat.customProgramCacheKey = () => 'plate-name';
  const iconMat = new THREE.MeshStandardMaterial({ map: TEX.plateIcons, transparent: true, depthWrite: false, roughness: 0.8, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1 });
  iconMat.onBeforeCompile = plateUvPatch('iconRect');
  iconMat.customProgramCacheKey = () => 'plate-icon';
  PLATES.frame = new THREE.InstancedMesh(frameGeo, M.brass, n);
  PLATES.bg = new THREE.InstancedMesh(bgGeo, bgMat, n);
  PLATES.nameRect = new THREE.InstancedBufferAttribute(new Float32Array(n * 4), 4);
  PLATES.iconRect = new THREE.InstancedBufferAttribute(new Float32Array(n * 4), 4);
  nameGeo.setAttribute('nameRect', PLATES.nameRect);
  iconGeo.setAttribute('iconRect', PLATES.iconRect);
  PLATES.name = new THREE.InstancedMesh(nameGeo, nameMat, n);
  PLATES.icon = new THREE.InstancedMesh(iconGeo, iconMat, n);
  PLATES.list.forEach((p, i) => {
    setPlateMatrices(i, 1);
    PLATES.bg.setColorAt(i, PLATE_BG[0]);
    PLATES.name.setColorAt(i, PLATE_INK[0]);
    PLATES.icon.setColorAt(i, PLATE_INK[0]);
    PLATES.iconRect.setXYZW(i, 0.75, 0, 0.25, 1);
  });
  for (const m of [PLATES.frame, PLATES.bg, PLATES.name, PLATES.icon]) {
    m.instanceMatrix.needsUpdate = true;
    if (m.instanceColor) m.instanceColor.needsUpdate = true;
    m.computeBoundingSphere();
    scene.add(m);
  }
  PLATES.name.renderOrder = 2;
  PLATES.icon.renderOrder = 2;
}

function setPlateMatrices(i, s) {
  const p = PLATES.list[i];
  const fw = p.w + 0.014;
  const fh = p.h + 0.012;
  tm1.compose(p.pos, p.quat, tv1.set(fw * s, fh * s, 0.006));
  tm2.makeTranslation(0, 0, -0.5);
  PLATES.frame.setMatrixAt(i, tm1.multiply(tm2));
  tm1.compose(tv2.set(0, 0, 0.0032).applyQuaternion(p.quat).add(p.pos), p.quat, tv1.set(p.w * s, p.h * s, 1));
  PLATES.bg.setMatrixAt(i, tm1);
  const iconW = p.h * 0.72;
  tm1.compose(tv2.set(-iconW * 0.55, 0, 0.0036).applyQuaternion(p.quat).add(p.pos), p.quat, tv1.set((p.w - iconW * 1.2) * s, p.h * 0.92 * s, 1));
  PLATES.name.setMatrixAt(i, tm1);
  tm1.compose(tv2.set(p.w / 2 - iconW * 0.62, 0, 0.0038).applyQuaternion(p.quat).add(p.pos), p.quat, tv1.set(iconW * s, iconW * s, 1));
  PLATES.icon.setMatrixAt(i, tm1);
}

let plateCellCounter = 0;
/** Writes the plate's name into its own atlas cell (once, or again when the text changes). */
function setPlateText(i, text) {
  const p = PLATES.list[i];
  if (p.text === text) return;
  if (p.cell < 0) p.cell = plateCellCounter++;
  p.text = text;
  const r = drawPlateCell(p.cell, text);
  PLATES.nameRect.setXYZW(i, r[0], r[1], r[2], r[3]);
  PLATES.nameRect.needsUpdate = true;
}

function setPlateState(i, state) {
  const p = PLATES.list[i];
  if (p.state === state) return;
  p.state = state;
  PLATES.bg.setColorAt(i, PLATE_BG[state]);
  PLATES.name.setColorAt(i, PLATE_INK[state]);
  PLATES.icon.setColorAt(i, PLATE_INK[state]);
  const cell = state === PLATE_STATE.ROOM ? 0 : state === PLATE_STATE.DONE ? 1 : state === PLATE_STATE.WRONG ? 2 : 3;
  PLATES.iconRect.setXYZW(i, cell * 0.25, 0, 0.25, 1);
  PLATES.bg.instanceColor.needsUpdate = true;
  PLATES.name.instanceColor.needsUpdate = true;
  PLATES.icon.instanceColor.needsUpdate = true;
  PLATES.iconRect.needsUpdate = true;
}

/** Útjelző: the target plate pulses for a few seconds. */
function pulsePlate(i, seconds) {
  if (PLATES.pulse >= 0 && PLATES.pulse !== i) {
    setPlateMatrices(PLATES.pulse, 1);
    flagPlateMatrices();
  }
  PLATES.pulse = i;
  PLATES.pulseT = seconds;
}

function flagPlateMatrices() {
  for (const m of [PLATES.frame, PLATES.bg, PLATES.name, PLATES.icon]) m.instanceMatrix.needsUpdate = true;
}

function animatePlates(t, dt) {
  if (PLATES.pulse < 0) return;
  PLATES.pulseT -= dt;
  if (PLATES.pulseT <= 0) {
    setPlateMatrices(PLATES.pulse, 1);
    PLATES.pulse = -1;
  } else setPlateMatrices(PLATES.pulse, 1 + 0.18 * (0.5 + 0.5 * Math.sin(t * 9)));
  flagPlateMatrices();
}

const MARKERS = { mesh: null, cap: 0, dirty: true };
function buildMarkers() {
  let cap = 0;
  for (const s of WORLD.slots) cap += s.positions.length;
  MARKERS.cap = cap;
  const geo = new THREE.CylinderGeometry(1, 1, 1, 18, 1);
  geo.translate(0, 0.5, 0);
  MARKERS.mesh = new THREE.InstancedMesh(geo, M.marker, Math.max(1, cap));
  MARKERS.mesh.frustumCulled = false;
  MARKERS.mesh.count = 0;
  scene.add(MARKERS.mesh);
}

/** Rebuilds the empty-position markers (called only when a slot's occupancy changed). */
function updateMarkers() {
  if (!MARKERS.dirty) return;
  MARKERS.dirty = false;
  let n = 0;
  for (const s of WORLD.slots) {
    if (!s.occupants) continue;
    for (let k = 0; k < s.positions.length; k++) {
      if (s.occupants[k] >= 0) continue;
      const p = s.positions[k];
      const r = s.markerR * 0.62 * s.posScale[k];
      tm1.compose(tv1.set(p.x, p.y + 0.0005, p.z), tq1.identity(), tv2.set(r, 0.002, r));
      MARKERS.mesh.setMatrixAt(n++, tm1);
    }
  }
  MARKERS.mesh.count = n;
  MARKERS.mesh.instanceMatrix.needsUpdate = true;
}

/* ------------------------------------------------------------------------------------------------
   Blob contact shadows under figurines (one instanced draw)
   ------------------------------------------------------------------------------------------------ */
const BLOBS = { mesh: null, cap: 0 };
function buildBlobs(cap) {
  const geo = new THREE.PlaneGeometry(1, 1);
  geo.rotateX(-Math.PI / 2);
  BLOBS.cap = cap;
  BLOBS.mesh = new THREE.InstancedMesh(geo, M.blob, Math.max(1, cap));
  BLOBS.mesh.frustumCulled = false;
  BLOBS.mesh.count = 0;
  BLOBS.mesh.renderOrder = 1;
  scene.add(BLOBS.mesh);
}

/* ------------------------------------------------------------------------------------------------
   Slots
   ------------------------------------------------------------------------------------------------ */

/**
 * Copy positions of a slot in its local frame (x right, z towards the room): rows of 4, 3 and 3 (front row widest),
 * centred; a row offset by half a pitch from the one in front of it is tucked in (hexagonal packing), an aligned row
 * keeps a full base diameter. The pitch is the base diameter plus a small gap, squeezed only as far as the slot width
 * needs; the front row stays on the shelf board.
 */
function slotLocalPositions(cap, baseR, slotW) {
  const out = [];
  const pattern = cap <= 4 ? [cap] : cap <= 7 ? [4, cap - 4] : [4, 3, cap - 7];
  const widest = Math.max(...pattern);
  const pitchX = Math.min(2 * baseR + 0.012, widest > 1 ? (slotW - 2 * baseR - 0.01) / (widest - 1) : 1);
  const touch = 2 * baseR + 0.008;
  const dzHex = Math.sqrt(Math.max(0, touch * touch - 0.25 * pitchX * pitchX));
  let z = -(baseR + 0.035);
  pattern.forEach((n, r) => {
    if (r > 0) z -= (n % 2) !== (pattern[r - 1] % 2) ? dzHex : touch;
    for (let i = 0; i < n; i++) out.push([(i - (n - 1) / 2) * pitchX, z]);
  });
  return out;
}

function newSlot(id, kind, design, cat, capacity) {
  const s = {
    id, kind, design, cat, catIdx: FIG_CATEGORY_INDEX[cat] ?? -1, capacity, positions: [], yaws: [], posScale: [], center: new THREE.Vector3(),
    halfSize: new THREE.Vector3(), yaw: 0, plate: -1, occupants: new Int16Array(capacity).fill(-1), correct: 0, wrong: 0, done: false,
    unit: null, sector: null, sizeIndex: -1, markerR: 0.03, nameHu: '',
  };
  WORLD.slots.push(s);
  WORLD.slotById[id] = s;
  return s;
}

/* ------------------------------------------------------------------------------------------------
   Signs: unit signs and station signs share one atlas and one mesh; unit signs glow when their shelf is done
   ------------------------------------------------------------------------------------------------ */
const SIGNS = { mesh: null, glow: null, quads: [], pos: [], uv: [], idx: [], glowList: [] };

/** Adds a sign face (atlas cell) of size w × h, placed by matrix m (the face looks along local +Z). */
function addSignQuad(m, w, h, cell) {
  const base = SIGNS.pos.length / 3;
  for (const [lx, ly] of [[-w / 2, -h / 2], [w / 2, -h / 2], [w / 2, h / 2], [-w / 2, h / 2]]) {
    tv1.set(lx, ly, 0).applyMatrix4(m);
    SIGNS.pos.push(tv1.x, tv1.y, tv1.z);
    SIGNS.glowList.push(0);
  }
  const [u0, v0, u1, v1] = signCellUV(cell);
  SIGNS.uv.push(u0, v0, u1, v0, u1, v1, u0, v1);
  SIGNS.idx.push(base, base + 1, base + 2, base, base + 2, base + 3);
  return base;
}

function finishSigns() {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(SIGNS.pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(SIGNS.uv, 2));
  SIGNS.glow = new THREE.Float32BufferAttribute(SIGNS.glowList, 1);
  g.setAttribute('aGlow', SIGNS.glow);
  g.setIndex(SIGNS.idx);
  g.computeVertexNormals();
  g.computeBoundingSphere();
  SIGNS.mesh = new THREE.Mesh(g, M.sign);
  SIGNS.mesh.matrixAutoUpdate = false;
  SIGNS.mesh.updateMatrix();
  scene.add(SIGNS.mesh);
}

/** Sets the gold glow of a unit's sign (0..1). */
function setSignGlow(catKey, amount) {
  const u = WORLD.units[catKey];
  if (!u || !SIGNS.glow) return;
  const base = SIGNS.quads[u.signQuad];
  for (let k = 0; k < 4; k++) SIGNS.glow.setX(base + k, amount);
  SIGNS.glow.needsUpdate = true;
}

/** A painted station sign on a gilt post with a curl on top (both faces show the sign). */
function stationSign(F, px, pz, cell, signY = 2.05) {
  const post = F.pt(px, 0, pz);
  DB.metal.cyl(PAL.gold, dmat(post.x, (signY + 0.31) / 2, post.z), 0.025, 0.03, signY + 0.31, 10);
  DB.metal.torus(PAL.gold, F.at(px, signY + 0.37, pz), 0.1, 0.012, 6, 18, Math.PI * 1.5);
  DB.metal.box(PAL.gold, F.at(px + 0.56, signY + 0.22, pz), 1.14, 0.02, 0.02, 'x');
  for (const sx of [0.22, 1.02]) DB.metal.cyl(PAL.gold, F.at(px + sx, signY + 0.19, pz), 0.005, 0.005, 0.06, 4);
  const sm = F.at(px + 0.62, signY, pz, 0.05, 0, 0);
  DB.paint.geo(boxGeo(1.06, 0.3, 0.03, { grain: 'x' }), PAL.plumDeep, sm);
  addSignQuad(sm.clone().multiply(dmat(0, 0, 0.0165)), 1.0, 0.25, cell);
  addSignQuad(sm.clone().multiply(dmat(0, 0, -0.0165, 0, Math.PI, 0)), 1.0, 0.25, cell);
}

/* ------------------------------------------------------------------------------------------------
   Shelving units: lacquered plum carcass, coloured trims, category-tinted back, signs, sconces, slots, plates
   ------------------------------------------------------------------------------------------------ */

function unitPoint(L, lx, ly, lz) {
  yawRotate(lx, lz, L.yaw, tv5);
  return vec3(L.x + tv5.x, ly, L.z + tv5.z);
}

/**
 * Sizes every shelving unit from its own figurines and spreads the units over their walls (called once, before
 * buildUnits). A slot holds the ten copies of one design in three staggered rows (4 + 3 + 3) of the category's widest
 * base; a level fits the category's tallest design; the number of levels follows from the design count and the unit's
 * columns. Fills UNIT_LAYOUT[key].x / z / dims, UNIT.depth (common to all units) and WORLD.unitGaps (the gaps between
 * neighbouring units, filled by narrow decor racks).
 */
function layoutShelves() {
  const U = UNIT;
  const round2 = (v) => Math.round(v * 100) / 100;
  const ceil2 = (v) => Math.ceil(v * 100 - 1e-6) / 100;
  let depth = 0;
  for (const key in UNIT_LAYOUT) {
    const L = UNIT_LAYOUT[key];
    const designs = FIG_DESIGNS.filter((d) => d.category === key);
    let maxH = 0;
    let maxR = 0;
    for (const d of designs) {
      const m = getFigureMetrics(d.id);
      maxH = Math.max(maxH, m.totalH);
      maxR = Math.max(maxR, m.baseR);
    }
    const cols = Math.max(1, L.cols || 2);
    const levelCount = Math.max(1, Math.ceil(designs.length / cols));
    // Three pitches of (diameter + 12 mm) plus one base diameter and a margin (the 4-wide front row).
    const slotW = ceil2(8 * maxR + 0.056);
    const clear = ceil2(maxH + 0.03);
    const levels = [];
    for (let i = 0; i < levelCount; i++) levels.push(round2(U.firstLevel + i * (clear + U.board)));
    const top = round2(levels[levelCount - 1] + clear);
    const width = round2(cols * slotW + (cols - 1) * U.divider + 2 * U.side);
    const slotX = [];
    for (let c = 0; c < cols; c++) slotX.push((c - (cols - 1) / 2) * (slotW + U.divider));
    // Slot order: top level first, left before right.
    const order = [];
    for (let li = levelCount - 1; li >= 0; li--) for (let c = 0; c < cols; c++) order.push([li, c]);
    const back = Math.max(...slotLocalPositions(10, maxR, slotW).map(([, pz]) => -pz)) + maxR;
    depth = Math.max(depth, back + 0.04);
    const signW = Math.min(U.signW, width - 0.06);
    L.dims = {
      cols, levels, clear, top, width, slotW, slotX, order, maxR,
      cornice: top + 0.099, signY: round2(Math.min(2.9, top + 0.46)), signW, signH: Math.min(U.signH, signW * 0.3),
    };
  }
  U.depth = round2(depth);
  WORLD.unitGaps = [];
  for (const wall of ['back', 'left', 'right']) {
    const list = Object.values(UNIT_LAYOUT).filter((L) => L.wall === wall).sort((a, b) => a.order - b.order);
    if (!list.length) continue;
    const span = UNIT_WALLS[wall];
    const total = list.reduce((s, L) => s + L.dims.width, 0);
    const free = span.to - span.from - total;
    if (free < 0) console.warn('[world] shelving units are wider than the wall', wall, free.toFixed(2));
    const edge = Math.max(0, Math.min(0.06, free / (2 * list.length)));
    const gap = list.length > 1 ? (free - 2 * edge) / (list.length - 1) : 0;
    const front = U.depth + 0.02;
    let at = span.from + edge;
    list.forEach((L, i) => {
      const c = at + L.dims.width / 2;
      if (wall === 'back') {
        L.x = round2(c);
        L.z = HALL.minZ + front;
      } else {
        L.z = round2(c);
        L.x = wall === 'left' ? HALL.minX + front : HALL.maxX - front;
      }
      if (i > 0) WORLD.unitGaps.push({ wall, at: round2(at - gap / 2), w: gap });
      at += L.dims.width + gap;
    });
  }
  // Spots that rest on a unit move with it: card 1 on the Griffendél cornice, the 4th Snitch perch on the Kviddics unit.
  const G = UNIT_LAYOUT.gryffindor;
  CARD_SPOTS[0][0] = G.x - G.dims.width * 0.3;
  CARD_SPOTS[0][1] = G.dims.cornice + 0.006;
  CARD_SPOTS[0][2] = HALL.minZ + 0.25;
  const Q = UNIT_LAYOUT.quidditch;
  SNITCH_PERCHES[3][0] = HALL.maxX - 0.38;
  SNITCH_PERCHES[3][1] = Q.dims.cornice + 0.001;
  SNITCH_PERCHES[3][2] = Q.z;
}

function buildUnits() {
  layoutShelves();
  FIG_CATEGORIES.forEach((cat, ci) => {
    const L = UNIT_LAYOUT[cat.key];
    if (!L) return;
    const F = new DecoFrame(L.x, L.z, L.yaw);
    const U = UNIT;
    const Dm = L.dims;
    const W = Dm.width;
    const top = Dm.top;
    const hw = W / 2;
    const D = U.depth;
    const carcass = PAL.plumMid;
    const trim = [PAL.orange, PAL.lime, PAL.magenta, PAL.turquoise][ci % 4];
    for (const sx of [-1, 1]) DB.paint.box(carcass, F.at(sx * (hw - U.side / 2 - 0.0), top / 2, -D / 2), U.side, top, D);
    DB.paint.box(carcass, F.at(0, top + 0.025, -D / 2 + 0.01), W + 0.06, 0.05, D + 0.04, 'x');
    DB.paint.box(trim, F.at(0, top + 0.07, -D / 2 + 0.02), W + 0.12, 0.045, D + 0.08, 'x');
    DB.metal.box(PAL.gold, F.at(0, top + 0.095, -D / 2 + 0.02), W + 0.1, 0.008, D + 0.06, 'x');
    DB.paint.box(PAL.ink, F.at(0, U.plinth / 2, -D / 2), W - 0.02, U.plinth, D - 0.02, 'x');
    const back = new THREE.Color(cat.color).lerp(new THREE.Color(PAL.cream), cat.key === 'hallows_horcruxes' ? 0.15 : 0.35);
    DB.paint.box(back, F.at(0, (top + U.plinth) / 2, -D + 0.01), W - 2 * U.side, top - U.plinth, 0.02);
    for (const sx of [-1, 1]) DB.paint.box(trim, F.at(sx * (hw - 0.04), (top + U.plinth) / 2, 0.003), 0.08, top - U.plinth, 0.012);
    Dm.levels.forEach((ys, li) => {
      DB.paint.box(PAL.plum, F.at(0, ys - U.board / 2, -D / 2 - 0.01), W - 2 * U.side, U.board, D - 0.04, 'x');
      DB.paint.box(trim, F.at(0, ys - U.board / 2 - 0.002, -0.024), W - 2 * U.side, U.board + 0.005, 0.012, 'x');
      const nextY = li + 1 < Dm.levels.length ? Dm.levels[li + 1] - U.board : top;
      for (let c = 1; c < Dm.cols; c++) {
        const dx = (Dm.slotX[c - 1] + Dm.slotX[c]) / 2;
        DB.metal.box(PAL.gold, F.at(dx, (ys + nextY) / 2, -D / 2), 0.012, nextY - ys, 0.012);
      }
      aoBatch.strip(unitPoint(L, -hw + U.side, nextY, -0.004), yawRotate(1, 0, L.yaw, new THREE.Vector3()), W - 2 * U.side, vec3(0, -1, 0), 0.09);
    });
    // Sign above the unit (leaning forward): painted frame, atlas face, gilt rods to the wall.
    const sm = F.at(0, Dm.signY, -0.12, 0.105, 0, 0);
    DB.paint.geo(boxGeo(Dm.signW + 0.08, Dm.signH, 0.04, { grain: 'x' }), PAL.plumDeep, sm);
    const signBase = addSignQuad(sm.clone().multiply(dmat(0, 0, 0.0215)), Dm.signW, Dm.signW / 4, ci);
    const rodX = Dm.signW * 0.375;
    for (const sx of [-rodX, rodX]) DB.metal.cyl(PAL.gold, F.at(sx, Dm.signY + Dm.signH / 3, -0.12 - (D - 0.12) / 2, Math.PI / 2, 0, 0), 0.012, 0.012, D - 0.12, 6);
    // Sconces: gilt arm and cup with a candle, unlit until the category is complete.
    const sconces = [];
    const sconceY = top + 0.19;
    for (const sx of [-(hw - 0.11), hw - 0.11]) {
      DB.metal.cyl(PAL.gold, F.at(sx, sconceY, -0.01, Math.PI / 2, 0, 0), 0.009, 0.009, 0.12, 6);
      DB.metal.lathe(PAL.gold, F.at(sx, sconceY, 0.05), [[0, 0], [0.03, 0], [0.034, 0.01], [0.02, 0.025], [0, 0.025]], 14);
      const wp = unitPoint(L, sx, sconceY + 0.025, 0.05);
      sconces.push(addCandle(wp.x, wp.y, wp.z, 0.1, 0.011, { lit: false, glow: 0.4 }));
    }
    // Collider and floor shadow.
    const corners = [unitPoint(L, -hw - 0.05, 0, 0.05), unitPoint(L, hw + 0.05, 0, 0.05), unitPoint(L, -hw - 0.05, 0, -D), unitPoint(L, hw + 0.05, 0, -D)];
    const minX = Math.min(...corners.map((c) => c.x)) - 0.08;
    const maxX = Math.max(...corners.map((c) => c.x)) + 0.08;
    const minZ = Math.min(...corners.map((c) => c.z)) - 0.08;
    const maxZ = Math.max(...corners.map((c) => c.z)) + 0.08;
    addColliderBox(minX, maxX, minZ, maxZ, top + 0.2, `unit:${cat.key}`);
    addSupport(Math.min(corners[0].x, corners[3].x) + 0.02, Math.max(corners[0].x, corners[3].x) - 0.02, Math.min(corners[0].z, corners[3].z) + 0.02, Math.max(corners[0].z, corners[3].z) - 0.02, Dm.cornice);
    const sc = unitPoint(L, 0, 0, -D / 2 + 0.06);
    shadowBatch.floor(sc.x, sc.z, W + 0.35, D + 0.45, L.yaw, 0.012);
    const unit = {
      cat: cat.key, catIdx: ci, origin: vec3(L.x, 0, L.z), yaw: L.yaw, aabb: { minX, maxX, minZ, maxZ }, slotIds: [], sconces, signQuad: SIGNS.quads.length,
      front: unitPoint(L, 0, 0, 0.7), done: false, dims: Dm,
    };
    SIGNS.quads.push(signBase);
    WORLD.units[cat.key] = unit;
    // Slots: the category's designs in catalog order fill the top level first.
    const designs = FIG_DESIGNS.filter((d) => d.category === cat.key);
    designs.slice(0, Dm.order.length).forEach((d, si) => {
      const [li, side] = Dm.order[si];
      const met = getFigureMetrics(d.id);
      const s = newSlot(d.id, 'unit', d.id, cat.key, d.copies);
      s.unit = cat.key;
      s.nameHu = d.nameHu;
      s.yaw = L.yaw;
      const lx = Dm.slotX[side];
      const ly = Dm.levels[li];
      s.center.copy(unitPoint(L, lx, ly + Dm.clear / 2, -D / 2));
      s.halfSize.set(Dm.slotW / 2, Dm.clear / 2, D / 2);
      const baseR = Math.max(0.03 * FIG_SCALE, met.baseR || 0.036 * FIG_SCALE);
      s.markerR = baseR * 0.9;
      const jr = rng(1000 + ci * 50 + si);
      for (const [px, pz] of slotLocalPositions(d.copies, baseR, Dm.slotW)) {
        s.positions.push(unitPoint(L, lx + px, ly, pz));
        s.yaws.push(L.yaw + (jr() - 0.5) * 0.12);
        s.posScale.push(1);
      }
      // Name plates sized to the slot so names and the state colour read at TV distance.
      const pp = unitPoint(L, lx, ly - 0.04, 0.014);
      addPlate(s, pp.x, pp.y, pp.z, L.yaw, 12 * DEG, Math.min(0.42, Dm.slotW * 0.5), 0.09);
      unit.slotIds.push(s.id);
    });
    if (designs.length > Dm.order.length) console.warn('[world] too many designs for unit', cat.key, designs.length);
    // Free slot positions get a few product boxes, so the shelf never looks unfinished.
    for (let si = designs.length; si < Dm.order.length; si++) {
      const [li, side] = Dm.order[si];
      const lx = Dm.slotX[side];
      const r = rng(ci * 31 + si);
      const step = Dm.slotW * 0.3;
      for (let k = 0; k < 3; k++) addProductBox(F, lx + (k - 1) * step, Dm.levels[li], -D * 0.4, 0.22, Math.min(Dm.clear - 0.04, 0.16 + r() * 0.16), 0.24, Math.floor(r() * 16), (r() - 0.5) * 0.3);
    }
  });
}

/* ------------------------------------------------------------------------------------------------
   Házkupa-torony: a carousel with house-tinted ring shelves, a striped canopy on bobbin poles
   ------------------------------------------------------------------------------------------------ */
function octagonShape(r, hole) {
  const s = hole ? new THREE.Path() : new THREE.Shape();
  for (let k = 0; k <= 8; k++) {
    const a = (k / 8) * Math.PI * 2 + Math.PI / 8;
    const x = Math.cos(a) * r;
    const y = Math.sin(a) * r;
    if (k === 0) s.moveTo(x, y);
    else s.lineTo(x, y);
  }
  return s;
}

/** Bobbin-turned column (lacquered beads in alternating colours) with gilt collars. */
function bobbinColumn(x, z, h, colors) {
  const n = Math.max(4, Math.round(h / 0.42));
  const seg = h / n;
  for (let k = 0; k < n; k++) {
    const y0 = k * seg;
    const prof = [];
    for (let i = 0; i <= 8; i++) {
      const t = i / 8;
      prof.push([0.075 + 0.04 * Math.sin(Math.PI * t), y0 + t * seg]);
    }
    DB.paint.lathe(colors[k % colors.length], dmat(x, 0, z), prof, 12);
  }
  DB.metal.cyl(PAL.gold, dmat(x, 0.04, z), 0.14, 0.15, 0.08, 12);
  DB.metal.cyl(PAL.gold, dmat(x, h - 0.03, z), 0.15, 0.12, 0.06, 12);
}

  decoBannerPlane(DECO_BANNER.pennant(0), F.at(0.2, 3.72, 0, 0, 0, Math.PI / 2), 0.2, 0.36, 0.0);
  // Cloth banners (one per house sector) on the core between the top ring and the plinth.
  const houses = T.sectors.map((s) => FIG_CATEGORIES[FIG_CATEGORY_INDEX[s.house]]);

  const buv = [];
  const bidx = [];
  T.sectors.forEach((sec, i) => {
    const a = Math.atan2(sec.dx, sec.dz);
    const r0 = T.coreR * Math.cos(Math.PI / 8) + 0.012;
    const w = 0.26;
    const y0 = T.rings[2] + 0.04;
    const y1 = T.topY - 0.1;
    const base = bp.length / 3;
    for (const [lx, ly] of [[-w / 2, y0], [w / 2, y0], [w / 2, y1], [-w / 2, y1]]) {
      yawRotate(lx, r0, a, tv5);
      bp.push(T.x + tv5.x, ly, T.z + tv5.z);
    }
    const hi = houses.indexOf(houses[i]);
    buv.push(hi * 0.25, 0, hi * 0.25 + 0.25, 0, hi * 0.25 + 0.25, 1, hi * 0.25, 1);
    bidx.push(base, base + 1, base + 2, base, base + 2, base + 3);
  });
  const bg = new THREE.BufferGeometry();
  bg.setAttribute('position', new THREE.Float32BufferAttribute(bp, 3));
  bg.setAttribute('uv', new THREE.Float32BufferAttribute(buv, 2));
  bg.setIndex(bidx);
  bg.computeVertexNormals();
  staticMesh(bg, M.banner, false, true);
  // Tower slots: 4 houses × 3 sizes, statuettes facing outwards; the Házkupa on the top plinth.
  const sizes = FIG_TOWER_SIZES;
  WORLD.tower = { center: vec3(T.x, 0, T.z), sectors: [] };
  T.sectors.forEach((sec) => {
    const designId = TOWER_DESIGN_OF[sec.house];
    const d = FIG_BY_ID[designId];
    if (!d) return;
    const a = Math.atan2(sec.dx, sec.dz);
    const per = Math.max(1, Math.ceil(d.copies / sizes.length));
    const sector = { house: sec.house, angle: a, slotIds: [] };
    sizes.forEach((sz, si) => {
      const id = `tower:${sec.house}:${sz.key}`;
      const s = newSlot(id, 'tower', designId, 'tower', per);
      s.sector = sec.house;
      s.sizeIndex = si;
      s.yaw = a;
      const y = T.rings[si];
      const spread = per > 1 ? T.spread : 0;
      for (let k = 0; k < per; k++) {
        const da = per > 1 ? (k / (per - 1) - 0.5) * 2 * spread : 0;
        s.positions.push(vec3(T.x + Math.sin(a + da) * T.slotR, y, T.z + Math.cos(a + da) * T.slotR));
        s.yaws.push(a + da);
        s.posScale.push(sz.scale);
      }
      // Aim box: the ring segment up to a little above the statuettes of this size.
      const hh = getFigureMetrics(designId).totalH * sz.scale;
      yawRotate(0, 0.7, a, tv5);
      s.center.set(T.x + tv5.x, y + hh / 2 + 0.02, T.z + tv5.z);
      s.halfSize.set(0.36, Math.max(0.15, hh / 2 + 0.05), 0.25);
      s.markerR = 0.05 * FIG_SCALE * sz.scale;
      s.nameHu = `${FIG_CATEGORIES[FIG_CATEGORY_INDEX[sec.house]].nameHu} · ${sz.nameHu}`;
      yawRotate(0, T.outerR + 0.012, a, tv5);
      addPlate(s, T.x + tv5.x, y - 0.022, T.z + tv5.z, a, 8 * DEG, 0.2, 0.036);
      sector.slotIds.push(id);
    });
    WORLD.tower.sectors.push(sector);
  });
  const cup = FIG_BY_ID.house_cup;
  if (cup) {
    const s = newSlot('top', 'top', 'house_cup', 'tower', cup.copies);
    s.positions.push(vec3(T.x, T.topY, T.z));
    s.yaws.push(0);

    s.nameHu = cup.nameHu;
    addPlate(s, T.x, T.topY - 0.03, T.z + 0.205, 0, 4 * DEG, 0.16, 0.034);
  }
}

/** Curved half of an open book (from the demo): the page surface rises from the gutter. */
const pageProfile = (s) => 0.003 + 0.022 * Math.pow(Math.sin(Math.PI * s), 0.5) * (1 - 0.35 * s);
function pageHalfGeometry(side, W, L, segs) {
  const pos = [];
  const uv = [];
  const idx = [];
  for (let i = 0; i <= segs; i++) {
    const s = i / segs;
    for (let j = 0; j <= 1; j++) {
      pos.push(side * W * s, pageProfile(s), (j - 0.5) * L);
      uv.push(0.5 + side * 0.5 * s, 1 - j);
    }
  }
  for (let i = 0; i < segs; i++) {
    const a = i * 2;
    if (side > 0) idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
    else idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

const LIQUID_VERT = `
varying vec2 vUv;
#include <fog_pars_vertex>
void main() {
  vUv = uv;
  vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
  gl_Position = projectionMatrix * mvPosition;
  #include <fog_vertex>
}`;
const LIQUID_FRAG = `
uniform float uTime;
varying vec2 vUv;
#include <fog_pars_fragment>
void main() {
  vec2 p = vUv - 0.5;
  float r = length(p);
  float a = atan(p.y, p.x);
  float swirl = sin(a * 3.0 + r * 18.0 - uTime * 1.6) * 0.5 + 0.5;
  float bub = smoothstep(0.82, 1.0, sin(p.x * 60.0 + uTime * 2.0) * sin(p.y * 57.0 - uTime * 1.7));
  vec3 c = mix(vec3(0.55, 0.12, 0.9), vec3(0.6, 1.0, 0.2), swirl * 0.55) * (1.4 + 0.6 * swirl) + bub * vec3(1.5, 1.2, 1.6);
  c *= 1.0 - smoothstep(0.42, 0.5, r) * 0.6;
  gl_FragColor = vec4(c, 1.0);
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
  #include <fog_fragment>
}`;
const CAULDRON_RIM = 1.03;

function animateCauldron(t, dt) {
  if (PROPS.liquid) PROPS.liquid.material.uniforms.uTime.value = t;
  const st = PROPS.steam;
  if (!st) return;
  const pos = st.geometry.attributes.position.array;
  const col = st.geometry.attributes.color.array;
  const ph = st.userData.phase;
  const sd = st.userData.seed;
  for (let i = 0; i < ph.length; i++) {
    ph[i] += dt * 0.22;
    if (ph[i] > 1) ph[i] -= 1;
    const a = ph[i];
    const ang = sd[i] * 6.283 + t * 0.2;
    const rad = 0.08 + sd[i] * 0.25 + a * 0.15;
    pos[i * 3] = CAULDRON.x + Math.cos(ang) * rad;
    pos[i * 3 + 1] = CAULDRON_RIM + a * 1.1;
    pos[i * 3 + 2] = CAULDRON.z + Math.sin(ang) * rad;
    const f = Math.sin(a * Math.PI) * 0.16;
    col[i * 3] = f * 0.85;
    col[i * 3 + 1] = f * 0.6;
    col[i * 3 + 2] = f * 0.95;
  }
  st.geometry.attributes.position.needsUpdate = true;
  st.geometry.attributes.color.needsUpdate = true;
}

/* ------------------------------------------------------------------------------------------------
   Csokibéka cards and glints
   ------------------------------------------------------------------------------------------------ */
const CARDS = { mesh: null, list: [] };
const GLINTS = { batch: null };

function buildCards() {
  const geo = new THREE.PlaneGeometry(0.06, 0.09);
  geo.rotateX(-Math.PI / 2);
  CARDS.mesh = new THREE.InstancedMesh(geo, M.card, CARD_SPOTS.length);
  CARD_SPOTS.forEach(([x, y, z, yaw], i) => {
    const rec = { i, pos: vec3(x, y, z), yaw, found: false, glint: -1, phase: i * 0.6 };
    tm1.compose(rec.pos, tq1.setFromEuler(te1.set(0, yaw, 0)), ONE3);
    CARDS.mesh.setMatrixAt(i, tm1);
    CARDS.list.push(rec);
    WORLD.cardSpots.push(rec.pos);
  });
  CARDS.mesh.instanceMatrix.needsUpdate = true;
  CARDS.mesh.computeBoundingSphere();
  scene.add(CARDS.mesh);
  GLINTS.batch = new BillboardBatch(64, TEX.sparkle, { additive: true, order: 7 });
  for (const c of CARDS.list) c.glint = GLINTS.batch.add(c.pos.x, c.pos.y + 0.02, c.pos.z, 0, 0, 1, 0.9, 0.6, 1);
}

function hideCard(i) {
  const c = CARDS.list[i];
  c.found = true;
  tm1.makeScale(0, 0, 0);
  CARDS.mesh.setMatrixAt(i, tm1);
  CARDS.mesh.instanceMatrix.needsUpdate = true;
  GLINTS.batch.setSize(c.glint, 0, 0);
}

    addColliderEllipse(h.x, h.z, h.rx * HEAP_SOLID, h.rz * HEAP_SOLID, h.core + 0.4, `heap:${h.id}`);
    roundBatch.floor(h.x, h.z, h.rx * 2.5, h.rz * 2.5, 0, 0.0115);

    DQ.straw.floor(h.x, h.z, h.rx * 2.3, h.rz * 2.3, i * Math.PI, 0.008);
  });
  for (const c of CRATE_DEFS) {

  finishDecor();
  aoBatch.mesh(M.ao, 1);

  WORLD.snitchPerches = SNITCH_PERCHES.map((p) => vec3(p[0], p[1], p[2]));
  WORLD.nifflerWaypoints = NIFFLER_WAYPOINTS.map((p) => ({ x: p[0], z: p[1] }));
}

/** Per-frame world animation (candles, lights, cauldron, plates, quill, glints and the decor). */
function animateWorld(t, dt) {
  animateCandles(t);
  animateLights(t);
  animateCauldron(t, dt);
  animatePlates(t, dt);
  animateDecor(t, dt);
  if (PROPS.quill) {
    const b = PROPS.quill.userData.base;
    PROPS.quill.position.set(b.x, b.y + 0.04 * Math.sin(t * 1.4), b.z);
    PROPS.quill.rotation.set(0.5 + 0.08 * Math.sin(t * 1.1), PROPS.quill.userData.yaw + 0.3 * Math.sin(t * 0.5), 0.35 + 0.1 * Math.sin(t * 1.7));
  }
  if (GLINTS.batch) {
    for (const c of CARDS.list) {
      if (c.found) continue;
      const ph = ((t + c.phase) % 6) / 6;
      const k = ph < 0.08 ? Math.sin((ph / 0.08) * Math.PI) : 0;
      GLINTS.batch.setSize(c.glint, 0.05 * k, 0.05 * k);
    }
    GLINTS.batch.commit();
  }
}

/* ---- 42-decor.js ---- */
/* ==== 42-decor.js — themable decor layer, part 2: the Weasley Varázsvicc Vállalat dressing (gallery, crammed stock
   racks, the Boszibűbáj corner with its törpegolymó cages, the twin automaton, Telefül display, bunting, banners,
   frozen fireworks, lamp clusters, rugs and straw). Ported from the approved concept helyszin/weasley; it only adds
   decoration and colliders around the gameplay layout of 40/41. ==== */

const DECO = {
  emitters: [new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()],
  lines: [], fairy: [], glow: { pos: [], col: [], size: [] }, bannerParts: [], rockets: [],
  inst: { box: [], jar: [], jarFill: [], lid: [], flask: [], flaskFill: [], puff: [], flag: [] },
  twinRig: null, twinArms: [], twinYaw: TWINS.yaw, mounds: null,
};
const POTION_COLORS = [new THREE.Color(3.2, 0.5, 1.6), new THREE.Color(2.4, 0.4, 2.8), new THREE.Color(3.4, 1.1, 2.0), new THREE.Color(1.6, 0.5, 3.0), new THREE.Color(3.0, 0.3, 0.9)];
const FILL_COLORS = [0xff8a1f, 0xa8e03a, 0xe8268a, 0x7b2fbf, 0xffd23f, 0x2ec4b6, 0xff7ac0, 0xe23b2e, 0x47bef5, 0xfff1d6];
const decoColor = new THREE.Color();
const decoTip = new THREE.Vector3();

function createDecoBatches() {
  for (const k of ['paint', 'metal', 'glow', 'glass', 'lettering', 'dome', 'straw']) DB[k] = new ColorBatch();
}

/* ------------------------------------------------------------------------------------------------
   Small builders shared by the decor and the furniture
   ------------------------------------------------------------------------------------------------ */

/** Soft additive glow point (lamp bulbs, fairy lights); drawn as one point cloud. */
function decoGlowPoint(x, y, z, size, color, alpha = 1) {
  decoColor.set(color).multiplyScalar(alpha);
  DECO.glow.pos.push(x, y, z);
  DECO.glow.col.push(decoColor.r, decoColor.g, decoColor.b);
  DECO.glow.size.push(size);
}

/** Plane mapped to a rectangle of the decor banner atlas; sway 0..1 per vertex goes along as an attribute. */
function decoBannerPlane(rect, m, w, h, sway = 0, segX = 1, segY = 1) {
  const g = new THREE.PlaneGeometry(w, h, segX, segY);
  const [u0, v0, u1, v1] = decoBannerUV(rect);
  const uv = g.attributes.uv;
  const p = g.attributes.position;
  const s = new Float32Array(p.count);
  for (let k = 0; k < uv.count; k++) {
    s[k] = sway * (0.5 - p.getY(k) / h);
    uv.setXY(k, lerp(u0, u1, uv.getX(k)), lerp(v0, v1, uv.getY(k)));
  }
  g.setAttribute('aSway', new THREE.BufferAttribute(s, 1));
  g.applyMatrix4(m);
  DECO.bannerParts.push(g);
}

/** One product box (instanced, label from the product atlas cell) standing at local (x, y, z) of frame F. */
function addProductBox(F, x, y, z, w, h, d, cell, yaw = 0, tint = 0xffffff) {
  DECO.inst.box.push({ m: F.at(x, y + h / 2, z, 0, yaw, 0, w, h, d), color: tint, cell });
}

function addDecoJar(F, x, y, z, rad, h, r) {
  const fill = FILL_COLORS[Math.floor(r() * FILL_COLORS.length)];
  DECO.inst.jar.push({ m: F.at(x, y, z, 0, 0, 0, rad, h, rad), color: 0xffffff, cell: 0 });
  DECO.inst.jarFill.push({ m: F.at(x, y + 0.004, z, 0, r() * 6, 0, rad * 0.9, h * (0.55 + r() * 0.35), rad * 0.9), color: fill, cell: 0 });
  DECO.inst.lid.push({ m: F.at(x, y + h, z, 0, 0, 0, rad * 1.04, 0.02 + r() * 0.015, rad * 1.04), color: PAL_LIST[Math.floor(r() * PAL_LIST.length)], cell: 0 });
}

function addDecoFlask(F, x, y, z, s, r, palette = POTION_COLORS) {
  DECO.inst.flask.push({ m: F.at(x, y, z, 0, r() * 6, 0, s, s, s), color: 0xffffff, cell: 0 });
  DECO.inst.flaskFill.push({ m: F.at(x, y + 0.004 * s, z, 0, 0, 0, s * 0.92, s * (0.6 + r() * 0.25), s * 0.92), color: palette[Math.floor(r() * palette.length)], cell: 0 });
}

function heartGeo(s) {
  const sh = new THREE.Shape();
  sh.moveTo(0, -0.75 * s);
  sh.bezierCurveTo(-1.1 * s, 0, -0.6 * s, 0.9 * s, 0, 0.35 * s);
  sh.bezierCurveTo(0.6 * s, 0.9 * s, 1.1 * s, 0, 0, -0.75 * s);
  return new THREE.ExtrudeGeometry(sh, { depth: 0.03, bevelEnabled: false, curveSegments: 10 });
}

/** Brass birdcage with a domed top; holds a few fluffy törpegolymók (instanced, bobbing in the shader). */
function addCage(m, rad, h, r, puffs = 3, face = 0) {
  const at = (x, y, z, rx = 0, ry = 0, rz = 0) => m.clone().multiply(dmat(x, y, z, rx, ry, rz));
  DB.metal.cyl(PAL.gold, at(0, 0.015, 0), rad + 0.02, rad + 0.025, 0.03, 18);
  DB.paint.cyl(PAL.magenta, at(0, 0.032, 0), rad, rad, 0.006, 18);
  const bars = 14;
  for (let k = 0; k < bars; k++) {
    const a = (k / bars) * Math.PI * 2;
    DB.metal.cyl(PAL.gold, at(Math.cos(a) * rad, h / 2, Math.sin(a) * rad), 0.004, 0.004, h, 4);
  }
  for (const yy of [0.04, h * 0.55, h]) DB.metal.torus(PAL.gold, at(0, yy, 0, Math.PI / 2, 0, 0), rad, 0.006, 4, 24);
  for (let k = 0; k < 4; k++) DB.metal.torus(PAL.gold, at(0, h, 0, 0, (k * Math.PI) / 4, 0), rad, 0.005, 4, 16, Math.PI);
  DB.metal.torus(PAL.gold, at(0, h + rad + 0.03, 0), 0.03, 0.006, 4, 12);
  for (let k = 0; k < puffs; k++) {
    const a = r() * Math.PI * 2;
    const d = r() * rad * 0.45;
    const s = 0.056 + r() * 0.024;
    DECO.inst.puff.push({ m: at(Math.cos(a) * d, 0.035 + s, Math.sin(a) * d, 0, face + (r() - 0.5) * 1.2, 0).multiply(dmat(0, 0, 0, 0, 0, 0, s, s, s)), color: [0xff7ac0, 0xd36bff, 0xff4fa3, 0xb084ff, 0xffa3d6][Math.floor(r() * 5)], cell: 0 });
  }
}

/** Packs one shelf along local x (front at local z = 0) with stacked boxes, jars and potions. */
function fillShelf(F, x0, x1, y, depth, hMax, r, opts = {}) {
  let x = x0 + 0.01 + r() * 0.03;
  const cells = opts.cells;
  const pickCell = () => (cells ? cells[Math.floor(r() * cells.length)] : r() < 0.4 ? Math.floor(r() * 16) : 16 + Math.floor(r() * 48));
  while (x < x1 - 0.06) {
    const roll = r();
    if (opts.potions && roll < opts.potions) {
      const s = 0.09 + r() * 0.07;
      if (s * 1.6 > hMax) {
        x += 0.05;
        continue;
      }
      addDecoFlask(F, x + s * 0.55, y, -depth * (0.3 + r() * 0.3), s, r, opts.palette);
      x += s * 1.15 + 0.01;
      continue;
    }
    if (roll < (opts.jars ?? 0.16)) {
      const rad = 0.04 + r() * 0.035;
      const h = Math.min(hMax - 0.04, 0.12 + r() * 0.14);
      if (h > 0.08) addDecoJar(F, x + rad, y, -depth * 0.45, rad, h, r);
      x += rad * 2 + 0.015;
      continue;
    }
    if (roll < (opts.jars ?? 0.16) + 0.05 && opts.gaps !== false) {
      x += 0.04 + r() * 0.08;
      continue;
    }
    const w = 0.08 + r() * 0.2;
    if (x + w > x1) break;
    let yy = y;
    const n = 1 + Math.floor(r() * (opts.stack ?? 3));
    for (let k = 0; k < n; k++) {
      const h = 0.06 + r() * (k === 0 ? 0.2 : 0.1);
      if (yy + h > y + hMax - 0.01) break;
      const d = Math.min(depth - 0.02, 0.1 + r() * 0.22);
      addProductBox(F, x + w / 2 + (r() - 0.5) * 0.01, yy, -d / 2 - r() * 0.02, w * (1 - k * 0.12), h, d, pickCell(), (r() - 0.5) * 0.18);
      yy += h;
    }
    x += w + 0.006 + (r() < 0.3 ? r() * 0.02 : 0);
  }
}

/** Painted rack in a frame: uprights, shelves (local x0..x1, from y0 up to y1) and its products. */
function stockRack(F, x0, x1, y0, y1, depth, step, r, opts = {}) {
  const color = opts.color ?? PAL.plumMid;
  const edge = opts.edge ?? PAL.orange;
  const w = x1 - x0;
  const cx = (x0 + x1) / 2;
  const posts = Math.max(2, Math.round(w / 1.6) + 1);
  for (let k = 0; k < posts; k++) {
    const px = x0 + 0.02 + (k * (w - 0.04)) / (posts - 1);
    DB.paint.box(color, F.at(px, (y0 + y1) / 2, -depth / 2), 0.04, y1 - y0, depth);
  }
  if (opts.back !== false) DB.paint.box(opts.backColor ?? PAL.plumDeep, F.at(cx, (y0 + y1) / 2, -depth + 0.01), w, y1 - y0, 0.02);
  for (let y = y0; y <= y1 - step * 0.6; y += step) {
    DB.paint.box(color, F.at(cx, y - 0.012, -depth / 2), w, 0.024, depth, 'x');
    DB.paint.box(edge, F.at(cx, y - 0.014, 0.004), w, 0.03, 0.01, 'x');
    if (opts.fill !== false) {
      for (let k = 0; k < posts - 1; k++) {
        const sx0 = x0 + 0.04 + (k * (w - 0.04)) / (posts - 1);
        const sx1 = x0 + ((k + 1) * (w - 0.04)) / (posts - 1);
        fillShelf(F, sx0, sx1, y, depth, step - 0.03, r, opts);
      }
    }
  }
  DB.paint.box(edge, F.at(cx, y1 + 0.02, -depth / 2 + 0.01), w + 0.04, 0.04, depth + 0.02, 'x');
}

/* ------------------------------------------------------------------------------------------------
   Gallery with balustrade, valance, columns and the spiral stair
   ------------------------------------------------------------------------------------------------ */

/** Centres of the gaps between neighbouring shelving units on a wall (x on the back wall, z on the side walls). */
function unitGapsAt(wall) {
  return WORLD.unitGaps.filter((g) => g.wall === wall).map((g) => g.at);
}

function buildGallery() {
  const y = GALLERY.y;
  const d = GALLERY.depth;
  const fz = HALL.minZ + d;
  const lx = HALL.minX + d;
  const rx = HALL.maxX - d;
  const sideLen = GALLERY.sideEnd - fz;
  const sideZ = (GALLERY.sideEnd + fz) / 2;
  // Deck boards (wood) and the painted underside.
  G.wood.push(boxGeo(16, 0.06, d, { grain: 'x', y: y - 0.03, z: HALL.minZ + d / 2, seed: 701 }));
  G.wood.push(boxGeo(d, 0.06, sideLen, { grain: 'z', x: HALL.minX + d / 2, y: y - 0.03, z: sideZ, seed: 702 }));
  G.wood.push(boxGeo(d, 0.06, sideLen, { grain: 'z', x: HALL.maxX - d / 2, y: y - 0.03, z: sideZ, seed: 703 }));
  DB.paint.box(PAL.plumDeep, dmat(0, y - 0.125, HALL.minZ + d / 2), 16, 0.19, d - 0.02, 'x');
  DB.paint.box(PAL.plumDeep, dmat(HALL.minX + d / 2, y - 0.125, sideZ), d - 0.02, 0.19, sideLen, 'z');
  DB.paint.box(PAL.plumDeep, dmat(HALL.maxX - d / 2, y - 0.125, sideZ), d - 0.02, 0.19, sideLen, 'z');
  // Fascia, gilt rule and the scalloped circus valance with fairy lights.
  const edges = [
    { a: vec3(HALL.minX, 0, fz), b: vec3(HALL.maxX, 0, fz), out: vec3(0, 0, 1) },
    { a: vec3(lx, 0, fz), b: vec3(lx, 0, GALLERY.sideEnd), out: vec3(1, 0, 0) },
    { a: vec3(rx, 0, fz), b: vec3(rx, 0, GALLERY.sideEnd), out: vec3(-1, 0, 0) },
    { a: vec3(HALL.minX, 0, GALLERY.sideEnd), b: vec3(lx, 0, GALLERY.sideEnd), out: vec3(0, 0, 1) },
    { a: vec3(rx, 0, GALLERY.sideEnd), b: vec3(HALL.maxX, 0, GALLERY.sideEnd), out: vec3(0, 0, 1) },
  ];
  let scallop = 0;
  for (const e of edges) {
    const len = e.a.distanceTo(e.b);
    const dir = e.b.clone().sub(e.a).normalize();
    const yaw = Math.atan2(-dir.z, dir.x);
    const mid = e.a.clone().add(e.b).multiplyScalar(0.5).addScaledVector(e.out, 0.02);
    DB.paint.box(PAL.orange, dmat(mid.x, y - 0.11, mid.z, 0, yaw, 0), len + 0.04, 0.3, 0.05, 'x');
    const g1 = mid.clone().addScaledVector(e.out, 0.03);
    DB.metal.box(PAL.gold, dmat(g1.x, y - 0.03, g1.z, 0, yaw, 0), len + 0.05, 0.025, 0.012, 'x');
    DB.metal.box(PAL.gold, dmat(g1.x, y - 0.25, g1.z, 0, yaw, 0), len + 0.05, 0.02, 0.012, 'x');
    const n = Math.floor(len / 0.3);
    for (let k = 0; k < n; k++) {
      const p = e.a.clone().addScaledVector(dir, (k + 0.5) * (len / n)).addScaledVector(e.out, 0.05);
      DB.paint.geo(new THREE.CircleGeometry(0.14, 10, Math.PI, Math.PI), scallop++ & 1 ? PAL.magenta : PAL.purple, dmat(p.x, y - 0.26, p.z, 0, Math.atan2(e.out.x, e.out.z), 0));
      if ((k & 1) === 0) {
        decoGlowPoint(p.x, y - 0.42, p.z, 0.32, 0xffc070, 0.75);
        DB.glow.sphere(new THREE.Color(5, 3.6, 2), dmat(p.x, y - 0.4, p.z), 0.028, 8, 6);
      }
    }
  }
  // Balustrade: rails, turned balusters in alternating colours, newel posts with gilt balls.
  const rails = [
    [vec3(HALL.minX, 0, fz), vec3(STAIR.x - 0.9, 0, fz)],
    [vec3(lx, 0, fz), vec3(lx, 0, GALLERY.sideEnd)],
    [vec3(rx, 0, STAIR.z + 0.9), vec3(rx, 0, GALLERY.sideEnd)],
    [vec3(HALL.minX, 0, GALLERY.sideEnd), vec3(lx, 0, GALLERY.sideEnd)],
    [vec3(rx, 0, GALLERY.sideEnd), vec3(HALL.maxX, 0, GALLERY.sideEnd)],
  ];
  const balProf = [[0.03, 0], [0.03, 0.06], [0.018, 0.12], [0.034, 0.3], [0.022, 0.46], [0.016, 0.62], [0.026, 0.72], [0.02, 0.8], [0.03, 0.86]];
  let bi = 0;
  for (const [a, b] of rails) {
    const len = a.distanceTo(b);
    const dir = b.clone().sub(a).normalize();
    const yaw = Math.atan2(-dir.z, dir.x);
    const mid = a.clone().add(b).multiplyScalar(0.5);
    DB.paint.box(PAL.plumLight, dmat(mid.x, y + GALLERY.railH - 0.04, mid.z, 0, yaw, 0), len, 0.08, 0.1, 'x');
    DB.metal.box(PAL.gold, dmat(mid.x, y + GALLERY.railH + 0.005, mid.z, 0, yaw, 0), len, 0.012, 0.11, 'x');
    DB.paint.box(PAL.plumLight, dmat(mid.x, y + 0.05, mid.z, 0, yaw, 0), len, 0.06, 0.08, 'x');
    const n = Math.floor(len / 0.19);
    for (let k = 1; k < n; k++) {
      const p = a.clone().addScaledVector(dir, k * (len / n));
      DB.paint.lathe(bi++ & 1 ? PAL.lime : PAL.orange, dmat(p.x, y + 0.08, p.z), balProf, 8);
      if (k % 2 === 0) DECO.fairy.push(p.x, y + GALLERY.railH + 0.04, p.z);
    }
    for (const p of [a, b]) {
      DB.paint.box(PAL.purple, dmat(p.x, y + 0.5, p.z), 0.13, 1.0, 0.13);
      DB.metal.sphere(PAL.gold, dmat(p.x, y + 1.08, p.z), 0.08, 12, 8);
    }
  }
  // Curly gilt brackets under the cantilevered deck (above the gaps between the shelving units), and bobbin-turned
  // columns at the open corners.
  const by = y - GALLERY.t - 0.3;
  for (const x of [-7.2, ...unitGapsAt('back'), 0.0, 3.0]) DB.metal.torus(PAL.gold, dmat(x, by, HALL.minZ + 0.72, 0, Math.PI / 2, 0), 0.3, 0.028, 6, 14, Math.PI / 2);
  for (const z of [-4.6, ...unitGapsAt('left'), 1.75]) DB.metal.torus(PAL.gold, dmat(HALL.minX + 0.72, by, z, 0, Math.PI, 0), 0.3, 0.028, 6, 14, Math.PI / 2);
  for (const z of [-4.6, ...unitGapsAt('right'), 1.75]) DB.metal.torus(PAL.gold, dmat(HALL.maxX - 0.72, by, z), 0.3, 0.028, 6, 14, Math.PI / 2);
  const colH = y - GALLERY.t;
  // The back-left corner is taken by the shelving units, so only three columns stand on the floor.
  const cols = [[4.15, fz], [lx, GALLERY.sideEnd], [rx, GALLERY.sideEnd]];
  cols.forEach(([x, z], i) => {
    bobbinColumn(x, z, colH, i & 1 ? [PAL.lime, PAL.purple] : [PAL.purple, PAL.orange]);
    addColliderCircle(x, z, 0.16, colH, 'column');
    roundBatch.floor(x, z, 0.6, 0.6, 0, 0.012);
  });
  buildSpiralStair();
}

function buildSpiralStair() {
  const { x, z, r, steps } = STAIR;
  const dt = (270 * Math.PI) / 180 / (steps - 1);
  DB.metal.cyl(PAL.gold, dmat(x, GALLERY.y / 2 + 0.6, z), 0.075, 0.075, GALLERY.y + 1.2, 14);
  DB.metal.sphere(PAL.gold, dmat(x, GALLERY.y + 1.26, z), 0.12, 14, 10);
  for (let i = 0; i < steps; i++) {
    const th = STAIR_T0 + i * dt;
    const yy = ((i + 1) * GALLERY.y) / steps;
    const c = Math.cos(th);
    const s = Math.sin(th);
    DB.paint.box(i & 1 ? PAL.purple : PAL.orange, dmat(x + c * (r / 2 + 0.04), yy - 0.03, z + s * (r / 2 + 0.04), 0, -th, 0), r - 0.02, 0.06, 0.34, 'x');
    DB.metal.box(PAL.gold, dmat(x + c * (r / 2 + 0.04), yy - 0.065, z + s * (r / 2 + 0.04), 0, -th, 0), r - 0.02, 0.012, 0.36, 'x');
    DB.metal.cyl(PAL.gold, dmat(x + c * (r - 0.04), yy + 0.42, z + s * (r - 0.04)), 0.012, 0.012, 0.84, 6);
  }
  const rail = [];
  for (let k = 0; k <= 60; k++) {
    const th = STAIR_T0 - dt * 0.5 + (k / 60) * ((steps - 0.5) * dt);
    const yy = ((th - STAIR_T0) / dt + 1) * (GALLERY.y / steps) + 0.86;
    rail.push(vec3(x + Math.cos(th) * (r - 0.04), yy, z + Math.sin(th) * (r - 0.04)));
  }
  DB.metal.geo(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(rail), 80, 0.025, 6, false), PAL.gold);
  addColliderCircle(x, z, r + 0.12, GALLERY.y, 'stair');
  // Hedvig waits on the first tread: a flat support so she (and anything thrown there) can rest on it.
  const t0 = vec3(x + Math.cos(STAIR_T0) * r * 0.6, GALLERY.y / steps, z + Math.sin(STAIR_T0) * r * 0.6);
  addSupport(t0.x - 0.12, t0.x + 0.12, t0.z - 0.12, t0.z + 0.12, t0.y);
  roundBatch.floor(x, z, 2.1, 2.1, 0, 0.012);
}

/* ------------------------------------------------------------------------------------------------
   Stock racks crammed with boxes, jars and potions (instanced products)
   ------------------------------------------------------------------------------------------------ */

function buildRacks() {
  const r = rng(3131);
  const top = HALL.h - 0.4;
  const gy = GALLERY.y;
  // Gallery level: towering racks along the back and both side walls.
  const back = new DecoFrame(0, HALL.minZ + 0.42, 0);
  stockRack(back, -7.98, 7.98, gy + 0.1, top, 0.4, 0.44, r);
  const left = new DecoFrame(HALL.minX + 0.42, 0, Math.PI / 2);
  stockRack(left, -GALLERY.sideEnd, 5.56, gy + 0.1, top, 0.4, 0.44, r);
  const right = new DecoFrame(HALL.maxX - 0.42, 0, -Math.PI / 2);
  stockRack(right, -5.56, GALLERY.sideEnd, gy + 0.1, top, 0.4, 0.44, r);
  // A rolling ladder leaning on the upper back rack.
  const ladL = Math.hypot(2.6, 0.5);
  const lad = new DecoFrame(-2.2, HALL.minZ + 0.95, 0);
  for (const sx of [-0.2, 0.2]) G.wood.push(boxGeo(0.05, ladL, 0.06, {}).applyMatrix4(lad.at(sx, gy + ladL / 2 - 0.05, 0, -Math.atan2(0.5, 2.6), 0, 0)));
  for (let k = 0; k < 8; k++) DB.metal.cyl(PAL.gold, lad.at(0, gy + 0.3 + k * 0.31, -0.06 * k, 0, 0, Math.PI / 2), 0.014, 0.014, 0.4, 8);
  // Front wall above the windows: racks on brackets.
  const fr = new DecoFrame(0, HALL.maxZ - 0.42, Math.PI);
  stockRack(fr, -7.98, -1.95, 4.25, top, 0.4, 0.44, r);
  stockRack(fr, 0.35, 7.98, 4.25, top, 0.4, 0.44, r);
  // Ground level: narrow towers in the gaps between the units (as wide as the gap allows), and shelves above the units.
  for (const g of WORLD.unitGaps) {
    const hw = Math.min(0.19, g.w / 2 - 0.02);
    if (hw < 0.07) continue;
    // Flush with the unit fronts (their frame sits at the units' depth from the wall).
    const gd = UNIT.depth - 0.02;
    const f = UNIT.depth + 0.02;
    if (g.wall === 'back') stockRack(new DecoFrame(0, HALL.minZ + f, 0), g.at - hw, g.at + hw, 0.12, 3.05, gd, 0.38, r, { jars: 0.1 });

function buildTwinFigure(F, side, coat, vest, stock, hatColor, bp, bm, rig) {
  const s = 0.88;
  const at = (x, y, z, rx = 0, ry = 0, rz = 0, sx = 1, sy = 1, sz = 1) => F.at(x * s, y * s, z * s, rx, ry, rz, sx * s, sy * s, sz * s);
  const skin = 0xf0ad84;
  const hair = 0xff6a1a;
  for (const lx of [-0.13, 0.13]) {
    bp.sphere(PAL.plumDeep, at(lx, 0.06, 0.06, 0, 0, 0, 0.12, 0.08, 0.24), 1, 14, 10);
    bp.sphere(PAL.plumDeep, at(lx, 0.11, 0.27), 0.05, 10, 8);
    for (let k = 0; k < 6; k++) bp.cyl(k & 1 ? stock[1] : stock[0], at(lx, 0.15 + k * 0.13 + 0.065, 0), 0.075, 0.075, 0.13, 12);
  }
  bp.lathe(coat, at(0, 0, 0), [[0.36, 0.9], [0.32, 1.1], [0.27, 1.45], [0.25, 1.62], [0.29, 1.85], [0.31, 1.98], [0.2, 2.06], [0.1, 2.1]], 20);
  bp.box(coat, at(0, 1.05, -0.24, 0.25, 0, 0), 0.28, 0.5, 0.05);
  bp.box(vest, at(0, 1.6, 0.235, -0.08, 0, 0), 0.3, 0.62, 0.04);
  for (let k = 0; k < 3; k++) bm.sphere(PAL.gold, at(0, 1.42 + k * 0.16, 0.265), 0.025, 8, 6);
  for (const sx of [-1, 1]) {
    bp.box(vest, at(sx * 0.17, 1.86, 0.2, -0.3, sx * 0.4, sx * 0.25), 0.12, 0.3, 0.03);
    bp.sphere(hatColor, at(sx * 0.09, 2.08, 0.13, 0, 0, 0, 0.09, 0.06, 0.04), 1, 10, 8);
  }
  bp.sphere(PAL.gold, at(0, 2.08, 0.15), 0.035, 8, 6);
  // Head: skin, ears, nose, painted eyes, a big grin, freckles and a mop of orange hair.
  bp.sphere(skin, at(0, 2.42, 0, 0, 0, 0, 1, 1.06, 1), 0.36, 24, 18);
  for (const sx of [-1, 1]) {
    bp.sphere(skin, at(sx * 0.35, 2.42, 0.0, 0, 0, 0, 0.6, 1, 0.8), 0.09, 10, 8);
    bp.sphere(0xffffff, at(sx * 0.13, 2.49, 0.3, 0, 0, 0, 1, 1.25, 0.6), 0.075, 14, 10);
    bp.sphere(PAL.ink, at(sx * 0.12, 2.48, 0.345), 0.034, 10, 8);
    bp.sphere(0xffffff, at(sx * 0.11 + 0.012, 2.495, 0.37), 0.01, 6, 4);
    bp.box(hair, at(sx * 0.13, 2.6, 0.31, -0.3, 0, sx * -0.2), 0.12, 0.025, 0.03);
    for (let k = 0; k < 4; k++) bp.sphere(0xd8743a, at(sx * (0.17 + (k % 2) * 0.05), 2.36 + Math.floor(k / 2) * 0.04, 0.315 - (k % 2) * 0.02), 0.012, 6, 4);
  }
  bp.sphere(0xf2a07a, at(0, 2.39, 0.36), 0.055, 12, 8);
  bp.torus(0x9b1d14, at(0, 2.31, 0.325, 0.3, 0, Math.PI), 0.12, 0.024, 8, 18, Math.PI);
  const r = rng(side > 0 ? 11 : 22);
  for (let k = 0; k < 34; k++) {
    const a = r() * Math.PI * 2;
    const el = 0.05 + r() * 1.2;
    const rr = 0.34;
    const hx = Math.cos(a) * Math.cos(el) * rr;
    const hz = Math.sin(a) * Math.cos(el) * rr;
    const hy = Math.sin(el) * rr;
    if (hz > 0.12 && hy < 0.27) continue;
    bp.sphere(hair, at(hx, 2.44 + hy, hz - 0.02), 0.1 + r() * 0.07, 10, 8);
  }
  for (let k = 0; k < 7; k++) {
    const fx = -0.24 + k * 0.08;
    bp.sphere(hair, at(fx, 2.7 - Math.abs(fx) * 0.25, 0.25 - Math.abs(fx) * 0.35), 0.085 + (k % 2) * 0.02, 10, 8);
  }
  for (let k = 0; k < 5; k++) bp.geo(new THREE.ConeGeometry(0.05, 0.2, 8), hair, at(-0.16 + k * 0.08, 2.84, -0.02 - (k % 2) * 0.06, (r() - 0.5) * 0.6, 0, (k - 2) * 0.25));
  // Static arm on the hip.
  const hipX = -side * 0.33;
  bp.cyl(coat, at(hipX - side * 0.06, 1.78, 0, 0, 0, side * 0.35), 0.075, 0.07, 0.42, 10);
  bp.cyl(coat, at(hipX - side * 0.1, 1.48, 0.08, 0.6, 0, -side * 0.8), 0.065, 0.06, 0.36, 10);
  bp.sphere(0xffffff, at(hipX + side * 0.04, 1.36, 0.16), 0.07, 10, 8);
  // Raised arm (animated): built around the shoulder pivot.
  const pivot = new THREE.Group();
  pivot.position.copy(F.pt(side * 0.33 * s, 1.95 * s, 0));
  pivot.rotation.y = F.yaw;
  rig.add(pivot);
  const arm = new ColorBatch();
  const am = (x, y, z, rx = 0, ry = 0, rz = 0, sx = 1, sy = 1, sz = 1) => dmat(x * s, y * s, z * s, rx, ry, rz, sx * s, sy * s, sz * s);
  arm.cyl(coat, am(side * 0.05, 0.2, 0, 0, 0, -side * 0.2), 0.075, 0.07, 0.42, 10);
  arm.cyl(coat, am(side * 0.1, 0.56, 0.02, 0, 0, -side * 0.05), 0.065, 0.06, 0.36, 10);
  arm.sphere(0xffffff, am(side * 0.11, 0.78, 0.02), 0.075, 10, 8);
  const tipLocal = vec3(0, 0, 0);
  if (side > 0) {
    arm.cyl(hatColor, am(side * 0.11, 0.98, 0.02), 0.2, 0.19, 0.34, 18);
    arm.cyl(PAL.orange, am(side * 0.11, 0.86, 0.02), 0.205, 0.205, 0.07, 18);
    arm.cyl(hatColor, am(side * 0.11, 0.81, 0.02), 0.33, 0.33, 0.025, 20);
    tipLocal.set(side * 0.11 * s, 1.2 * s, 0.02 * s);
  } else {
    arm.cyl(0x5a2e16, am(side * 0.11, 0.95, 0.12, 0.35, 0, 0), 0.018, 0.026, 0.82, 8);
    arm.sphere(PAL.gold, am(side * 0.11, 1.33, 0.26), 0.035, 8, 6);
    tipLocal.set(side * 0.11 * s, 1.35 * s, 0.27 * s);
  }
  const mesh = arm.build(M.paint, true, true, 0);
  scene.remove(mesh);
  mesh.matrixAutoUpdate = false;
  pivot.add(mesh);
  DECO.twinArms.push({ pivot, side, tipLocal, phase: side > 0 ? 0 : 1.7 });
}

function buildTwins() {
  const { x, z, yaw } = TWINS;
  const F = new DecoFrame(x, z, yaw);
  const rad = 0.78;
  for (let k = 0; k < 16; k++) {
    DB.paint.geo(new THREE.CylinderGeometry(rad, rad + 0.02, 0.34, 3, 1, false, (k * Math.PI) / 8, Math.PI / 8), k & 1 ? PAL.orange : PAL.purple, F.at(0, 0.2, 0));
  }
  DB.metal.cyl(PAL.gold, F.at(0, 0.02, 0), rad + 0.06, rad + 0.07, 0.04, 32);
  DB.metal.cyl(PAL.gold, F.at(0, 0.385, 0), rad + 0.04, rad + 0.03, 0.03, 32);
  decoBannerPlane(DECO_BANNER.plate, F.at(0, 0.2, rad + 0.025), 0.72, 0.18);
  // The platter and the figures turn on the static drum (own meshes: a few extra draw calls).
  const rig = new THREE.Group();
  rig.position.set(x, 0, z);
  rig.rotation.y = yaw;
  scene.add(rig);
  DECO.twinRig = rig;
  const bp = new ColorBatch();
  const bm = new ColorBatch();
  bp.cyl(PAL.plumDeep, dmat(0, 0.41, 0), rad + 0.02, rad + 0.02, 0.025, 32);
  for (let k = 0; k < 12; k++) {
    const a = (k / 12) * Math.PI * 2;
    bm.sphere(PAL.gold, dmat(Math.cos(a) * (rad - 0.06), 0.435, Math.sin(a) * (rad - 0.06)), 0.025, 8, 6);
  }
  const top = new DecoFrame(0, 0, 0, 0.42);
  const leftF = new DecoFrame(0, 0, 0);
  leftF.m.copy(top.m).multiply(dmat(-0.34, 0, 0, 0, 0.18, 0));
  leftF.yaw = 0.18;
  const rightF = new DecoFrame(0, 0, 0);
  rightF.m.copy(top.m).multiply(dmat(0.34, 0, 0, 0, -0.18, 0));
  rightF.yaw = -0.18;
  buildTwinFigure(leftF, -1, PAL.magenta, PAL.lime, [PAL.lime, PAL.plumDeep], PAL.lime, bp, bm, rig);
  buildTwinFigure(rightF, 1, PAL.purple, PAL.orange, [PAL.orange, PAL.cream], PAL.purple, bp, bm, rig);
  for (const [batch, material] of [[bp, M.paint], [bm, M.metal]]) {
    const mesh = batch.build(material, true, true, 0);
    scene.remove(mesh);
    rig.add(mesh);
  }
  roundBatch.floor(x, z, 2.2, 2.2, 0, 0.012);
  addColliderCircle(x, z, rad + 0.1, 2.9, 'twins');
}

const EAR_SKIN = 0xf0a888;

  const at = (x, y, z, rx = 0, ry = 0, rz = 0, sx = 1, sy = 1, sz = 1) => m.clone().multiply(dmat(x * s, y * s, z * s, rx, ry, rz, sx * s, sy * s, sz * s));
  DB.paint.torus(EAR_SKIN, at(0, 0, 0, 0, 0, -0.5, 1, 1.3, 1), 0.045, 0.013, 6, 18, Math.PI * 1.5);
  DB.paint.sphere(EAR_SKIN, at(-0.006, -0.006, -0.006, 0, 0, 0, 1, 1.25, 0.42), 0.036, 12, 8);
  DB.paint.sphere(0xc9765c, at(-0.004, -0.012, 0.006, 0, 0, 0, 0.55, 0.62, 0.3), 0.03, 10, 6);
  DB.paint.sphere(EAR_SKIN, at(0.004, -0.066, 0, 0, 0, 0, 0.9, 1.1, 0.7), 0.02, 10, 8);
}

/** Window displays: pyramids of boxes, a few tall boxes, jars or a puff cage; the hidden figurines keep their room. */
function buildWindowGoods() {
  const r = rng(6161);
  SHOP_WINDOWS.forEach((w, i) => {
    const F = new DecoFrame(w.cx, 5.62, Math.PI);
    const y = DISPLAY_BOXES[i].top;
    const px = i === 0 ? -0.95 : -1.05;
    const rows = i === 0 ? 4 : 4;
    for (let row = 0; row < rows; row++) {
      const n = (i === 0 ? 5 : 4) - row;
      for (let k = 0; k < n; k++) {
        const x = px + (k - (n - 1) / 2) * 0.17;
        addProductBox(F, x, y + row * 0.15, 0.05, 0.15, 0.15, 0.15, i === 0 ? [0, 0, 7, 11][k % 4] : [CELL_FIRE, CELL_FIRE, 8, 9][k % 4], (r() - 0.5) * 0.2);
      }
    }
    const tall = i === 0 ? [0.0] : [0.0, 0.2];
    for (const tx of tall) addProductBox(F, tx, y, -0.02, 0.15, 0.26 + r() * 0.16, 0.12, Math.floor(r() * 16), (r() - 0.5) * 0.3);
    if (i === 1) addCage(F.at(0.95, y, 0.0), 0.13, 0.26, r, 3);

  });
}

function catenary(a, b, sag, n) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const p = a.clone().lerp(b, t);
    p.y -= sag * 4 * t * (1 - t);
    pts.push(p);
  }
  return pts;
}

const FW_VERT = `
attribute float aSize;
attribute vec3 aColor;
attribute vec3 aCenter;
attribute vec2 aData;
uniform float uScale;
uniform float uTime;
varying vec3 vCol;
void main() {
  vec3 p = position - aCenter;
  float spinOn = step(0.0, aData.x);
  float ang = uTime * 0.04 * (0.6 + fract(aData.x * 0.618)) * spinOn;
  float c = cos(ang);
  float s = sin(ang);
  p.xz = mat2(c, -s, s, c) * p.xz;
  p *= 1.0 + 0.035 * spinOn * sin(uTime * 0.6 + aData.x * 3.0);
  vec4 mv = modelViewMatrix * vec4(aCenter + p, 1.0);
  float tw = 0.6 + 0.4 * sin(uTime * (1.6 + aData.y * 2.6) + aData.y * 40.0);
  vCol = aColor * tw;
  gl_PointSize = min(aSize * uScale / max(-mv.z, 0.1), 600.0);
  gl_Position = projectionMatrix * mv;
}`;
const DRIFT_VERT = `
attribute vec3 aColor;
attribute vec3 aCenter;
attribute vec4 aData;
uniform float uScale;
uniform float uTime;
varying vec3 vCol;
void main() {
  float life = 7.0 + aData.w * 5.0;
  float t = mod(uTime + aData.x * life, life);
  float k = t / life;
  vec3 p = aCenter + position * (1.0 + k * 0.5);
  p.y -= 0.12 * t + 0.012 * t * t;
  p.x += sin(t * 0.7 + aData.y * 6.28) * 0.12 * k;
  p.z += cos(t * 0.6 + aData.y * 6.28) * 0.12 * k;
  vec4 mv = modelViewMatrix * vec4(p, 1.0);
  float fade = smoothstep(0.0, 0.08, k) * (1.0 - smoothstep(0.55, 1.0, k));
  float tw = 0.55 + 0.45 * sin(uTime * 9.0 + aData.y * 50.0);
  vCol = aColor * fade * tw * 0.7;
  gl_PointSize = min((0.026 + 0.016 * aData.z) * uScale / max(-mv.z, 0.1), 200.0);
  gl_Position = projectionMatrix * mv;
}`;
const EMIT_VERT = `
attribute vec3 aColor;
attribute vec4 aData;
uniform float uScale;
uniform float uTime;
uniform vec3 uEmit[4];
varying vec3 vCol;
void main() {
  int e = int(aData.z + 0.5);
  vec3 base = e == 0 ? uEmit[0] : e == 1 ? uEmit[1] : e == 2 ? uEmit[2] : uEmit[3];
  float life = e == 2 ? 2.0 : 1.8;
  float t = mod(uTime + aData.x * life, life);
  float k = t / life;
  vec3 p = base + position * t + vec3(0.0, (e == 2 ? 0.08 : -0.12) * t * t, 0.0);
  vec4 mv = modelViewMatrix * vec4(p, 1.0);
  float fade = smoothstep(0.0, 0.1, k) * (1.0 - k);
  vCol = aColor * fade * (0.6 + 0.4 * sin(uTime * 14.0 + aData.y * 30.0));
  gl_PointSize = min((0.022 + 0.02 * aData.w) * uScale / max(-mv.z, 0.1), 160.0);
  gl_Position = projectionMatrix * mv;
}`;
const STREAK_VERT = `
attribute vec3 aB;
attribute vec3 aCenter;
attribute vec4 aCorner;
attribute vec3 aColor;
uniform float uTime;
uniform float uWidth;
varying vec3 vCol;
varying vec2 vUv;
vec3 spin(vec3 p, float ang) {
  vec3 q = p - aCenter;
  float c = cos(ang);
  float s = sin(ang);
  q.xz = mat2(c, -s, s, c) * q.xz;
  q *= 1.0 + 0.035 * sin(uTime * 0.6 + aCorner.w * 3.0);
  return aCenter + q;
}
void main() {
  float ang = uTime * 0.04 * (0.6 + fract(aCorner.w * 0.618));
  vec4 va = modelViewMatrix * vec4(spin(position, ang), 1.0);
  vec4 vb = modelViewMatrix * vec4(spin(aB, ang), 1.0);
  vec4 p = mix(va, vb, aCorner.x);
  vec2 d = vb.xy / max(-vb.z, 0.05) - va.xy / max(-va.z, 0.05);
  d = dot(d, d) > 1e-10 ? normalize(d) : vec2(1.0, 0.0);
  p.xy += vec2(-d.y, d.x) * aCorner.y * uWidth * mix(0.3, 1.0, aCorner.z);
  vUv = vec2(aCorner.z, aCorner.y);
  vCol = aColor * (0.8 + 0.2 * sin(uTime * 1.7 + aCorner.w * 11.0 + aCorner.z * 3.0));
  gl_Position = projectionMatrix * p;
}`;
const STREAK_FRAG = `
varying vec3 vCol;
varying vec2 vUv;
void main() {
  float across = exp(-vUv.y * vUv.y * 3.0) * (1.0 - smoothstep(0.8, 1.0, abs(vUv.y)));
  float k = clamp(vUv.x, 0.0, 1.0);
  float along = mix(0.05, 1.0, k * k * k);
  gl_FragColor = vec4(vCol * across * along, 1.0);
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
}`;

/** Star trails of the frozen bursts: camera-facing ribbons, thin at the core, bright and wide at the head. */
function buildStreaks() {
  const r = rng(9191);
  const pa = [];
  const pb = [];
  const cen = [];
  const cor = [];
  const col = [];
  const idx = [];
  let base = 0;
  const quad = (a, b, ka, kb, c, center, phase) => {
    for (const [sel, side] of [[0, -1], [0, 1], [1, 1], [1, -1]]) {
      pa.push(a.x, a.y, a.z);
      pb.push(b.x, b.y, b.z);
      cen.push(center.x, center.y, center.z);
      cor.push(sel, side, sel ? kb : ka, phase);
      col.push(c[0], c[1], c[2]);
    }
    idx.push(base, base + 1, base + 2, base, base + 2, base + 3);
    base += 4;
  };
  const dir = new THREE.Vector3();
  const a = new THREE.Vector3();
  const b = new THREE.Vector3();
  const along = (bu, reach, droop, t, out) => {
    out.copy(dir).multiplyScalar(reach * t).add(bu.c);
    out.y -= droop * reach * t * t;
    return out;
  };
  BURSTS.forEach((bu, bi) => {
    const kind = bu.kind;
    const rays = kind === 'ring' ? 40 : kind === 'peony' ? 36 : kind === 'willow' ? 30 : 48;
    const droop = kind === 'willow' ? 0.75 : kind === 'chrys' ? 0.14 : 0.05;
    const t0 = kind === 'peony' ? 0.5 : kind === 'willow' ? 0.08 : 0.22;
    const segs = kind === 'willow' ? 5 : 3;
    const gain = kind === 'willow' ? 0.5 : kind === 'peony' ? 0.75 : 0.6;
    const c = bu.col.map((v) => v * gain);
    const tilt = bu.tilt ? new THREE.Euler(...bu.tilt) : null;
    for (let k = 0; k < rays; k++) {
      if (kind === 'ring') {
        const th = (k / rays) * Math.PI * 2;
        dir.set(Math.cos(th), (r() - 0.5) * 0.06, Math.sin(th)).applyEuler(tilt);
      } else {
        // Fibonacci sphere with a little jitter: even coverage without clumps.
        const yy = 1 - (2 * (k + 0.5)) / rays;
        const rad = Math.sqrt(Math.max(0, 1 - yy * yy));
        const th = k * 2.39996 + bi * 1.3;
        dir.set(Math.cos(th) * rad + (r() - 0.5) * 0.12, yy + (r() - 0.5) * 0.12, Math.sin(th) * rad + (r() - 0.5) * 0.12).normalize();
        if (kind === 'willow') dir.y = Math.abs(dir.y) * 0.8 + 0.1;
        dir.normalize();
      }
      const reach = bu.r * (0.86 + r() * 0.22);
      for (let s = 0; s < segs; s++) {
        const ka = s / segs;
        const kb = (s + 1) / segs;
        along(bu, reach, droop, t0 + (1 - t0) * ka, a);
        along(bu, reach, droop, t0 + (1 - t0) * kb, b);
        quad(a, b, ka, kb, c, bu.c, bi);
      }
    }
  });
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pa, 3));
  g.setAttribute('aB', new THREE.Float32BufferAttribute(pb, 3));
  g.setAttribute('aCenter', new THREE.Float32BufferAttribute(cen, 3));
  g.setAttribute('aCorner', new THREE.Float32BufferAttribute(cor, 4));
  g.setAttribute('aColor', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  const m = new THREE.ShaderMaterial({
    uniforms: { uTime: uDecoTime, uWidth: { value: 0.016 } },
    vertexShader: STREAK_VERT,
    fragmentShader: STREAK_FRAG,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    side: THREE.DoubleSide,
  });
  const mesh = new THREE.Mesh(g, m);
  mesh.frustumCulled = false;
  mesh.renderOrder = 6;
  scene.add(mesh);
}

function buildFireworks(quality) {
  const r = rng(8686);
  const pos = [];
  const col = [];
  const cen = [];
  const dat = [];
  const size = [];
  const push = (p, c, center, s, d0, d1) => {
    pos.push(p.x, p.y, p.z);
    col.push(c[0], c[1], c[2]);
    cen.push(center.x, center.y, center.z);
    size.push(s);
    dat.push(d0, d1);
  };
  const dir = new THREE.Vector3();
  BURSTS.forEach((b, bi) => {
    const heads = b.kind === 'willow' ? 10 : 22;
    for (let k = 0; k < heads; k++) {
      dir.set(r() * 2 - 1, r() * 2 - 1, r() * 2 - 1);
      if (dir.lengthSq() < 0.05) dir.set(0, 1, 0);
      dir.normalize().multiplyScalar(b.r * (0.9 + r() * 0.2));
      push(dir.add(b.c), b.tip, b.c, 0.05, bi, r());
    }
    for (let k = 0; k < 12; k++) {
      dir.set(r() * 2 - 1, r() * 2 - 1, r() * 2 - 1).normalize().multiplyScalar(b.r * (0.2 + r() * 0.5));
      push(dir.add(b.c), [b.tip[0] * 0.7, b.tip[1] * 0.7, b.tip[2] * 0.7], b.c, 0.035, bi, r());
    }
  });
  DECO.rockets.forEach((rk) => {
    for (let k = 0; k < 40; k++) {
      const t = k / 40;
      const p = rk.p.clone().addScaledVector(rk.d, -0.22 - t * 1.4);
      p.x += (r() - 0.5) * 0.08 * t;
      p.y += (r() - 0.5) * 0.08 * t;
      p.z += (r() - 0.5) * 0.08 * t;
      const f = Math.pow(1 - t, 1.6);
      push(p, [4 * f, 2.6 * f, 1.0 * f], rk.p, 0.04 + 0.05 * (1 - t), -1, r());
    }
  });
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('aColor', new THREE.Float32BufferAttribute(col, 3));
  g.setAttribute('aCenter', new THREE.Float32BufferAttribute(cen, 3));
  g.setAttribute('aData', new THREE.Float32BufferAttribute(dat, 2));
  g.setAttribute('aSize', new THREE.Float32BufferAttribute(size, 1));
  const pts = new THREE.Points(g, decoPointsMaterial(FW_VERT, SPARK_FRAG));
  pts.frustumCulled = false;
  pts.renderOrder = 6;
  scene.add(pts);
  const dpos = [];
  const dcol = [];
  const dcen = [];
  const ddat = [];
  BURSTS.forEach((b) => {
    for (let k = 0; k < (quality === 'xbox' ? 30 : 46); k++) {
      dir.set(r() * 2 - 1, r() * 2 - 1, r() * 2 - 1).normalize().multiplyScalar(b.r * (0.6 + r() * 0.4));
      dpos.push(dir.x, dir.y, dir.z);
      const c = r() < 0.5 ? b.tip : b.col;
      dcol.push(c[0], c[1], c[2]);
      dcen.push(b.c.x, b.c.y, b.c.z);
      ddat.push(r(), r(), r(), r());
    }
  });
  const dg = new THREE.BufferGeometry();
  dg.setAttribute('position', new THREE.Float32BufferAttribute(dpos, 3));
  dg.setAttribute('aColor', new THREE.Float32BufferAttribute(dcol, 3));
  dg.setAttribute('aCenter', new THREE.Float32BufferAttribute(dcen, 3));
  dg.setAttribute('aData', new THREE.Float32BufferAttribute(ddat, 4));
  const drift = new THREE.Points(dg, decoPointsMaterial(DRIFT_VERT, SPARK_FRAG));
  drift.frustumCulled = false;
  drift.renderOrder = 6;
  scene.add(drift);
  const epos = [];
  const ecol = [];
  const edat = [];
  const ecolors = [[[3.2, 2.4, 0.6], [1.4, 3.0, 0.5]], [[3.2, 0.7, 2.0], [3.2, 2.0, 0.4]], [[2.0, 0.5, 3.2], [1.1, 3.0, 0.4]], [[2.6, 1.7, 0.45], [1.3, 2.4, 0.5]]];
  for (let e = 0; e < 4; e++) {
    const n = e === 2 ? 120 : e === 3 ? 60 : 110;
    for (let k = 0; k < n; k++) {
      dir.set(r() * 2 - 1, 0.6 + r() * 1.2, r() * 2 - 1);
      if (e === 2) dir.set((r() - 0.5) * 0.3, 0.12 + r() * 0.22, (r() - 0.5) * 0.3);
      else if (e === 3) dir.set((r() - 0.5) * 0.2, 0.15 + r() * 0.25, (r() - 0.5) * 0.2);
      else dir.multiplyScalar(0.45);
      epos.push(dir.x, dir.y, dir.z);
      const c = ecolors[e][k & 1];
      ecol.push(c[0], c[1], c[2]);
      edat.push(r(), r(), e, r());
    }
  }
  const eg = new THREE.BufferGeometry();
  eg.setAttribute('position', new THREE.Float32BufferAttribute(epos, 3));
  eg.setAttribute('aColor', new THREE.Float32BufferAttribute(ecol, 3));
  eg.setAttribute('aData', new THREE.Float32BufferAttribute(edat, 4));
  const em = new THREE.Points(eg, decoPointsMaterial(EMIT_VERT, SPARK_FRAG, { uEmit: { value: DECO.emitters } }));
  em.frustumCulled = false;
  em.renderOrder = 6;
  scene.add(em);
}

function buildRugs() {
  // Runner rugs: the entrance aisle and the aisle in front of the house units.
  const geos = [];
  for (const [x, z, w, l, yaw] of [[1.0, 3.2, 1.3, 4.6, Math.PI / 2], [-3.6, -4.6, 1.1, 6.6, 0]]) {
    const g = new THREE.PlaneGeometry(l, w);
    g.rotateX(-Math.PI / 2);
    g.rotateY(yaw);
    g.translate(x, 0.005, z);
    geos.push(g);
  }
  staticMesh(mergeGeometries(geos, false), M.rug, false, true);
  const rr = new THREE.CircleGeometry(1.75, 48);
  rr.rotateX(-Math.PI / 2);
  rr.translate(TOWER.x, 0.006, TOWER.z);
  staticMesh(rr, M.roundRug, false, true);
}

/** One instanced straw dome per heap; its height follows the heap's height field (set after spawning). */
function buildHeapMounds() {
  // Same bell profile as heapHeightAt(), so figurines rest on the visible straw.
  const prof = [];
  for (let i = 0; i <= 14; i++) {
    const rad = 1 - i / 14;
    prof.push([rad, heapBell(rad)]);
  }
  const geo = scaleUV(latheGeo(prof, 28, 0, 0, 0, 1), 4, 3);
  const mesh = new THREE.InstancedMesh(geo, M.straw, HEAP_DEFS.length);
  mesh.receiveShadow = true;
  mesh.count = HEAP_DEFS.length;
  mesh.frustumCulled = false;
  scene.add(mesh);
  DECO.mounds = mesh;
  updateHeapMounds();
}

/** Re-poses the straw domes from the current heap heights (called after spawning or loading). */
function updateHeapMounds() {
  const mesh = DECO.mounds;
  if (!mesh) return;
  let i = 0;
  for (const hp of WORLD.heaps) {
    if (hp.crate || i >= mesh.count) continue;
    // Elliptical dome (rx, rz); only half turns, so the texture varies without twisting the ellipse.
    tm1.compose(tv1.set(hp.x, 0, hp.z), tq1.setFromAxisAngle(UP_AXIS, i * Math.PI), tv2.set(hp.rx * 1.02, Math.max(0.04, hp.h0), hp.rz * 1.02));
    mesh.setMatrixAt(i++, tm1);
  }
  mesh.instanceMatrix.needsUpdate = true;
}
