        } else if (wasFar) {
          far.collapse(h);
          if (farGhost) farGhost.collapse(h);
        }
        poseDirty[h] = 0;
        fxDirty[h] = 0;
        if (haveCam) {
          figSphere.center.set(center[h * 4], center[h * 4 + 1], center[h * 4 + 2]);
          figSphere.radius = center[h * 4 + 3];
          if (!figFrustum.intersectsSphere(figSphere)) {
            nCull++;
            continue;
          }
        }
        figM2.fromArray(hm, h * 16);
        if (rim[h] > olV && !r.ext) {
          olV = rim[h];
          olH = h;
          olL = L;
        }
        if (r.ext) {
          const e = r.ext;
          const k = e.cnt++;
          e.sig = (Math.imul(e.sig, 31) + h + 1) | 0;
          if (dirtyH) e.dirty = 1;
          for (const em of e.meshes) {
            figM2.toArray(em.instanceMatrix.array, k * 16);
            const a = em.geometry.attributes.figInst.array;
            a[k * 4] = rim[h];
            a[k * 4 + 1] = glow;
            a[k * 4 + 2] = flash;
            a[k * 4 + 3] = shim;
          }
          tris += e.tris;
        } else {
          const k = r.cnt[L]++;
          r.sig[L] = (Math.imul(r.sig[L], 31) + h + 1) | 0;
          if (dirtyH) r.dirty[L] = 1;
          const mesh = r.meshes[L];
          figM1.multiplyMatrices(figM2, r.local[L]);
          figM1.toArray(mesh.instanceMatrix.array, k * 16);
          const a = mesh.geometry.attributes.figInst.array;
          a[k * 4] = rim[h];
          a[k * 4 + 1] = glow;
          a[k * 4 + 2] = flash;
          a[k * 4 + 3] = shim;
          tris += r.tris[L];
        }
        if (L === 0) nNear++;
        else nMid++;
        if (r.hasBase && baseOn[h]) {
          const b = bases[L];
          const k = b.cnt++;
          b.sig = (Math.imul(b.sig, 31) + h + 1) | 0;
          if (dirtyH) b.dirty = 1;
          baseLocal.makeScale(r.baseScale * FIG_CM, FIG_CM, r.baseScale * FIG_CM);
          figM1.multiplyMatrices(figM2, baseLocal);
          figM1.toArray(b.mesh.instanceMatrix.array, k * 16);
          const c = b.cat.array;
          c[k * 4] = r.ringLin[0];
          c[k * 4 + 1] = r.ringLin[1];
          c[k * 4 + 2] = r.ringLin[2];
          c[k * 4 + 3] = r.catIndex;
          const a = b.inst.array;
          a[k * 4] = rim[h];
          a[k * 4 + 1] = glow * 0.5;
          a[k * 4 + 2] = flash * 0.5;
          a[k * 4 + 3] = 0;
          tris += b.tris;
        }
      }
      let draws = 0;
      for (const r of recs) {
        for (let l = 0; l < 2; l++) {
          const mesh = r.meshes[l];
          const c = r.cnt[l];
          mesh.count = c;
          mesh.visible = c > 0 && !r.ext;
          if (r.depth) {
            r.depth[l].count = c;
            r.depth[l].visible = mesh.visible;
          }
          if (c > 0) {
            if (r.dirty[l] || r.sig[l] !== r.prevSig[l]) {
              figUpload(mesh.instanceMatrix, c, 16);
              figUpload(mesh.geometry.attributes.figInst, c, 4);
              r.prevSig[l] = r.sig[l];
              r.force[l] = 0;
            }
            draws++;
          } else r.force[l] = 1; // handles may move while undrawn: upload again when the mesh reappears
        }
      }
      for (const e of extList) {
        const up = e.dirty || e.sig !== e.prevSig;
        for (const em of e.meshes) {
          em.count = e.cnt;
          em.visible = e.cnt > 0;
          if (e.cnt > 0) {
            if (up) {
              figUpload(em.instanceMatrix, e.cnt, 16);
              figUpload(em.geometry.attributes.figInst, e.cnt, 4);
            }
            draws++;
          }
        }
        if (up && e.cnt > 0) {
          e.prevSig = e.sig;
          e.force = 0;
        } else if (e.cnt === 0) e.force = 1;
      }
      for (const b of bases) {
        b.mesh.count = b.cnt;
        b.mesh.visible = b.cnt > 0;
        if (b.cnt > 0) {
          if (b.dirty || b.sig !== b.prevSig) {
            figUpload(b.mesh.instanceMatrix, b.cnt, 16);
            figUpload(b.cat, b.cnt, 4);
            figUpload(b.inst, b.cnt, 4);
            b.prevSig = b.sig;
            b.force = 0;
          }
          draws++;
        } else b.force = 1;
      }
      far.flush();
      if (farGhost) farGhost.flush();
      draws += 1 + (farGhost ? 1 : 0);
      tris += far.liveTris + (farGhost ? farGhost.liveTris : 0);
      // Aim outline around the most highlighted visible handle (figure, then its base).
      outline[0].visible = false;
      outline[1].visible = false;
      if (olH >= 0) {
        const r = recs[designIdx[olH]];
        figM2.fromArray(hm, olH * 16);
        outline[0].geometry = r.meshes[olL].geometry;
        figM1.multiplyMatrices(figM2, r.local[olL]);
        outline[0].setMatrixAt(0, figM1);
        outline[0].instanceMatrix.needsUpdate = true;
        outline[0].visible = true;
        draws++;
        tris += r.tris[olL];
        if (r.hasBase && baseOn[olH]) {
          outline[1].geometry = bases[olL].mesh.geometry;
          baseLocal.makeScale(r.baseScale * FIG_CM, FIG_CM, r.baseScale * FIG_CM);
          figM1.multiplyMatrices(figM2, baseLocal);
          outline[1].setMatrixAt(0, figM1);
          outline[1].instanceMatrix.needsUpdate = true;
          outline[1].visible = true;
          draws++;
          tris += bases[olL].tris;
        }
        FIG_MATERIALS.outline.uniforms.uAmount.value = Math.min(1, olV);
      }
      info.near = nNear;
      info.mid = nMid;
      info.far = nFar;
      info.culled = nCull;
      info.loose = loose;
      info.shelf = shelf;
      info.trisEstimate = tris;
      info.drawCallsMax = draws;
    },
    setQuality(q) {
      figApplyQuality(q);
      quality.q = q;
      quality.dist = q === 'xbox' ? 1 : 1.3;
      for (const r of recs) for (const m of r.meshes) if (m) m.material = figMat(r);
      for (const b of bases) b.mesh.material = FIG_MATERIALS.base;
      if (far) far.mesh.material = FIG_MATERIALS.figure;
    },
    /** Replaces the procedural figure of a design with an external one (pose-space geometry, metres). */
    registerExternalFigure(designId, ext) {
      const r = recById[designId];
      if (!r || !ext || !ext.meshesByMaterial || !ext.meshesByMaterial.length) return false;
      if (r.ext) return true;
      const cap = r.handles.length;
      const e = { id: designId, meshes: [], cnt: 0, tris: ext.tris || 0 };
      for (const part of ext.meshesByMaterial) {
        const g = part.geometry.clone();
        g.setAttribute('figInst', figInstAttr(cap, 4));
        g.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 1e4);
        figPatchExternal(part.material);
        const m = figInstanced(g, part.material, cap);
        m.name = `fig:ext:${designId}`;
        m.visible = false;
        e.meshes.push(m);
        meshes.push(m);
        group.add(m);
      }
      r.ext = e;
      extList.push(e);
      for (const h of r.handles) {
        far.collapse(h);
        if (farGhost) farGhost.collapse(h);
        lod[h] = -1;
        poseDirty[h] = 1;
      }
      farStale = true;
      info.externalIds.push(designId);
      return true;
    },
    /** Loads the models listed in assets/figures/index.json one at a time. Resolves the applied ids; never rejects. */
    async loadExternalModels() {
      const applied = [];
      try {
        const index = await loadExternalFigureIndex();
        for (const id of Object.keys(index)) {
          if (!recById[id] || recById[id].ext) continue;
          const ext = await loadExternalFigure(id);
          if (ext && kit.registerExternalFigure(id, ext)) applied.push(id);
          await new Promise((res) => requestAnimationFrame(() => res()));
        }
      } catch (err) {
        console.warn('[figures] external models', err);
      }
      return applied;
    },
    whenLoaded() {
      return figWhenLoaded();
    },
    getInfo() {
      let m = recs.length * 2;
      m += bases.length + 1 + (farGhost ? 1 : 0) + extList.reduce((s, e) => s + e.meshes.length, 0);
      info.meshes = m;
      info.loaded = FIG_LOAD.loaded;
      info.baked = FIG_LOAD.total;
      return info;
    },
    dispose() {
      FIG_LOAD.listeners.delete(listener);
      scene.remove(group);
      for (const ms of meshes) {
        ms.geometry.dispose();
        ms.dispose();
      }
      for (const w of warm) {
        w.geometry.dispose();
        w.dispose();
      }
      far.dispose();
      if (farGhost) farGhost.dispose();
    },
  };
  return kit;
}

const figIdentity = new THREE.Matrix4();

/** Float copy of a decoded LOD entry (for the far batch), positions and normals already dequantised to cm. */
function figFloatCopy(e) {
  if (e.far) return e.far;
  const g = e.geometry;
  const p = g.attributes.position;
  const nV = p.count;
  const fp = new Float32Array(nV * 3);
  const fn = new Float32Array(nV * 3);
  const oct = g.attributes.aOct.array;
  for (let v = 0; v < nV; v++) {
    figV1.set(p.getX(v), p.getY(v), p.getZ(v)).applyMatrix4(e.dequant);
    fp[v * 3] = figV1.x;
    fp[v * 3 + 1] = figV1.y;
    fp[v * 3 + 2] = figV1.z;
    figOctDecode(oct[v * 2], oct[v * 2 + 1], fn, v * 3);
  }
  e.far = { pos: fp, nrm: fn, col: g.attributes.aCol.array, pbr: g.attributes.aPbr.array, index: g.index.array };
  return e.far;
}

/* ---- single-design instancer (preview, finale casting) ------------------------------------------- */

/**
 * DESIGN.md 16.5 low-level instancer: full-detail figure (+ base) of one design, capacity maxCount.
 * setInstance(i, matrix) takes a pose-space -> world matrix (base bottom centre).
 */
function createFigureInstancer(scene, designId, maxCount, opts = { withBase: true }) {
  initFigureMaterials();
  figStartLoading();
  const d = FIG_BY_ID[designId];
  if (!d) throw new Error(`[figures] unknown design ${designId}`);
  const cap = Math.max(1, maxCount);
  const mats = new Float32Array(cap * 16);
  const local = new THREE.Matrix4();
  const inst = figInstAttr(cap, 4);
  const geo = figGeo(designId);
  let met = getFigureMetrics(designId);
  figLocalMatrix(geo.lods[0], met.baseH, local);
  const fig = figInstanced(figInstGeometry(geo.lods[0].geometry, { figInst: inst }), d.translucent ? FIG_MATERIALS.glass : FIG_MATERIALS.figure, cap);
  fig.name = `fig:instancer:${designId}`;
  const meshes = [fig];
  let depth = null;
  if (d.translucent) {
    // Same depth pre-pass as in the kit (see figGhostDepthMaterial).
    fig.renderOrder = 2;
    depth = figInstanced(fig.geometry, figGhostDepthMaterial(), 1);
    depth.instanceMatrix = fig.instanceMatrix;
    depth.renderOrder = 1;
    depth.name = `fig:instancer-depth:${designId}`;
    meshes.push(depth);
  }
  let base = null;
  let baseCat = null;
  if (opts.withBase !== false && !d.ownBase) {
    baseCat = figInstAttr(cap, 4);
    const cat = FIG_CATEGORIES[FIG_CATEGORY_INDEX[d.category]];
    figCol1.set(cat ? cat.color : '#8e8169').convertSRGBToLinear();
    for (let i = 0; i < cap; i++) baseCat.setXYZW(i, figCol1.r, figCol1.g, figCol1.b, cat ? cat.index : 0);
    base = figInstanced(figInstGeometry(figBuildBase(0).geometry, { figBaseCat: baseCat, figInst: figInstAttr(cap, 4) }), FIG_MATERIALS.base, cap);
    base.name = `fig:instancer-base:${designId}`;
    meshes.push(base);
  }
  for (const m of meshes) scene.add(m);
  const baseLocal = new THREE.Matrix4().makeScale((d.baseR / 30) * FIG_CM, FIG_CM, (d.baseR / 30) * FIG_CM);
  let count = 0;
  let maxSet = 0;
  function writeAll() {
    for (let i = 0; i < maxSet; i++) {
      figM2.fromArray(mats, i * 16);
      figM1.multiplyMatrices(figM2, local).toArray(fig.instanceMatrix.array, i * 16);
      if (base) figM1.multiplyMatrices(figM2, baseLocal).toArray(base.instanceMatrix.array, i * 16);
    }
    fig.instanceMatrix.needsUpdate = true;
    if (base) base.instanceMatrix.needsUpdate = true;
  }
  const listener = {
    onDesignLoaded(id) {
      if (id !== designId) return;
      met = getFigureMetrics(designId);
      figLocalMatrix(geo.lods[0], met.baseH, local);
      const old = fig.geometry;
      fig.geometry = figInstGeometry(geo.lods[0].geometry, { figInst: inst });
      if (depth) depth.geometry = fig.geometry;
      old.dispose();
      writeAll();
    },
  };
  FIG_LOAD.listeners.add(listener);
  return {
    meshes,
    get count() {
      return count;
    },
    set count(v) {
      count = Math.max(0, Math.min(cap, v));
      for (const m of meshes) m.count = count;
    },
    setInstance(i, matrix) {
      if (i < 0 || i >= cap) return;
      matrix.toArray(mats, i * 16);
      if (i + 1 > maxSet) maxSet = i + 1;
      figM1.multiplyMatrices(matrix, local).toArray(fig.instanceMatrix.array, i * 16);
      if (base) figM1.multiplyMatrices(matrix, baseLocal).toArray(base.instanceMatrix.array, i * 16);
    },
    setFx(i, glow, flash) {
      inst.setXYZW(i, 0, glow, flash, 0);
      inst.needsUpdate = true;
    },
    commit() {
      fig.instanceMatrix.needsUpdate = true;
      if (base) base.instanceMatrix.needsUpdate = true;
    },
    dispose() {
      FIG_LOAD.listeners.delete(listener);
      for (const m of meshes) {
        scene.remove(m);
        m.geometry.dispose();
        m.dispose();
      }
    },
  };
}

/* ---- external models --------------------------------------------------------------------------- */

let figExtIndexPromise = null;
let figGltfLoaderPromise = null;

/** Fetches assets/figures/index.json once. Resolves { [designId]: { file, tris, materials } } ({} on any failure). */
function loadExternalFigureIndex() {
  if (!figExtIndexPromise) {
    figExtIndexPromise = fetch('assets/figures/index.json', { cache: 'no-cache' })
      .then((r) => (r.ok ? r.json() : { models: {} }))
      .then((j) => (j && j.models) || {})
      .catch(() => ({}));
  }
  return figExtIndexPromise;
}

/**
 * Loads and normalises one external model: bottom centre at the origin, height = the procedural figure height,
 * lifted onto the game's base (ownBase designs: scaled to the total height, no lift), merged per material.
 * Resolves null on any failure (console.warn only).
 */
async function loadExternalFigure(designId) {
  try {
    const index = await loadExternalFigureIndex();
    const entry = index[designId];
    if (!entry) return null;
    if (!figGltfLoaderPromise) figGltfLoaderPromise = import('three/addons/loaders/GLTFLoader.js').then((m) => new m.GLTFLoader());
    const loader = await figGltfLoaderPromise;
    const gltf = await loader.loadAsync(`assets/figures/${entry.file}`);
    const d = FIG_BY_ID[designId];
    const met = getFigureMetrics(designId);
    const root = gltf.scene;
    root.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(root);
    const size = box.getSize(new THREE.Vector3());
    if (!(size.y > 1e-6)) throw new Error('empty model');
    const targetH = d.ownBase ? met.totalH : met.figH;
    const s = targetH / size.y;
    const norm = new THREE.Matrix4().makeTranslation(0, d.ownBase ? 0 : met.baseH, 0)
      .multiply(new THREE.Matrix4().makeScale(s, s, s))
      .multiply(new THREE.Matrix4().makeTranslation(-(box.min.x + box.max.x) / 2, -box.min.y, -(box.min.z + box.max.z) / 2));
    const byMat = new Map();
    let tris = 0;
    root.traverse((o) => {
      if (!o.isMesh) return;
      if (o.isSkinnedMesh || Array.isArray(o.material)) throw new Error('skinned or multi-material mesh');
      const g = o.geometry.clone();
      for (const k of Object.keys(g.attributes)) if (!['position', 'normal', 'uv', 'color'].includes(k)) g.deleteAttribute(k);
      g.morphAttributes = {};
      g.applyMatrix4(new THREE.Matrix4().multiplyMatrices(norm, o.matrixWorld));
      if (!g.attributes.normal) g.computeVertexNormals();
      tris += (g.index ? g.index.count : g.attributes.position.count) / 3;
      if (!byMat.has(o.material)) byMat.set(o.material, []);
      byMat.get(o.material).push(g);
    });
    if (!byMat.size) throw new Error('no meshes');
    if (byMat.size > 4) throw new Error(`${byMat.size} materials (at most 4)`);
    const meshesByMaterial = [];
    for (const [material, geos] of byMat) {
      if (!material.isMeshStandardMaterial) throw new Error('unsupported material type');
      const common = Object.keys(geos[0].attributes).filter((k) => geos.every((g) => g.attributes[k]));
      for (const g of geos) for (const k of Object.keys(g.attributes)) if (!common.includes(k)) g.deleteAttribute(k);
      const list = geos.every((g) => g.index) ? geos : geos.map((g) => (g.index ? g.toNonIndexed() : g));
      const merged = list.length > 1 ? mergeGeometries(list, false) : list[0];
      if (!merged) throw new Error('merge failed');
      meshesByMaterial.push({ geometry: merged, material });
    }
    return { meshesByMaterial, height: targetH, tris };
  } catch (err) {
    console.warn('[figures] external model failed', designId, err);
    return null;
  }
}

/* ---- the free-flying Snitch ------------------------------------------------------------------------ */

/** DESIGN.md 16.5: walnut-sized polished gold ball with two fluttering feather wings (2 draws, no base). */
function createSnitchFlyer(scene) {
  const group = new THREE.Group();
  group.name = 'fig:snitch';
  // Modelled at the original statuette scale; follows the global figurine scale like every other figure.
  group.scale.setScalar(FIG_SCALE);
  const gold = new THREE.MeshPhysicalMaterial({ color: 0xe0b24a, metalness: 1, roughness: 0.16, clearcoat: 0.6, emissive: 0x3a2606, emissiveIntensity: 0.6 });
  const R = 0.017;
  const ballGeo = new THREE.SphereGeometry(R, 24, 16);
  const seam1 = new THREE.TorusGeometry(R * 1.01, R * 0.05, 6, 32);
  const seam2 = seam1.clone().rotateY(Math.PI / 2);
  const ball = new THREE.Mesh(mergeGeometries([ballGeo, seam1, seam2].map((g) => (g.index ? g.toNonIndexed() : g)), false), gold);
  group.add(ball);
  /* Feather wing: a curved blade with scalloped trailing edge, ribs from vertex shading */
  const shape = new THREE.Shape();
  shape.moveTo(0, 0);
  shape.bezierCurveTo(0.012, 0.012, 0.05, 0.02, 0.075, 0.012);
  const scallops = 6;
  for (let i = 0; i < scallops; i++) {
    const t0 = i / scallops;
    const t1 = (i + 1) / scallops;
    const x0 = 0.075 * (1 - t0);
    const x1 = 0.075 * (1 - t1);
    shape.quadraticCurveTo((x0 + x1) / 2, -0.012 - 0.004 * Math.sin(Math.PI * t0), x1, -0.002 * (1 - t1));
  }
  const wingGeo = new THREE.ShapeGeometry(shape, 6);
  const wingMat = new THREE.MeshStandardMaterial({ color: 0xf6ecd2, metalness: 0.35, roughness: 0.35, side: THREE.DoubleSide, transparent: true, opacity: 0.88, emissive: 0x2a2008 });
  const wingL = new THREE.Mesh(wingGeo, wingMat);
  const wingR = new THREE.Mesh(wingGeo, wingMat);
  const pivotL = new THREE.Group();
  const pivotR = new THREE.Group();
  pivotL.position.set(R * 0.8, R * 0.3, -R * 0.2);
  pivotR.position.set(-R * 0.8, R * 0.3, -R * 0.2);
  wingR.scale.x = -1;
  pivotL.add(wingL);
  pivotR.add(wingR);
  group.add(pivotL, pivotR);
  scene.add(group);
  return {
    object3D: group,
    update(t, flapping = true) {
      const a = flapping ? 0.25 + 0.55 * Math.sin(t * 62) : 0.5;
      pivotL.rotation.set(-0.35, 0.25, a);
      pivotR.rotation.set(-0.35, -0.25, -a);
    },
    dispose() {
      scene.remove(group);
      ball.geometry.dispose();
      wingGeo.dispose();
      gold.dispose();
      wingMat.dispose();
    },
  };
}

/* ---- 30-textures.js ---- */
/* ==== 30-textures.js — photo texture loading and procedural generators (stone, fallbacks, sprites, sky, atlases) ==== */

let maxAniso = 8;
/** Every generated canvas texture; their canvases are dropped once uploaded (releaseTextureSources in 90-main). */
const canvasTextures = [];
/** Photo textures (also released after upload). */
const photoTextures = [];
/** All textures by name, filled during boot. */
const TEX = {};

function toTexture(source, srgb, repeatX = 1, repeatY = repeatX) {
  const t = new THREE.CanvasTexture(source);
  canvasTextures.push(t);
  t.wrapS = THREE.RepeatWrapping;
  t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.anisotropy = maxAniso;
  t.generateMipmaps = true;
  t.minFilter = THREE.LinearMipmapLinearFilter;
  t.magFilter = THREE.LinearFilter;
  t.repeat.set(repeatX, repeatY);
  return t;
}

function clampTex(t) {
  t.wrapS = THREE.ClampToEdgeWrapping;
  t.wrapT = THREE.ClampToEdgeWrapping;
  return t;
}

function finishSet(S, col, height, rough, normalStrength, repeat, normalScale) {
  const roughCanvas = canvasFromRGBA(S, S, rough);
  return {
    map: toTexture(canvasFromRGBA(S, S, col), true, repeat),
    normalMap: toTexture(canvasFromRGBA(S, S, normalFromHeight(height, S, S, normalStrength)), false, repeat),
    roughnessMap: toTexture(ROUGH_DIV > 1 ? shrinkCanvas(roughCanvas, ROUGH_DIV) : roughCanvas, false, repeat),
    normalScale,
    tint: null,
  };
}

function putRGB(arr, i, r, g, b) {
  arr[i] = r;
  arr[i + 1] = g;
  arr[i + 2] = b;
  arr[i + 3] = 255;
}

function putRough(arr, i, rough, metal = 0) {
  arr[i] = 255;
  arr[i + 1] = clamp01(rough) * 255;
  arr[i + 2] = metal * 255;
  arr[i + 3] = 255;
}

/* ------------------------------------------------------------------------------------------------
   Surface sets: ashlar stone (always procedural), wood and parquet (photo, with procedural fallbacks)
   ------------------------------------------------------------------------------------------------ */

/** Aged dark oak (fallback when the photo set is missing). Tile = 1.2 m. */
function genWood(S, seed) {
  const n = new TileNoise(seed);
  const col = new Uint8ClampedArray(S * S * 4);
  const rough = new Uint8ClampedArray(S * S * 4);
  const h = new Float32Array(S * S);
  for (let y = 0; y < S; y++) {
    const v = y / S;
    for (let x = 0; x < S; x++) {
      const u = x / S;
      const warp = n.fbm(u, v, 2, 1, 4);
      const ringCoord = u * 22 + warp * 5 + n.fbm(u, v, 8, 2, 3) * 0.9;
      const ring = ringCoord - Math.floor(ringCoord);
      const late = ring * ring * ring * ring;
      const fiber = n.fbm(u, v, 128, 2, 3);
      const poreDark = smooth(0.8, 0.96, n.at(u * 256, v * 12, 256, 12));
      const broad = n.fbm(u, v, 1, 2, 3);
      const t = clamp01(0.64 + 0.3 * (broad - 0.5) - 0.3 * late - 0.3 * (fiber - 0.5) - 0.12 * poreDark);
      const j = y * S + x;
      putRGB(col, j * 4, lerp(30, 122, t), lerp(18, 79, t), lerp(10, 46, t));
      putRough(rough, j * 4, 0.5 + 0.14 * late + 0.16 * poreDark + 0.12 * (0.5 - broad));
      h[j] = 0.55 - 0.14 * late - 0.08 * poreDark + 0.14 * fiber;
    }
  }
  return finishSet(S, col, h, rough, 1.6, 1 / 1.2, 0.9);
}

/** Castle ashlar: irregular courses, chipped arrises, recessed mortar, grime. Tile = 2.4 m. */
function genStone(S, seed) {
  const n = new TileNoise(seed);
  const r = rng(seed + 7);
  const TILE = 2.4;
  const ROWS = 7;
  const heights = [];
  let sum = 0;
  for (let k = 0; k < ROWS; k++) {
    const hh = 0.8 + r() * 0.5;
    heights.push(hh);
    sum += hh;
  }
  const rows = [];
  let acc = 0;
  for (let k = 0; k < ROWS; k++) {
    const rh = heights[k] / sum;
    const widths = [];
    let tot = 0;
    while (tot < 1) {
      const w = (0.34 + r() * 0.5) / TILE;
      widths.push(w);
      tot += w;
    }
    const bounds = [0];
    let a = 0;
    for (const w of widths) {
      a += w / tot;
      bounds.push(a);
    }
    bounds[bounds.length - 1] = 1;
    const tones = widths.map(() => ({ tone: 0.72 + r() * 0.42, warm: r() - 0.5, seed: r() * 120 }));
    rows.push({ start: acc, h: rh, off: r(), bounds, tones });
    acc += rh;
  }
  const rowOf = new Int16Array(S);
  for (let y = 0; y < S; y++) {
    const v = (y + 0.5) / S;
    let k = 0;
    while (k < ROWS - 1 && v >= rows[k + 1].start) k++;
    rowOf[y] = k;
  }
  const col = new Uint8ClampedArray(S * S * 4);
  const rough = new Uint8ClampedArray(S * S * 4);
  const h = new Float32Array(S * S);
  for (let y = 0; y < S; y++) {
    const v = y / S;
    const row = rows[rowOf[y]];
    const B = row.bounds;
    for (let x = 0; x < S; x++) {
      const u = x / S;
      let lu = u - row.off;
      lu -= Math.floor(lu);
      let b = 0;
      while (b < B.length - 2 && lu >= B[b + 1]) b++;
      const dxm = Math.min(lu - B[b], B[b + 1] - lu) * TILE;
      const dym = Math.min(v - row.start, row.start + row.h - v) * TILE;
      const chip = (n.fbm(u, v, 40, 40, 3) - 0.5) * 0.018;
      const edge = Math.min(dxm, dym) - 0.007 + chip;
      const fine = n.at(u * 256, v * 256, 256, 256);
      const grime = n.fbm(u, v, 3, 3, 4);
      const j = y * S + x;
      if (edge < 0) {
        const m = 0.8 + 0.25 * (fine - 0.5) + 0.25 * (grime - 0.5);
        putRGB(col, j * 4, 92 * m, 86 * m, 76 * m);
        putRough(rough, j * 4, 0.96);
        h[j] = 0.06 + 0.05 * fine;
      } else {
        const tn = row.tones[b];
        const pit = n.fbm(u, v, 20, 20, 5);
        const bevel = smooth(0, 0.024, edge);
        const undulate = n.free(u * 24 + tn.seed, v * 24 + tn.seed, 2);
        const shade = tn.tone * (0.86 + 0.34 * (pit - 0.5) + 0.12 * (fine - 0.5)) * (0.7 + 0.42 * grime) * (0.74 + 0.26 * bevel);
        putRGB(col, j * 4, (106 + 16 * tn.warm) * shade, (97 + 5 * tn.warm) * shade, (86 - 12 * tn.warm) * shade);
        putRough(rough, j * 4, 0.8 + 0.14 * (1 - pit) - 0.06 * bevel);
        h[j] = 0.3 + 0.45 * bevel + 0.25 * (pit - 0.5) + 0.1 * (undulate - 0.5);
      }
    }
  }
  return finishSet(S, col, h, rough, 2.6, 1 / 2.4, 1);
}

/** Basket-weave oak parquet (fallback when the photo set is missing). Tile = 1.2 m. */
function genParquet(S, seed) {
  const n = new TileNoise(seed);
  const r = rng(seed + 3);
  const CELLS = 4;
  const SLATS = 4;
  const cellM = 1.2 / CELLS;
  const slatM = cellM / SLATS;
  const slatRand = new Float32Array(CELLS * CELLS * SLATS * 3);
  for (let i = 0; i < slatRand.length; i++) slatRand[i] = r();
  const col = new Uint8ClampedArray(S * S * 4);
  const rough = new Uint8ClampedArray(S * S * 4);
  const h = new Float32Array(S * S);
  for (let y = 0; y < S; y++) {
    const v = y / S;
    for (let x = 0; x < S; x++) {
      const u = x / S;
      const cu = u * CELLS;
      const cv = v * CELLS;
      const ci = Math.floor(cu);
      const cj = Math.floor(cv);
      const horiz = ((ci + cj) & 1) === 0;
      const along = horiz ? cu - ci : cv - cj;
      const acrossF = (horiz ? cv - cj : cu - ci) * SLATS;
      const si = Math.floor(acrossF);
      const across = acrossF - si;
      const id = ((cj * CELLS + ci) * SLATS + si) * 3;
      const s0 = slatRand[id];
      const s1 = slatRand[id + 1];
      const s2 = slatRand[id + 2];
      const edge = Math.min(Math.min(across, 1 - across) * slatM, Math.min(along, 1 - along) * cellM);
      const j = y * S + x;
      if (edge < 0.0007) {
        putRGB(col, j * 4, 22, 14, 8);
        putRough(rough, j * 4, 0.92);
        h[j] = 0;
        continue;
      }
      const ga = along * cellM;
      const gc = across * slatM;
      const warp = n.free(ga * 6 + s0 * 40, gc * 2 + s1 * 40, 3);
      const ringC = gc * 90 + warp * 2.2 + s2 * 10;
      const ring = ringC - Math.floor(ringC);
      const late = ring * ring * ring * ring;
      const fiber = n.free(ga * 3 + s1 * 50, gc * 160 + s0 * 50, 2);
      const wear = n.fbm(u, v, 3, 3, 4);
      const tone = 0.78 + s0 * 0.36;
      const t = clamp01(tone * (0.7 - 0.24 * late - 0.26 * (fiber - 0.5)) + 0.1 * (wear - 0.5));
      putRGB(col, j * 4, lerp(46, 150, t), lerp(30, 99, t), lerp(16, 60, t));
      putRough(rough, j * 4, 0.3 + 0.12 * late + 0.3 * smooth(0.52, 0.8, wear) + 0.05 * fiber);
      h[j] = 0.4 + 0.6 * smooth(0, 0.0016, edge) - 0.08 * late + 0.05 * fiber;
    }
  }
  return finishSet(S, col, h, rough, 1.5, 1 / 1.2, 0.8);
}

/** Gold foil / brass micro-variation: roughness in G, metalness in B. */
function genMetalRough(S, seed) {
  const n = new TileNoise(seed);
  const r = rng(seed + 1);
  const data = new Uint8ClampedArray(S * S * 4);
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      const val = 0.26 + 0.22 * n.fbm(x / S, y / S, 8, 8, 4);
      putRough(data, (y * S + x) * 4, val, 1);
    }
  }
  const c = canvasFromRGBA(S, S, data);
  const ctx = c.getContext('2d');
  ctx.strokeStyle = 'rgba(255, 150, 255, 0.5)';
  ctx.lineWidth = 0.6;
  for (let k = 0; k < 60; k++) {
    const x = r() * S;
    const y = r() * S;
    const a = r() * Math.PI;
    const len = 6 + r() * 30;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len);
    ctx.stroke();
  }
  return toTexture(c, false, 1);
}

/** Hammered copper: dents in the normal map, oxidised grime in colour. */
function genCopper(S, seed) {
  const n = new TileNoise(seed);
  const r = rng(seed + 5);
  const h = new Float32Array(S * S);
  const col = new Uint8ClampedArray(S * S * 4);
  const rough = new Uint8ClampedArray(S * S * 4);
  const dents = [];
  for (let k = 0; k < 140; k++) dents.push([r(), r(), 0.02 + r() * 0.035]);
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      const u = x / S;
      const v = y / S;
      let d = 0;
      for (const [cx, cy, rad] of dents) {
        let dx = Math.abs(u - cx);
        let dy = Math.abs(v - cy);
        if (dx > 0.5) dx = 1 - dx;
        if (dy > 0.5) dy = 1 - dy;
        const q = (dx * dx + dy * dy) / (rad * rad);
        if (q < 1) d += (1 - q) * (1 - q);
      }
      const j = y * S + x;
      const g = n.fbm(u, v, 4, 4, 4);
      h[j] = -d * 0.5 + 0.1 * g;
      const ox = smooth(0.55, 0.8, g);
      putRGB(col, j * 4, lerp(206, 92, ox), lerp(120, 98, ox), lerp(80, 70, ox));
      putRough(rough, j * 4, 0.3 + 0.35 * ox, 1 - 0.6 * ox);
    }
  }
  const set = finishSet(S, col, h, rough, 3.0, 1, 1);
  return set;
}

/* ------------------------------------------------------------------------------------------------
   Painted canvas assets (decals, sprites, sky, glass, pages, signs, plates)
   ------------------------------------------------------------------------------------------------ */

function radialTexture(size, stops) {
  const c = makeCanvas(size, size);
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  for (const [o, colr] of stops) g.addColorStop(o, colr);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  return clampTex(toTexture(c, true));
}

/** White-on-black masks are used as alphaMap (green channel). */
function maskTexture(w, h, paint) {
  const c = makeCanvas(w, h);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, w, h);
  paint(ctx, w, h);
  return clampTex(toTexture(c, false));
}

function genSoftRect() {
  return maskTexture(256, 256, (ctx) => {
    ctx.filter = 'blur(22px)';
    ctx.fillStyle = '#fff';
    ctx.fillRect(46, 46, 164, 164);
    ctx.filter = 'none';
  });
}

function genRadialMask() {
  return maskTexture(128, 128, (ctx, w, h) => {
    const g = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(0.5, 'rgba(255,255,255,0.55)');
    g.addColorStop(1, 'rgba(255,255,255,0)');

}

function genAOGradient() {

    g.addColorStop(0.5, 'rgb(45,45,45)');

function genFlame() {

/** Four-point sparkle used for glints, path trails and the card emblem shine. */
function genSparkle() {
  const S = 64;
  const c = makeCanvas(S, S);
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.2, 'rgba(255,255,255,0.45)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, S, S);
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.beginPath();
  ctx.moveTo(S / 2, 2);
  ctx.quadraticCurveTo(S / 2 + 3, S / 2 - 3, S - 2, S / 2);
  ctx.quadraticCurveTo(S / 2 + 3, S / 2 + 3, S / 2, S - 2);
  ctx.quadraticCurveTo(S / 2 - 3, S / 2 + 3, 2, S / 2);
  ctx.quadraticCurveTo(S / 2 - 3, S / 2 - 3, S / 2, 2);
  ctx.fill();
  return clampTex(toTexture(c, true));
}

/** Vertical light pillar for Lumos: bright core fading up and to the sides. */
function genPillar() {

  ctx.fillRect(0, 0, 64, 256);
  ctx.globalCompositeOperation = 'destination-in';
  const gy = ctx.createLinearGradient(0, 0, 0, 256);

function genWaxGlow() {
  const c = makeCanvas(8, 128);

const BODY_FONT = (px, w = 600) => `${w} ${px}px "Source Sans 3", "Source Sans Pro", "Segoe UI", Arial, sans-serif`;

/** Splits a name into two balanced lines at a space (for long sign names). */
function splitTwoLines(text) {
  const words = text.split(' ');
  if (words.length < 2) return [text];
  let best = 1;
  let bestDiff = 1e9;
  for (let i = 1; i < words.length; i++) {
    const a = words.slice(0, i).join(' ');
    const b = words.slice(i).join(' ');
    const diff = Math.abs(a.length - b.length);
    if (diff < bestDiff) {
      bestDiff = diff;
      best = i;
    }
  }
  return [words.slice(0, best).join(' '), words.slice(best).join(' ')];
}

function giltGradient(ctx, y0, y1) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, '#fff2c6');
  g.addColorStop(0.42, '#e3c27c');
  g.addColorStop(0.56, '#9c7434');
  g.addColorStop(0.78, '#e3c27c');
  g.addColorStop(1, '#f6e4ae');
  return g;
}

/** Plate name atlas: 2048 × 1024, cells of 256 × 64 (8 × 16), white text on transparent (tinted per instance). */
const PLATE_ATLAS = { W: 2048, H: 1024, CW: 256, CH: 64, cols: 8, canvas: null, ctx: null, tex: null };
function genPlateAtlas() {
  const c = makeCanvas(PLATE_ATLAS.W, PLATE_ATLAS.H);
  PLATE_ATLAS.canvas = c;
  PLATE_ATLAS.ctx = c.getContext('2d');
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = maxAniso;
  t.generateMipmaps = true;
  t.minFilter = THREE.LinearMipmapLinearFilter;
  clampTex(t);
  PLATE_ATLAS.tex = t;
  return t;
}

/** Draws one plate cell; returns the UV offset/scale for the plate shader. Long names wrap onto two lines. */
function drawPlateCell(index, text) {
  const A = PLATE_ATLAS;
  const ctx = A.ctx;
  const x0 = (index % A.cols) * A.CW;
  const y0 = Math.floor(index / A.cols) * A.CH;
  ctx.clearRect(x0, y0, A.CW, A.CH);
  ctx.save();
  ctx.beginPath();
  ctx.rect(x0, y0, A.CW, A.CH);
  ctx.clip();
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const maxW = A.CW - 18;
  let size = 34;
  ctx.font = BODY_FONT(size, 700);
  let lines = [text];
  if (ctx.measureText(text).width > maxW && text.includes(' ')) {
    lines = splitTwoLines(text);
    size = 27;
    ctx.font = BODY_FONT(size, 700);
  }
  while (Math.max(...lines.map((l) => ctx.measureText(l).width)) > maxW && size > 14) {
    size -= 1;
    ctx.font = BODY_FONT(size, 700);
  }
  if (lines.length === 1) ctx.fillText(lines[0], x0 + A.CW / 2, y0 + A.CH / 2 + 2);
  else {
    ctx.fillText(lines[0], x0 + A.CW / 2, y0 + A.CH / 2 - size * 0.5 + 2);
    ctx.fillText(lines[1], x0 + A.CW / 2, y0 + A.CH / 2 + size * 0.55 + 2);
  }
  ctx.restore();
  if (A.tex) A.tex.needsUpdate = true;
  return [x0 / A.W, 1 - (y0 + A.CH) / A.H, A.CW / A.W, A.CH / A.H];
}

/** Plate state icons: 4 cells of 64 × 64 (✓, ■, ✕, blank), white on transparent. */
function genPlateIcons() {
  const c = makeCanvas(256, 64);
  const ctx = c.getContext('2d');
  ctx.strokeStyle = '#fff';
  ctx.fillStyle = '#fff';
  ctx.lineWidth = 9;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(14, 34);
  ctx.lineTo(27, 47);
  ctx.lineTo(50, 18);
  ctx.stroke();
  ctx.fillRect(64 + 16, 16, 32, 32);
  ctx.beginPath();
  ctx.moveTo(128 + 16, 16);
  ctx.lineTo(128 + 48, 48);
  ctx.moveTo(128 + 48, 16);
  ctx.lineTo(128 + 16, 48);
  ctx.stroke();
  return clampTex(toTexture(c, true));
}

/** House banners for the tower core: 4 cells of 256 × 512 (cloth, gilt border, gold house symbol, swallowtail). */
function genBannerAtlas(houses) {
  const W = 1024;
  const H = 512;
  const c = makeCanvas(W, H);
  const ctx = c.getContext('2d');
  houses.forEach((cat, i) => {
    const ox = i * 256;
    ctx.save();
    ctx.translate(ox, 0);
    ctx.beginPath();
    ctx.moveTo(12, 0);
    ctx.lineTo(244, 0);
    ctx.lineTo(244, 470);
    ctx.lineTo(128, 400);
    ctx.lineTo(12, 470);
    ctx.closePath();
    ctx.save();
    ctx.clip();
    ctx.fillStyle = cat.color;
    ctx.fillRect(0, 0, 256, 512);
    for (let k = 0; k < 9; k++) {
      const g = ctx.createLinearGradient(k * 28, 0, k * 28 + 28, 0);
      g.addColorStop(0, 'rgba(0,0,0,0.18)');
      g.addColorStop(0.5, 'rgba(255,255,255,0.08)');
      g.addColorStop(1, 'rgba(0,0,0,0.18)');
      ctx.fillStyle = g;
      ctx.fillRect(k * 28, 0, 28, 512);
    }
    ctx.restore();
    ctx.strokeStyle = '#d9b25c';
    ctx.lineWidth = 10;
    ctx.stroke();
    const light = cat.key === 'hufflepuff';
    try {
      drawCategorySymbol(ctx, cat.key, 48, 120, 160, { color: light ? '#3a2408' : '#f2cf7a', lineWidth: 10 });
    } catch (err) {
      console.warn('[world] banner symbol failed', err);
    }
    ctx.restore();
  });
  return clampTex(toTexture(c, true));
}

/** Chocolate Frog card (our own design, no text): purple-brown card, gilt border, gold frog emblem. */
function genCardTexture() {
  const W = 128;
  const H = 192;
  const c = makeCanvas(W, H);
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, '#4a2440');
  g.addColorStop(1, '#2a1424');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = giltGradient(ctx, 0, H);
  ctx.lineWidth = 8;
  ctx.strokeRect(6, 6, W - 12, H - 12);
  ctx.lineWidth = 2;
  ctx.strokeRect(16, 16, W - 32, H - 32);
  ctx.fillStyle = giltGradient(ctx, 60, 140);
  ctx.beginPath();
  ctx.ellipse(64, 104, 30, 22, 0, 0, Math.PI * 2);
  ctx.fill();
  for (const sx of [-1, 1]) {
    ctx.beginPath();
    ctx.arc(64 + sx * 16, 80, 9, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(64 + sx * 30, 124, 14, 7, sx * 0.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = '#2a1424';
  for (const sx of [-1, 1]) {
    ctx.beginPath();
    ctx.arc(64 + sx * 16, 79, 3.5, 0, Math.PI * 2);
    ctx.fill();
  }
  return clampTex(toTexture(c, true));
}

/* ------------------------------------------------------------------------------------------------
   Photo sets (CC0 Poly Haven): dark wood and diagonal parquet, with procedural fallbacks
   ------------------------------------------------------------------------------------------------ */

/**
 * Xbox preset (decided at boot): surface detail maps are generated or uploaded at half size, because Xbox Edge
 * tabs have a tight JS + GPU memory budget. Colour maps keep their full size.
 */
function lowMemTextures() {
  return IS_XBOX || SETTINGS.quality === 'xbox';
}

function preparePhoto(t, srgb, repeat, shrink = false) {
  if (shrink && t.image && t.image.width > 512) t.image = shrinkCanvas(t.image, 2);
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.wrapS = THREE.RepeatWrapping;
  t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = maxAniso;
  t.repeat.set(repeat, repeat);
  t.needsUpdate = true;
  photoTextures.push(t);
  return t;
}

/** Loads one photo set; resolves null on any failure (the caller generates the fallback). */
async function loadPhotoSet(base, repeat, normalScale, tint) {
  const loader = new THREE.TextureLoader();
  const parts = await Promise.allSettled([
    loader.loadAsync(`${TEX_PATH}${base}_diff_1k.jpg`),
    loader.loadAsync(`${TEX_PATH}${base}_nor_gl_1k.jpg`),
    loader.loadAsync(`${TEX_PATH}${base}_rough_1k.jpg`),
  ]);
  if (!parts.every((p) => p.status === 'fulfilled')) {
    for (const p of parts) if (p.status === 'fulfilled') p.value.dispose();
    return null;
  }
  return {
    map: preparePhoto(parts[0].value, true, repeat),
    normalMap: preparePhoto(parts[1].value, false, repeat, lowMemTextures()),
    roughnessMap: preparePhoto(parts[2].value, false, repeat, lowMemTextures()),
    normalScale,
    tint: tint === null ? null : new THREE.Color(tint),
    photo: true,
  };
}
