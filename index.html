/* ==== 52-abilities.js — Varázslatpult upgrades, the three spells (Lumos, Invito, Útjelző), the Szerencseüst deck ==== */

/* ------------------------------------------------------------------------------------------------
   Upgrades
   ------------------------------------------------------------------------------------------------ */

function upgradePrice(key) {
  return UPGRADES[key].prices[GAME.up[key]];
}

function upgradeMax(key) {
  return UPGRADES[key].prices.length;
}

/** Human-readable effect of an upgrade at a level (TXT.up[key].val), or "nincs" for level 0 of a locked one. */
function upgradeValueText(key, level) {
  const v = UPGRADES[key].values[level];
  const t = TXT.up[key];
  if (v === null || v === undefined || v === false) return TXT.lectNone;
  switch (key) {
    case 'capacity': return fmt(t.val, { n: stackCapacity(level) });
    case 'speed': return fmt(t.val, { a: fmtDec(v[0]), b: fmtDec(v[1]) });
    case 'reach': return fmt(t.val, { a: fmtDec(v[0]) });
    case 'throw': return fmt(t.val, { a: fmtDec(v * v / (2 * PHYS.g) * 1.9, 1) });
    case 'homing': return t.val;
    case 'lumos': return fmt(t.val, { a: v.dur });
    case 'invito': return fmt(t.val, { a: v.n, b: v.range >= 99 ? TXT.rangeAll : fmt(TXT.rangeNear, { n: v.range }) });
    case 'path': return fmt(t.val, { a: v.dur });
    case 'elves': return fmt(t.val, { a: v.n, b: v.every });
    default: return '';
  }
}

function spellCooldown(key, level = GAME.up[key]) {
  const v = UPGRADES[key].values[level];
  if (!v) return 0;
  return v.cd * Math.max(0.5, 1 - 0.1 * GAME.boons.cdCut);
}

function buyUpgrade(key) {
  const price = upgradePrice(key);
  if (price === undefined) return false;
  if (GAME.galleons < price) {
    toast(fmt(TXT.toastPoor, { n: price - GAME.galleons }), 'bad');
    sfx('deny');
    return false;
  }
  GAME.galleons -= price;
  GAME.up[key]++;
  const name = TXT.up[key].name;
  const first = GAME.up[key] === 1;
  toast(first ? fmt(TXT.toastLearned, { name }) : fmt(TXT.toastUpgraded, { name, n: GAME.up[key] }), 'gold');
  sfx('learn');
  if (key === 'elves' && first) tipOnce('tipElves');
  if (SPELL_KEYS.includes(key) && first) setTimeout(() => tipOnce('tipSpells'), 1200);
  UI_DIRTY.hud = true;
  UI_DIRTY.spells = true;
  UI_DIRTY.stack = true;
  markDirty();
  return true;
}

/* ------------------------------------------------------------------------------------------------
   Spells
   ------------------------------------------------------------------------------------------------ */
const LUMOS = { t: 0, list: [], pillars: null };
const PATH = { t: 0, pts: [], len: 0, points: null, pos: null, col: null, plate: -1 };
const INVITO = { queue: [], t: 0 };

function buildSpellFx() {
  LUMOS.pillars = new BillboardBatch(140, TEX.pillar, { additive: true, cylindrical: true, order: 6 });
  const n = 140;
  PATH.pos = new Float32Array(n * 3);
  PATH.col = new Float32Array(n * 3);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(PATH.pos, 3).setUsage(THREE.DynamicDrawUsage));
  g.setAttribute('color', new THREE.BufferAttribute(PATH.col, 3).setUsage(THREE.DynamicDrawUsage));
  PATH.points = new THREE.Points(g, new THREE.PointsMaterial({ size: 0.07, map: TEX.sparkle, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false }));
  PATH.points.frustumCulled = false;
  PATH.points.visible = false;
  scene.add(PATH.points);
}

/** The reference design for a spell: the top of the stack, else the aimed figurine. */
function spellReference() {
  const top = stackTop();
  if (top) return top;
  return AIM.fig || null;
}

function castSpell(key) {
  if (GAME.phase !== 'play') return;
  const lvl = GAME.up[key];
  const name = TXT[key === 'lumos' ? 'spellLumos' : key === 'invito' ? 'spellInvito' : 'spellPath'];
  if (!lvl) {
    toast(TXT.toastLocked);
    sfx('deny');
    return;
  }
  if (GAME.cd[key] > 0) {
    toast(fmt(TXT.toastCooling, { s: Math.ceil(GAME.cd[key]) }));
    return;
  }
  let ok = false;
  if (key === 'lumos') ok = castLumos(lvl);
  else if (key === 'invito') ok = castInvito(lvl);
  else ok = castPath(lvl);
  if (ok) {
    GAME.cd[key] = spellCooldown(key);
    GAME.stats.abilityUses++;
    UI_DIRTY.spells = true;
    markDirty();
  }
  void name;
}

function clearLumos() {
  for (const rec of LUMOS.list) {
    rec.glow = 0;
    KIT.setFx(rec.h, 0, rec.flash || 0);
  }
  LUMOS.list.length = 0;
  if (LUMOS.pillars) LUMOS.pillars.setCount(0);
}

function castLumos(lvl) {
  clearLumos();
  const cfg = UPGRADES.lumos.values[lvl];
  const ref = spellReference();
  const list = [];
  if (ref) {
    for (const rec of REC) {
      if (rec.actor || rec === ref) continue;
      if (rec.state !== ST.LOOSE && rec.state !== ST.WILD && rec.state !== ST.SHELF_WRONG) continue;
      if (cfg.whole ? (rec.cat === ref.cat && (rec.cat !== 'tower' || rec.id === ref.id)) : rec.id === ref.id) list.push(rec);
    }
    toast(TXT.toastLumos);
  } else {
    const loose = REC.filter((r) => !r.actor && (r.state === ST.LOOSE || r.state === ST.WILD));
    loose.sort((a, b) => a.pickC.distanceToSquared(camera.position) - b.pickC.distanceToSquared(camera.position));
    list.push(...loose.slice(0, 8));
    for (const r of loose) if (r.spot && r.pickC.distanceTo(camera.position) < 10 && !list.includes(r)) list.push(r);
    toast(TXT.toastLumosEmpty);
  }
  LUMOS.t = cfg.dur * (GAME.boons.lumosLong ? 1.5 : 1);
  const catColor = ref && cfg.whole && ref.catIdx >= 0 ? new THREE.Color(FIG_CATEGORIES[ref.catIdx].color) : null;
  for (const rec of list.slice(0, 140)) {
    rec.glow = 1;
    KIT.setFx(rec.h, 1, rec.flash || 0);
    LUMOS.list.push(rec);
    const c = catColor || tc1.setRGB(1.0, 0.86, 0.55);
    LUMOS.pillars.add(rec.pos.x, rec.groundY, rec.pos.z, 0.09, 2.6, c.r * 0.55, c.g * 0.55, c.b * 0.55, 1);
  }
  sfx('lumos');
  return true;
}

function castInvito(lvl) {
  const cfg = UPGRADES.invito.values[lvl];
  const ref = spellReference();
  const eye = camera.position;
  const extra = [];
  if (SNITCH.state !== 'off' && SNITCH.pos.distanceTo(eye) < 6) extra.push('snitch');
  for (const rec of REC) {
    if (rec.state === ST.WILD && rec.wild && rec.wild.kind === 'scurrier' && rec.wild.mode !== 'dig' && rec.pickC.distanceTo(eye) < 6) extra.push(rec);
  }
  if (!ref && !extra.length) {
    toast(TXT.toastInvitoEmpty);
    return false;
  }
  const list = [];
  if (ref) {
    for (const rec of REC) {
      if (rec === ref || rec.actor || rec.id !== ref.id) continue;
      if (rec.state !== ST.LOOSE && rec.state !== ST.SHELF_WRONG && rec.state !== ST.WILD) continue;
      if (rec.state === ST.WILD && rec.wild && rec.wild.mode === 'dig') continue;
      if (rec.pickC.distanceTo(eye) > cfg.range) continue;
      list.push(rec);
    }
    // Uncovered figurines first (pulling one out from under others makes those settle down).
    list.sort((a, b) => a.pickC.distanceToSquared(eye) + (isCovered(a) ? 100 : 0) - b.pickC.distanceToSquared(eye) - (isCovered(b) ? 100 : 0));
    list.length = Math.min(list.length, cfg.n);
  }
  for (const e of extra) if (e !== 'snitch' && !list.includes(e)) list.push(e);
  const caught = extra.includes('snitch') ? catchSnitch() : false;
  if (!list.length) {
    if (!extra.length) toast(TXT.toastInvitoNone);
    // The cooldown is only spent when something really happened (full hands leave the Snitch flying).
    return caught;
  }
  toast(TXT.toastInvito);
  sfx('invito');
  INVITO.queue.push(...list);
  INVITO.t = 0;
  return true;
}

function updateInvito(dt) {
  if (!INVITO.queue.length) return;
  INVITO.t -= dt;
  if (INVITO.t > 0) return;
  INVITO.t = 0.15;
  const rec = INVITO.queue.shift();
  if (!rec || (rec.state !== ST.LOOSE && rec.state !== ST.SHELF_WRONG && rec.state !== ST.WILD)) return;
  if (rec.slot) unseat(rec);
  if (rec.state === ST.WILD) {
    rec.wild = null;
    pay(BONUS.niffler, true);
    toast(fmt(TXT.toastNiffler, { n: BONUS.niffler }), 'gold');
  }
  if (rec.spot) {
    rec.spot = false;
    toast(fmt(TXT.toastHidden, { name: rec.d.nameHu }), 'gold');
  }
  leavePile(rec);
  const feet = vec3(PLAYER.pos.x - Math.sin(PLAYER.yaw) * 0.5, 0, PLAYER.pos.z - Math.cos(PLAYER.yaw) * 0.5);
  tv1.set(STACK_VIEW.x, STACK_VIEW.y, STACK_VIEW.z).applyMatrix4(camera.matrixWorld);
  startScript(rec, tv1.x, tv1.y, tv1.z, PLAYER.yaw, 1.2, 'stack', { feet });
  puff(rec.pickC.x, rec.pickC.y, rec.pickC.z, 0.2, [1.0, 0.9, 0.6], 6);
}

/** Útjelző: a trail of gold sparkles from the player to the target (around the tower, through the doorway). */
function castPath(lvl) {
  const cfg = UPGRADES.path.values[lvl];
  const top = stackTop();
  let target = null;
  let plate = -1;
  if (top) {
    const slot = slotFor(top);
    if (slot) {
      target = slot.kind === 'unit' ? WORLD.units[slot.unit].front.clone().lerp(slot.center, 0.55) : slot.center.clone();
      target.y = slot.center.y;
      plate = slot.plate;
    }
    toast(TXT.toastPath);
  }
  if (!target) {
    let best = null;
    let bd = 1e9;
    for (const rec of REC) {
      if (rec.actor || (rec.state !== ST.LOOSE && rec.state !== ST.WILD)) continue;
      const d = rec.pickC.distanceToSquared(camera.position);
      if (d < bd && d > 0.5) {
        bd = d;
        best = rec;
      }
    }
    if (!best) return false;
    target = best.pickC.clone();
    toast(TXT.toastPathEmpty);
  }
  const pts = [vec3(PLAYER.pos.x, 0.9, PLAYER.pos.z)];
  const start = pts[0];
  const inShop = (p) => p.z < -6.2;
  if (inShop(start) !== inShop(target)) pts.push(vec3(5.0, 1.0, -5.6), vec3(5.0, 1.0, -6.8));
  const last = pts[pts.length - 1];
  // Detour around the tower when the straight line passes through it.
  const ax = last.x;
  const az = last.z;
  const bx = target.x;
  const bz = target.z;
  const dx = bx - ax;
  const dz = bz - az;
  const L2 = dx * dx + dz * dz || 1;
  const u = clamp01(((TOWER.x - ax) * dx + (TOWER.z - az) * dz) / L2);
  const cx = ax + dx * u;
  const cz = az + dz * u;
  const dist = Math.hypot(cx - TOWER.x, cz - TOWER.z);
  if (dist < 1.25 && u > 0.05 && u < 0.95) {
    const nx = (cx - TOWER.x) / (dist || 1) || 1;
    const nz = (cz - TOWER.z) / (dist || 1);
    pts.push(vec3(TOWER.x + nx * 1.45, 1.0, TOWER.z + nz * 1.45));
  }
  pts.push(target.clone());
  PATH.pts = pts;
  PATH.len = 0;
  for (let i = 1; i < pts.length; i++) PATH.len += pts[i].distanceTo(pts[i - 1]);
  PATH.t = cfg.dur;
  PATH.points.visible = true;
  if (plate >= 0) pulsePlate(plate, cfg.dur);
  sfx('path');
  return true;
}

function pathPoint(d, out) {
  let acc = 0;
  const pts = PATH.pts;
  for (let i = 1; i < pts.length; i++) {
    const seg = pts[i].distanceTo(pts[i - 1]);
    if (acc + seg >= d || i === pts.length - 1) {
      const k = seg > 0 ? clamp01((d - acc) / seg) : 0;
      return out.lerpVectors(pts[i - 1], pts[i], k);
    }
    acc += seg;
  }
  return out.copy(pts[pts.length - 1]);
}

function updateSpells(dt, t) {
  for (const k of SPELL_KEYS) {
    if (GAME.cd[k] > 0) {
      const before = GAME.cd[k];
      GAME.cd[k] = Math.max(0, GAME.cd[k] - dt);
      if (GAME.cd[k] === 0 && before > 0) {
        sfx('ready');
        UI_DIRTY.spellPing = k;
      }
    }
  }
  if (LUMOS.t > 0) {
    LUMOS.t -= dt;
    for (let i = 0; i < LUMOS.list.length; i++) {
      const rec = LUMOS.list[i];
      const visible = rec.state === ST.LOOSE || rec.state === ST.WILD || rec.state === ST.SHELF_WRONG;
      const k = visible ? Math.min(1, LUMOS.t / 1.2) : 0;
      LUMOS.pillars.setCenter(i, rec.pickC.x, rec.groundY, rec.pickC.z);
      LUMOS.pillars.setSize(i, 0.09 * k, 2.6 * k);
      if (!visible && rec.glow) {
        rec.glow = 0;
        KIT.setFx(rec.h, 0, rec.flash || 0);
      }
    }
    LUMOS.pillars.commit();
    if (LUMOS.t <= 0) clearLumos();
  }
  if (PATH.t > 0) {
    PATH.t -= dt;
    const n = PATH.pos.length / 3;
    const fade = Math.min(1, PATH.t / 1.0);
    for (let i = 0; i < n; i++) {
      const d = ((i / n) * PATH.len + t * 1.6) % Math.max(0.01, PATH.len);
      pathPoint(d, tv1);
      PATH.pos[i * 3] = tv1.x + Math.sin(i * 12.9 + t * 3) * 0.04;
      PATH.pos[i * 3 + 1] = tv1.y + Math.sin(i * 7.1 + t * 4) * 0.05;
      PATH.pos[i * 3 + 2] = tv1.z + Math.cos(i * 5.3 + t * 3) * 0.04;
      const tw = (0.5 + 0.5 * Math.sin(i * 3.7 + t * 8)) * fade;
      PATH.col[i * 3] = 1.0 * tw;
      PATH.col[i * 3 + 1] = 0.82 * tw;
      PATH.col[i * 3 + 2] = 0.45 * tw;
    }
    PATH.points.geometry.attributes.position.needsUpdate = true;
    PATH.points.geometry.attributes.color.needsUpdate = true;
    if (PATH.t <= 0) PATH.points.visible = false;
  }
}

/* ------------------------------------------------------------------------------------------------
   Szerencseüst: a finite deck of 12 cards, the first is always "Pehelykönnyű kupac"
   ------------------------------------------------------------------------------------------------ */

function newDeck(seed) {
  const rest = [];
  for (let i = 1; i < DECK.length; i++) rest.push(i);
  shuffleInPlace(rest, rng(seed ^ 0x5bd1e995));
  return [0, ...rest];
}

/** Draws the next card; returns the boon key that was applied, or null. */
function tossCauldron() {
  if (GAME.deckPos >= DECK.length) {
    toast(TXT.cauldronEmpty);
    return null;
  }
  if (GAME.galleons < CAULDRON_PRICE) {
    toast(fmt(TXT.toastPoor, { n: CAULDRON_PRICE - GAME.galleons }), 'bad');
    sfx('deny');
    return null;
  }
  GAME.galleons -= CAULDRON_PRICE;
  const id = GAME.deck[GAME.deckPos++];
  let key = DECK[id];
  if (key === 'peeves' && !SETTINGS.bombs) key = 'smallLuck';
  applyBoon(key);
  sfx('splashSmall');
  puff(CAULDRON.x, 0.8, CAULDRON.z, 0.5, hexRgb(BOON_COLORS[key] || '#e3c27c'), 18);
  UI_DIRTY.hud = true;
  markDirty();
  return key;
}

function hexRgb(hex) {
  const c = new THREE.Color(hex);
  return [c.r * 1.4, c.g * 1.4, c.b * 1.4];
}

function applyBoon(key) {
  const B = GAME.boons;
  switch (key) {
    case 'capacityPlus': B.capacityPlus = Math.min(3, B.capacityPlus + 1); UI_DIRTY.stack = true; break;
    case 'cdCut': B.cdCut = Math.min(2, B.cdCut + 1); break;
    case 'lumosLong': B.lumosLong = true; break;
    case 'throwPlus': B.throwPlus = true; break;
    case 'rain': pay(BONUS.rain, true); break;
    case 'goldDust': B.goldDustUntil = GAME.playS + GOLD_DUST_SECONDS; break;
    case 'nifflerLure': B.nifflerLure = true; break;
    case 'candleBonus': B.candleBonus = true; break;
    case 'peeves': setTimeout(() => startWaterBomb(), 900); break;
    case 'smallLuck': pay(BONUS.smallLuck, true); break;
    default: break;
  }
}

/* ---- 53-finale.js ---- */
/* ==== 53-finale.js — the closing fly-through, the twins' letter and the Bűvös öntőforma casting gag ==== */

const FINALE = { active: false, t: 0, dur: 22, pos: null, look: null, tmpP: new THREE.Vector3(), tmpL: new THREE.Vector3() };

function startFinale() {
  if (FINALE.active) return;
  saveNow('finale');
  FINALE.active = true;
  FINALE.t = 0;
  FINALE.pos = new THREE.CatmullRomCurve3(FINALE_PATH.map((p) => vec3(p[0], p[1], p[2])), false, 'centripetal');
  FINALE.look = new THREE.CatmullRomCurve3(FINALE_PATH.map((p) => vec3(p[3], p[4], p[5])), false, 'centripetal');
  GAME.phase = 'finale';
  for (const key in WORLD.units) celebrateShelf(key, false);
  uBannerGlow.value = 0.45;
  musicSwell();
  closeAllMenus();
  showSkip(true);
  UI_DIRTY.hud = true;
}

function updateFinale(dt) {
  if (!FINALE.active) return;
  FINALE.t += dt;
  const u = clamp01(FINALE.t / FINALE.dur);
  const e = u * u * (3 - 2 * u);
  FINALE.pos.getPoint(e, FINALE.tmpP);
  FINALE.look.getPoint(Math.min(1, e + 0.02), FINALE.tmpL);
  camera.position.copy(FINALE.tmpP);
  tm1.lookAt(FINALE.tmpP, FINALE.tmpL, UP_AXIS);
  camera.quaternion.setFromRotationMatrix(tm1);
  camera.updateMatrixWorld();
  if (IN.pressed.confirm || IN.pressed.back || IN.pressed.pause || IN.pressed.interact) {
    IN.consume('confirm');
    IN.consume('back');
    IN.consume('pause');
    IN.consume('interact');
    FINALE.t = FINALE.dur;
  }
  if (FINALE.t >= FINALE.dur) endFinale();
}

function endFinale() {
  FINALE.active = false;
  showSkip(false);
  GAME.flags.finaleDone = true;
  GAME.phase = 'play';
  applyCamera();
  // Persist the finished finale right away: the letter can also be closed by closeAllMenus() (pause on a
  // hidden tab), which skips onClose, and a save with finaleDone=false would never replay the finale.
  markDirty();
  saveNow('finale-end');
  openMenu('letter', {
    text: TXT.letterEnd, title: TXT.letterTitle,
    onClose: () => {
      toast(TXT.toastMouldHint, 'gold');
    },
  });
}

/* ------------------------------------------------------------------------------------------------
   Bűvös öntőforma: 250 copies of the figurine on the mould plate rain from the funnel
   ------------------------------------------------------------------------------------------------ */
const CASTING = {
  active: false, count: 0, inst: null, designId: null, t: 0, spawned: 0, flying: 0,
  pos: null, vel: null, quat: [], state: null, spin: null, leverT: 0, flash: 0, scale: 1,
};

function castToast(designId) {
  if (designId === 'shopkeeper') return TXT.toastCastShopkeeper;
  if (designId === 'peeves') return TXT.toastCastPeeves;
  if (designId === 'golden_snitch') return TXT.toastCastSnitch;
  return TXT.toastCast;
}

function useMould() {
  if (!GAME.flags.finaleDone) {
    toast(TXT.mouldSleeping);
    return;
  }
  if (CASTING.active || CASTING.count > 0) {
    sweepClones();
    toast(TXT.toastSwept);
    GAME.flags.mouldCast = null;
    markDirty();
    return;
  }
  const top = stackTop();
  if (!top) {
    toast(TXT.mouldNeedFigure);
    return;
  }
  popStack();
  flyToFloor(top, MOULD.x, MOULD.top + 0.02, MOULD.z, 0, 0.3);
  setTimeout(() => startCasting(top.id, top.scale, true), 450);
}

function sweepClones() {
  if (CASTING.inst) {
    CASTING.inst.dispose();
    CASTING.inst = null;
  }
  CASTING.active = false;
  CASTING.count = 0;
}

function startCasting(designId, scale, animate) {
  sweepClones();
  try {
    CASTING.inst = createFigureInstancer(scene, designId, MAX_CLONES, { withBase: true });
  } catch (err) {
    console.warn('[finale] casting instancer failed', err);
    return;
  }
  for (const m of CASTING.inst.meshes) m.frustumCulled = false;
  CASTING.designId = designId;
  CASTING.scale = scale || 1;
  CASTING.pos = new Float32Array(MAX_CLONES * 3);
  CASTING.vel = new Float32Array(MAX_CLONES * 3);
  CASTING.state = new Uint8Array(MAX_CLONES);
  CASTING.spin = new Float32Array(MAX_CLONES);
  CASTING.quat = Array.from({ length: MAX_CLONES }, () => new THREE.Quaternion());
  CASTING.t = 0;
  CASTING.spawned = 0;
  CASTING.flying = 0;
  CASTING.active = true;
  CASTING.leverT = animate ? 1 : 0;
  GAME.flags.mouldCast = designId;
  if (!animate) {
    for (let i = 0; i < MAX_CLONES; i++) settleClone(i, true);
    CASTING.spawned = MAX_CLONES;
    CASTING.count = MAX_CLONES;
    CASTING.inst.count = MAX_CLONES;
    for (let i = 0; i < MAX_CLONES; i++) writeClone(i);
    CASTING.inst.commit();
    CASTING.active = false;
    return;
  }
  sfx('lever');
  setTimeout(() => {
    CASTING.flash = 1;
    sfx('fanfare');
    puff(MOULD.x, 1.9, MOULD.z, 0.8, [1.0, 0.9, 0.6], 20);
  }, 500);
  toast(castToast(designId), 'gold');
  markDirty();
}

function settleClone(i, instant) {
  const p = CASTING.pos;
  let x = p[i * 3];
  let z = p[i * 3 + 2];
  if (instant) {
    const a = Math.random() * Math.PI * 2;
    const r = Math.sqrt(Math.random()) * 1.6;
    x = clampTo(MOULD.x - 0.6 + Math.cos(a) * r * 1.3, SHOP_WORKSHOP.minX + 0.15, SHOP_WORKSHOP.maxX - 0.15);
    z = clampTo(MOULD.z + 1.0 + Math.sin(a) * r, SHOP_WORKSHOP.minZ + 0.15, -5.2);
  }
  const lying = Math.random() < 0.6;
  const id = CASTING.designId;
  // A clone on its side rests on its radius (the pose origin is the base centre), so it does not sink into the floor.
  const lift = lying && FIG_BY_ID[id] ? getFigureMetrics(id).radius * CASTING.scale * 0.92 : 0;
  const y = 0.02 + Math.random() * 0.12 * FIG_SCALE + lift;
  p[i * 3] = x;
  p[i * 3 + 1] = y;
  p[i * 3 + 2] = z;
  const q = CASTING.quat[i];
  tq1.setFromAxisAngle(UP_AXIS, Math.random() * Math.PI * 2);
  if (lying) q.multiplyQuaternions(tq1, tq2.setFromAxisAngle(X_AXIS, Math.PI / 2));
  else q.copy(tq1);
  CASTING.state[i] = 2;
}

function writeClone(i) {
  const p = CASTING.pos;
  tm1.compose(tv1.set(p[i * 3], p[i * 3 + 1], p[i * 3 + 2]), CASTING.quat[i], tv2.setScalar(CASTING.scale));
  CASTING.inst.setInstance(i, tm1);
}

function updateCasting(dt) {
  if (PROPS.lever) {
    if (CASTING.leverT > 0) CASTING.leverT = Math.max(0, CASTING.leverT - dt * 1.2);
    PROPS.lever.rotation.z = -0.35 + Math.sin((1 - CASTING.leverT) * Math.PI) * 0.9 * (CASTING.leverT > 0 ? 1 : 0);
  }
  if (!CASTING.active || !CASTING.inst) return;
  CASTING.t += dt;
  const want = Math.min(MAX_CLONES, Math.floor(Math.max(0, CASTING.t - 0.6) / 3 * MAX_CLONES));
  const p = CASTING.pos;
  const v = CASTING.vel;
  while (CASTING.spawned < want && CASTING.flying < PHYS.maxSim) {
    const i = CASTING.spawned++;
    p[i * 3] = MOULD.x + (Math.random() - 0.5) * 0.1;
    p[i * 3 + 1] = 1.6;
    p[i * 3 + 2] = MOULD.z + (Math.random() - 0.5) * 0.1;
    const a = Math.random() * Math.PI * 2;
    const sp = 0.6 + Math.random() * 1.8;
    v[i * 3] = Math.cos(a) * sp - 0.3;
    v[i * 3 + 1] = 0.5 + Math.random();
    v[i * 3 + 2] = Math.sin(a) * sp + 0.8;
    CASTING.state[i] = 1;
    CASTING.spin[i] = (Math.random() - 0.5) * 12;
    CASTING.flying++;
  }
  CASTING.inst.count = CASTING.spawned;
  CASTING.count = CASTING.spawned;
  for (let i = 0; i < CASTING.spawned; i++) {
    if (CASTING.state[i] !== 1) continue;
    v[i * 3 + 1] -= PHYS.g * dt;
    p[i * 3] += v[i * 3] * dt;
    p[i * 3 + 1] += v[i * 3 + 1] * dt;
    p[i * 3 + 2] += v[i * 3 + 2] * dt;
    const x = p[i * 3];
    const z = p[i * 3 + 2];
    const inShop = x > SHOP_WORKSHOP.minX + 0.08 && x < SHOP_WORKSHOP.maxX - 0.08 && z > SHOP_WORKSHOP.minZ + 0.08;
    const throughDoor = x > SHOP_DOORWAY.minX + 0.05 && x < SHOP_DOORWAY.maxX - 0.05;
    if (!inShop || (z > -6.45 && !throughDoor) || z > -3.8) {
      p[i * 3] -= v[i * 3] * dt;
      p[i * 3 + 2] -= v[i * 3 + 2] * dt;
      v[i * 3] *= -0.4;
      v[i * 3 + 2] *= -0.4;
    }
    if (Math.hypot(p[i * 3] - MOULD.x, p[i * 3 + 2] - MOULD.z) < 0.5 && p[i * 3 + 1] < MOULD.top) {
      v[i * 3] += (p[i * 3] - MOULD.x) * 2;
      v[i * 3 + 2] += (p[i * 3 + 2] - MOULD.z) * 2;
    }
    if (p[i * 3 + 1] < 0.04) {
      p[i * 3 + 1] = 0.04;
      v[i * 3 + 1] = -v[i * 3 + 1] * 0.3;
      v[i * 3] *= 0.6;
      v[i * 3 + 2] *= 0.6;
      if (Math.abs(v[i * 3 + 1]) < 0.4 && Math.hypot(v[i * 3], v[i * 3 + 2]) < 0.3) {
        settleClone(i, false);
        CASTING.flying--;
      }
    }
    if (CASTING.state[i] === 1) CASTING.quat[i].multiply(tq1.setFromAxisAngle(X_AXIS, CASTING.spin[i] * dt));
    writeClone(i);
  }
  CASTING.inst.commit();
  if (CASTING.spawned >= MAX_CLONES && CASTING.flying <= 0) CASTING.active = false;
}

/* ---- 54-player.js ---- */
/* ==== 54-player.js — first-person movement, collisions, camera, aim assist and targeting (no Raycaster) ==== */

const PLAYER = {
  pos: new THREE.Vector3(START_POSE.x, 0, START_POSE.z), yaw: START_POSE.yaw, pitch: START_POSE.pitch,
  vx: 0, vz: 0, run: false, lift: 0, bobT: 0, stepAcc: 0, speed: 0,
};

const AIM = {
  fig: null, card: -1, snitch: false, slot: null, floor: null, floorV: new THREE.Vector3(), inter: null,
  dir: new THREE.Vector3(), lastFig: null, lastSlot: null, lastCard: -1, lastInter: null, lastSnitch: false,
};

/* ------------------------------------------------------------------------------------------------
   Movement and collisions (circle against boxes and circles, from the demo)
   ------------------------------------------------------------------------------------------------ */

function resolvePlayer(p) {
  const R = PLAYER_R;
  p.x = clampTo(p.x, HALL.minX + R, HALL.maxX - R);
  p.z = clampTo(p.z, SHOP_WORKSHOP.minZ + R, HALL.maxZ - R);
  for (let pass = 0; pass < 2; pass++) {
    for (let i = 0; i < WORLD.colliders.length; i++) {
      const o = WORLD.colliders[i];
      if (o.type === 'ellipse') {
        // Offset ellipse (radii grown by the player radius): push out along the scaled direction.
        const ex = o.rx + R;
        const ez = o.rz + R;
        const nx = (p.x - o.x) / ex;
        const nz = (p.z - o.z) / ez;
        const d = Math.hypot(nx, nz);
        if (d >= 1) continue;
        const k = d > 1e-4 ? 1 / d : 1;
        p.x = o.x + (d > 1e-4 ? nx : 1) * k * ex;
        p.z = o.z + (d > 1e-4 ? nz : 0) * k * ez;
        continue;
      }
      if (o.type === 'circle') {
        const dx = p.x - o.x;
        const dz = p.z - o.z;
        const d2 = dx * dx + dz * dz;
        const rr = o.r + R;
        if (d2 >= rr * rr) continue;
        const d = Math.sqrt(d2) || 1e-4;
        p.x = o.x + (dx / d) * rr;
        p.z = o.z + (dz / d) * rr;
        continue;
      }
      const cx = Math.max(o.minX, Math.min(o.maxX, p.x));
      const cz = Math.max(o.minZ, Math.min(o.maxZ, p.z));
      const dx = p.x - cx;
      const dz = p.z - cz;
      const d2 = dx * dx + dz * dz;
      if (d2 >= R * R) continue;
      if (d2 > 1e-8) {
        const d = Math.sqrt(d2);
        p.x = cx + (dx / d) * R;
        p.z = cz + (dz / d) * R;
      } else {
        const l = p.x - o.minX;
        const r = o.maxX - p.x;
        const b = p.z - o.minZ;
        const f = o.maxZ - p.z;
        const m = Math.min(l, r, b, f);
        if (m === l) p.x = o.minX - R;
        else if (m === r) p.x = o.maxX + R;
        else if (m === b) p.z = o.minZ - R;
        else p.z = o.maxZ + R;
      }
    }
  }
}

function moveSpeeds() {
  const v = UPGRADES.speed.values[GAME.up.speed];
  return { walk: v[0], run: v[1] };
}

/* ------------------------------------------------------------------------------------------------
   Hold-to-zoom (binocular): Z, the middle mouse button or the right stick held in narrows the view smoothly
   ------------------------------------------------------------------------------------------------ */
const ZOOM = { k: 0 };

function updateZoom(dt, allow) {
  const want = allow && IN.held.zoom;
  const was = ZOOM.k > 0;
  ZOOM.k = clamp01(ZOOM.k + ((want ? 1 : -1) * dt) / ZOOM_TUNE.easeS);
  if (was !== ZOOM.k > 0) UI_DIRTY.prompts = true;
  if (want && !GAME.tipsShown.has('tipZoom')) GAME.tipsShown.add('tipZoom');
  else if (allow && GAME.playS > 45) tipOnce('tipZoom');
}

/** Current vertical field of view: the setting, narrowed towards the zoom angle while zooming. */
function viewFov() {
  return ZOOM.k > 0 ? lerp(SETTINGS.fov, SETTINGS.zoomFov, easeInOut(ZOOM.k)) : SETTINGS.fov;
}

/** Look speed factor while zoomed: follows the narrower view, so the aim stays as precise as without zoom. */
function zoomLookK() {
  if (ZOOM.k <= 0) return 1;
  return Math.tan((viewFov() * DEG) / 2) / Math.tan((SETTINGS.fov * DEG) / 2);
}

/** Applies look input with gamepad look friction and gentle magnetism towards the current target. */
function applyLook(dt) {
  const zk = zoomLookK();
  let lx = IN.look.x * zk;
  let ly = IN.look.y * zk;
  if (IN.device === 'pad' && (lx !== 0 || ly !== 0)) {
    const a = ASSIST[SETTINGS.assist] || ASSIST[1];
    const target = AIM.fig ? AIM.fig.pickC : AIM.slot ? AIM.slot.center : null;
    if (target) {
      lx *= a.friction;
      ly *= a.friction;
      if (a.magnet > 0) {
        tv1.subVectors(target, camera.position);
        const wantYaw = Math.atan2(-tv1.x, -tv1.z);
        let dyaw = wantYaw - PLAYER.yaw;
        while (dyaw > Math.PI) dyaw -= Math.PI * 2;
        while (dyaw < -Math.PI) dyaw += Math.PI * 2;
        const wantPitch = Math.atan2(tv1.y, Math.hypot(tv1.x, tv1.z));
        const dpitch = wantPitch - PLAYER.pitch;
        // The look delta is subtracted from yaw/pitch, so turning towards the target means -lx has the sign of dyaw;
        // only then a small extra turn towards the target is added (never a snap).
        if (-lx * dyaw > 0) lx -= a.magnet * Math.sign(dyaw) * Math.min(Math.abs(lx), Math.abs(dyaw));
        if (-ly * dpitch > 0) ly -= a.magnet * Math.sign(dpitch) * Math.min(Math.abs(ly), Math.abs(dpitch));
      }
    }
  }
  PLAYER.yaw -= lx;
  PLAYER.pitch = clampTo(PLAYER.pitch - ly, -80 * DEG, 80 * DEG);
}

function updatePlayer(dt, allowMove) {
  updateZoom(dt, allowMove);
  if (allowMove) applyLook(dt);
  const sp = moveSpeeds();
  if (allowMove && IN.pressed.runToggle) PLAYER.run = !PLAYER.run;
  const mx = allowMove ? IN.move.x : 0;
  const my = allowMove ? IN.move.y : 0;
  const mag = Math.min(1, Math.hypot(mx, my));
  const speed = (PLAYER.run ? sp.run : sp.walk);
  const s = Math.sin(PLAYER.yaw);
  const c = Math.cos(PLAYER.yaw);
  const tx = (mx * c - my * s) * speed;
  const tz = (-mx * s - my * c) * speed;
  const k = Math.min(1, dt / 0.12);
  PLAYER.vx += (tx - PLAYER.vx) * k;
  PLAYER.vz += (tz - PLAYER.vz) * k;
  const ox = PLAYER.pos.x;
  const oz = PLAYER.pos.z;
  PLAYER.pos.x += PLAYER.vx * dt;
  PLAYER.pos.z += PLAYER.vz * dt;
  resolvePlayer(PLAYER.pos);
  const moved = Math.hypot(PLAYER.pos.x - ox, PLAYER.pos.z - oz);
  PLAYER.speed += (mag - PLAYER.speed) * Math.min(1, dt * 6);
  const liftTarget = Math.min(0.25, heapHeightAt(PLAYER.pos.x, PLAYER.pos.z));
  PLAYER.lift += (liftTarget - PLAYER.lift) * Math.min(1, dt / 0.2);
  PLAYER.stepAcc += moved;
  if (PLAYER.stepAcc > 0.55) {
    PLAYER.stepAcc = 0;
    if (SETTINGS.ambient) sfx('step');
  }
  PLAYER.bobT += moved * 7;
}

function applyCamera() {
  const bob = SETTINGS.bob ? Math.sin(PLAYER.bobT) * 0.012 * PLAYER.speed : 0;
  camera.position.set(PLAYER.pos.x, EYE_H + PLAYER.lift + bob, PLAYER.pos.z);
  te1.set(PLAYER.pitch, PLAYER.yaw, 0, 'YXZ');
  camera.quaternion.setFromEuler(te1);
  const fov = viewFov();
  if (camera.fov !== fov) {
    camera.fov = fov;
    camera.updateProjectionMatrix();
    // Magnified figures keep their detail: the LOD distances grow with the zoom.
    if (kit && kit.setLodZoom) kit.setLodZoom(1 / zoomLookK());
  }
  camera.updateMatrixWorld();
}

/* ------------------------------------------------------------------------------------------------
   Targeting (DESIGN.md 16.14): figurines from the spatial hash, cards, the Snitch, slots, floor, interactables
   ------------------------------------------------------------------------------------------------ */
const SLOT_L_O = new THREE.Vector3();
const SLOT_L_D = new THREE.Vector3();

function reachNow() {
  const v = UPGRADES.reach.values[GAME.up.reach];
  return { reach: v[0], cone: v[1] * DEG * (ASSIST[SETTINGS.assist] || ASSIST[1]).cone };
}

function angleTo(eye, dir, p, radius) {
  tv2.subVectors(p, eye);
  const dist = tv2.length();
  if (dist < 1e-4) return { a: 0, dist };
  const cos = clampTo(tv2.dot(dir) / dist, -1, 1);
  let a = Math.acos(cos) - Math.asin(Math.min(1, radius / dist));
  if (a < 0) a = 0;
  return { a, dist };
}

function heapTopBonus(rec) {
  if (rec.heap < 0) return 0;
  const hp = WORLD.heaps[rec.heap];
  return hp && hp.h0 > 0 ? clamp01(rec.pickC.y / (hp.h0 + 0.1)) : 0;
}

/** Slab test of a ray against an oriented (yaw) box; returns the entry distance or -1. */
function rayOrientedBox(eye, dir, center, half, yaw) {
  const c = Math.cos(-yaw);
  const s = Math.sin(-yaw);
  const ox = eye.x - center.x;
  const oz = eye.z - center.z;
  SLOT_L_O.set(ox * c + oz * s, eye.y - center.y, -ox * s + oz * c);
  SLOT_L_D.set(dir.x * c + dir.z * s, dir.y, -dir.x * s + dir.z * c);
  let tmin = 0;
  let tmax = 1e9;
  for (const ax of ['x', 'y', 'z']) {
    const o = SLOT_L_O[ax];
    const d = SLOT_L_D[ax];
    const h = half[ax];
    if (Math.abs(d) < 1e-7) {
      if (o < -h || o > h) return -1;
      continue;
    }
    let t1 = (-h - o) / d;
    let t2 = (h - o) / d;
    if (t1 > t2) {
      const tmp = t1;
      t1 = t2;
      t2 = tmp;
    }
    if (t1 > tmin) tmin = t1;
    if (t2 < tmax) tmax = t2;
    if (tmin > tmax) return -1;
  }
  return tmin;
}

function slotNear(slot, eye, range) {
  if (slot.kind === 'unit') {
    const b = WORLD.units[slot.unit].aabb;
    const dx = Math.max(b.minX - eye.x, 0, eye.x - b.maxX);
    const dz = Math.max(b.minZ - eye.z, 0, eye.z - b.maxZ);
    return dx * dx + dz * dz < range * range;
  }
  const dx = slot.center.x - eye.x;
  const dz = slot.center.z - eye.z;
  return dx * dx + dz * dz < (range + 1) * (range + 1);
}

function sameGroup(a, b) {
  if (a.kind === 'unit' && b.kind === 'unit') return a.unit === b.unit;
  const ta = a.kind === 'tower' || a.kind === 'top';
  const tb = b.kind === 'tower' || b.kind === 'top';
  if (ta && tb) return a.kind === 'top' || b.kind === 'top' || a.sector === b.sector;
  return false;
}

function findSlot(eye, dir, reach) {
  let best = null;
  let bestT = reach + 0.4;
  for (const s of WORLD.slots) {
    if (!slotNear(s, eye, 4)) continue;
    const t = rayOrientedBox(eye, dir, s.center, s.halfSize, s.yaw);
    if (t >= 0 && t < bestT) {
      bestT = t;
      best = s;
    }
  }
  const top = stackTop();
  if (best && top) {
    const correct = slotFor(top);
    if (correct && correct !== best && sameGroup(correct, best)) {
      const { a } = angleTo(eye, dir, correct.center, 0.05);
      if (a <= 8 * DEG) best = correct;
    }
  }
  return best;
}

/** Ray against the floor, heaps and flat supports within reach; returns a valid resting point or null. */
function findFloor(eye, dir, reach) {
  if (dir.y > -0.05) return null;
  let bestT = 1e9;
  let by = 0;
  for (const s of WORLD.supports) {
    if (eye.y <= s.y) continue;
    const t = (s.y - eye.y) / dir.y;
    if (t <= 0 || t >= bestT) continue;
    const x = eye.x + dir.x * t;
    const z = eye.z + dir.z * t;
    if (x >= s.minX && x <= s.maxX && z >= s.minZ && z <= s.maxZ) {
      bestT = t;
      by = s.y;
    }
  }
  let t0 = -eye.y / dir.y;
  if (t0 < bestT) {
    const x = eye.x + dir.x * t0;
    const z = eye.z + dir.z * t0;
    const hh = heapHeightAt(x, z);
    if (hh > 0) t0 = (hh - eye.y) / dir.y;
    if (t0 < bestT) {
      bestT = t0;
      by = heapHeightAt(eye.x + dir.x * t0, eye.z + dir.z * t0);
    }
  }
  if (bestT > reach + 0.5) return null;
  const x = eye.x + dir.x * bestT;
  const z = eye.z + dir.z * bestT;
  if (!inRoom(x, z) || insideCollider(x, z, by + 0.02)) return null;
  AIM.floorV.set(x, by, z);
  return AIM.floorV;
}

function updateAim() {
  const eye = camera.position;
  const dir = AIM.dir;
  camera.getWorldDirection(dir);
  const { reach, cone } = reachNow();
  let best = null;
  let bestScore = 1e9;
  const prev = AIM.lastFig;
  const ix0 = Math.max(0, Math.floor(eye.x - reach - HASH.minX));
  const ix1 = Math.min(HASH.nx - 1, Math.floor(eye.x + reach - HASH.minX));
  const iz0 = Math.max(0, Math.floor(eye.z - reach - HASH.minZ));
  const iz1 = Math.min(HASH.nz - 1, Math.floor(eye.z + reach - HASH.minZ));
  for (let iz = iz0; iz <= iz1; iz++) {
    for (let ix = ix0; ix <= ix1; ix++) {
      const list = HASH.cells[ix + iz * HASH.nx];
      for (let k = 0; k < list.length; k++) {
        const rec = list[k];
        // Only the top of a pile can be grabbed: figurines under others are not targets.
        if (rec.actor || (rec.heap >= 0 && rec.over && rec.over.length)) continue;
        const { a, dist } = angleTo(eye, dir, rec.pickC, rec.pickR);
        if (dist > reach + rec.pickR) continue;
        const mult = rec.state === ST.WILD ? 1.5 : 1;
        const lim = cone * mult * (rec === prev ? 1.5 : 1);
        if (a > lim) continue;
        const score = a / (cone * mult) + 0.25 * dist / reach - 0.1 * heapTopBonus(rec) + (rec.state === ST.SHELF_OK ? 0.15 : 0);
        if (score < bestScore) {
          bestScore = score;
          best = rec;
        }
      }
    }
  }
  AIM.fig = best;
  AIM.card = -1;
  AIM.snitch = false;
  for (const c of CARDS.list) {
    if (c.found) continue;
    const { a, dist } = angleTo(eye, dir, c.pos, 0.05);
    if (dist > reach + 0.1 || a > 8 * DEG) continue;
    const score = a / (8 * DEG) + 0.25 * dist / reach - 0.2;
    if (score < bestScore) {
      bestScore = score;
      AIM.card = c.i;
      AIM.fig = null;
    }
  }
  const sn = snitchTargetScore(eye, dir, reach, cone);
  if (sn < bestScore) {
    AIM.snitch = true;
    AIM.fig = null;
    AIM.card = -1;
  }
  AIM.slot = null;
  AIM.floor = null;
  if (GAME.stack.length) {
    AIM.slot = findSlot(eye, dir, reach);
    if (!AIM.slot) AIM.floor = findFloor(eye, dir, reach);
  }
  AIM.inter = null;
  let bestI = 1e9;
  for (const it of WORLD.interactables) {
    tv2.subVectors(it.pos, eye);
    const d = tv2.length();
    if (d > it.r + 0.4) continue;
    const cos = tv2.dot(dir) / Math.max(1e-4, d);
    if (cos < INTERACT_COS && d > 0.9) continue;
    const sc = d - cos;
    if (sc < bestI) {
      bestI = sc;
      AIM.inter = it;
    }
  }
  if (AIM.fig !== AIM.lastFig || AIM.slot !== AIM.lastSlot || AIM.card !== AIM.lastCard || AIM.inter !== AIM.lastInter || AIM.snitch !== AIM.lastSnitch) {
    AIM.lastFig = AIM.fig;
    AIM.lastSlot = AIM.slot;
    AIM.lastCard = AIM.card;
    AIM.lastInter = AIM.inter;
    AIM.lastSnitch = AIM.snitch;
    UI_DIRTY.card = true;
    UI_DIRTY.prompts = true;
  }
}

/* ------------------------------------------------------------------------------------------------
   Aim highlight: the targeted figurine pops up a little and gets a glowing rim, so it is obvious what will be picked
   up; the previous target settles back smoothly. Purely visual (rec.pos, the pick sphere and saves are untouched).
   ------------------------------------------------------------------------------------------------ */
const HILITE_LIST = [];

function hiliteable(rec) {
  return rec.state === ST.LOOSE || rec.state === ST.SHELF_OK || rec.state === ST.SHELF_WRONG || rec.state === ST.WILD;
}

/** Runs after every other pose update of the frame (it re-poses the highlighted figurines with their lift). */
function updateHighlight(dt, t) {
  const target = GAME.phase === 'play' && !MENU.open && AIM.fig && !AIM.fig.actor && hiliteable(AIM.fig) ? AIM.fig : null;
  if (target && !HILITE_LIST.includes(target)) {
    target.hiT = target.hiT || 0;
    HILITE_LIST.push(target);
  }
  for (let i = HILITE_LIST.length - 1; i >= 0; i--) {
    const rec = HILITE_LIST[i];
    const on = rec === target;
    rec.hiT = on ? Math.min(1, rec.hiT + dt / HILITE.inS) : Math.max(0, rec.hiT - dt / HILITE.outS);
    const still = hiliteable(rec);
    // A pop with a small overshoot on the way up, a plain ease on the way down.
    const k = on ? easeOutBack(rec.hiT) : easeInOut(rec.hiT);
    if (still) {
      rec.hiLift = rec.state === ST.WILD ? 0 : (rec.slot ? HILITE.liftShelf : HILITE.lift) * k;
      tv1.copy(rec.pos);
      tv1.y += rec.hiLift;
      KIT.setPose(rec.h, tv1, rec.quat, rec.scale);
    } else rec.hiLift = 0;
    const pulse = on ? 0.84 + 0.16 * Math.sin(t * 6.5) : 1;
    if (rec.hiT <= 0) {
      if (still) KIT.setPose(rec.h, rec.pos, rec.quat, rec.scale);
      rec.hiLift = 0;
      KIT.setRim(rec.h, 0);
      HILITE_LIST.splice(i, 1);
    } else KIT.setRim(rec.h, Math.max(0.002, clamp01(k) * pulse));
  }
}

/* ------------------------------------------------------------------------------------------------
   Aim ring (world feedback at the target) and the throw arc preview
   ------------------------------------------------------------------------------------------------ */
const AIMFX = { ring: null, arc: null, arcPos: null, holdT: 0 };

function buildAimFx() {
  const ringGeo = new THREE.TorusGeometry(1, 0.06, 6, 40);
  ringGeo.rotateX(Math.PI / 2);
  AIMFX.ring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: 0xffe2a0, transparent: true, opacity: 0.85, depthWrite: false, blending: THREE.AdditiveBlending, fog: false }));
  AIMFX.ring.visible = false;
  AIMFX.ring.renderOrder = 8;
  scene.add(AIMFX.ring);
  const n = 24;
  AIMFX.arcPos = new Float32Array(n * 3);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(AIMFX.arcPos, 3).setUsage(THREE.DynamicDrawUsage));
  AIMFX.arc = new THREE.Points(g, new THREE.PointsMaterial({ size: 0.035, map: TEX.dot, color: 0xffe2a0, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false }));
  AIMFX.arc.frustumCulled = false;
  AIMFX.arc.visible = false;
  scene.add(AIMFX.arc);
}

function updateAimFx(t, dt) {
  const ring = AIMFX.ring;
  let show = false;
  if (GAME.phase === 'play' && !MENU.open) {
    if (AIM.slot) {
      const slot = AIM.slot;
      const pi = freePosition(slot);
      const top = stackTop();
      if (pi >= 0) {
        const p = slot.positions[pi];
        ring.position.set(p.x, p.y + 0.004, p.z);
        ring.scale.setScalar(slot.markerR * 1.25 * slot.posScale[pi]);
        ring.material.color.setHex(top && isCorrectFor(top, slot) ? 0xfff4dc : 0xff5040);
        show = true;
      }
    } else if (AIM.fig) {
      const r = AIM.fig;
      ring.position.set(r.lying ? r.pickC.x : r.pos.x, r.groundY + 0.006, r.lying ? r.pickC.z : r.pos.z);
      ring.scale.setScalar(Math.max(0.035 * FIG_SCALE, (r.met.baseR || r.met.radius) * r.scale) * 1.35);
      ring.material.color.setHex(0xffc860);
      // In a pile the outline and the pop-up mark the target; a floor ring would hang between the figurines.
      const inPile = r.heap >= 0 && r.state === ST.LOOSE && !WORLD.heaps[r.heap].crate;
      show = r.state !== ST.WILD && !inPile;
    }
  }
  ring.visible = show;
  if (show) ring.material.opacity = 0.55 + 0.3 * Math.sin(t * 6);
  // Throw arc while the throw button is held.
  if (IN.held.throw && GAME.stack.length && GAME.phase === 'play' && !MENU.open) AIMFX.holdT += dt;
  else AIMFX.holdT = 0;
  const arc = AIMFX.arc;
  arc.visible = AIMFX.holdT >= 0.15;
  if (!arc.visible) return;
  const speed = UPGRADES.throw.values[GAME.up.throw] * (GAME.boons.throwPlus ? 1.3 : 1);
  camera.getWorldDirection(tv1);
  tv2.crossVectors(tv1, UP_AXIS).normalize();
  tv1.applyAxisAngle(tv2, 12 * DEG).normalize();
  tv3.copy(camera.position).addScaledVector(tv1, 0.4);
  tv3.y -= 0.12;
  const P = AIMFX.arcPos;
  let px = tv3.x;
  let py = tv3.y;
  let pz = tv3.z;
  let vx = tv1.x * speed;
  let vy = tv1.y * speed;
  let vz = tv1.z * speed;
  const step = 0.06;
  for (let i = 0; i < 24; i++) {
    P[i * 3] = px;
    P[i * 3 + 1] = py;
    P[i * 3 + 2] = pz;
    if (py > 0.02) {
      px += vx * step;
      py += vy * step;
      pz += vz * step;
      vy -= PHYS.g * step;
    }
  }
  arc.geometry.attributes.position.needsUpdate = true;
}

/* ---- 55-audio.js ---- */
/* ==== 55-audio.js — WebAudio synthesis (effects, figurine voices, music box, ambience) and the player's own music
   files (assets/music/zene-N.mp3 / .ogg / .m4a, discovered at run time and played as a crossfading playlist) ==== */

/** Music modes: the two generated tunes, silence, and the player's own tracks (only offered when some were found). */
const MUSIC_ESTI = 0;
const MUSIC_GYERTYA = 1;
const MUSIC_OFF = 2;
const MUSIC_OWN = 3;

const AUDIO = {
  ctx: null, master: null, music: null, fx: null, amb: null, comp: null, noise: null,
  musicMode: MUSIC_ESTI, musicPicked: false, nextT: 0, step: 0, lastCoin: 0, hinted: false, swell: 0, ambT: 0, bubbleT: 0, clockT: 0, wind: null,
};

/** Creates (once) and resumes the context; must run synchronously inside a user-gesture handler. */
function audioUnlock() {
  try {
    if (!AUDIO.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      const ctx = new AC();
      AUDIO.ctx = ctx;
      AUDIO.comp = ctx.createDynamicsCompressor();
      AUDIO.comp.threshold.value = -18;
      AUDIO.comp.ratio.value = 3;
      AUDIO.master = ctx.createGain();
      AUDIO.master.gain.value = 0.9;
      AUDIO.music = ctx.createGain();
      AUDIO.fx = ctx.createGain();
      AUDIO.amb = ctx.createGain();
      AUDIO.music.connect(AUDIO.master);
      AUDIO.fx.connect(AUDIO.master);
      AUDIO.amb.connect(AUDIO.master);
      AUDIO.master.connect(AUDIO.comp);
      AUDIO.comp.connect(ctx.destination);
      const len = ctx.sampleRate * 2;
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      AUDIO.noise = buf;
      applyVolumes();
      startWind();
      discoverOwnMusic();
    }
    if (AUDIO.ctx.state === 'suspended') AUDIO.ctx.resume().catch(() => {});
    if (OWN_MUSIC.needGesture) {
      OWN_MUSIC.needGesture = false;
      if (ownMusicActive()) ownMusicPlay(OWN_MUSIC.idx, OWN_MUSIC.fadeIn);
    }
  } catch (err) {
    console.warn('[audio] unavailable', err);
  }
}

function audioSuspend() {
  try {
    ownMusicPause();
    if (AUDIO.ctx && AUDIO.ctx.state === 'running') AUDIO.ctx.suspend().catch(() => {});
  } catch {
    /* audio is optional */
  }
}

function audioResume() {
  try {
    if (AUDIO.ctx && AUDIO.ctx.state === 'suspended') AUDIO.ctx.resume().catch(() => {});
    ownMusicResume();
  } catch {
    /* audio is optional */
  }
}

function applyVolumes() {
  if (!AUDIO.ctx) return;
  const t = AUDIO.ctx.currentTime;
  // The generated tunes swell with the finale; the player's own (fully mixed) tracks duck a little under it instead.
  const own = ownMusicActive();
  const level = AUDIO.musicMode === MUSIC_OFF ? 0 : own ? 0.8 * (1 - 0.5 * AUDIO.swell) : 1 + AUDIO.swell;
  AUDIO.music.gain.setTargetAtTime(0.5 * SETTINGS.music * level, t, 0.3);
  AUDIO.fx.gain.setTargetAtTime(0.85 * SETTINGS.sfx, t, 0.05);
  AUDIO.amb.gain.setTargetAtTime(SETTINGS.ambient ? 0.5 * SETTINGS.sfx : 0, t, 0.3);
}

function audioReady() {
  return AUDIO.ctx && AUDIO.ctx.state === 'running';
}

/* ------------------------------------------------------------------------------------------------
   Primitives
   ------------------------------------------------------------------------------------------------ */

function tone(freq, type, t0, dur, vol, dest, o = {}) {
  const ctx = AUDIO.ctx;
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (o.glide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.glide), t0 + dur);
  if (o.detune) osc.detune.value = o.detune;
  const a = o.attack ?? 0.005;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t0 + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  let node = osc;
  if (o.filter) {
    const f = ctx.createBiquadFilter();
    f.type = o.filter;
    f.frequency.value = o.ff || 1200;
    f.Q.value = o.q || 0.7;
    osc.connect(f);
    node = f;
  }
  node.connect(g);
  g.connect(dest || AUDIO.fx);
  if (o.lfo) {
    const l = ctx.createOscillator();
    const lg = ctx.createGain();
    l.frequency.value = o.lfo;
    lg.gain.value = o.lfoDepth || 20;
    l.connect(lg);
    lg.connect(osc.frequency);
    l.start(t0);
    l.stop(t0 + dur + 0.05);
  }
  osc.start(t0);
  osc.stop(t0 + dur + 0.05);
  return osc;
}

function noise(t0, dur, vol, type, freq, q = 0.8, dest = null, sweepTo = 0) {
  const ctx = AUDIO.ctx;
  const src = ctx.createBufferSource();
  src.buffer = AUDIO.noise;
  src.loop = true;
  const f = ctx.createBiquadFilter();
  f.type = type;
  f.frequency.setValueAtTime(freq, t0);
  if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t0 + dur);
  f.Q.value = q;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t0 + Math.min(0.02, dur * 0.3));
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f);
  f.connect(g);
  g.connect(dest || AUDIO.fx);
  src.start(t0, Math.random() * 1.5);
  src.stop(t0 + dur + 0.05);
}

const midi = (n) => 440 * Math.pow(2, (n - 69) / 12);

/* ------------------------------------------------------------------------------------------------
   Effects
   ------------------------------------------------------------------------------------------------ */

function sfx(name, arg) {
  if (!audioReady()) return;
  try {
    const t = AUDIO.ctx.currentTime + 0.005;
    switch (name) {
      case 'pickup': {
        const f = 1800 + ((arg ?? 0) % 10) * 80;
        tone(f, 'sine', t, 0.09, 0.12);
        tone(f * 1.5, 'triangle', t, 0.06, 0.04);
        break;
      }
      case 'place':
        noise(t, 0.12, 0.2, 'lowpass', 900, 0.7);
        tone(2400, 'sine', t + 0.02, 0.18, 0.05);
        break;
      case 'wrong':
        tone(180, 'triangle', t, 0.1, 0.2);
        tone(330, 'sine', t + 0.08, 0.16, 0.08);
        tone(311, 'sine', t + 0.22, 0.2, 0.08);
        break;
      case 'slotDone':
        [72, 76, 79].forEach((n, i) => {
          tone(midi(n), 'sine', t + i * 0.12, 0.5, 0.1);
          tone(midi(n + 12), 'sine', t + i * 0.12, 0.3, 0.03);
        });
        break;
      case 'shelfDone':
        noise(t, 0.9, 0.06, 'bandpass', 300, 1.2, null, 2400);
        [62, 66, 69, 74].forEach((n) => {
          for (const det of [-8, 0, 7]) tone(midi(n), 'sawtooth', t + 0.25, 1.7, 0.012, null, { attack: 0.3, detune: det, filter: 'lowpass', ff: 1400 });
        });
        break;
      case 'chime':
        tone(midi(84), 'sine', t, 0.6, 0.07);
        tone(midi(91), 'sine', t + 0.08, 0.5, 0.04);
        break;
      case 'fanfare':
        [[67, 0], [72, 0.14], [76, 0.28], [79, 0.42]].forEach(([n, dt]) => {
          for (const det of [-6, 6]) tone(midi(n), 'sawtooth', t + dt, 0.5, 0.025, null, { attack: 0.02, detune: det, filter: 'lowpass', ff: 2200 });
        });
        break;
      case 'coins': {
        const now = AUDIO.ctx.currentTime;
        if (now - AUDIO.lastCoin < 0.12) break;
        AUDIO.lastCoin = now;
        for (let k = 0; k < 3; k++) tone(3200 + Math.random() * 900, 'sine', t + k * 0.05, 0.08, 0.05);
        break;
      }
      case 'lumos':
        tone(midi(76), 'sine', t, 0.8, 0.06, null, { attack: 0.2, glide: midi(88) });
        tone(midi(83), 'triangle', t + 0.1, 0.7, 0.03, null, { attack: 0.2 });
        break;
      case 'invito':
        noise(t, 0.6, 0.12, 'bandpass', 2400, 1.5, null, 400);
        tone(900, 'sine', t, 0.5, 0.05, null, { glide: 300 });
        break;
      case 'path':
        for (let k = 0; k < 8; k++) tone(midi(79 + k * 2), 'sine', t + k * 0.05, 0.25, 0.035);
        break;
      case 'ready':
        tone(880, 'sine', t, 0.5, 0.06);
        tone(1760, 'sine', t, 0.3, 0.02);
        break;
      case 'deny':
        tone(220, 'triangle', t, 0.12, 0.08);
        break;
      case 'tick':
        tone(1400, 'sine', t, 0.03, 0.035);
        break;
      case 'confirm':
        tone(1200, 'sine', t, 0.06, 0.05);
        tone(1800, 'sine', t + 0.04, 0.08, 0.04);
        break;
      case 'back':
        tone(900, 'sine', t, 0.07, 0.04, null, { glide: 600 });
        break;
      case 'open':
        tone(midi(74), 'sine', t, 0.25, 0.05);
        tone(midi(81), 'sine', t + 0.06, 0.3, 0.04);
        break;
      case 'learn':
        [74, 78, 81, 86].forEach((n, i) => tone(midi(n), 'sine', t + i * 0.07, 0.45, 0.07));
        break;
      case 'bell':
        tone(2093, 'sine', t, 0.9, 0.09);
        tone(2093 * 2.76, 'sine', t, 0.4, 0.02);
        break;
      case 'knock':
        noise(t, 0.08, 0.25, 'lowpass', 400);
        noise(t + 0.18, 0.08, 0.25, 'lowpass', 400);
        break;
      case 'thud':
        noise(t, 0.09, 0.12 * (arg || 1), 'lowpass', 600);
        break;
      case 'whoosh':
        noise(t, 0.35, 0.09, 'bandpass', 600, 0.8, null, 2200);
        break;
      case 'pop':
        tone(500, 'sine', t, 0.08, 0.12, null, { glide: 1400 });
        break;
      case 'sparkle':
        for (let k = 0; k < 6; k++) tone(2600 + Math.random() * 2400, 'sine', t + k * 0.04, 0.2, 0.03);
        break;
      case 'card':
        sfx('sparkle');
        tone(160, 'square', t + 0.25, 0.12, 0.03, null, { filter: 'lowpass', ff: 700, glide: 120 });
        break;
      case 'squeak':
        tone(1900, 'sine', t, 0.08, 0.06, null, { glide: 2600 });
        tone(2100, 'sine', t + 0.1, 0.06, 0.05, null, { glide: 1700 });
        break;
      case 'splash':
        noise(t, 0.7, 0.2, 'lowpass', 2400, 0.5, null, 300);
        noise(t, 0.25, 0.12, 'highpass', 3000);
        break;
      case 'splashSmall':
        noise(t, 0.35, 0.1, 'lowpass', 1600, 0.6, null, 300);
        tone(320, 'sine', t + 0.05, 0.15, 0.06, null, { glide: 700 });
        break;
      case 'step':
        noise(t, 0.06, 0.02 + Math.random() * 0.012, 'bandpass', 300 + Math.random() * 200, 2);
        break;
      case 'lever':
        noise(t, 0.4, 0.12, 'bandpass', 500, 3, null, 200);
        tone(90, 'square', t + 0.3, 0.3, 0.04, null, { filter: 'lowpass', ff: 300 });
        break;
      default:
        break;
    }
  } catch {
    /* audio is optional */
  }
}

/** Short figurine voice for a voice key (DESIGN.md 4.5); house motifs use the figurine's house. */
function voice(key, vol = 1, house = null) {
  if (!audioReady() || !key) return;
  try {
    const t = AUDIO.ctx.currentTime + 0.01;
    const v = 0.06 * vol;
    switch (key) {
      case 'house': {
        const roots = { gryffindor: [60, 64, 67], slytherin: [62, 65, 69], ravenclaw: [63, 67, 70], hufflepuff: [65, 69, 72] };
        const notes = roots[house] || roots.gryffindor;
        notes.forEach((n, i) => tone(midi(n + 12), 'triangle', t + i * 0.07, 0.25, v));
        break;
      }
      case 'screech': tone(1400, 'sawtooth', t, 0.35, v * 0.5, null, { glide: 700, filter: 'bandpass', ff: 1800, q: 3 }); break;
      case 'song': [79, 83, 86, 91].forEach((n, i) => tone(midi(n), 'sine', t + i * 0.09, 0.3, v)); break;
      case 'growl': tone(90, 'sawtooth', t, 0.5, v, null, { filter: 'lowpass', ff: 380, lfo: 18, lfoDepth: 25 }); break;
      case 'roar': tone(140, 'sawtooth', t, 0.6, v * 1.2, null, { glide: 70, filter: 'lowpass', ff: 600, lfo: 22, lfoDepth: 30 }); noise(t, 0.5, v * 0.8, 'lowpass', 500); break;
      case 'wingflap': for (let k = 0; k < 3; k++) noise(t + k * 0.13, 0.09, v, 'bandpass', 500, 1); break;
      case 'hiss': noise(t, 0.5, v * 0.8, 'highpass', 4000); break;
      case 'squeak': sfx('squeak'); break;
      case 'hoot': tone(midi(67), 'sine', t, 0.25, v, null, { attack: 0.04 }); tone(midi(64), 'sine', t + 0.3, 0.35, v, null, { attack: 0.04 }); break;
      case 'twitter': for (let k = 0; k < 4; k++) tone(3000 + k * 300, 'sine', t + k * 0.06, 0.05, v * 0.7, null, { glide: 4200 }); break;
      case 'meow': tone(600, 'sawtooth', t, 0.4, v * 0.5, null, { glide: 420, filter: 'bandpass', ff: 1200, q: 4 }); break;
      case 'croak': tone(120, 'square', t, 0.18, v * 0.6, null, { filter: 'lowpass', ff: 700, lfo: 30, lfoDepth: 20 }); break;
      case 'woof': tone(260, 'sawtooth', t, 0.15, v, null, { glide: 140, filter: 'lowpass', ff: 900 }); break;
      case 'wooo': tone(midi(64), 'sine', t, 0.6, v, null, { attack: 0.15, lfo: 5, lfoDepth: 14, glide: midi(58) }); break;
      case 'cackle': for (let k = 0; k < 5; k++) tone(700 - k * 40, 'sawtooth', t + k * 0.11, 0.09, v * 0.6, null, { filter: 'bandpass', ff: 1400, q: 5 }); break;
      case 'pop': sfx('pop'); break;
      case 'sparkle': sfx('sparkle'); break;
      case 'hum': tone(midi(52), 'triangle', t, 0.6, v, null, { attack: 0.1, lfo: 4, lfoDepth: 4 }); break;
      case 'tick': for (let k = 0; k < 4; k++) tone(3000, 'square', t + k * 0.12, 0.015, v * 0.4); break;
      case 'shout': noise(t, 0.3, v * 0.6, 'bandpass', 900, 3); tone(320, 'sawtooth', t, 0.3, v * 0.3, null, { filter: 'bandpass', ff: 900, q: 4 }); break;
      case 'flame': noise(t, 0.5, v, 'lowpass', 800, 0.7, null, 2000); break;
      case 'whoosh': sfx('whoosh'); break;
      case 'buzz': tone(220, 'sine', t, 0.6, v * vol, null, { lfo: 48, lfoDepth: 40 }); break;
      case 'thud': noise(t, 0.12, v * 1.5, 'lowpass', 400); break;
      case 'bell': tone(midi(84), 'sine', t, 0.6, v); break;
      case 'drone': tone(midi(41), 'sawtooth', t, 0.6, v * 0.5, null, { attack: 0.15, filter: 'lowpass', ff: 300 }); break;
      case 'zap': noise(t, 0.12, v, 'highpass', 2500); tone(1600, 'square', t, 0.1, v * 0.3, null, { glide: 300 }); break;
      case 'chime': sfx('chime'); break;
      case 'fanfare': sfx('fanfare'); break;
      default: tone(midi(76), 'sine', t, 0.2, v); break;
    }
  } catch {
    /* audio is optional */
  }
}

/* ------------------------------------------------------------------------------------------------
   Music box (two generated tunes) and ambience
   ------------------------------------------------------------------------------------------------ */
const TUNE_ESTI = { bpm: 72, chords: [[62, 66, 69], [59, 62, 66], [55, 59, 62], [57, 61, 64], [62, 66, 69], [55, 59, 62], [57, 61, 64], [62, 66, 69]] };
const TUNE_GYERTYA = { bpm: 64, chords: [[57, 60, 64], [53, 57, 60], [55, 59, 62], [52, 55, 59], [57, 60, 64], [50, 53, 57], [52, 56, 59], [57, 60, 64]] };

/** The music box order: Saját zenék (when there are any), then the generated tunes, then silence. */
function musicModes() {
  return OWN_MUSIC.tracks.length ? [MUSIC_OWN, MUSIC_ESTI, MUSIC_GYERTYA, MUSIC_OFF] : [MUSIC_ESTI, MUSIC_GYERTYA, MUSIC_OFF];
}

function musicModeName(m = AUDIO.musicMode) {
  return m === MUSIC_OWN ? TXT.musicOwn : TXT.musicNames[m] || '';
}

/** Switches the music mode (the own playlist fades in or out; the generated tunes start on the next beat). */
function setMusicMode(m) {
  const was = AUDIO.musicMode;
  AUDIO.musicMode = m;
  if (AUDIO.ctx) AUDIO.nextT = AUDIO.ctx.currentTime + 0.1;
  if (m === MUSIC_OWN && OWN_MUSIC.tracks.length) ownMusicStart();
  else if (was === MUSIC_OWN || OWN_MUSIC.cur >= 0) ownMusicStop(1.2);
  applyVolumes();
}

/** Zenélő doboz: the next music mode. */
function cycleMusic() {
  const list = musicModes();
  const i = list.indexOf(AUDIO.musicMode);
  AUDIO.musicPicked = true;
  setMusicMode(list[(i + 1) % list.length]);
  toast(fmt(TXT.toastMusic, { name: musicModeName() }));
  markDirty();
}

function musicSwell() {
  AUDIO.swell = 0.6;
  applyVolumes();
  setTimeout(() => {
    AUDIO.swell = 0;
    applyVolumes();
  }, 20000);
}

function scheduleMusic() {
  const ctx = AUDIO.ctx;
  if (AUDIO.musicMode === MUSIC_OFF || ownMusicActive()) return;
  // Mode "own" while the tracks are still being looked for (or none are left) plays the evening tune meanwhile.
  const tune = AUDIO.musicMode === MUSIC_GYERTYA ? TUNE_GYERTYA : TUNE_ESTI;
  const eighth = 60 / tune.bpm / 2;
  if (AUDIO.nextT < ctx.currentTime) AUDIO.nextT = ctx.currentTime + 0.05;
  while (AUDIO.nextT < ctx.currentTime + 0.35) {
    const s = AUDIO.step;
    const bar = Math.floor(s / 8) % 32;
    const chord = tune.chords[Math.floor(bar / 4) % tune.chords.length];
    const pos = s % 8;
    const t = AUDIO.nextT;
    if (tune === TUNE_ESTI) {
      const pat = [0, 1, 2, 1, 0, 2, 1, 2];
      const n = chord[pat[pos]] + 12 + (pos === 4 && bar % 2 ? 12 : 0);
      tone(midi(n), 'sine', t, 0.9, 0.045, AUDIO.music, { attack: 0.003 });
      tone(midi(n) * 3, 'sine', t, 0.25, 0.008, AUDIO.music);
      if (pos === 0) tone(midi(chord[0] - 12), 'triangle', t, 1.6, 0.03, AUDIO.music, { attack: 0.01 });
    } else {
      if (pos === 0) for (const c of chord) tone(midi(c), 'sawtooth', t, eighth * 8.5, 0.006, AUDIO.music, { attack: 0.6, filter: 'lowpass', ff: 700, detune: (c % 3) * 4 - 4 });
      if (pos % 2 === 0 || Math.random() < 0.3) {
        const n = chord[(pos + bar) % 3] + 12 + (pos > 5 ? 12 : 0);
        tone(midi(n), 'triangle', t, 0.8, 0.035, AUDIO.music, { attack: 0.002, filter: 'lowpass', ff: 2600 });
      }
    }
    AUDIO.step++;
    AUDIO.nextT += eighth;
  }
}

/* ------------------------------------------------------------------------------------------------
   The player's own music: assets/music/zene-1 … zene-20 (.mp3, .ogg or .m4a), uploaded on GitHub without a build.
   Found at run time with cheap probes (the service worker answers them without 404s), played as a playlist on two
   HTMLAudioElement decks routed into AUDIO.music (master and music volume apply), crossfading between tracks.
   ------------------------------------------------------------------------------------------------ */
const OWN_MUSIC = {
  dir: 'assets/music/', max: 20, exts: [['mp3', 'audio/mpeg'], ['ogg', 'audio/ogg'], ['m4a', 'audio/mp4']],
  state: 'idle', tracks: [], decks: [], cur: -1, idx: 0, token: 0, paused: false, needGesture: false, viaWorker: false,
  xfade: 3.5, fadeIn: 2.5, fadeOut: 1.2, blobs: new Map(),
};

/** True while the playlist is the music that plays (own mode chosen and tracks available). */
function ownMusicActive() {
  return AUDIO.musicMode === MUSIC_OWN && OWN_MUSIC.tracks.length > 0;
}

/** After loading a save: own mode waits for the discovery; anything else simply plays. */
function musicModeRestored() {
  if (OWN_MUSIC.state === 'ready' && ownMusicActive()) ownMusicStart();
  else if (OWN_MUSIC.state === 'none' && AUDIO.musicMode === MUSIC_OWN) AUDIO.musicMode = MUSIC_ESTI;
  else if (OWN_MUSIC.state === 'ready' && !AUDIO.musicPicked && AUDIO.musicMode !== MUSIC_OWN) setMusicMode(MUSIC_OWN);
  applyVolumes();
}

/** True when the controlling service worker answers the music handshake (an older version of it does not). */
function ownMusicWorkerReady(ms = 1500) {
  return new Promise((resolve) => {
    try {
      const ctl = navigator.serviceWorker && navigator.serviceWorker.controller;
      if (!ctl || typeof MessageChannel === 'undefined') {
        resolve(false);
        return;
      }
      const ch = new MessageChannel();
      const timer = setTimeout(() => resolve(false), ms);
      ch.port1.onmessage = (e) => {
        clearTimeout(timer);
        resolve(!!(e.data && e.data.music));
      };
      ctl.postMessage({ type: 'music?' }, [ch.port2]);
    } catch {
      resolve(false);
    }
  });
}

/**
 * Waits (bounded) for a service worker that handles the music probes, so a missing file is answered without a 404
 * and nothing is downloaded: it checks for an update of the worker (a new upload) and waits for it to take over.
 */
async function ownMusicWorker(ms) {
  try {
    if (!('serviceWorker' in navigator)) return false;
    const sw = navigator.serviceWorker;
    const until = performance.now() + ms;
    let reg = await sw.getRegistration();
    if (!reg) {
      // The page registers its worker on load; give it a moment.
      await new Promise((r) => { setTimeout(r, 1500); });
      reg = await sw.getRegistration();
      if (!reg) return false;
    }
    if (await ownMusicWorkerReady()) return true;
    try {
      await reg.update();
    } catch {
      /* offline: keep what is there */
    }
    while (performance.now() < until) {
      // A newer worker is installing, waiting or activating: wait for it to take over the page.
      const pending = reg.installing || reg.waiting || (reg.active && reg.active !== sw.controller);
      if (!pending && sw.controller) break;
      await new Promise((resolve) => {
        const timer = setTimeout(resolve, 1000);
        sw.addEventListener('controllerchange', () => {
          clearTimeout(timer);
          resolve();
        }, { once: true });
      });
      if (await ownMusicWorkerReady(800)) return true;
    }
  } catch {
    /* no worker: probe directly */
  }
  return false;
}

/**
 * True when a music file exists. Through a music-aware worker: 200 found, 204 missing (no 404 reaches the page);
 * otherwise HEAD (or a one-byte GET where HEAD is refused).
 */
async function ownMusicProbe(url) {
  try {
    if (OWN_MUSIC.viaWorker) {
      const r = await fetch(url, { headers: { 'x-music-probe': '1' }, cache: 'no-store' });
      return r.status === 200;
    }
    let r = await fetch(url, { method: 'HEAD', cache: 'no-store' });
    if (r.status === 405 || r.status === 501) r = await fetch(url, { headers: { Range: 'bytes=0-0' }, cache: 'no-store' });
    return r.status === 200 || r.status === 206;
  } catch {
    return false;
  }
}

/**
 * Looks for zene-1, zene-2, … (each as .mp3, .ogg, .m4a, formats this browser cannot play are skipped) and stops at the
 * first number that has no file, so a shop without music costs three tiny requests. Runs once, after the first
 * gesture, and only on the GitHub Pages site (the artifact build has no music folder).
 */
async function discoverOwnMusic() {
  if (OWN_MUSIC.state !== 'idle') return;
  OWN_MUSIC.state = 'probing';
  try {
    if (!document.querySelector('link[rel="manifest"]')) {
      OWN_MUSIC.state = 'none';
      musicModeRestored();
      return;
    }
    OWN_MUSIC.viaWorker = await ownMusicWorker(30000);
    const probe = document.createElement('audio');
    const exts = OWN_MUSIC.exts.filter(([, mime]) => probe.canPlayType(mime) !== '');
    for (let n = 1; n <= OWN_MUSIC.max; n++) {
      let found = null;
      for (const [ext] of exts) {
        const url = `${OWN_MUSIC.dir}zene-${n}.${ext}`;
        if (await ownMusicProbe(url)) {
          found = url;
          break;
        }
      }
      if (!found) break;
      OWN_MUSIC.tracks.push({ url: found, n, name: fmt(TXT.musicOwnTrack, { n }), bad: false });
    }
  } catch {
    /* no music: the generated tunes stay */
  }
  OWN_MUSIC.state = OWN_MUSIC.tracks.length ? 'ready' : 'none';
  if (OWN_MUSIC.tracks.length) {
    if (!AUDIO.musicPicked) {
      setMusicMode(MUSIC_OWN);
      toast(fmt(TXT.toastOwnFound, { n: OWN_MUSIC.tracks.length }));
    } else musicModeRestored();
  } else musicModeRestored();
}

/** One deck: an audio element, its source node and a fade gain into AUDIO.music. */
function ownDeck(i) {
  let d = OWN_MUSIC.decks[i];
  if (d) return d;
  const el = new Audio();
  el.preload = 'auto';
  const src = AUDIO.ctx.createMediaElementSource(el);
  const g = AUDIO.ctx.createGain();
  g.gain.value = 0;
  src.connect(g);
  g.connect(AUDIO.music);
  d = { el, g, track: -1, url: '', next: false, stopAt: 0 };
  el.addEventListener('ended', () => {
    // Tracks without a known duration (or a missed crossfade) move on at their end.
    if (OWN_MUSIC.decks[OWN_MUSIC.cur] === d && !d.next && ownMusicActive()) {
      d.next = true;
      ownMusicPlay((OWN_MUSIC.idx + 1) % OWN_MUSIC.tracks.length, 0.4);
    }
  });
  OWN_MUSIC.decks[i] = d;
  return d;
}

/** Object URL of a track's file (fetched through the worker: cache-first, so it also plays offline). */
async function ownMusicBlob(tr) {
  const have = OWN_MUSIC.blobs.get(tr.url);
  if (have) return have;
  const res = await fetch(tr.url);
  if (res.status !== 200) throw new Error(`music ${res.status}`);
  const url = URL.createObjectURL(await res.blob());
  OWN_MUSIC.blobs.set(tr.url, url);
  return url;
}

/** Releases the object URLs no deck plays and that are not the next track. */
function ownMusicTrim(keep) {
  for (const [k, u] of OWN_MUSIC.blobs) {
    if (keep.includes(k)) continue;
    URL.revokeObjectURL(u);
    OWN_MUSIC.blobs.delete(k);
  }
}

/** Starts track i on the idle deck, fading it in over fade seconds while the other deck fades out. */
async function ownMusicPlay(i, fade) {
  const n = OWN_MUSIC.tracks.length;
  if (!n || !AUDIO.ctx) return;
  const token = ++OWN_MUSIC.token;
  let tr = OWN_MUSIC.tracks[i];
  let url = '';
  for (let k = 0; k < n; k++) {
    tr = OWN_MUSIC.tracks[(i + k) % n];
    if (tr.bad) continue;
    try {
      url = await ownMusicBlob(tr);
      i = (i + k) % n;
      break;
    } catch {
      tr.bad = true;
    }
  }
  if (token !== OWN_MUSIC.token || !ownMusicActive()) return;
  if (!url) {
    // Nothing playable (offline before the first play, or broken files): back to the music box tunes.
    OWN_MUSIC.tracks.length = 0;
    setMusicMode(MUSIC_ESTI);
    return;
  }
  const prev = OWN_MUSIC.cur >= 0 ? OWN_MUSIC.decks[OWN_MUSIC.cur] : null;
  const di = OWN_MUSIC.cur === 0 ? 1 : 0;
  const d = ownDeck(di);
  const t = AUDIO.ctx.currentTime;
  d.el.src = url;
  d.track = i;
  d.url = tr.url;
  d.next = false;
  d.stopAt = 0;
  d.g.gain.cancelScheduledValues(t);
  d.g.gain.setValueAtTime(0, t);
  try {
    await d.el.play();
  } catch (err) {
    // Blocked until the next user gesture (autoplay rules): audioUnlock() tries again; otherwise the file is broken.
    if (err && err.name === 'NotAllowedError') {
      OWN_MUSIC.needGesture = true;
      return;
    }
    tr.bad = true;
    if (token === OWN_MUSIC.token && OWN_MUSIC.tracks.some((x) => !x.bad)) ownMusicPlay((i + 1) % n, fade);
    return;
  }
  if (token !== OWN_MUSIC.token) return;
  const t1 = AUDIO.ctx.currentTime;
  d.g.gain.setValueAtTime(0, t1);
  d.g.gain.linearRampToValueAtTime(1, t1 + Math.max(0.05, fade));
  if (prev && prev !== d) ownDeckFadeOut(prev, Math.max(0.3, fade));
  OWN_MUSIC.cur = di;
  OWN_MUSIC.idx = i;
  OWN_MUSIC.paused = false;
  toast(fmt(TXT.toastTrack, { name: tr.name }));
  // Fetch the next track now, so the crossfade starts on time; keep only these two files in memory.
  const nx = OWN_MUSIC.tracks[(i + 1) % n];
  ownMusicTrim([tr.url, nx.url]);
  if (!nx.bad) ownMusicBlob(nx).catch(() => { nx.bad = true; });
}

function ownDeckFadeOut(d, s) {
  const t = AUDIO.ctx.currentTime;
  d.g.gain.cancelScheduledValues(t);
  d.g.gain.setValueAtTime(d.g.gain.value, t);
  d.g.gain.linearRampToValueAtTime(0, t + s);
  d.stopAt = performance.now() + s * 1000 + 100;
  d.next = true;
}

function ownMusicStart() {
  if (!AUDIO.ctx || !OWN_MUSIC.tracks.length) return;
  const d = OWN_MUSIC.cur >= 0 ? OWN_MUSIC.decks[OWN_MUSIC.cur] : null;
  if (d && !d.el.paused && d.stopAt === 0) return;
  ownMusicPlay(OWN_MUSIC.idx % OWN_MUSIC.tracks.length, OWN_MUSIC.fadeIn);
}

/** Fades the playlist out (switching to another mode); the decks pause once silent. */
function ownMusicStop(s = OWN_MUSIC.fadeOut) {
  OWN_MUSIC.token++;
  if (!AUDIO.ctx) return;
  for (const d of OWN_MUSIC.decks) if (d && !d.el.paused) ownDeckFadeOut(d, s);
  OWN_MUSIC.cur = -1;
}

/** Hidden tab: pause the decks (the context is suspended too) and continue where they were. */
function ownMusicPause() {
  for (const d of OWN_MUSIC.decks) {
    if (d && !d.el.paused) {
      d.el.pause();
      d.wasPlaying = true;
    }
  }
  OWN_MUSIC.paused = true;
}

function ownMusicResume() {
  if (!OWN_MUSIC.paused) return;
  OWN_MUSIC.paused = false;
  for (const d of OWN_MUSIC.decks) {
    if (d && d.wasPlaying) {
      d.wasPlaying = false;
      d.el.play().catch(() => {});
    }
  }
}

/** Per frame: start the crossfade into the next track before the current one ends; pause decks that faded out. */
function ownMusicTick() {
  const now = performance.now();
  for (const d of OWN_MUSIC.decks) {
    if (d && d.stopAt && now >= d.stopAt) {
      d.stopAt = 0;
      d.el.pause();
      d.el.removeAttribute('src');
      d.el.load();
    }
  }
  if (!ownMusicActive() || OWN_MUSIC.cur < 0 || OWN_MUSIC.paused) return;
  const d = OWN_MUSIC.decks[OWN_MUSIC.cur];
  if (!d || d.next || d.el.paused) return;
  const dur = d.el.duration;
  if (Number.isFinite(dur) && dur > 1 && d.el.currentTime >= dur - Math.min(OWN_MUSIC.xfade, dur * 0.3)) {
    d.next = true;
    ownMusicPlay((OWN_MUSIC.idx + 1) % OWN_MUSIC.tracks.length, Math.min(OWN_MUSIC.xfade, dur * 0.3));
  }
}

function startWind() {
  try {
    const ctx = AUDIO.ctx;
    const src = ctx.createBufferSource();
    src.buffer = AUDIO.noise;
    src.loop = true;
    const f = ctx.createBiquadFilter();
    f.type = 'bandpass';
    f.frequency.value = 420;
    f.Q.value = 0.6;
    const g = ctx.createGain();
    g.gain.value = 0.015;
    const lfo = ctx.createOscillator();
    const lg = ctx.createGain();
    lfo.frequency.value = 0.07;
    lg.gain.value = 0.012;
    lfo.connect(lg);
    lg.connect(g.gain);
    src.connect(f);
    f.connect(g);
    g.connect(AUDIO.amb);
    src.start();
    lfo.start();
    AUDIO.wind = src;
  } catch {
    /* audio is optional */
  }
}

/** Called every frame: music scheduling, candle crackle, clock tick, cauldron bubbling near it. */
function audioTick(dt) {
  if (!audioReady()) return;
  try {
    scheduleMusic();
    ownMusicTick();
    if (!SETTINGS.ambient) return;
    const t = AUDIO.ctx.currentTime;
    AUDIO.ambT -= dt;
    if (AUDIO.ambT <= 0) {
      AUDIO.ambT = 0.08 + Math.random() * 0.5;
      noise(t, 0.015, 0.004 + Math.random() * 0.01, 'highpass', 2000 + Math.random() * 3000, 1, AUDIO.amb);
    }
    AUDIO.clockT -= dt;
    if (AUDIO.clockT <= 0) {
      AUDIO.clockT = 1;
      tone(2400, 'square', t, 0.012, 0.004, AUDIO.amb);
    }
    const dc = Math.hypot(camera.position.x - CAULDRON.x, camera.position.z - CAULDRON.z);
    if (dc < 5) {
      AUDIO.bubbleT -= dt;
      if (AUDIO.bubbleT <= 0) {
        AUDIO.bubbleT = 0.12 + Math.random() * 0.35;
        tone(180 + Math.random() * 260, 'sine', t, 0.08, 0.04 * (1 - dc / 5), AUDIO.amb, { glide: 400 + Math.random() * 300, filter: 'lowpass', ff: 900 });
      }
    }
  } catch {
    /* audio is optional */
  }
}

/** Fills a TXT template whose {glyph} placeholder becomes inline glyph HTML; other values are escaped. */

}

  }
}

let reloadArmed = false;
/**
 * Makes the reload overlay usable without a cursor (Xbox game-controls mode): focuses the button and, since the
 * game loop is stopped, runs its own tiny gamepad poll; A or Menu (after a release) and Enter/Space reload.
 */
function armReloadOverlay() {
  if (reloadArmed) return;
  reloadArmed = true;
  if (!UI.lostHint) {
    UI.lostHint = el('p', 'quiet', TXT.lostHint);
    UI.lostReload.before(UI.lostHint);
  }
  try {
    UI.lostReload.focus();
  } catch {
    /* focus is optional */
  }
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Enter' || e.code === 'NumpadEnter' || e.code === 'Space' || e.key === 'GamepadA') {
      e.preventDefault();
      window.location.reload();
    }
  }, true);
  let wasDown = true;
  const poll = () => {
    let down = false;
    try {
      const pads = navigator.getGamepads ? navigator.getGamepads() : [];
      for (const p of pads) {
        if (!p || !p.buttons) continue;
        if ((p.buttons[0] && p.buttons[0].pressed) || (p.buttons[9] && p.buttons[9].pressed)) down = true;
      }
    } catch {
      /* no gamepad access */
    }
    if (down && !wasDown) {
      window.location.reload();
      return;
    }
    wasDown = down;
    requestAnimationFrame(poll);
  };
  requestAnimationFrame(poll);
}

const TOASTS = [];

function toast(text, kind = '') {
  if (!text || !UI.toasts) return;
  if (TOASTS.length && TOASTS[TOASTS.length - 1].text === text) {
    TOASTS[TOASTS.length - 1].t = 4;
    return;
  }
  const node = el('div', `panel toast ${kind}`, text);
  UI.toasts.append(node);
  TOASTS.push({ node, t: 4, text });
  while (TOASTS.length > 3) TOASTS.shift().node.remove();
}

function updateToasts(dt) {
  for (let i = TOASTS.length - 1; i >= 0; i--) {
    const T = TOASTS[i];
    T.t -= dt;
    if (T.t < 0.4) T.node.classList.add('out');
    if (T.t <= 0) {
      T.node.remove();
      TOASTS.splice(i, 1);
    }
  }
}

let noticeTimer = 0;
function notice(text, ms = 7000) {

  const pips = UI.ttPips.children;

    pips[i].hidden = i >= m;
