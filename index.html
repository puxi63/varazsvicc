   (ported from the approved environment concept helyszin/weasley; DECISIONS.md 9 and 9a) ==== */

/** Shop palette (sRGB hex): bold orange, purple, magenta and lime with plum and gilt. */
const PAL = {
  orange: 0xff8a1f, orangeDeep: 0xd9600c, magenta: 0xe8268a, pink: 0xff7ac0, purple: 0x7b2fbf, plum: 0x3a1442,
  plumDeep: 0x2a0f30, plumMid: 0x4a1a56, plumLight: 0x5a1466, lime: 0xa8e03a, limeDeep: 0x6fae1e, turquoise: 0x2ec4b6,
  sky: 0x47bef5, cream: 0xfff1d6, gold: 0xf2b844, red: 0xe23b2e, yellow: 0xffd23f, ink: 0x1d0a22, brass: 0xd9a640,
};
const PAL_LIST = [PAL.orange, PAL.magenta, PAL.purple, PAL.lime, PAL.turquoise, PAL.yellow, PAL.red, PAL.pink, PAL.sky];
const THEME_FONT_DISPLAY = '"Abril Fatface", "Bodoni Moda", Didot, "Times New Roman", serif';
const THEME_FONT_FUN = '"Titan One", "Baloo 2", "Trebuchet MS", "Segoe UI", sans-serif';
const hexCss = (c) => `#${c.toString(16).padStart(6, '0')}`;

/** Verified Hungarian product names (Potterzum Szótár, harrypotter.fandom.com/hu) printed on the boxes. */
const PRODUCT_NAMES = [
  'Telefül', 'Rókázó Rágcsa', 'Orrvérzés ostya', 'Lázralobbantó', 'Tetszhalott Tabletta', 'Kanári-kuglóf',
  'Nyelvnyújtó nyalánkság', 'Csalizajgép', 'Trágyagránát', 'Bűzpatron', 'Fejnyelő Fejfedő', 'Éberálom-bűbáj',
  'Maximuláns', 'Boszibűbáj', 'Tűzijáték', 'Trükkös pálca',
];
const CELL_TELEFUL = 0;
const CELL_MAXI = 12;
const CELL_BOSZI = 13;
const CELL_FIRE = 14;
const CELL_WAND = 15;

/* ------------------------------------------------------------------------------------------------
   Canvas helpers
   ------------------------------------------------------------------------------------------------ */

/** Shrinks the font until the text fits the width; returns the size used. */
function fitFont(ctx, text, maxW, size, family, weight = '400') {
  let s = size;
  ctx.font = `${weight} ${s}px ${family}`;
  while (ctx.measureText(text).width > maxW && s > 10) {
    s -= 2;
    ctx.font = `${weight} ${s}px ${family}`;
  }
  return s;
}

function roundRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function starPath(ctx, cx, cy, n, ro, ri, rot = -Math.PI / 2) {
  ctx.beginPath();
  for (let k = 0; k < n * 2; k++) {
    const r = k & 1 ? ri : ro;
    const a = rot + (k * Math.PI) / n;
    const x = cx + Math.cos(a) * r;
    const y = cy + Math.sin(a) * r;
    if (k) ctx.lineTo(x, y);
    else ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/** Four-point sparkle with concave sides. */
function sparklePath(ctx, cx, cy, r) {
  ctx.beginPath();
  ctx.moveTo(cx, cy - r);
  ctx.quadraticCurveTo(cx, cy, cx + r, cy);
  ctx.quadraticCurveTo(cx, cy, cx, cy + r);
  ctx.quadraticCurveTo(cx, cy, cx - r, cy);
  ctx.quadraticCurveTo(cx, cy, cx, cy - r);
  ctx.closePath();
}

/** Symbols of the stations and product corners (the ten category symbols come from the figure kit). */
function drawStationSymbol(ctx, sym, cx, cy, s, bg) {
  ctx.save();
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#fff';
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  if (sym === 'book') {
    ctx.beginPath();
    ctx.moveTo(cx, cy - s * 0.3);
    ctx.quadraticCurveTo(cx - s * 0.45, cy - s * 0.6, cx - s * 0.9, cy - s * 0.45);
    ctx.lineTo(cx - s * 0.9, cy + s * 0.5);
    ctx.quadraticCurveTo(cx - s * 0.45, cy + s * 0.35, cx, cy + s * 0.62);
    ctx.quadraticCurveTo(cx + s * 0.45, cy + s * 0.35, cx + s * 0.9, cy + s * 0.5);
    ctx.lineTo(cx + s * 0.9, cy - s * 0.45);
    ctx.quadraticCurveTo(cx + s * 0.45, cy - s * 0.6, cx, cy - s * 0.3);
    ctx.fill();
    ctx.strokeStyle = bg;
    ctx.lineWidth = s * 0.07;
    ctx.beginPath();
    ctx.moveTo(cx, cy - s * 0.25);
    ctx.lineTo(cx, cy + s * 0.55);
    ctx.stroke();
    ctx.fillStyle = '#fff';
    sparklePath(ctx, cx + s * 0.55, cy - s * 0.85, s * 0.28);
    ctx.fill();
  } else if (sym === 'cauldron') {
    ctx.beginPath();
    ctx.ellipse(cx, cy + s * 0.15, s * 0.75, s * 0.55, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(cx - s * 0.85, cy - s * 0.4, s * 1.7, s * 0.18);
    ctx.fillRect(cx - s * 0.6, cy + s * 0.55, s * 0.12, s * 0.3);
    ctx.fillRect(cx + s * 0.48, cy + s * 0.55, s * 0.12, s * 0.3);
    for (const [ox, oy, rr] of [[-0.2, -0.65, 0.14], [0.18, -0.85, 0.1], [0.42, -0.6, 0.08]]) {
      ctx.beginPath();
      ctx.arc(cx + ox * s, cy + oy * s, rr * s, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.font = `700 ${s * 0.7}px ${THEME_FONT_FUN}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = bg;
    ctx.fillText('?', cx, cy + s * 0.2);
  } else if (sym === 'heart') {
    ctx.beginPath();
    ctx.moveTo(cx, cy + s * 0.75);
    ctx.bezierCurveTo(cx - s * 1.1, cy, cx - s * 0.6, cy - s * 0.9, cx, cy - s * 0.35);
    ctx.bezierCurveTo(cx + s * 0.6, cy - s * 0.9, cx + s * 1.1, cy, cx, cy + s * 0.75);
    ctx.fill();
  } else if (sym === 'tower') {
    for (let k = 0; k < 3; k++) {
      const w = s * (1.5 - k * 0.42);
      ctx.fillRect(cx - w / 2, cy + s * (0.55 - k * 0.5), w, s * 0.16);
    }
    ctx.fillRect(cx - s * 0.12, cy - s * 0.75, s * 0.24, s * 1.4);
    ctx.beginPath();
    ctx.moveTo(cx - s * 0.32, cy - s * 0.75);
    ctx.lineTo(cx + s * 0.32, cy - s * 0.75);
    ctx.lineTo(cx, cy - s * 1.05);
    ctx.closePath();
    ctx.fill();
  } else {
    roundRectPath(ctx, cx - s * 0.7, cy - s * 0.5, s * 1.4, s, s * 0.15);
    ctx.fill();
    ctx.fillStyle = bg;
    for (let k = 0; k < 3; k++) ctx.fillRect(cx - s * 0.7 + s * 0.15 + k * s * 0.45, cy - s * 0.5, s * 0.18, s);
  }
  ctx.restore();
}

/* ------------------------------------------------------------------------------------------------
   Surfaces: lacquer paint, striped wallpaper, painted night-sky ceiling
   ------------------------------------------------------------------------------------------------ */

/** Near-white glossy lacquer: faint brush strokes and blotches; the vertex colour tints it. Tile = 1 m. */
function genPaint(S, seed) {
  const n = new TileNoise(seed);
  const col = new Uint8ClampedArray(S * S * 4);
  const rough = new Uint8ClampedArray(S * S * 4);
  const h = new Float32Array(S * S);
  for (let y = 0; y < S; y++) {
    const v = y / S;
    for (let x = 0; x < S; x++) {
      const u = x / S;
      const stroke = n.fbm(u, v, 48, 3, 3);
      const grain = n.fbm(u, v, 96, 4, 2);
      const blot = n.fbm(u, v, 4, 4, 4);
      const val = 0.9 + 0.06 * (stroke - 0.5) + 0.06 * (blot - 0.5) - 0.04 * smooth(0.6, 0.8, grain);
      const j = y * S + x;
      putRGB(col, j * 4, 248 * val, 244 * val, 238 * val);
      putRough(rough, j * 4, 0.3 + 0.14 * blot + 0.08 * stroke);
      h[j] = 0.5 + 0.18 * stroke + 0.1 * grain;
    }
  }
  return finishSet(S, col, h, rough, 0.9, 1, 0.35);
}

/** Striped wallpaper: plum and aubergine bands, gilt pinstripes, sparkles and magenta diamonds. Tile = 1.2 m. */
function genWallpaper(S, seed) {
  const n = new TileNoise(seed);
  const c = makeCanvas(S, S);
  const ctx = c.getContext('2d');
  const k = S / 1024;
  const bands = 6;
  const bw = S / bands;
  for (let b = 0; b < bands; b++) {
    ctx.fillStyle = b & 1 ? '#5c1c63' : '#3d1148';
    ctx.fillRect(b * bw, 0, bw, S);
  }
  ctx.fillStyle = '#e8b04a';
  for (let b = 0; b < bands; b++) {
    ctx.fillRect(b * bw - 3 * k, 0, 6 * k, S);
    ctx.fillRect(b * bw + 11 * k, 0, 2 * k, S);
    ctx.fillRect(b * bw - 13 * k, 0, 2 * k, S);
  }
  for (let b = 0; b < bands; b += 2) {
    for (let q = 0; q < 4; q++) {
      const cx = b * bw + bw / 2;
      const cy = (q + 0.5) * (S / 4);
      ctx.fillStyle = '#e8b04a';
      sparklePath(ctx, cx, cy, 20 * k);
      ctx.fill();
      ctx.fillStyle = '#ff8a1f';
      ctx.beginPath();
      ctx.arc(cx, cy + S / 8, 5 * k, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  for (let b = 1; b < bands; b += 2) {
    for (let q = 0; q < 8; q++) {
      ctx.fillStyle = 'rgba(232,38,138,0.55)';
      const cx = b * bw + bw / 2;
      const cy = (q + 0.5) * (S / 8);
      ctx.beginPath();
      ctx.moveTo(cx, cy - 14 * k);
      ctx.lineTo(cx + 9 * k, cy);
      ctx.lineTo(cx, cy + 14 * k);
      ctx.lineTo(cx - 9 * k, cy);
      ctx.closePath();
      ctx.fill();
    }
  }
  const img = ctx.getImageData(0, 0, S, S);
  const d = img.data;
  const rough = new Uint8ClampedArray(S * S * 4);
  const h = new Float32Array(S * S);
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      const i = (y * S + x) * 4;
      const paper = n.fbm(x / S, y / S, 64, 64, 2);
      const stain = n.fbm(x / S, y / S, 3, 3, 4);
      const gilt = d[i] > 200 && d[i + 2] < 120 ? 1 : 0;
      const f = (0.9 + 0.12 * (paper - 0.5)) * (0.84 + 0.26 * stain);
      d[i] *= f;
      d[i + 1] *= f;
      d[i + 2] *= f;
      putRough(rough, i, gilt ? 0.34 : 0.78 + 0.1 * paper);
      h[y * S + x] = 0.4 + 0.35 * gilt + 0.12 * paper;
    }
  }
  ctx.putImageData(img, 0, 0);
  const roughCanvas = canvasFromRGBA(S, S, rough);
  return {
    map: toTexture(c, true, 1 / 1.2),
    normalMap: toTexture(canvasFromRGBA(S, S, normalFromHeight(h, S, S, 1.6)), false, 1 / 1.2),
    roughnessMap: toTexture(ROUGH_DIV > 1 ? shrinkCanvas(roughCanvas, ROUGH_DIV) : roughCanvas, false, 1 / 1.2),
    normalScale: 0.6,
    tint: null,
  };
}

/** Painted night-sky ceiling: deep indigo boards, gilt stars and comet swirls. Tile = 4 m. */
function genCeiling(S, seed) {
  const n = new TileNoise(seed);
  const r = rng(seed + 9);
  const c = makeCanvas(S, S);
  const ctx = c.getContext('2d');
  const k = S / 1024;
  const g = ctx.createLinearGradient(0, 0, S, S);
  g.addColorStop(0, '#1d0d3a');
  g.addColorStop(0.5, '#2a1050');
  g.addColorStop(1, '#1a0b34');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, S, S);
  ctx.strokeStyle = 'rgba(0,0,0,0.45)';
  ctx.lineWidth = 3 * k;
  for (let q = 0; q <= 16; q++) {
    ctx.beginPath();
    ctx.moveTo(0, (q * S) / 16);
    ctx.lineTo(S, (q * S) / 16);
    ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(255,200,110,0.22)';
  for (let q = 0; q < 5; q++) {
    const x = r() * S;
    const y = r() * S;
    ctx.beginPath();
    for (let a = 0; a < 9; a += 0.1) {
      const rad = (6 + a * 9) * k;
      if (a === 0) ctx.moveTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
      else ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
    }
    ctx.stroke();
  }
  for (let q = 0; q < 140; q++) {
    const x = r() * S;
    const y = r() * S;
    const s = (3 + r() * r() * 22) * k;
    ctx.fillStyle = r() < 0.75 ? '#f2c25a' : r() < 0.5 ? '#ff9a3c' : '#c7f06a';
    if (s > 9 * k) {
      starPath(ctx, x, y, 5, s, s * 0.45, r() * 6);
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(x, y, s * 0.4, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  const img = ctx.getImageData(0, 0, S, S);
  const d = img.data;
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      const i = (y * S + x) * 4;
      const f = 0.85 + 0.3 * n.fbm(x / S, y / S, 4, 4, 4);
      d[i] *= f;
      d[i + 1] *= f;
      d[i + 2] *= f;
    }
  }
  ctx.putImageData(img, 0, 0);
  return toTexture(c, true, 1 / 4);
}

/* ------------------------------------------------------------------------------------------------
   Rugs, straw, street, glass
   ------------------------------------------------------------------------------------------------ */

/** Long runner: magenta field, orange border, lime chevrons and gilt stars (mapped once over the rug). */
function genRunner() {
  const W = 1024;
  const H = 256;
  const c = makeCanvas(W, H);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#ff8a1f';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#5a1466';
  ctx.fillRect(10, 10, W - 20, H - 20);
  ctx.fillStyle = '#c4206f';
  ctx.fillRect(26, 26, W - 52, H - 52);
  ctx.strokeStyle = '#a8e03a';
  ctx.lineWidth = 9;
  for (let x = 60; x < W - 40; x += 64) {
    ctx.beginPath();
    ctx.moveTo(x - 22, H / 2 - 50);
    ctx.lineTo(x, H / 2 - 28);
    ctx.lineTo(x - 22, H / 2 - 6);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x - 22, H / 2 + 6);
    ctx.lineTo(x, H / 2 + 28);
    ctx.lineTo(x - 22, H / 2 + 50);
    ctx.stroke();
  }
  ctx.fillStyle = '#ffd23f';
  for (let x = 92; x < W - 40; x += 128) {
    starPath(ctx, x, H / 2, 5, 15, 6);
    ctx.fill();
  }
  const n = new TileNoise(77);
  const img = ctx.getImageData(0, 0, W, H);
  const d = img.data;
  const pile = new Float32Array(W * H);
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const p = n.free(x * 0.5, y * 0.5, 2);
      const wear = n.fbm(x / W, y / H, 6, 2, 4);
      const f = (0.8 + 0.3 * (p - 0.5)) * (0.84 + 0.26 * wear);
      const i = (y * W + x) * 4;
      d[i] *= f;
      d[i + 1] *= f;
      d[i + 2] *= f;
      pile[y * W + x] = p;
    }
  }
  ctx.putImageData(img, 0, 0);
  return { map: clampTex(toTexture(c, true)), normalMap: clampTex(toTexture(canvasFromRGBA(W, H, normalFromHeight(pile, W, H, 1.2)), false)) };
}

/** Round carousel rug under the tower: concentric segments in the shop colours. */
function genRoundRug() {
  const S = 512;
  const c = makeCanvas(S, S);
  const ctx = c.getContext('2d');
  const cx = S / 2;
  const rings = [[250, '#ff8a1f'], [238, '#3d1148'], [222, null], [150, '#a8e03a'], [138, '#5a1466'], [96, '#ffd23f'], [84, '#c4206f'], [40, '#ff8a1f']];
  for (const [rad, colr] of rings) {
    if (colr === null) {
      for (let k = 0; k < 16; k++) {
        ctx.fillStyle = k & 1 ? '#e8268a' : '#7b2fbf';
        ctx.beginPath();
        ctx.moveTo(cx, cx);
        ctx.arc(cx, cx, rad, (k * Math.PI) / 8, ((k + 1) * Math.PI) / 8);
        ctx.closePath();
        ctx.fill();
      }
      continue;
    }
    ctx.fillStyle = colr;
    ctx.beginPath();
    ctx.arc(cx, cx, rad, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = '#ffd23f';
  for (let k = 0; k < 12; k++) {
    const a = (k / 12) * Math.PI * 2;
    starPath(ctx, cx + Math.cos(a) * 186, cx + Math.sin(a) * 186, 5, 13, 5);
    ctx.fill();
  }
  const n = new TileNoise(78);
  const img = ctx.getImageData(0, 0, S, S);
  const d = img.data;
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      const i = (y * S + x) * 4;
      const f = 0.8 + 0.3 * (n.free(x * 0.5, y * 0.5, 2) - 0.5);
      d[i] *= f;
      d[i + 1] *= f;
      d[i + 2] *= f;
      if (Math.hypot(x - cx, y - cx) > 252) d[i + 3] = 0;
    }
  }
  ctx.putImageData(img, 0, 0);
  return clampTex(toTexture(c, true));
}

/** Packing straw (excelsior): with a background colour for the heap mounds, transparent for the floor strands. */
function genStraw(bg) {
  const S = 512;
  const c = makeCanvas(S, S);
  const ctx = c.getContext('2d');
  const r = rng(616);
  if (bg) {
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, S, S);
  }
  ctx.lineCap = 'round';
  for (let k = 0; k < 2600; k++) {
    const x = r() * S;
    const y = r() * S;
    const a = r() * Math.PI * 2;
    const len = 18 + r() * 60;
    const t = 0.55 + r() * 0.45;
    ctx.strokeStyle = `rgba(${Math.round(196 * t)},${Math.round(150 * t)},${Math.round(78 * t)},${0.75 + r() * 0.25})`;
    ctx.lineWidth = 1 + r() * 2.2;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x + Math.cos(a + 0.6) * len * 0.5, y + Math.sin(a + 0.6) * len * 0.5, x + Math.cos(a) * len, y + Math.sin(a) * len);
    ctx.stroke();
    for (const ox of [-S, S]) {
      if (x + Math.cos(a) * len > S || x + Math.cos(a) * len < 0) {
        ctx.beginPath();
        ctx.moveTo(x + ox, y);
        ctx.lineTo(x + ox + Math.cos(a) * len, y + Math.sin(a) * len);
        ctx.stroke();
      }
    }
  }
  return toTexture(c, true);
}

/** Night street of Abszol út across the road: crooked facades, warm windows, glowing signboards, lamps. */
function genStreetScene() {
  const W = 2048;
  const H = 1024;
  const c = makeCanvas(W, H);
  const ctx = c.getContext('2d');
  const r = rng(4242);
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#060818');
  sky.addColorStop(0.35, '#121a3c');
  sky.addColorStop(0.6, '#2a2050');
  sky.addColorStop(1, '#1a1428');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);
  for (let k = 0; k < 500; k++) {
    ctx.fillStyle = `rgba(220,226,255,${((0.2 + r() * 0.7) * (1 - k / 600)).toFixed(3)})`;
    ctx.fillRect(r() * W, r() * H * 0.3, r() < 0.1 ? 2 : 1, r() < 0.1 ? 2 : 1);
  }
  const ground = H * 0.86;
  let x = -20;
  const facades = [];
  while (x < W) {
    const w = 150 + r() * 190;
    facades.push({ x, w, top: H * (0.12 + r() * 0.2), lean: (r() - 0.5) * 0.08, hue: r() });
    x += w - 4;
  }
  const tones = ['#1c1426', '#221a2e', '#18121f', '#261b24', '#1a1a2a'];
  for (const f of facades) {
    ctx.fillStyle = tones[Math.floor(f.hue * tones.length)];
    ctx.beginPath();
    ctx.moveTo(f.x, ground);
    ctx.lineTo(f.x + f.lean * 400, f.top + 40);
    ctx.lineTo(f.x + f.w * 0.5 + f.lean * 420, f.top - 30 - r() * 60);
    ctx.lineTo(f.x + f.w + f.lean * 400, f.top + 30);
    ctx.lineTo(f.x + f.w, ground);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#0d0912';
    ctx.fillRect(f.x + f.w * 0.62 + f.lean * 300, f.top - 50, 16, 46);
    const rows = 3 + Math.floor(r() * 2);
    for (let row = 0; row < rows; row++) {
      const wy = f.top + 70 + row * ((ground - f.top - 260) / rows);
      const cols = 2 + Math.floor(r() * 2);
      for (let col = 0; col < cols; col++) {
        const wx = f.x + 24 + col * ((f.w - 48) / cols) + f.lean * (ground - wy) * 0.5;
        const ww = (f.w - 48) / cols - 26;
        const lit = r() < 0.7;
        ctx.shadowColor = '#ffae4a';
        ctx.shadowBlur = lit ? 18 : 0;
        ctx.fillStyle = lit ? (r() < 0.8 ? '#ffb75a' : '#ffd99a') : '#2a2236';
        ctx.fillRect(wx, wy, ww, 44);
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#120c18';
        ctx.fillRect(wx + ww / 2 - 2, wy, 4, 44);
        ctx.fillRect(wx, wy + 20, ww, 3);
      }
    }
    const sx = f.x + f.w / 2;
    const sw = f.w * 0.62;
    const sx0 = sx - sw / 2;
    const sh = 128;
    const sy0 = ground - 150;
    const colr = ['#ff6ac1', '#7ee0ff', '#c7f06a', '#ffcf5a', '#ff8a4a'][Math.floor(r() * 5)];
    // Signboard: a dark board, a coloured rim and gilt squiggles that only suggest lettering.
    ctx.fillStyle = '#140c16';
    ctx.fillRect(sx0 - 6, sy0 - 66, sw + 12, 40);
    ctx.strokeStyle = colr;
    ctx.lineWidth = 4;
    ctx.strokeRect(sx0 - 4, sy0 - 64, sw + 8, 36);
    ctx.strokeStyle = '#e8b85a';
    ctx.lineWidth = 3;
    ctx.beginPath();
    let qx = sx0 + 14;
    while (qx < sx0 + sw - 30) {
      const qw = 10 + r() * 16;
      ctx.moveTo(qx, sy0 - 46);
      ctx.bezierCurveTo(qx + qw * 0.3, sy0 - 60, qx + qw * 0.7, sy0 - 32, qx + qw, sy0 - 46);
      qx += qw + (r() < 0.2 ? 12 : 3);
    }
    ctx.stroke();
    // Striped awning above the shop window.
    const stripes = 8;
    const aw = (sw + 20) / stripes;
    ctx.globalAlpha = 0.85;
    for (let k = 0; k < stripes; k++) {
      ctx.fillStyle = k & 1 ? colr : '#efe0c8';
      const ax = sx0 - 10 + k * aw;
      ctx.beginPath();
      ctx.moveTo(ax, sy0 - 24);
      ctx.lineTo(ax + aw, sy0 - 24);
      ctx.lineTo(ax + aw + 4, sy0 - 4);
      ctx.lineTo(ax + 4, sy0 - 4);
      ctx.closePath();
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    // Warm small-paned shop window with goods silhouetted against the light.
    const glow = ctx.createLinearGradient(0, sy0, 0, sy0 + sh);
    glow.addColorStop(0, '#ffc870');
    glow.addColorStop(1, '#c8641e');
    ctx.shadowColor = '#ff9a40';
    ctx.shadowBlur = 22;
    ctx.fillStyle = glow;
    ctx.fillRect(sx0, sy0, sw, sh);
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(70,26,30,0.6)';
    for (let k = 0; k < 9; k++) {
      const gw = 8 + r() * 18;
      const gh = 14 + r() * 46;
      const gx = sx0 + 6 + r() * (sw - gw - 12);
      if (r() < 0.5) ctx.fillRect(gx, sy0 + sh - gh, gw, gh);
      else {
        ctx.beginPath();
        ctx.arc(gx + gw / 2, sy0 + sh - gh * 0.5, gw * 0.6, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.fillStyle = 'rgba(28,14,22,0.92)';
    const paneCols = 6;
    for (let k = 0; k <= paneCols; k++) ctx.fillRect(sx0 + (k * sw) / paneCols - 2, sy0, 4, sh);
    for (const fy of [sh / 3, (2 * sh) / 3]) ctx.fillRect(sx0, sy0 + fy - 2, sw, 4);
    ctx.fillRect(sx0 - 4, sy0 + sh - 2, sw + 8, 8);
  }
  const street = ctx.createLinearGradient(0, ground, 0, H);
  street.addColorStop(0, '#2a2232');
  street.addColorStop(1, '#3a2c38');
  ctx.fillStyle = street;
  ctx.fillRect(0, ground, W, H - ground);
  for (const lx of [260, 1020, 1760]) {
    ctx.fillStyle = '#0a0810';
    ctx.fillRect(lx - 4, ground - 300, 8, 300);
    const g = ctx.createRadialGradient(lx, ground - 310, 0, lx, ground - 310, 90);
    g.addColorStop(0, 'rgba(255,220,150,1)');
    g.addColorStop(0.2, 'rgba(255,190,110,0.6)');
    g.addColorStop(1, 'rgba(255,170,90,0)');
    ctx.fillStyle = g;
    ctx.fillRect(lx - 90, ground - 400, 180, 180);
  }
  const haze = ctx.createLinearGradient(0, H * 0.4, 0, ground);
  haze.addColorStop(0, 'rgba(60,50,90,0)');
  haze.addColorStop(1, 'rgba(70,50,90,0.35)');
  ctx.fillStyle = haze;
  ctx.fillRect(0, H * 0.4, W, ground - H * 0.4);
  return clampTex(toTexture(c, true));
}

/** Cobbles outside, very dark with warm reflections. Tile = 2 m. */
function genCobbles() {
  const S = 512;
  const c = makeCanvas(S, S);
  const ctx = c.getContext('2d');
  const r = rng(1919);
  ctx.fillStyle = '#100c12';
  ctx.fillRect(0, 0, S, S);
  for (let y = 0; y < 16; y++) {
    for (let x = 0; x < 16; x++) {
      const t = 26 + r() * 22;
      ctx.fillStyle = `rgb(${Math.round(t + 4)},${Math.round(t)},${Math.round(t + 6)})`;
      roundRectPath(ctx, x * 32 + (y & 1) * 16 + 2, y * 32 + 2, 28, 28, 9);
      ctx.fill();
    }
  }
  return toTexture(c, true, 0.5);
}

/** Small-paned shop window: painted plum glazing bars with a gilt line over faint glass (alpha). */
function genShopGlass() {
  const S = 512;
  const c = makeCanvas(S, S);
  const ctx = c.getContext('2d');
  ctx.fillStyle = 'rgba(14,16,30,0.14)';
  ctx.fillRect(0, 0, S, S);
  const g = ctx.createLinearGradient(0, 0, S, S);
  g.addColorStop(0, 'rgba(255,255,255,0)');
  g.addColorStop(0.45, 'rgba(255,255,255,0.035)');
  g.addColorStop(0.55, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, S, S);
  ctx.fillStyle = 'rgba(70,22,80,1)';
  for (const x of [0, S / 2]) ctx.fillRect(x - 9, 0, 18, S);
  for (const y of [0, S / 2]) ctx.fillRect(0, y - 9, S, 18);
  ctx.fillStyle = 'rgba(242,184,68,1)';
  for (const x of [0, S / 2]) ctx.fillRect(x - 2, 0, 4, S);
  for (const y of [0, S / 2]) ctx.fillRect(0, y - 2, S, 4);
  return toTexture(c, true, 1 / 0.8, 1 / 0.9);
}

/** Gilded lettering on the inside of the glass: the street reads it, so from inside it shows mirrored. */
function genGlassLettering() {
  const W = 1024;
  const H = 256;
  const c = makeCanvas(W, H);
  const ctx = c.getContext('2d');
  ctx.translate(W, 0);
  ctx.scale(-1, 1);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  fitFont(ctx, 'Weasley & Weasley', 900, 130, THEME_FONT_DISPLAY);
  ctx.lineWidth = 10;
  ctx.strokeStyle = 'rgba(60,14,60,0.9)';
  ctx.strokeText('Weasley & Weasley', W / 2, H / 2 + 6);
  const g = ctx.createLinearGradient(0, 40, 0, 220);
  g.addColorStop(0, '#fff2c0');
  g.addColorStop(0.5, '#f2b844');
  g.addColorStop(1, '#c47a1c');
  ctx.fillStyle = g;
  ctx.fillText('Weasley & Weasley', W / 2, H / 2 + 6);
  return clampTex(toTexture(c, true));
}

/** Light pool of an arched shop window on the floor (soft, with the glazing-bar shadows). */
function genShopWindowPool() {
  return maskTexture(256, 384, (ctx, w, h) => {
    ctx.filter = 'blur(6px)';
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(10, h - 10);
    ctx.lineTo(w - 10, h - 10);
    ctx.lineTo(w - 10, 120);
    ctx.ellipse(w / 2, 120, w / 2 - 10, 110, 0, 0, Math.PI, true);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#000';
    for (let k = 1; k < 3; k++) ctx.fillRect((k * w) / 3 - 4, 0, 8, h);
    for (let k = 1; k < 4; k++) ctx.fillRect(0, (k * h) / 4 - 4, w, 8);
    ctx.filter = 'none';
  });
}

/** Glowing spellbook spread for the Varázslatpult: parchment, gilt rule, coloured sparkles and runes. */
function genSpellPages() {
  const W = 512;
  const H = 256;
  const c = makeCanvas(W, H);
  const ctx = c.getContext('2d');
  const r = rng(321);
  const g = ctx.createRadialGradient(W / 2, H / 2, 10, W / 2, H / 2, W * 0.6);
  g.addColorStop(0, '#fff6dc');
  g.addColorStop(1, '#e2c58e');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(120,60,20,0.35)';
  ctx.fillRect(W / 2 - 3, 0, 6, H);
  for (const side of [0, 1]) {
    const x0 = side ? W / 2 + 30 : 30;
    ctx.strokeStyle = '#d98f24';
    ctx.lineWidth = 2;
    ctx.strokeRect(x0 - 10, 18, W / 2 - 40, H - 36);
    ctx.fillStyle = side ? '#7b2fbf' : '#e8268a';
    sparklePath(ctx, x0 + (W / 2 - 60) / 2, 62, 26);
    ctx.fill();
    ctx.fillStyle = 'rgba(70,30,60,0.75)';
    for (let y = 108; y < H - 34; y += 16) {
      let x = x0;
      while (x < x0 + W / 2 - 70) {
        const w = 6 + r() * 26;
        ctx.fillRect(x, y, w, 3);
        x += w + 6;
      }
    }
  }
  return clampTex(toTexture(c, true));
}

/** The twins' notice board on the left wall: purple board, gilt frame, pinned notes (no readable text). */
function genNoticeBoard() {
  const W = 256;
  const H = 320;
  const c = makeCanvas(W, H);
  const ctx = c.getContext('2d');
  const r = rng(909);
  ctx.fillStyle = '#4a1a56';
  ctx.fillRect(0, 0, W, H);
  for (let k = 0; k < 400; k++) {
    ctx.fillStyle = `rgba(0,0,0,${(r() * 0.12).toFixed(3)})`;
    ctx.fillRect(r() * W, r() * H, 2 + r() * 3, 2 + r() * 3);
  }
  const notes = [[30, 30, 110, 120, -0.06, '#fff1d6'], [140, 44, 92, 96, 0.08, '#ffd23f'], [44, 168, 96, 110, 0.05, '#a8e03a'], [150, 158, 84, 130, -0.07, '#ff7ac0']];
  for (const [x, y, w, h, rot, col] of notes) {
    ctx.save();
    ctx.translate(x + w / 2, y + h / 2);
    ctx.rotate(rot);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(-w / 2 + 4, -h / 2 + 5, w, h);
    ctx.fillStyle = col;
    ctx.fillRect(-w / 2, -h / 2, w, h);
    ctx.fillStyle = 'rgba(42,15,48,0.7)';
    for (let yy = -h / 2 + 22; yy < h / 2 - 10; yy += 12) {
      let xx = -w / 2 + 10;
      while (xx < w / 2 - 14) {
        const lw = 5 + r() * 18;
        ctx.fillRect(xx, yy, Math.min(lw, w / 2 - 10 - xx), 3);
        xx += lw + 4;
      }
    }
    ctx.fillStyle = '#e8268a';
    ctx.beginPath();
    ctx.arc(0, -h / 2 + 8, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  return clampTex(toTexture(c, true));
}

/* ------------------------------------------------------------------------------------------------
   Atlases: shop signs (categories and stations), product labels, decor banners
   ------------------------------------------------------------------------------------------------ */

/** Board palettes for the signs, cycled per unit: [board, edge, text, text outline]. */
const SIGN_BOARDS = [
  ['#ff8a1f', '#3a1442', '#2a0f30', '#ffe0b0'],
  ['#a8e03a', '#3a1442', '#2a0f30', '#f0ffd0'],
  ['#e8268a', '#2a0f30', '#fff1d6', '#5a0f3a'],
  ['#7b2fbf', '#ffd23f', '#fff1d6', '#2a0f30'],
  ['#2ec4b6', '#3a1442', '#1d0a22', '#e0fff9'],
];
/** Station signs after the ten category cells (index = 10 + k). */
const STATION_SIGNS = [
  { key: 'lectern', text: 'Varázslatpult', sym: 'book', medal: '#a8e03a', board: SIGN_BOARDS[3] },
  { key: 'cauldron', text: 'Szerencseüst', sym: 'cauldron', medal: '#e8268a', board: SIGN_BOARDS[0] },
  { key: 'boszi', text: 'Boszibűbáj Termékcsalád', sym: 'heart', medal: '#ff4fa3', board: ['#ffb3d9', '#c4206f', '#5a0f3a', '#fff0f8'] },
  { key: 'maxi', text: 'Maximuláns Termékcsalád', sym: 'box', medal: '#7b2fbf', board: SIGN_BOARDS[0] },
  { key: 'tower', text: 'Házkupa-torony', sym: 'tower', medal: '#f2b844', board: SIGN_BOARDS[2] },
];
const SIGN_ATLAS = { W: 1024, H: 1024, CW: 512, CH: 128, cols: 2 };

/**
 * Sign atlas (1024², 2 × 8 cells of 512 × 128): the ten category signs in catalog order, then the station signs.
 * Rounded lacquer board, gilt rule, a gilt medallion in the category colour with the kit's symbol, and the
 * Hungarian name in a bold display face with an outline.
 */
function genShopSignAtlas(categories) {
  const A = SIGN_ATLAS;
  const c = makeCanvas(A.W, A.H);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#3a1442';
  ctx.fillRect(0, 0, A.W, A.H);
  const cells = [
    ...categories.map((cat, i) => ({ text: cat.nameHu, cat, medal: cat.color, board: SIGN_BOARDS[i % 4] })),
    ...STATION_SIGNS.map((s) => ({ text: s.text, sym: s.sym, medal: s.medal, board: s.board })),
  ];
  const w = A.CW;
  const h = A.CH;
  cells.forEach((s, i) => {
    const x0 = (i % A.cols) * w;
    const y0 = Math.floor(i / A.cols) * h;
    const [board, edge, ink, outline] = s.board;
    ctx.save();
    ctx.translate(x0, y0);
    ctx.fillStyle = edge;
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = board;
    roundRectPath(ctx, 6, 6, w - 12, h - 12, 15);
    ctx.fill();
    const shine = ctx.createLinearGradient(0, 6, 0, h * 0.55);
    shine.addColorStop(0, 'rgba(255,255,255,0.28)');
    shine.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = shine;
    roundRectPath(ctx, 6, 6, w - 12, h * 0.45, 15);
    ctx.fill();
    ctx.strokeStyle = '#f2b844';
    ctx.lineWidth = 2.5;
    roundRectPath(ctx, 13, 13, w - 26, h - 26, 10);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    for (const [sx, sy, sr] of [[w - 32, 27, 6], [w - 47, h - 28, 4], [118, 24, 3.5]]) {
      sparklePath(ctx, sx, sy, sr);
      ctx.fill();
    }
    const mr = 45;
    const mcx = 13 + mr + 10;
    const mcy = h / 2;
    ctx.fillStyle = '#c47a1c';
    ctx.beginPath();
    ctx.arc(mcx, mcy, mr + 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffe08a';
    ctx.beginPath();
    ctx.arc(mcx, mcy, mr + 2.5, 0, Math.PI * 2);
    ctx.fill();
    const pale = s.cat && (s.cat.key === 'ghosts_elves');
    ctx.fillStyle = pale ? '#9aa0c0' : s.medal;
    ctx.beginPath();
    ctx.arc(mcx, mcy, mr - 2, 0, Math.PI * 2);
    ctx.fill();
    const mg = ctx.createRadialGradient(mcx - 13, mcy - 17, 2, mcx, mcy, mr);
    mg.addColorStop(0, 'rgba(255,255,255,0.35)');
    mg.addColorStop(1, 'rgba(0,0,0,0.25)');
    ctx.fillStyle = mg;
    ctx.beginPath();
    ctx.arc(mcx, mcy, mr - 2, 0, Math.PI * 2);
    ctx.fill();
    if (s.cat) {
      const dark = s.cat.key === 'hufflepuff' || s.cat.key === 'quidditch';
      try {
        drawCategorySymbol(ctx, s.cat.key, mcx - 29, mcy - 29, 58, { color: dark ? '#2a0f30' : '#ffffff', lineWidth: 4 });
      } catch (err) {
        console.warn('[world] sign symbol failed', s.cat.key, err);
      }
    } else drawStationSymbol(ctx, s.sym, mcx, mcy, 27, s.medal);
    const tx0 = mcx + mr + 15;
    const tw = w - tx0 - 24;
    const words = s.text.split(' ');
    let lines = [s.text];
    ctx.font = `400 60px ${THEME_FONT_DISPLAY}`;
    if (words.length > 1 && ctx.measureText(s.text).width > tw * 1.15) {
      const cut = Math.ceil(words.length / 2);
      lines = [words.slice(0, cut).join(' '), words.slice(cut).join(' ')];
    }
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const base = lines.length === 1 ? 58 : 42;
    let size = base;
    for (const l of lines) size = Math.min(size, fitFont(ctx, l, tw, base, THEME_FONT_DISPLAY));
    ctx.font = `400 ${size}px ${THEME_FONT_DISPLAY}`;
    const cxT = tx0 + tw / 2;
    lines.forEach((l, k) => {
      const ly = lines.length === 1 ? h / 2 + 3 : h / 2 + (k === 0 ? -size * 0.5 : size * 0.58);
      ctx.lineWidth = 6;
      ctx.lineJoin = 'round';
      ctx.strokeStyle = outline;
      ctx.strokeText(l, cxT, ly);
      ctx.fillStyle = ink;
      ctx.fillText(l, cxT, ly);
    });
    ctx.restore();
  });
  const t = clampTex(toTexture(c, true));
  return { tex: t, cols: A.cols, cw: A.CW / A.W, ch: A.CH / A.H };
}

/** UV rectangle [u0, v0, u1, v1] of a sign atlas cell. */
function signCellUV(i) {
  const A = SIGN_ATLAS;
  const u0 = ((i % A.cols) * A.CW) / A.W;
  const v1 = 1 - (Math.floor(i / A.cols) * A.CH) / A.H;
  const v0 = v1 - A.CH / A.H;
  return [u0 + 0.002, v0 + 0.002, u0 + A.CW / A.W - 0.002, v1 - 0.002];
}

/**
 * Product label atlas (1024², 8 × 8 cells of 128 px). Each cell's border is its plain base colour: the side faces of
 * a box sample that border, the front face shows the whole label. The first 16 cells carry the product names.
 */
function genProductAtlas() {
  const S = 1024;
  const C = 128;
  const c = makeCanvas(S, S);
  const ctx = c.getContext('2d');
  const r = rng(7070);
  const combos = [
    ['#ff8a1f', '#5a1466', '#ffd23f'], ['#7b2fbf', '#ffd23f', '#ff8a1f'], ['#e8268a', '#fff1d6', '#a8e03a'], ['#a8e03a', '#3a1442', '#e8268a'],
    ['#2ec4b6', '#2a0f30', '#ffd23f'], ['#ffd23f', '#7b2fbf', '#e8268a'], ['#e23b2e', '#ffd23f', '#fff1d6'], ['#3a1442', '#ff8a1f', '#a8e03a'],
    ['#ff7ac0', '#7b2fbf', '#fff1d6'], ['#47bef5', '#2a0f30', '#ff8a1f'], ['#5a1466', '#a8e03a', '#ff7ac0'], ['#ff8a1f', '#2a0f30', '#a8e03a'],
  ];
  const k = C / 256;
  for (let i = 0; i < 64; i++) {
    const x0 = (i % 8) * C;
    const y0 = Math.floor(i / 8) * C;
    let [bg, fg, ac] = combos[i % combos.length];
    if (i === CELL_MAXI) [bg, fg, ac] = ['#7b2fbf', '#ff8a1f', '#ffd23f'];
    if (i === CELL_BOSZI) [bg, fg, ac] = ['#ff7ac0', '#7a0f4a', '#fff1d6'];
    ctx.save();
    ctx.translate(x0, y0);
    ctx.scale(k, k);
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, 256, 256);
    const pattern = i < 16 ? i % 4 : i % 7;
    ctx.fillStyle = fg;
    ctx.strokeStyle = fg;
    ctx.globalAlpha = i < 16 ? 0.35 : 1;
    ctx.save();
    ctx.beginPath();
    ctx.rect(20, 20, 216, 216);
    ctx.clip();
    if (pattern === 0) {
      for (let q = -6; q < 8; q++) {
        ctx.beginPath();
        ctx.moveTo(q * 44, 20);
        ctx.lineTo(q * 44 + 22, 20);
        ctx.lineTo(q * 44 + 22 + 216, 236);
        ctx.lineTo(q * 44 + 216, 236);
        ctx.closePath();
        ctx.fill();
      }
    } else if (pattern === 1) {
      for (let y = 40; y < 230; y += 44) {
        for (let x = 40 + ((y / 44) & 1) * 22; x < 230; x += 44) {
          ctx.beginPath();
          ctx.arc(x, y, 11, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    } else if (pattern === 2) {
      for (let q = 0; q < 7; q++) {
        starPath(ctx, 40 + r() * 176, 40 + r() * 176, 5, 18 + r() * 14, 8);
        ctx.fill();
      }
    } else if (pattern === 3) {
      ctx.lineWidth = 12;
      for (let y = 46; y < 230; y += 46) {
        ctx.beginPath();
        for (let x = 20; x <= 236; x += 24) ctx.lineTo(x, y + ((x / 24) & 1 ? 12 : -12));
        ctx.stroke();
      }
    } else if (pattern === 4) {
      ctx.lineWidth = 10;
      ctx.beginPath();
      for (let a = 0; a < 18; a += 0.15) ctx.lineTo(128 + Math.cos(a) * a * 5.5, 128 + Math.sin(a) * a * 5.5);
      ctx.stroke();
    } else if (pattern === 5) {
      ctx.font = `400 150px ${THEME_FONT_FUN}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(r() < 0.5 ? '?' : '!', 128, 138);
    } else {
      ctx.fillRect(20, 92, 216, 26);
      ctx.fillRect(20, 138, 216, 26);
      ctx.fillStyle = ac;
      ctx.beginPath();
      ctx.arc(128, 128, 40, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
    if (i < 16) {
      ctx.fillStyle = ac;
      roundRectPath(ctx, 26, 70, 204, 116, 18);
      ctx.fill();
      ctx.strokeStyle = fg;
      ctx.lineWidth = 6;
      roundRectPath(ctx, 26, 70, 204, 116, 18);
      ctx.stroke();
      const name = PRODUCT_NAMES[i];
      const words = name.split(/(?<=-)| /);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = fg;
      const lines = name.length > 11 && words.length > 1
        ? [words.slice(0, Math.ceil(words.length / 2)).join(' ').replace('- ', '-'), words.slice(Math.ceil(words.length / 2)).join(' ')]
        : [name];
      let size = lines.length === 1 ? 46 : 36;
      for (const l of lines) size = Math.min(size, fitFont(ctx, l, 188, size, THEME_FONT_FUN));
      ctx.font = `400 ${size}px ${THEME_FONT_FUN}`;
      lines.forEach((l, q) => ctx.fillText(l, 128, lines.length === 1 ? 130 : 128 + (q ? 1 : -1) * size * 0.55));
      ctx.font = `400 22px ${THEME_FONT_FUN}`;
      ctx.fillText('W & W', 128, 40);
      ctx.fillText('Abszol út 93.', 128, 218);
    }
    ctx.restore();
  }
  return clampTex(toTexture(c, true));
}

/**
 * Decor banner atlas (1024²): the main hanging banner and its striped back, eight pennants, the twins' plate, the
 * "Zárva" door sign, the "Tűzijáték!" poster and the hanging "Kassza" plate. Rectangles are [x, y, w, h] in px.
 */
const DECO_BANNER = {
  main: [0, 0, 1024, 224], back: [0, 224, 1024, 32], pennant: (k) => [k * 128, 256, 128, 256],
  plate: [0, 512, 512, 128], closed: [512, 512, 256, 128], ad: [0, 640, 512, 128], till: [512, 640, 256, 128],
};

function decoBannerUV(rect) {
  const [x, y, w, h] = rect;
  return [x / 1024, 1 - (y + h) / 1024, (x + w) / 1024, 1 - y / 1024];
}

function genDecoBannerAtlas() {
  const S = 1024;
  const c = makeCanvas(S, S);
  const ctx = c.getContext('2d');
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  {
    const [x, y, w, h] = DECO_BANNER.main;
    ctx.fillStyle = '#7b2fbf';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#ff8a1f';
    ctx.fillRect(x, y, w, 23);
    ctx.fillRect(x, y + h - 23, w, 23);
    ctx.fillStyle = '#ffd23f';
    for (let k = 0; k < 40; k++) {
      starPath(ctx, x + 13 + k * 26, y + 11.5, 5, 6.5, 2.5);
      ctx.fill();
      starPath(ctx, x + 26 + k * 26, y + h - 11.5, 5, 6.5, 2.5);
      ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    for (let k = 0; k < 24; k++) ctx.fillRect(x + k * 45, y + 23, 22, h - 46);
    const g = ctx.createLinearGradient(0, y + 35, 0, y + 165);
    g.addColorStop(0, '#fff6cc');
    g.addColorStop(0.45, '#ffd23f');
    g.addColorStop(1, '#ff8a1f');
    const size = fitFont(ctx, 'Weasley Varázsvicc Vállalat', 920, 105, THEME_FONT_DISPLAY);
    ctx.font = `400 ${size}px ${THEME_FONT_DISPLAY}`;
    ctx.lineWidth = 13;
    ctx.strokeStyle = '#2a0f30';
    ctx.strokeText('Weasley Varázsvicc Vállalat', x + w / 2, y + 98);
    ctx.fillStyle = g;
    ctx.fillText('Weasley Varázsvicc Vállalat', x + w / 2, y + 98);
    ctx.font = `400 37px ${THEME_FONT_FUN}`;
    ctx.lineWidth = 6;
    ctx.strokeText('Abszol út 93.', x + w / 2, y + 170);
    ctx.fillStyle = '#a8e03a';
    ctx.fillText('Abszol út 93.', x + w / 2, y + 170);
    ctx.fillStyle = '#ff7ac0';
    for (const sx of [x + 85, x + w - 85]) {
      sparklePath(ctx, sx, y + 170, 20);
      ctx.fill();
    }
  }
  {
    const [x, y, w, h] = DECO_BANNER.back;
    for (let k = 0; k < 32; k++) {
      ctx.fillStyle = k & 1 ? '#ff8a1f' : '#7b2fbf';
      ctx.fillRect(x + k * 32, y, 32, h);
    }
  }
  const pens = [['#ff8a1f', '#7b2fbf'], ['#a8e03a', '#e8268a'], ['#e8268a', '#ffd23f'], ['#7b2fbf', '#a8e03a'], ['#2ec4b6', '#ff8a1f'], ['#ffd23f', '#e8268a'], ['#ff7ac0', '#5a1466'], ['#47bef5', '#ffd23f']];
  pens.forEach(([a, b], k) => {
    const [x, y, w, h] = DECO_BANNER.pennant(k);
    ctx.fillStyle = a;
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = b;
    if (k % 3 === 0) for (let s = 0; s < 6; s++) ctx.fillRect(x + s * 22 + 5, y, 11, h);
    else if (k % 3 === 1) {
      for (let s = 0; s < 5; s++) {
        starPath(ctx, x + w / 2, y + 30 + s * 45, 5, 17, 7);
        ctx.fill();
      }
    } else {
      for (let s = 0; s < 9; s++) {
        ctx.beginPath();
        ctx.moveTo(x, y + s * 30);
        ctx.lineTo(x + w / 2, y + s * 30 + 15);
        ctx.lineTo(x + w, y + s * 30);
        ctx.lineTo(x + w, y + s * 30 + 9);
        ctx.lineTo(x + w / 2, y + s * 30 + 24);
        ctx.lineTo(x, y + s * 30 + 9);
        ctx.closePath();
        ctx.fill();
      }
    }
    ctx.fillStyle = '#ffd23f';
    ctx.fillRect(x, y, w, 6);
  });
  {
    const [x, y, w, h] = DECO_BANNER.plate;
    ctx.fillStyle = '#2a0f30';
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = '#f2b844';
    ctx.lineWidth = 4;
    roundRectPath(ctx, x + 8, y + 8, w - 16, h - 16, 13);
    ctx.stroke();
    ctx.font = `400 60px ${THEME_FONT_DISPLAY}`;
    const g = ctx.createLinearGradient(0, y + 25, 0, y + 100);
    g.addColorStop(0, '#fff2c0');
    g.addColorStop(1, '#f2a03a');
    ctx.fillStyle = g;
    ctx.fillText('Weasley & Weasley', x + w / 2, y + h / 2 + 3);
  }
  {
    const [x, y, w, h] = DECO_BANNER.closed;
    ctx.fillStyle = '#fff1d6';
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = '#e8268a';
    ctx.lineWidth = 6;
    ctx.strokeRect(x + 7, y + 7, w - 14, h - 14);
    ctx.font = `400 60px ${THEME_FONT_FUN}`;
    ctx.fillStyle = '#7b2fbf';
    ctx.fillText(TXT.closedSign, x + w / 2, y + h / 2 + 3);
  }
  {
    const [x, y, w, h] = DECO_BANNER.till;
    ctx.fillStyle = '#7b2fbf';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#ff8a1f';
    ctx.fillRect(x, y, w, 13);
    ctx.fillRect(x, y + h - 13, w, 13);
    ctx.fillStyle = '#ffd23f';
    for (let k = 0; k < 10; k++) {
      starPath(ctx, x + 13 + k * 26, y + 6.5, 5, 4, 1.75);
      ctx.fill();
      starPath(ctx, x + 13 + k * 26, y + h - 6.5, 5, 4, 1.75);
      ctx.fill();
    }
    ctx.font = `400 56px ${THEME_FONT_FUN}`;
    ctx.lineWidth = 7;
    ctx.strokeStyle = '#2a0f30';
    ctx.strokeText('Kassza', x + w / 2, y + h / 2 + 3);
    const g = ctx.createLinearGradient(0, y + 35, 0, y + 95);
    g.addColorStop(0, '#fff6cc');
    g.addColorStop(1, '#ffd23f');
    ctx.fillStyle = g;
    ctx.fillText('Kassza', x + w / 2, y + h / 2 + 3);
  }
  {
    const [x, y, w, h] = DECO_BANNER.ad;
    ctx.fillStyle = '#ffd23f';
    ctx.fillRect(x, y, w, h);
    // The sunburst rays are longer than the cell: clip them so they do not paint over the neighbouring cells.
    ctx.save();
    ctx.beginPath();
    ctx.rect(x, y, w, h);
    ctx.clip();
    ctx.fillStyle = '#e8268a';
    for (let k = 0; k < 16; k++) {
      ctx.beginPath();
      ctx.moveTo(x + w / 2, y + h / 2);
      ctx.arc(x + w / 2, y + h / 2, w, (k * Math.PI) / 8, ((k + 0.5) * Math.PI) / 8);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
    ctx.font = `400 65px ${THEME_FONT_FUN}`;
    ctx.lineWidth = 9;
    ctx.strokeStyle = '#2a0f30';
    ctx.strokeText('Tűzijáték!', x + w / 2, y + h / 2 + 4);
    ctx.fillStyle = '#fff1d6';
    ctx.fillText('Tűzijáték!', x + w / 2, y + h / 2 + 4);
  }
  return clampTex(toTexture(c, true));
}

/* ------------------------------------------------------------------------------------------------
   Geometry helpers (metre-scaled UVs so tiling textures keep a real-world scale)
   ------------------------------------------------------------------------------------------------ */
const FACE_AXES = [['z', 'y'], ['z', 'y'], ['x', 'z'], ['x', 'z'], ['x', 'y'], ['x', 'y']];
const geoM = new THREE.Matrix4();
const geoQ = new THREE.Quaternion();
const geoE = new THREE.Euler();
const geoV = new THREE.Vector3();
const geoS = new THREE.Vector3();
const geoC = new THREE.Color();

/** Box with UVs in metres; the wood grain (texture V) runs along the given axis. o: x y z rx ry rz grain seed. */
function boxGeo(w, h, d, o = {}) {
  const g = new THREE.BoxGeometry(w, h, d);
  const uv = g.attributes.uv;
  const dims = { x: w, y: h, z: d };
  const grain = o.grain || 'y';
  const r = rng((o.seed || 1) * 7919 + 13);
  for (let f = 0; f < 6; f++) {
    const [ua, va] = FACE_AXES[f];
    const du = dims[ua];
    const dv = dims[va];
    const swap = grain === ua;
    const ox = r() * 3;
    const oy = r() * 3;
    for (let k = 0; k < 4; k++) {
      const i = f * 4 + k;
      const u = uv.getX(i);
      const v = uv.getY(i);
      if (swap) uv.setXY(i, v * dv + ox, u * du + oy);
      else uv.setXY(i, u * du + ox, v * dv + oy);
    }
  }
  if (o.x || o.y || o.z || o.rx || o.ry || o.rz) {
    geoE.set(o.rx || 0, o.ry || 0, o.rz || 0);
    geoM.compose(geoV.set(o.x || 0, o.y || 0, o.z || 0), geoQ.setFromEuler(geoE), geoS.set(1, 1, 1));
    g.applyMatrix4(geoM);
  }
  return g;
}

/** Turned (lathe) part with UVs scaled to metres along the axis. profile: [[radius, y], ...]. */
function latheGeo(profile, segments, x = 0, y = 0, z = 0, circumference = 0.25) {
  const pts = profile.map(([rad, yy]) => new THREE.Vector2(Math.max(rad, 0.0001), yy));
  const g = new THREE.LatheGeometry(pts, segments);
  const uv = g.attributes.uv;
  const len = profile[profile.length - 1][1] - profile[0][1];
  for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * circumference, uv.getY(i) * Math.max(0.05, Math.abs(len)));
  if (x || y || z) g.translate(x, y, z);
  return g;
}

function cylGeo(rt, rb, h, seg, x, y, z, open = false) {
  const g = new THREE.CylinderGeometry(rt, rb, h, seg, 1, open);
  g.translate(x, y, z);
  return g;
}

function sphereGeo(r, x, y, z, ws = 12, hs = 8) {
  const g = new THREE.SphereGeometry(r, ws, hs);
  g.translate(x, y, z);
  return g;
}

function scaleUV(g, su, sv) {
  const uv = g.attributes.uv;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * su, uv.getY(i) * sv);
  return g;
}

/** Applies a local-frame transform (origin + yaw) to a geometry built in a unit or prop frame. */
function placeGeo(g, ox, oy, oz, yaw) {
  geoM.makeRotationY(yaw);
  geoM.setPosition(ox, oy, oz);
  g.applyMatrix4(geoM);
  return g;
}

/** Local transform: translation, XYZ Euler rotation and scale (a new matrix). */
function dmat(x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, sx = 1, sy = 1, sz = 1) {
  geoE.set(rx, ry, rz);
  return new THREE.Matrix4().compose(geoV.set(x, y, z), geoQ.setFromEuler(geoE), geoS.set(sx, sy, sz));
}

/** A placement frame (origin on the floor plus yaw); local +Z faces into the room. */
class DecoFrame {
  constructor(x, z, yaw = 0, y = 0) {
    this.m = new THREE.Matrix4().compose(new THREE.Vector3(x, y, z), new THREE.Quaternion().setFromAxisAngle(UP_AXIS, yaw), new THREE.Vector3(1, 1, 1));
    this.yaw = yaw;
  }

  at(x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, sx = 1, sy = 1, sz = 1) {
    return new THREE.Matrix4().multiplyMatrices(this.m, dmat(x, y, z, rx, ry, rz, sx, sy, sz));
  }

  pt(x, y, z) {
    return new THREE.Vector3(x, y, z).applyMatrix4(this.m);
  }
}

/** Merges geometries that may mix indexed and non-indexed inputs; keeps position, normal and uv only. */
function mergeAny(geos) {
  const list = [];
  for (const g of geos) {
    let x = g.index ? g.toNonIndexed() : g;
    for (const name of Object.keys(x.attributes)) if (name !== 'position' && name !== 'normal' && name !== 'uv') x.deleteAttribute(name);
    if (!x.attributes.uv) x.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(x.attributes.position.count * 2), 2));
    if (!x.attributes.normal) x.computeVertexNormals();
    x.clearGroups();
    list.push(x);
    if (x !== g) g.dispose();
  }
  const merged = mergeGeometries(list, false);
  for (const x of list) x.dispose();
  return merged;
}

function staticMesh(geo, mat, cast = true, receive = true) {
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = cast;
  mesh.receiveShadow = receive;
  mesh.matrixAutoUpdate = false;
  mesh.updateMatrix();
  staticMeshes.push(mesh);
  scene.add(mesh);
  return mesh;
}

function flushGeometry(list, mat, cast = true, receive = true) {
  if (!list.length) return null;
  const mesh = staticMesh(mergeAny(list.splice(0)), mat, cast, receive);
  mesh.geometry.computeBoundingSphere();
  return mesh;
}

/** Vertex-coloured merge batch (one draw call per material): paint, gilt metal and emissive glow parts. */
class ColorBatch {
  constructor() {
    this.geos = [];
  }

  /** Adds a geometry (consumed) in the given colour, transformed by the matrix. */
  geo(g, color, m) {
    let geo = g;
    if (geo.index) {
      const ng = geo.toNonIndexed();
      geo.dispose();
      geo = ng;
    }
    if (m) geo.applyMatrix4(m);
    for (const k of Object.keys(geo.attributes)) if (k !== 'position' && k !== 'normal' && k !== 'uv') geo.deleteAttribute(k);
    if (!geo.attributes.normal) geo.computeVertexNormals();
    if (!geo.attributes.uv) geo.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(geo.attributes.position.count * 2), 2));
    const n = geo.attributes.position.count;
    const col = new Float32Array(n * 3);
    if (color instanceof THREE.Color) geoC.copy(color);
    else geoC.set(color);
    for (let i = 0; i < n; i++) {
      col[i * 3] = geoC.r;
      col[i * 3 + 1] = geoC.g;
      col[i * 3 + 2] = geoC.b;
    }
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    geo.clearGroups();
    this.geos.push(geo);
    return this;
  }

  box(color, m, w, h, d, grain = 'y') {
    return this.geo(boxGeo(w, h, d, { grain, seed: this.geos.length + 1 }), color, m);
  }

  cyl(color, m, rTop, rBot, h, seg = 16, open = false) {
    return this.geo(new THREE.CylinderGeometry(rTop, rBot, h, seg, 1, open), color, m);
  }

  sphere(color, m, r, ws = 16, hs = 10) {
    return this.geo(new THREE.SphereGeometry(r, ws, hs), color, m);
  }

  lathe(color, m, profile, seg = 16) {
    return this.geo(latheGeo(profile, seg, 0, 0, 0, 0.3), color, m);
  }

  torus(color, m, r, tube, rs = 8, ts = 24, arc = Math.PI * 2) {
    return this.geo(new THREE.TorusGeometry(r, tube, rs, ts, arc), color, m);
  }

  build(material, cast = true, receive = true, order = 0) {
    if (!this.geos.length) return null;
    const g = mergeGeometries(this.geos, false);
    for (const x of this.geos) x.dispose();
    this.geos = [];
    g.computeBoundingSphere();
    const mesh = new THREE.Mesh(g, material);
    mesh.castShadow = cast;
    mesh.receiveShadow = receive;
    mesh.renderOrder = order;
    mesh.matrixAutoUpdate = false;
    mesh.updateMatrix();
    scene.add(mesh);
    return mesh;
  }
}
/** Decor batches: paint (lacquered wood), metal (gilt and brass), glow (bulbs), glass, domes, lettering, straw. */
const DB = {};

/** Accumulates textured quads (AO strips, contact shadows, straw, light pools) into one draw call. */
class QuadBatch {
  constructor() {
    this.pos = [];
    this.uv = [];
    this.idx = [];
  }

  add(a, b, c, d, uv = null) {
    const base = this.pos.length / 3;
    this.pos.push(a.x, a.y, a.z, b.x, b.y, b.z, c.x, c.y, c.z, d.x, d.y, d.z);
    if (uv) this.uv.push(...uv);
    else this.uv.push(0, 0, 1, 0, 1, 1, 0, 1);
    this.idx.push(base, base + 1, base + 2, base, base + 2, base + 3);
  }

  /** Strip from an edge (v = 0, darkest) outwards (v = 1). */
  strip(p0, edgeDir, len, outDir, width) {
    const a = p0.clone();
    const b = p0.clone().addScaledVector(edgeDir, len);
    this.add(a, b, b.clone().addScaledVector(outDir, width), a.clone().addScaledVector(outDir, width));
  }

  /** Floor-aligned decal centred at (x, z) with size (w, d) and yaw. */
  floor(x, z, w, d, yaw = 0, y = 0.012, uvRepeat = 1) {
    const c = Math.cos(yaw);
    const s = Math.sin(yaw);
    const pt = (lx, lz) => new THREE.Vector3(x + lx * c + lz * s, y, z - lx * s + lz * c);
    const u = uvRepeat;
    this.add(pt(-w / 2, d / 2), pt(w / 2, d / 2), pt(w / 2, -d / 2), pt(-w / 2, -d / 2), [0, 0, u, 0, u, u, 0, u]);
  }

  mesh(mat, order = 1) {
    if (!this.pos.length) return null;
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.pos, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(this.uv, 2));
    g.setIndex(this.idx);
    g.computeVertexNormals();
    g.computeBoundingSphere();
    const m = new THREE.Mesh(g, mat);
    m.renderOrder = order;
    m.matrixAutoUpdate = false;
    m.updateMatrix();
    scene.add(m);
    return m;
  }
}
const aoBatch = new QuadBatch();
const shadowBatch = new QuadBatch();
const roundBatch = new QuadBatch();
/** Decor quad batches: straw strands and light pools (cool street light, lime lectern glow, pink cauldron glow). */
const DQ = { straw: new QuadBatch(), pool: new QuadBatch(), poolWarm: new QuadBatch(), poolPink: new QuadBatch() };

/* ------------------------------------------------------------------------------------------------
   Camera-facing billboard batch (flames, halos, glints, pillars): one draw call per batch
   ------------------------------------------------------------------------------------------------ */
const BILLBOARD_VERT = `
attribute vec2 corner;
attribute vec3 center;
attribute vec2 bsize;
attribute vec4 bcolor;
uniform float uCyl;
varying vec2 vUv;
varying vec4 vColor;
#include <fog_pars_vertex>
void main() {
  vUv = corner * 0.5 + 0.5;
  vColor = bcolor;
  vec4 mvPosition;
  if (uCyl > 0.5) {
    vec3 camPos = cameraPosition;
    vec3 toCam = camPos - center;
    toCam.y = 0.0;
    vec3 right = normalize(cross(vec3(0.0, 1.0, 0.0), normalize(toCam + vec3(1e-5))));
    vec3 wp = center + right * corner.x * bsize.x + vec3(0.0, 1.0, 0.0) * (corner.y * 0.5 + 0.5) * bsize.y;
    mvPosition = viewMatrix * vec4(wp, 1.0);
  } else {
    mvPosition = viewMatrix * vec4(center, 1.0);
    mvPosition.xy += corner * bsize;
  }
  gl_Position = projectionMatrix * mvPosition;
  #include <fog_vertex>
}`;
const BILLBOARD_FRAG = `
uniform sampler2D map;
varying vec2 vUv;
varying vec4 vColor;
#include <fog_pars_fragment>
void main() {
  vec4 t = texture2D(map, vUv);
  gl_FragColor = vec4(t.rgb * vColor.rgb, t.a * vColor.a);
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
}`;

class BillboardBatch {
  constructor(capacity, map, { additive = true, cylindrical = false, order = 5, fog = false } = {}) {
    this.cap = capacity;
    this.n = 0;
    const g = new THREE.BufferGeometry();
    const corner = new Float32Array(capacity * 8);
    const idx = new Uint32Array(capacity * 6);
    for (let i = 0; i < capacity; i++) {
      corner.set([-1, -1, 1, -1, 1, 1, -1, 1], i * 8);
      idx.set([i * 4, i * 4 + 1, i * 4 + 2, i * 4, i * 4 + 2, i * 4 + 3], i * 6);
    }
    this.center = new Float32Array(capacity * 12);
    this.size = new Float32Array(capacity * 8);
    this.color = new Float32Array(capacity * 16);
    g.setAttribute('corner', new THREE.BufferAttribute(corner, 2));
    g.setAttribute('position', new THREE.BufferAttribute(this.center, 3));
    g.setAttribute('center', g.attributes.position);
    g.setAttribute('bsize', new THREE.BufferAttribute(this.size, 2).setUsage(THREE.DynamicDrawUsage));
    g.setAttribute('bcolor', new THREE.BufferAttribute(this.color, 4).setUsage(THREE.DynamicDrawUsage));
    g.attributes.position.setUsage(THREE.DynamicDrawUsage);
    g.setIndex(new THREE.BufferAttribute(idx, 1));
    g.setDrawRange(0, 0);
    this.geo = g;
    this.mat = new THREE.ShaderMaterial({
      uniforms: THREE.UniformsUtils.merge([THREE.UniformsLib.fog, { map: { value: map }, uCyl: { value: cylindrical ? 1 : 0 } }]),
      vertexShader: BILLBOARD_VERT,
      fragmentShader: BILLBOARD_FRAG,
      transparent: true,
      depthWrite: false,
      blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending,
      fog,
    });
    this.mat.uniforms.map.value = map;
    this.mesh = new THREE.Mesh(g, this.mat);
    this.mesh.frustumCulled = false;
    this.mesh.renderOrder = order;
    this.dirty = true;
    scene.add(this.mesh);
  }

  add(x, y, z, w, h, r, g, b, a = 1) {
    if (this.n >= this.cap) return -1;
    const i = this.n++;
    this.set(i, x, y, z, w, h, r, g, b, a);
    this.geo.setDrawRange(0, this.n * 6);
    return i;
  }

  set(i, x, y, z, w, h, r, g, b, a = 1) {
    this.setCenter(i, x, y, z);
    this.setSize(i, w, h);
    this.setColor(i, r, g, b, a);
  }

  setCenter(i, x, y, z) {
    const c = this.center;
    for (let k = 0; k < 4; k++) {
      c[i * 12 + k * 3] = x;
      c[i * 12 + k * 3 + 1] = y;
      c[i * 12 + k * 3 + 2] = z;
    }
    this.dirty = true;
  }

  setSize(i, w, h) {
    const s = this.size;
    for (let k = 0; k < 4; k++) {
      s[i * 8 + k * 2] = w;
      s[i * 8 + k * 2 + 1] = h;
    }
    this.dirty = true;
  }

  setColor(i, r, g, b, a = 1) {
    const c = this.color;
    for (let k = 0; k < 4; k++) {
      c[i * 16 + k * 4] = r;
      c[i * 16 + k * 4 + 1] = g;
      c[i * 16 + k * 4 + 2] = b;
      c[i * 16 + k * 4 + 3] = a;
    }
    this.dirty = true;
  }

  /** Sets the number of drawn sprites (sprites above it are kept but not drawn). */
  setCount(n) {
    this.n = Math.min(this.cap, n);
    this.geo.setDrawRange(0, this.n * 6);
  }

  commit() {
    if (!this.dirty) return;
    this.dirty = false;
    const a = this.geo.attributes;
    a.position.needsUpdate = true;
    a.bsize.needsUpdate = true;
    a.bcolor.needsUpdate = true;
  }
}

function surfaceMaterial(set, params = {}) {
  const m = new THREE.MeshStandardMaterial({
    map: set.map, normalMap: set.normalMap, roughnessMap: set.roughnessMap, roughness: 1, metalness: 0, ...params,
  });
  m.normalScale.setScalar(set.normalScale);
  if (set.tint) m.color.multiply(set.tint);
  return m;
}

/** Adds the shared decor clock and a vertex snippet after begin_vertex (one program per key). */
function patchDecoVertex(mat, key, decl, body) {
  mat.onBeforeCompile = (shader) => {
    shader.uniforms.uDecoTime = uDecoTime;
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', `#include <common>\nuniform float uDecoTime;\n${decl}`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>\n${body}`);
  };
  mat.customProgramCacheKey = () => key;
  return mat;
}

/**
 * Lacquered wood: the vertex colour over a near-white brushed lacquer, with the photo wood grain showing through
 * the paint (normal map) and a little grime that darkens the paint towards the floor (cheap material realism).
 */
function paintMaterial() {
  const S = TEX.sets;
  const m = new THREE.MeshStandardMaterial({
    vertexColors: true, map: S.paint.map, roughnessMap: S.paint.roughnessMap, normalMap: S.wood.normalMap, roughness: 1, metalness: 0, envMapIntensity: 0.85,
  });
  m.normalScale.setScalar(0.42);
  m.onBeforeCompile = (shader) => {
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\nvarying float vGrimeY;')
      .replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\nvGrimeY = (modelMatrix * vec4(transformed, 1.0)).y;');
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying float vGrimeY;')
      .replace('#include <color_fragment>', '#include <color_fragment>\ndiffuseColor.rgb *= mix(0.78, 1.0, smoothstep(0.0, 0.55, vGrimeY));');
  };
  m.customProgramCacheKey = () => 'deco-paint';
  return m;
}

  M.card = new THREE.MeshStandardMaterial({ map: TEX.card, roughness: 0.4, metalness: 0.1, emissive: 0xffffff, emissiveMap: TEX.card, emissiveIntensity: 0.12, side: THREE.DoubleSide });

function createRenderer(canvas) {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance', alpha: false, stencil: false });

/** Scene, camera and the lighting rig of the joke shop (DECISIONS.md 9a: the concept's lighting). */
function createScene() {
  const L = THEME_LIGHT;
  scene = new THREE.Scene();

  scene.fog = new THREE.FogExp2(fog, L.fogDensity);

  twinSpot = new THREE.SpotLight(0xfff0d8, L.spot, 14, 0.3, 0.55, 2);

/** A tiny stand-in of the shop (warm lamps, coloured walls, cool street windows) prefiltered into a PMREM. */
function createEnvironment() {
  const env = new THREE.Scene();
  const room = new THREE.Mesh(new THREE.BoxGeometry(16, 7, 12), new THREE.MeshBasicMaterial({ color: 0x2a1030, side: THREE.BackSide }));
  room.position.set(0, 3.4, 0);
  env.add(room);
  const add = (geo, color, x, y, z, ry = 0) => {
    const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color }));
    m.position.set(x, y, z);
    m.rotation.y = ry;
    env.add(m);
  };
  const warm = new THREE.Color(7, 4.6, 2.4);
  for (const l of THEME_LIGHT.lamps) add(new THREE.SphereGeometry(0.45, 12, 8), warm, l[0], l[1], l[2]);
  add(new THREE.PlaneGeometry(5, 2.4), new THREE.Color(1.6, 0.45, 0.05), -4, 1.6, -5.9);
  add(new THREE.PlaneGeometry(5, 2.4), new THREE.Color(1.2, 0.08, 0.6), 4, 1.6, -5.9);
  add(new THREE.PlaneGeometry(4, 2.4), new THREE.Color(0.35, 0.55, 0.08), -7.9, 1.6, 0, Math.PI / 2);
  add(new THREE.PlaneGeometry(4, 2.4), new THREE.Color(0.5, 0.15, 1.1), 7.9, 1.6, 0, -Math.PI / 2);
  for (const w of SHOP_WINDOWS) add(new THREE.PlaneGeometry(2.4, 3), new THREE.Color(0.15, 0.2, 0.45), w.cx, 2.2, 5.9, Math.PI);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(env, 0.04).texture;
  pmrem.dispose();
  env.traverse((o) => {
    if (o.isMesh) {
      o.geometry.dispose();
      o.material.dispose();
    }
  });
}

/** Four coloured-globe lamp clusters carry the hall; the workshop lantern; fireworks hearth and cauldron (Magas). */
function createPointLights() {
  const L = THEME_LIGHT;
  const defs = L.lamps.map(([x, y, z, i], k) => ({ id: `lamp${k}`, color: 0xffd2a0, i, d: 16, x, y, z, flicker: 0.04 }));
  defs.push({ id: 'lantern', color: 0xffb066, i: L.lantern, d: 8, x: 5.5, y: 2.35, z: -8.0, flicker: 0.4 });
  defs.push({ id: 'fire', color: 0xff8a3a, i: L.fire, d: 6, x: 1.7, y: 0.6, z: -5.2, flicker: 1.0, high: true });
  defs.push({ id: 'cauldron', color: 0xd65cff, i: L.cauldron, d: 5, x: CAULDRON.x, y: 1.25, z: CAULDRON.z, flicker: 0.5, high: true });
  for (const d of defs) {
    const l = new THREE.PointLight(d.color, d.i, d.d, 2);
    l.position.set(d.x, d.y, d.z);
    l.userData = { id: d.id, base: d.i, flicker: d.flicker, phase: d.x * 3.1 + d.z };
    scene.add(l);
    pointLights.push(l);
    if (d.high) highOnlyLights.push(l);
  }
}

function animateLights(t) {
  for (const l of pointLights) {
    const u = l.userData;
    const f = 0.86 + 0.08 * Math.sin(t * 11.3 + u.phase) + 0.05 * Math.sin(t * 23.1 + u.phase * 2.3) + 0.03 * Math.sin(t * 41.7 + u.phase * 0.7);
    l.intensity = u.base * (1 - u.flicker + u.flicker * (f + 0.07));
  }
}

/* ------------------------------------------------------------------------------------------------
   Hall shell: parquet, striped wallpaper, painted ceiling, beams, wainscot; the back workshop
   ------------------------------------------------------------------------------------------------ */

function archOutline(p, cx, hw, sill, spring, grow = 0) {
  p.moveTo(cx - hw - grow, sill - grow);
  p.lineTo(cx + hw + grow, sill - grow);
  p.lineTo(cx + hw + grow, spring);
  p.absarc(cx, spring, hw + grow, 0, Math.PI, false);
  p.lineTo(cx - hw - grow, sill - grow);
  return p;
}

function doorOutline(p, grow) {
  const x0 = SHOP_DOOR.minX - grow;
  const x1 = SHOP_DOOR.maxX + grow;
  const r = (x1 - x0) / 2;
  p.moveTo(x0, -0.05);
  p.lineTo(x1, -0.05);
  p.lineTo(x1, SHOP_DOOR.h - r + grow);
  p.absarc((x0 + x1) / 2, SHOP_DOOR.h - r + grow, r, 0, Math.PI, false);
  p.lineTo(x0, -0.05);
  return p;
}

/** Painted run along a wall (cornice, dado, skirting) between two floor-plan points. */
function wallRun(x0, z0, x1, z1, y, h, d, color) {
  const len = Math.hypot(x1 - x0, z1 - z0);
  const yaw = Math.atan2(-(z1 - z0), x1 - x0);
  DB.paint.box(color, dmat((x0 + x1) / 2, y, (z0 + z1) / 2, 0, yaw, 0), len, h, d, 'x');
}

function buildShell() {
  const H = HALL.h;

  shopF.rotateX(-Math.PI / 2);
  scaleUV(shopF, wd.maxX - wd.minX, -6.4 - wd.minZ);

  floors.push(shopF);
  const doorF = new THREE.PlaneGeometry(SHOP_DOORWAY.maxX - SHOP_DOORWAY.minX, 0.42);

  staticMesh(mergeAny(floors), M.floor, false, true);

  // Front wall with the two arched shop windows and the arched street door (0.4 m reveal).
  const front = new THREE.Shape();
  front.moveTo(HALL.minX - 0.2, -0.1);
  front.lineTo(HALL.maxX + 0.2, -0.1);
  front.lineTo(HALL.maxX + 0.2, H + 0.1);
  front.lineTo(HALL.minX - 0.2, H + 0.1);
  front.closePath();
  for (const w of SHOP_WINDOWS) front.holes.push(archOutline(new THREE.Path(), w.cx, w.hw, w.sill, w.spring));
  front.holes.push(doorOutline(new THREE.Path(), 0));
  const fg = new THREE.ExtrudeGeometry(front, { depth: 0.4, bevelEnabled: false, curveSegments: 24 });
  fg.translate(0, 0, HALL.maxZ);
  G.wall.push(fg);
  // Back wall with the arched doorway to the workshop.

  back.moveTo(HALL.minX - 0.2, -0.1);
  back.lineTo(HALL.maxX + 0.2, -0.1);
  back.lineTo(HALL.maxX + 0.2, H + 0.1);
  back.lineTo(HALL.minX - 0.2, H + 0.1);
  back.closePath();
  const dhw = (SHOP_DOORWAY.maxX - SHOP_DOORWAY.minX) / 2;
  back.holes.push(archOutline(new THREE.Path(), (SHOP_DOORWAY.minX + SHOP_DOORWAY.maxX) / 2, dhw, 0, SHOP_DOORWAY.spring));
  const bg = new THREE.ExtrudeGeometry(back, { depth: WALL_T, bevelEnabled: false, curveSegments: 16 });
  bg.translate(0, 0, HALL.minZ - WALL_T);
  G.wall.push(bg);
  const wall = (list, w, h, x, y, z, ry) => {
    const g = new THREE.PlaneGeometry(w, h);
    scaleUV(g, w, h);
    g.rotateY(ry);
    g.translate(x, y, z);

  };
  wall(G.wall, HALL.maxZ - HALL.minZ + 0.4, H + 0.3, HALL.minX, H / 2, 0, Math.PI / 2);
  wall(G.wall, HALL.maxZ - HALL.minZ + 0.4, H + 0.3, HALL.maxX, H / 2, 0, -Math.PI / 2);
  // The back workshop keeps bare ashlar walls behind the scenes.
  wall(G.stone, -6.4 - wd.minZ + 0.1, wd.h + 0.1, wd.maxX, wd.h / 2, (wd.minZ - 6.4) / 2, -Math.PI / 2);
  wall(G.stone, -6.4 - wd.minZ + 0.1, wd.h + 0.1, wd.minX, wd.h / 2, (wd.minZ - 6.4) / 2, Math.PI / 2);
  wall(G.stone, wd.maxX - wd.minX + 0.1, wd.h + 0.1, (wd.minX + wd.maxX) / 2, wd.h / 2, wd.minZ, 0);

  // Painted night-sky ceiling with beams, and the workshop's plain plank ceiling.
  const hc = new THREE.PlaneGeometry(HALL.maxX - HALL.minX, HALL.maxZ - HALL.minZ);
  hc.rotateX(Math.PI / 2);
  scaleUV(hc, 16, 12);

  staticMesh(hc, M.ceiling, false, false);
  const wc = new THREE.PlaneGeometry(wd.maxX - wd.minX, -6.4 - wd.minZ);

  scaleUV(wc, 5, 3.6);
  wc.translate((wd.minX + wd.maxX) / 2, wd.h, (wd.minZ - 6.4) / 2);
  const wbeams = [wc];
  for (const z of [-7.4, -8.8]) wbeams.push(boxGeo(wd.maxX - wd.minX, 0.24, 0.22, { grain: 'x', x: (wd.minX + wd.maxX) / 2, y: wd.h - 0.12, z, seed: 63 + z }));

  const runs = [[-8, -5.99, SHOP_DOORWAY.minX - 0.12, -5.99], [SHOP_DOORWAY.maxX + 0.12, -5.99, 8, -5.99], [-7.99, -6, -7.99, 6], [7.99, -6, 7.99, 6], [-8, 5.99, SHOP_DOOR.minX - 0.14, 5.99], [SHOP_DOOR.maxX + 0.14, 5.99, 8, 5.99]];

    wallRun(x0, z0, x1, z1, H - 0.16, 0.3, 0.22, PAL.plumLight);

  // Wall-floor and wall-ceiling occlusion strips.
  const ex = vec3(1, 0, 0);

/** Shop windows (plum frames, gilt ring, painted glazing bars, mirrored gilt lettering), the door and the street. */
function buildWindowsAndDoor() {
  const zIn = HALL.maxZ;
  for (const w of SHOP_WINDOWS) {
    const ring = archOutline(new THREE.Shape(), w.cx, w.hw, w.sill, w.spring, 0.16);
    ring.holes.push(archOutline(new THREE.Path(), w.cx, w.hw, w.sill, w.spring));
    DB.paint.geo(new THREE.ExtrudeGeometry(ring, { depth: 0.08, bevelEnabled: true, bevelThickness: 0.015, bevelSize: 0.015, bevelSegments: 1, curveSegments: 24 }), PAL.plumLight, dmat(0, 0, zIn - 0.06));
    const inner = archOutline(new THREE.Shape(), w.cx, w.hw, w.sill, w.spring, 0.04);
    inner.holes.push(archOutline(new THREE.Path(), w.cx, w.hw, w.sill, w.spring));
    DB.metal.geo(new THREE.ExtrudeGeometry(inner, { depth: 0.03, bevelEnabled: false, curveSegments: 24 }), PAL.gold, dmat(0, 0, zIn - 0.075));
    const gl = new THREE.ShapeGeometry(archOutline(new THREE.Shape(), w.cx, w.hw, w.sill, w.spring), 24);
    scaleUV(gl, 1, 1);
    DB.glass.geo(gl, 0xffffff, dmat(0, 0, zIn + 0.2));
    const lg = new THREE.PlaneGeometry(2.1, 0.52);
    lg.rotateY(Math.PI);
    DB.lettering.geo(lg, 0xffffff, dmat(w.cx, w.spring + 0.55, zIn + 0.18));
    // Window display box (kirakat) below the glass; its collider and support are added with the furniture.
    const F = new DecoFrame(w.cx, 5.675, Math.PI);
    DB.paint.box(PAL.plum, F.at(0, 0.45, 0), 2.4, 0.9, 0.45);
    DB.paint.box(PAL.orange, F.at(0, 0.92, 0), 2.44, 0.06, 0.5, 'x');
    DB.paint.box(PAL.magenta, F.at(0, 0.955, 0), 2.38, 0.01, 0.44, 'x');
    for (const sx of [-0.8, 0, 0.8]) DB.paint.box(PAL.purple, F.at(sx, 0.45, 0.232), 0.6, 0.55, 0.012);
    for (const sx of [-0.8, 0, 0.8]) DB.metal.box(PAL.gold, F.at(sx, 0.45, 0.226), 0.64, 0.59, 0.006);
    shadowBatch.floor(w.cx, 5.6, 2.8, 0.9, 0, 0.012);
    // Cool street light falling in through the glass.
    DQ.pool.floor(w.cx, 4.25, 2.5, 2.9, 0, 0.011);
  }
  // Street door: frame, leaf with a glazed top, brass knob and the "Zárva" sign.
  const dx0 = SHOP_DOOR.minX;
  const dx1 = SHOP_DOOR.maxX;
  const dcx = (dx0 + dx1) / 2;
  const ring = doorOutline(new THREE.Shape(), 0.14);
  ring.holes.push(doorOutline(new THREE.Path(), 0));
  DB.paint.geo(new THREE.ExtrudeGeometry(ring, { depth: 0.08, bevelEnabled: false, curveSegments: 20 }), PAL.orange, dmat(0, 0, zIn - 0.06));
  const leaf = doorOutline(new THREE.Shape(), -0.005);
  const r0 = (dx1 - dx0) / 2 - 0.16;
  const springY = SHOP_DOOR.h - (dx1 - dx0) / 2;
  const glassHole = () => {
    const p = new THREE.Path();
    p.moveTo(dx0 + 0.16, 1.45);
    p.lineTo(dx1 - 0.16, 1.45);
    p.lineTo(dx1 - 0.16, springY);
    p.absarc(dcx, springY, r0, 0, Math.PI, false);
    p.lineTo(dx0 + 0.16, 1.45);
    return p;
  };
  leaf.holes.push(glassHole());
  DB.paint.geo(new THREE.ExtrudeGeometry(leaf, { depth: 0.06, bevelEnabled: false, curveSegments: 20 }), PAL.plumLight, dmat(0, 0, zIn + 0.12));
  const gs = new THREE.Shape();
  gs.moveTo(dx0 + 0.16, 1.45);
  gs.lineTo(dx1 - 0.16, 1.45);
  gs.lineTo(dx1 - 0.16, springY);
  gs.absarc(dcx, springY, r0, 0, Math.PI, false);
  gs.lineTo(dx0 + 0.16, 1.45);
  DB.glass.geo(new THREE.ShapeGeometry(gs, 16), 0xffffff, dmat(0, 0, zIn + 0.15));

/* ------------------------------------------------------------------------------------------------
   Atmosphere: the theatre spot's volumetric cone, cool window shafts and dust motes in the spot
   ------------------------------------------------------------------------------------------------ */
const shaftMats = [];
const dust = { count: 260, points: null };

const SHAFT_VERT = `
attribute float along;
varying float vAlong;
varying vec3 vNormalV;
varying vec3 vViewPos;
varying vec3 vWorld;
void main() {
  vAlong = along;
  vec4 wp = modelMatrix * vec4(position, 1.0);
  vWorld = wp.xyz;
  vec4 mv = viewMatrix * wp;
  vViewPos = mv.xyz;
  vNormalV = normalize(normalMatrix * normal);
  gl_Position = projectionMatrix * mv;
}`;
const SHAFT_FRAG = `
uniform vec3 uColor;
uniform float uIntensity;
uniform float uFadeIn;
uniform float uTime;
varying float vAlong;
varying vec3 vNormalV;
varying vec3 vViewPos;
varying vec3 vWorld;
void main() {
  float facing = abs(dot(normalize(vNormalV), normalize(-vViewPos)));
  float soft = pow(facing, 2.2);
  float ends = smoothstep(0.0, uFadeIn, vAlong) * (1.0 - smoothstep(0.7, 1.0, vAlong));
  float drift = 0.8 + 0.2 * sin(vWorld.y * 2.3 + uTime * 0.31) * sin(vWorld.x * 1.9 - uTime * 0.23 + vWorld.z * 1.3);
  float nearFade = smoothstep(0.3, 1.6, length(vViewPos));
  gl_FragColor = vec4(uColor * (soft * ends * drift * nearFade * uIntensity), 1.0);
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
}`;

function shaftMaterial(color, intensity, fadeIn = 0.12) {
  const m = new THREE.ShaderMaterial({
    uniforms: { uColor: { value: new THREE.Color(...color) }, uIntensity: { value: intensity }, uFadeIn: { value: fadeIn }, uTime: uDecoTime },
    vertexShader: SHAFT_VERT,
    fragmentShader: SHAFT_FRAG,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    side: THREE.DoubleSide,
    forceSinglePass: true,
  });
  shaftMats.push(m);
  return m;
}

/** A cone from the spot to its target plus sheared prisms from the shop windows towards their floor pools. */
function buildShafts() {
  const p = twinSpot.position;
  const t = twinSpot.target.position;
  const len = p.distanceTo(t) * 1.15;
  const cone = new THREE.CylinderGeometry(0.12, len * Math.tan(twinSpot.angle * 0.78), len, 36, 3, true);
  cone.translate(0, -len / 2, 0);
  const along = new Float32Array(cone.attributes.position.count);
  for (let i = 0; i < along.length; i++) along[i] = -cone.attributes.position.getY(i) / len;
  cone.setAttribute('along', new THREE.BufferAttribute(along, 1));
  cone.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(vec3(0, -1, 0), t.clone().sub(p).normalize()));
  cone.translate(p.x, p.y, p.z);
  cone.computeBoundingSphere();
  const sm = new THREE.Mesh(cone, shaftMaterial([1.0, 0.85, 0.6], 0.075));
  sm.renderOrder = 4;
  sm.frustumCulled = false;
  scene.add(sm);
  const LIGHT = vec3(0, -0.75, -0.66).normalize();
  const wgeos = [];
  for (const w of SHOP_WINDOWS) {
    const g = new THREE.CylinderGeometry(1, 1, 1, 28, 2, true);
    const pp = g.attributes.position;
    const al = new Float32Array(pp.count);
    const cy = (w.sill + w.top) / 2;
    const hh = (w.top - w.sill) / 2;
    for (let i = 0; i < pp.count; i++) {
      const s = 0.5 - pp.getY(i);
      const wx = w.cx + pp.getX(i) * w.hw * 0.96;
      const wy = cy + pp.getZ(i) * hh * 0.96;
      const L = (wy / -LIGHT.y) * s;
      pp.setXYZ(i, wx + LIGHT.x * L, wy + LIGHT.y * L, HALL.maxZ + 0.2 + LIGHT.z * L);
      al[i] = s;
    }
    g.setAttribute('along', new THREE.BufferAttribute(al, 1));
    g.computeVertexNormals();
    wgeos.push(g);
  }
  const wg = mergeGeometries(wgeos, false);
  wg.computeBoundingSphere();
  const wm = new THREE.Mesh(wg, shaftMaterial([0.45, 0.55, 1.0], 0.022, 0.45));
  wm.renderOrder = 4;
  wm.frustumCulled = false;
  scene.add(wm);
}

const DUST_VERT = `
attribute vec4 aData;
uniform float uScale;
uniform float uTime;
uniform vec3 uFrom;
uniform vec3 uTo;
uniform float uRadius;
varying vec3 vCol;
void main() {
  float a = fract(aData.x + uTime * 0.006 * (0.5 + aData.w));
  vec3 axis = uTo - uFrom;
  vec3 dir = normalize(axis);
  vec3 side = normalize(cross(dir, vec3(0.0, 1.0, 0.0)));
  vec3 up2 = cross(side, dir);
  float rad = uRadius * a * sqrt(aData.y);
  float ang = aData.z * 6.2832 + uTime * 0.05;
  vec3 p = uFrom + axis * a + (side * cos(ang) + up2 * sin(ang)) * rad;
  p.y += sin(uTime * 0.4 + aData.z * 20.0) * 0.04;
  vec4 mv = modelViewMatrix * vec4(p, 1.0);
  float fade = smoothstep(0.1, 0.3, a) * (1.0 - smoothstep(0.8, 1.0, a)) * (0.5 + 0.5 * sin(uTime * 1.3 + aData.w * 30.0));
  vCol = vec3(1.0, 0.82, 0.55) * fade * 0.9;
  gl_PointSize = min(0.016 * uScale / max(-mv.z, 0.1), 40.0);
  gl_Position = projectionMatrix * mv;
}`;
const SPARK_FRAG = `
varying vec3 vCol;
void main() {
  float d = length(gl_PointCoord - 0.5) * 2.0;
  float core = exp(-d * d * 9.0);
  float halo = exp(-d * d * 2.2) * 0.35;
  float a = (core + halo) * (1.0 - smoothstep(0.9, 1.0, d));
  gl_FragColor = vec4(vCol * a, 1.0);
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
}`;

function decoPointsMaterial(vert, frag, extra = {}) {
  return new THREE.ShaderMaterial({
    uniforms: { uScale: uPointScale, uTime: uDecoTime, ...extra },
    vertexShader: vert,
    fragmentShader: frag,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
  });
}

/** Dust motes drifting down the theatre spot's cone (all animation in the shader). */
function buildDust(count) {
  dust.count = count;
  const r = rng(1234);
  const pos = new Float32Array(count * 3);
  const dat = new Float32Array(count * 4);
  for (let i = 0; i < count * 4; i++) dat[i] = r();
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aData', new THREE.BufferAttribute(dat, 4));
  const p = twinSpot.position.clone();
  const t = twinSpot.target.position.clone();
  const mt = decoPointsMaterial(DUST_VERT, SPARK_FRAG, {
    uFrom: { value: p }, uTo: { value: t.clone().lerp(p, -0.05) }, uRadius: { value: p.distanceTo(t) * Math.tan(twinSpot.angle * 0.7) },
  });
  dust.points = new THREE.Points(g, mt);
  dust.points.frustumCulled = false;
  dust.points.renderOrder = 6;
  scene.add(dust.points);
}
