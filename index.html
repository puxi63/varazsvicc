  },
  give(n) {
    pay(n, true);
    return GAME.galleons;
  },
  /** Aims at a record: teleports next to it and looks at its pick centre. */
  aimAt(key) {
    const rec = REC_BY_KEY.get(key);
    if (!rec) return null;
    const c = rec.pickC;
    let dx = c.x - PLAYER.pos.x;
    let dz = c.z - PLAYER.pos.z;
    const d = Math.hypot(dx, dz) || 1;
    if (d > 1.4) {
      PLAYER.pos.set(c.x - (dx / d) * 1.2, 0, c.z - (dz / d) * 1.2);
      resolvePlayer(PLAYER.pos);
      dx = c.x - PLAYER.pos.x;
      dz = c.z - PLAYER.pos.z;
    }
    PLAYER.yaw = Math.atan2(-dx, -dz);
    applyCamera();
    tv1.subVectors(c, camera.position);
    PLAYER.pitch = Math.atan2(tv1.y, Math.hypot(tv1.x, tv1.z));
    applyCamera();
    updateAim();
    return this.state();
  },
  /** Faces the slot of a design (or slot id) from in front of it. */
  aimSlot(id) {
    const s = WORLD.slotById[id];
    if (!s) return null;
    yawRotate(0, 1.1, s.yaw, tv5);
    PLAYER.pos.set(s.center.x + tv5.x, 0, s.center.z + tv5.z);
    resolvePlayer(PLAYER.pos);
    tv1.subVectors(s.center, tv2.set(PLAYER.pos.x, EYE_H, PLAYER.pos.z));
    PLAYER.yaw = Math.atan2(-tv1.x, -tv1.z);
    PLAYER.pitch = Math.atan2(tv1.y, Math.hypot(tv1.x, tv1.z));
    applyCamera();
    updateAim();
    return this.state();
  },
  pickNearest() {
    updateAim();
    if (!AIM.fig) return null;
    actionPick();
    return this.state();
  },
  placeTop() {
    updateAim();
    actionPlace();
    for (let k = 0; k < 30; k++) tick(1 / 60, false);
    return this.state();
  },
  sortFraction(f) {
    const list = REC.filter((r) => r.counted && r.state !== ST.SHELF_OK && r.state !== ST.HELD);
    const n = Math.floor(list.length * clamp01(f));
    for (let i = 0; i < n; i++) {
      const rec = list[i];
      const slot = slotFor(rec);
      if (!slot) continue;
      const pi = freePosition(slot);
      if (pi < 0) continue;
      if (rec.slot) unseat(rec);
      rec.wild = null;
      rec.spot = false;
      rec.paid = true;
      seatInSlot(rec, slot, pi);
    }
    for (const s of WORLD.slots) if (s.correct >= s.capacity) GAME.paidBonus.slots.add(s.id);
    for (const key in WORLD.units) if (unitComplete(key)) {
      GAME.paidBonus.shelves.add(key);
      celebrateShelf(key, false);
    }
    recount();
    return this.state();
  },
  openMenu(name, data) {
    openMenu(name, data || {});
    return this.state();
  },
  /** Opens the intro or the end letter (for screenshots). */
  letter(kind = 'intro') {
    openMenu('letter', { text: kind === 'end' ? TXT.letterEnd : TXT.letterIntro, title: TXT.letterTitle });
    return this.state();
  },
  /** World position and state of one figurine record. */
  where(key) {
    const rec = REC_BY_KEY.get(key);
    return rec ? { x: +rec.pos.x.toFixed(3), y: +rec.pos.y.toFixed(3), z: +rec.pos.z.toFixed(3), state: rec.state, pick: [+rec.pickC.x.toFixed(2), +rec.pickC.y.toFixed(2), +rec.pickC.z.toFixed(2)] } : null;
  },
  /** Id of the correct slot for a figurine record (design slot, tower tier, House Cup or honour place). */
  slotOf(key) {
    const rec = REC_BY_KEY.get(key);
    const slot = rec ? slotFor(rec) : null;
    return slot ? slot.id : null;
  },
  /** Keys of the hidden legendary copies waiting at their fixed spots. */
  spotKeys() {
    return REC.filter((r) => r.spot && r.state === ST.LOOSE).map((r) => r.key);
  },
  /** Faces a Csokibéka card from about 1 m away and returns the aim state. */
  aimCard(i) {
    const c = CARDS.list[i];
    if (!c) return null;
    let best = null;
    for (let k = 0; k < 16; k++) {
      const a = (k / 16) * Math.PI * 2;
      const x = c.pos.x + Math.sin(a) * 1.0;
      const z = c.pos.z + Math.cos(a) * 1.0;
      if (!inRoom(x, z) || insideCollider(x, z, 0.5)) continue;
      best = [x, z];
      break;
    }
    if (!best) return null;
    PLAYER.pos.set(best[0], 0, best[1]);
    tv1.subVectors(c.pos, tv2.set(best[0], EYE_H, best[1]));
    PLAYER.yaw = Math.atan2(-tv1.x, -tv1.z);
    PLAYER.pitch = Math.atan2(tv1.y, Math.hypot(tv1.x, tv1.z));
    applyCamera();
    updateAim();
    return this.state();
  },
  /** Live engine objects for automated diagnostics (not used by the game itself). */
  internals() {
    return { THREE, scene, camera, renderer, kit, composer, GAME, REC, WORLD, SNITCH, SETTINGS, MENU, LOOP, PLATES, slotPlateState, leavePile, PILE, AUDIO, OWN_MUSIC, cycleMusic };
  },
  /** Stands about `dist` metres from a world point on free floor and looks at it (Snitch, interactables, spots). */
  aimPoint(x, y, z, dist = 1.1) {
    let best = null;
    for (let k = 0; k < 24 && !best; k++) {
      const a = (k / 24) * Math.PI * 2;
      const px = x + Math.sin(a) * dist;
      const pz = z + Math.cos(a) * dist;
      if (inRoom(px, pz) && !insideCollider(px, pz, 0.5)) best = [px, pz];
    }
    if (!best) return null;
    PLAYER.pos.set(best[0], 0, best[1]);
    tv1.set(x - best[0], y - EYE_H, z - best[1]);
    PLAYER.yaw = Math.atan2(-tv1.x, -tv1.z);
    PLAYER.pitch = Math.atan2(tv1.y, Math.hypot(tv1.x, tv1.z));
    applyCamera();
    updateAim();
    return this.state();
  },
  setQuality(q) {
    SETTINGS.quality = q;
    storeSettings();
    applyQuality();
    return SETTINGS.quality;
  },
  /** Pile diagnostics: per heap counts, floating / sunk figurines and the largest support gap (metres). */
  pileAudit() {
    return pileAudit();
  },
  /** Text size setting (1.0–2.0), as the settings menu applies it. */
  setTextSize(v) {
    SETTINGS.textSize = v;
    storeSettings();
    applySettings();
    return SETTINGS.textSize;
  },
  newGame() {
    newGame(true);
    return this.state();
  },
  save() {
    return saveNow('debug');
  },
  loseContext() {
    const ext = renderer.getContext().getExtension('WEBGL_lose_context');
    if (ext) ext.loseContext();
    return !!ext;
  },
  fakePad: {
    connect() {
      FAKE_PAD.pad = makeFakePad();
      FAKE_PAD.active = true;
      return true;
    },
    disconnect() {
      FAKE_PAD.active = false;
      return true;
    },
    press(i) {
      const b = FAKE_PAD.pad.buttons[i];
      b.pressed = true;
      b.value = 1;
      FAKE_PAD.pad.timestamp = performance.now();
    },
    release(i) {
      const b = FAKE_PAD.pad.buttons[i];
      b.pressed = false;
      b.value = 0;
      FAKE_PAD.pad.timestamp = performance.now();
    },
    axes(a0, a1, a2, a3) {
      FAKE_PAD.pad.axes = [a0, a1, a2, a3];
      FAKE_PAD.pad.timestamp = performance.now();
    },
    /** Press and release a button over a few simulated frames. */
    tap(i) {
      this.press(i);
      tick(1 / 60, false);
      tick(1 / 60, false);
      this.release(i);
      tick(1 / 60, false);
      return DEBUG_API.state();
    },
  },
};

function wireLifecycle() {
  window.addEventListener('resize', () => {
    basePR = computeBasePixelRatio();
    updateRenderSize();
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (GAME.phase === 'play') pauseGame('hidden');
      if (GAME.dirty) saveNow('hidden');
      audioSuspend();
    } else {
      audioResume();
      dyn.cooldown = 2;
      LOOP.last = performance.now();
    }
  });
  window.addEventListener('pagehide', () => {
    if (GAME.dirty) saveNow('pagehide');
  });
}

    e.preventDefault();
    renderer.setAnimationLoop(null);

    try {
      if (GAME.phase === 'play' || GAME.dirty) saved = saveNow('context');

      saved = false;
    }

    UI.lostText.textContent = saved ? TXT.lostText : TXT.lostTextUnsaved;

    armReloadOverlay();
  });

  createEnvironment();
  createPointLights();
  applySettings();

  TEX.sets.wall = genWallpaper(lowMemTextures() ? 512 : 1024, 21);
  await yieldToBrowser();
  TEX.sets.stone = genStone(512, 23);
  await yieldToBrowser();
  generateTextures();

  // Figure geometries with progress (the kit builds synchronously from the cache afterwards).
  const ids = FIG_DESIGNS.map((d) => d.id);
  for (let i = 0; i < ids.length; i++) {
    if (i % 4 === 0) {
      setLoad(0.3 + 0.2 * (i / ids.length), fmt(TXT.loadFigures, { n: i, m: ids.length }));

    }
    try {
      buildFigureGeometry(ids[i]);

  }

  // after the loader is gone; the kit is then built once from the final geometry.
  if (typeof FIG_LOAD !== 'undefined' && FIG_LOAD.started) {
    const waitStart = performance.now();
    while (!FIG_LOAD.done && performance.now() - waitStart < 30000) {
      setLoad(0.5 + 0.2 * (FIG_LOAD.loaded / Math.max(1, FIG_LOAD.total)), fmt(TXT.loadFigures, { n: FIG_LOAD.loaded, m: FIG_LOAD.total }));

  }
  recount();
  setLoad(0.9, TXT.loadShaders);
  await yieldToBrowser();
  updateTitleCamera(0);
  try {
    await renderer.compileAsync(scene, camera);
  } catch {
    /* compilation also happens lazily on the first frame */
  }
  releaseTextureSources(canvasTextures);
  canvasTextures.length = 0;
  releaseTextureSources(photoTextures);
  photoTextures.length = 0;
  setLoad(1, TXT.loadReady);
  LOOP.last = 0;
  renderer.setAnimationLoop(frame);
  LOOP.running = true;
  setTimeout(() => UI.loader.classList.add('done'), 150);
  setTimeout(() => { UI.loader.hidden = true; }, 1200);
  if (resumeHot) {
    GAME.firstInput = true;
    startPlay();
  } else {
    GAME.phase = 'title';
    openMenu('title');
  }
  backGuard();
}

function start(data) {
  boot(data || {}).catch((err) => {
    console.error(err);
    showFatal(TXT.fatalLoadTitle, TXT.fatalLoadText);
  });
}

window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});

</script>
</body>
