/**
 * Docks the hover card at the left TV-safe margin, below the galleon / progress panel and above the spell medals
 * (both measured, so text size and resolution changes are followed); it sits near the old height when there is room.
 */
function layoutHoverCard() {
  const H = window.innerHeight;
  const vh = H / 100;
  const gap = 2 * vh;
  const tl = UI.hud ? UI.hud.querySelector('.tl') : null;
  const tlBottom = tl ? tl.getBoundingClientRect().bottom : 0;
  const sp = UI.spells ? UI.spells.getBoundingClientRect() : null;
  const floor = sp && sp.height > 0 ? sp.top : H * 0.95;
  const ts = SETTINGS.textSize || 1;
  const wanted = H * 0.5 - (12 + 10 * (ts - 1)) * vh;
  // Natural height of the current content: measured once without the height cap (one extra layout per card change).
  UI.card.style.setProperty('--card-maxh', 'none');
  const need = UI.card.offsetHeight;
  const top = Math.max(tlBottom + gap, Math.min(wanted, floor - gap - need));
  UI.card.style.setProperty('--card-top', `${Math.round(top)}px`);
  UI.card.style.setProperty('--card-maxh', `${Math.round(Math.max(12 * vh, floor - gap - top))}px`);
  // When the description has to shrink, show whole lines only (never a line cut in half).
  const desc = UI.ttDesc;
  desc.style.maxHeight = '';
  if (!desc.hidden && desc.scrollHeight > desc.clientHeight + 1) {
    const lh = parseFloat(getComputedStyle(desc).lineHeight) || 2.8 * vh;
    desc.style.maxHeight = `${Math.floor((desc.clientHeight + 1) / lh) * lh}px`;
  }
}

function cardActions(list) {
  return list.map(([a, label]) => `<span>${glyph(a)}${escapeHtml(label)}</span>`).join('');
}

function updateHoverCard() {
  if (!UI_DIRTY.card) return;
  UI_DIRTY.card = false;
  const show = GAME.phase === 'play' && !MENU.open;
  const rec = AIM.fig;
  let key = '';
  if (!show) key = 'none';
  else if (AIM.snitch) key = 'snitch';
  else if (AIM.card >= 0) key = `card${AIM.card}`;
  else if (rec) key = `fig${rec.h}:${rec.state}:${rec.slot ? rec.slot.correct : 0}:${SETTINGS.details}:${IN.device}:${GAME.stack.length}`;
  else if (AIM.slot) key = `slot${AIM.slot.id}:${AIM.slot.correct}:${AIM.slot.wrong}:${IN.device}:${stackTop() ? stackTop().id : ''}`;
  else key = 'none';
  const cross = UI.cross;
  cross.classList.toggle('on', key !== 'none');
  cross.classList.toggle('bad', !!(AIM.slot && stackTop() && !isCorrectFor(stackTop(), AIM.slot)));
  if (key === CARD_STATE.key) return;
  CARD_STATE.key = key;
  const card = UI.card;
  if (key === 'none') {
    card.classList.remove('show');
    return;
  }
  UI.ttKicker.classList.remove('bad');
  UI.ttDesc.hidden = !SETTINGS.details;
  if (AIM.snitch) {
    const d = FIG_BY_ID.golden_snitch;
    UI.ttKicker.textContent = TXT.kickWild;
    UI.ttTitle.textContent = d ? d.nameHu : '';
    setCardSymbol('quidditch');
    UI.ttCat.textContent = FIG_CATEGORIES[FIG_CATEGORY_INDEX.quidditch]?.nameHu || '';
    UI.ttRarity.textContent = TXT.rarityLegendary;
    setPips(0, 0);
    UI.ttCount.textContent = '';
    UI.ttDesc.textContent = TXT.flyerLine;
    UI.ttActions.innerHTML = cardActions([['catch', TXT.promptCatch]]);
  } else if (AIM.card >= 0) {
    UI.ttKicker.textContent = TXT.kickCard;
    UI.ttTitle.textContent = TXT.kickCard;
    setCardSymbol(null);
    UI.ttCat.textContent = TXT.cardLine;
    UI.ttRarity.textContent = `${cardCount()}/10`;
    setPips(0, 0);
    UI.ttCount.textContent = '';
    UI.ttDesc.textContent = '';
    UI.ttActions.innerHTML = cardActions([['pick', TXT.promptPick]]);
  } else if (rec) {
    const slot = slotFor(rec);
    let kick = TXT.kickLoose;
    if (rec.state === ST.SHELF_OK) kick = TXT.kickShelved;
    else if (rec.state === ST.SHELF_WRONG) {
      kick = TXT.kickWrong;
      UI.ttKicker.classList.add('bad');
    } else if (rec.state === ST.WILD) kick = TXT.kickWild;
    else if (rec.spot) kick = TXT.kickHidden;
    UI.ttKicker.textContent = kick;
    UI.ttTitle.textContent = rec.id === 'shopkeeper' ? GAME.name : rec.d.nameHu;
    setCardSymbol(rec.house || (rec.catIdx >= 0 ? rec.cat : null));
    UI.ttCat.textContent = categoryLine(rec);
    UI.ttRarity.textContent = rarityText(rec.d);
    if (slot) {
      setPips(slot.correct, slot.capacity, slot.wrong);
      UI.ttCount.textContent = fmt(TXT.onShelf, { n: slot.correct, m: slot.capacity });
    } else {
      setPips(0, 0);
      UI.ttCount.textContent = '';
    }
    UI.ttDesc.textContent = rec.d.tagHu || '';
    const acts = [[rec.state === ST.WILD ? 'catch' : 'pick', rec.state === ST.WILD ? TXT.promptCatch : TXT.promptPick], ['info', TXT.promptInfo]];
    UI.ttActions.innerHTML = cardActions(acts);
  } else if (AIM.slot) {
    const s = AIM.slot;
    UI.ttKicker.textContent = TXT.kickSlot;
    UI.ttTitle.textContent = s.id === 'honor' ? GAME.name : s.nameHu;
    const catKey = s.kind === 'tower' ? s.sector : s.kind === 'unit' ? s.unit : null;
    setCardSymbol(catKey);
    UI.ttCat.textContent = s.kind === 'tower' ? fmt(TXT.towerLine, { house: FIG_CATEGORIES[FIG_CATEGORY_INDEX[s.sector]].nameHu, size: FIG_TOWER_SIZES[s.sizeIndex].nameHu })
      : s.kind === 'top' ? TXT.towerTop : s.kind === 'honor' ? TXT.honorLine : FIG_CATEGORIES[s.catIdx]?.nameHu || '';
    const st = slotPlateState(s);
    UI.ttRarity.textContent = [TXT.plateEmpty, TXT.plateRoom, TXT.plateDone, TXT.plateWrong][st];
    if (st === PLATE_STATE.WRONG) UI.ttKicker.classList.add('bad');
    setPips(s.correct, s.capacity, s.wrong);
    UI.ttCount.textContent = fmt(TXT.slotFree, { n: s.capacity - s.correct - s.wrong });
    UI.ttDesc.textContent = '';
    UI.ttActions.innerHTML = stackTop() ? cardActions([['place', TXT.promptPlace]]) : '';
  }
  layoutHoverCard();
  card.classList.add('show');
}

const SPELL_CLS = ['', 'locked', 'active', 'active', 'cooling'];

function updateSpellHud() {
  const padBit = IN.device === 'pad' ? 1 : 0;
  for (let i = 0; i < UI.spellEls.length; i++) {
    const s = UI.spellEls[i];
    const k = s.key;
    const lvl = GAME.up[k];
    const cd = GAME.cd[k];
    // Mode: 0 ready, 1 locked, 2 Lumos active, 3 path active, 4 cooling; strings are only built when it changes.
    let mode = 0;
    let secs = 0;
    if (!lvl) mode = 1;
    else if (k === 'lumos' && LUMOS.t > 0) {
      mode = 2;
      secs = Math.ceil(LUMOS.t);
    } else if (k === 'path' && PATH.t > 0) {
      mode = 3;
      secs = Math.ceil(PATH.t);
    } else if (cd > 0) {
      mode = 4;
      secs = Math.ceil(cd);
    }
    const code = mode * 100000 + secs * 2 + padBit;
    if (code !== s.last) {
      s.last = code;
      s.state.textContent = mode === 1 ? TXT.spellLocked : mode === 2 || mode === 3 ? fmt(TXT.spellActive, { s: secs })
        : mode === 4 ? fmt(TXT.spellCooling, { s: secs }) : TXT.spellReady;
      s.medal.className = `medal ${SPELL_CLS[mode]}`;
      s.glyph.innerHTML = glyph(`spell${i + 1}`);
    }
    const p = mode === 4 ? cd / (spellCooldown(k) || 1) : 0;
    if (Math.abs(p - s.lastP) > 0.01 || (p === 0 && s.lastP !== 0)) {
      s.lastP = p;
      s.medal.style.setProperty('--p', p.toFixed(3));
    }
  }
  if (UI_DIRTY.spellPing) {
    const i = SPELL_KEYS.indexOf(UI_DIRTY.spellPing);
    UI_DIRTY.spellPing = null;
    if (i >= 0) {
      const m = UI.spellEls[i].medal;
      m.classList.remove('ping');
      void m.offsetWidth;
      m.classList.add('ping');
    }
  }
}

function updateCounters() {
  if (!UI_DIRTY.hud) return;
  UI_DIRTY.hud = false;
  if (HUD_CACHE.gal !== GAME.galleons) {
    HUD_CACHE.gal = GAME.galleons;
    UI.galVal.textContent = String(GAME.galleons);

  if (cards !== HUD_CACHE.cards) UI.chipCards.textContent = HUD_CACHE.cards = cards;

  if (UI.pauseHint.innerHTML !== ph) UI.pauseHint.innerHTML = ph;

}

let lastDevice = '';
function updateHud(dt) {
  const visible = GAME.phase === 'play' && !MENU.blocking;
  UI.hud.classList.toggle('off', !visible && GAME.phase !== 'finale');
  if (IN.device !== lastDevice) {

/* ---- 61-menus.js ---- */
/* ==== 61-menus.js — own focus model (exactly one focused item) and every menu: title, pause, map, missing list,
   Varázslatpult, Szerencseüst, settings, controls, letters, confirmations ==== */

const MENU = { open: false, blocking: false, current: null, stack: [] };

/* ------------------------------------------------------------------------------------------------
   Focus manager
   ------------------------------------------------------------------------------------------------ */

function menuItem(html, act, opts = {}) {
  const b = el('button', `item${opts.cls ? ` ${opts.cls}` : ''}`);
  b.type = 'button';
  b.innerHTML = html;
  b._act = act;
  if (opts.adj) b._adj = opts.adj;
  return b;
}

function wireItems(m) {
  m.items.forEach((it, i) => {
    it.addEventListener('mouseenter', () => setFocus(m, i, false));
    it.addEventListener('click', (e) => {
      e.preventDefault();
      setFocus(m, i, false);
      activate(m);
    });
  });
}

function setFocus(m, i, sound = true) {
  if (!m.items.length) return;
  i = clampTo(i, 0, m.items.length - 1);
  if (m.index === i && m.items[i].classList.contains('focused')) return;
  if (m.items[m.index]) m.items[m.index].classList.remove('focused');
  m.index = i;
  const it = m.items[i];
  it.classList.add('focused');
  if (sound) sfx('tick');
  const sc = it.closest('.scroll');
  if (sc) {
    // Keep the item clear of the edge fades (5vh) that mark more content above or below.
    const margin = Math.round(window.innerHeight * 0.055);
    const top = it.offsetTop - sc.offsetTop;
    const bottom = top + it.offsetHeight;
    if (top < sc.scrollTop + margin) sc.scrollTop = Math.max(0, top - margin);
    else if (bottom > sc.scrollTop + sc.clientHeight - margin) sc.scrollTop = bottom - sc.clientHeight + margin;
    updateScrollHint(sc);
  }
}

/** Pad / arrow scroll step for text-only scroll containers: a quarter of the visible height. */
function scrollStep(sc) {
  return Math.max(40, Math.round(sc.clientHeight * 0.25));
}

/** Toggles the top/bottom fade of a scroll container according to what is hidden. */
function updateScrollHint(sc) {
  const max = sc.scrollHeight - sc.clientHeight;
  sc.classList.toggle('more-above', max > 4 && sc.scrollTop > 4);
  sc.classList.toggle('more-below', max > 4 && sc.scrollTop < max - 4);
}

/** Wires the scroll fades of every scroll container in a freshly rendered menu. */
function wireScrollHints(root) {
  const list = root.querySelectorAll('.scroll');
  for (const sc of list) {
    sc.addEventListener('scroll', () => updateScrollHint(sc), { passive: true });
    requestAnimationFrame(() => updateScrollHint(sc));
  }
}

function activate(m) {
  const it = m.items[m.index];
  if (it && it._act) {
    sfx('confirm');
    it._act();
  }
}

/** Presses a menu swallows every frame so they never leak into gameplay (hoisted: no per-frame allocation). */
const MENU_CONSUMED = ['up', 'down', 'left', 'right', 'confirm', 'back', 'pause', 'tabPrev', 'tabNext', 'map', 'interact', 'drop', 'pick', 'place', 'cycle',
  'info', 'missing', 'spell1', 'spell2', 'spell3', 'throwStart', 'flourish', 'runToggle'];

function menuInput(dt) {
  const m = MENU.current;
  if (!m) return;
  const P = IN.pressed;
  const cols = m.cols || 1;
  if (P.up) setFocus(m, m.index - cols);
  if (P.down) setFocus(m, m.index + cols);
  const it = m.items[m.index];
  if (P.left) {
    if (it && it._adj) it._adj(-1);
    else if (cols > 1) setFocus(m, m.index - 1);
    else if (m.onTab) m.onTab(-1);
  }
  if (P.right) {
    if (it && it._adj) it._adj(1);
    else if (cols > 1) setFocus(m, m.index + 1);
    else if (m.onTab) m.onTab(1);
  }
  if ((P.tabPrev || P.tabNext) && m.onTab && IN.device === 'pad') m.onTab(P.tabPrev ? -1 : 1);
  if (P.confirm) activate(m);
  if (P.back || (P.pause && m.id !== 'title')) {
    if (m.onBack) {
      sfx('back');
      m.onBack();
    }
  } else if (P.map && m.id === 'map') {
    sfx('back');
    closeMenu();
  }
  if (MENU.current === m && m.update) m.update(dt);
  for (let i = 0; i < MENU_CONSUMED.length; i++) IN.consume(MENU_CONSUMED[i]);
}

/* ------------------------------------------------------------------------------------------------
   Opening and closing
   ------------------------------------------------------------------------------------------------ */

function openMenu(id, data = {}) {
  if (MENU.current) {
    MENU.stack.push({ id: MENU.current.id, data: MENU.current.data, index: MENU.current.index });
    MENU.current.root.remove();
  }
  MENU.open = true;
  releaseLock();
  renderMenu(id, data);
}

function renderMenu(id, data, index = 0) {
  if (MENU.current && MENU.current.root && MENU.current.root.parentNode) MENU.current.root.remove();
  const builder = MENU_BUILDERS[id];
  if (!builder) return;
  const d = data || (MENU.current && MENU.current.id === id ? MENU.current.data : {}) || {};
  const m = builder(d);
  m.id = id;
  m.data = d;
  m.index = 0;
  UI.layers.append(m.root);
  wireItems(m);
  wireScrollHints(m.root);
  MENU.current = m;
  MENU.blocking = m.blocking !== false;
  setFocus(m, m.defaultIndex ?? index, false);
  UI_DIRTY.card = true;
  UI_DIRTY.prompts = true;
}

function closeMenu() {
  const m = MENU.current;
  if (m) {
    m.root.remove();
    if (m.onClose) m.onClose();
  }
  MENU.current = null;
  const prev = MENU.stack.pop();
  if (prev) {
    renderMenu(prev.id, prev.data, prev.index);
    return;
  }
  MENU.open = false;
  MENU.blocking = false;
  UI_DIRTY.hud = true;
  UI_DIRTY.card = true;
  UI_DIRTY.prompts = true;
  if (GAME.phase === 'play') resumePlay();
}

function closeAllMenus() {
  MENU.stack.length = 0;
  if (MENU.current) {
    MENU.current.root.remove();
    MENU.current = null;
  }
  MENU.open = false;
  MENU.blocking = false;
}

function refreshMenuGlyphs() {
  const m = MENU.current;
  if (!m) return;
  renderMenu(m.id, m.data, m.index);
}

function layer(cls = 'dim') {
  return el('div', `layer ${cls}`);
}

function hintsRow(list) {
  const h = el('div', 'hints');
  h.innerHTML = list.map(([a, l]) => `<span>${glyph(a)}${escapeHtml(l)}</span>`).join('');
  return h;
}

function xboxCard() {

/* ---- Polctérkép (map + rules tabs) ----------------------------------------------------------------- */
function mapSvg() {
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '-8.8 -10.8 17.6 17.6');
  svg.setAttribute('class', 'map-svg');
  const add = (tag, attrs, text) => {
    const n = document.createElementNS(ns, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (text !== undefined) n.textContent = text;
    svg.append(n);
    return n;
  };
  add('rect', { x: HALL.minX, y: HALL.minZ, width: HALL.maxX - HALL.minX, height: HALL.maxZ - HALL.minZ, fill: 'rgba(58,20,66,0.85)', stroke: '#f2b844', 'stroke-width': 0.08 });
  add('rect', { x: SHOP_WORKSHOP.minX, y: SHOP_WORKSHOP.minZ, width: SHOP_WORKSHOP.maxX - SHOP_WORKSHOP.minX, height: -6.4 - SHOP_WORKSHOP.minZ, fill: 'rgba(36,14,40,0.85)', stroke: '#a8601a', 'stroke-width': 0.06 });
  add('rect', { x: SHOP_DOORWAY.minX, y: -6.45, width: SHOP_DOORWAY.maxX - SHOP_DOORWAY.minX, height: 0.5, fill: 'rgba(58,20,66,0.95)' });
  add('text', { x: (SHOP_WORKSHOP.minX + SHOP_WORKSHOP.maxX) / 2, y: -9.4, 'font-size': 0.42, fill: '#bdb098', 'text-anchor': 'middle' }, TXT.mapWorkshop);
  for (const key in WORLD.units) {
    const u = WORLD.units[key];
    const b = u.aabb;
    const cat = FIG_CATEGORIES[u.catIdx];
    let n = 0;
    let m = 0;
    for (const id of u.slotIds) {
      const s = WORLD.slotById[id];
      n += s.correct;
      m += s.capacity;
    }
    const done = n >= m;
    add('rect', { x: b.minX + 0.08, y: b.minZ + 0.08, width: b.maxX - b.minX - 0.16, height: b.maxZ - b.minZ - 0.16, fill: cat.color, stroke: done ? '#f2dca2' : '#2a1c10', 'stroke-width': done ? 0.12 : 0.04, rx: 0.06 });
    const cx = (b.minX + b.maxX) / 2;
    const cz = (b.minZ + b.maxZ) / 2;
    const tx = u.yaw === 0 ? cx : u.yaw > 0 ? b.maxX + 0.25 : b.minX - 0.25;
    // Back-wall labels sit above the hall outline (the side-wall labels run along the walls below them).
    const back = u.yaw === 0;
    const fs = back ? 0.36 : 0.42;
    const tz = back ? b.minZ - 0.2 - fs * 1.2 : cz;
    const anchor = back ? 'middle' : u.yaw > 0 ? 'start' : 'end';
    add('text', { x: tx, y: tz, 'font-size': fs, fill: '#f1e8d6', 'text-anchor': anchor, 'font-weight': 600, class: 'lbl' }, cat.nameHu);
    add('text', { x: tx, y: tz + fs * 1.2, 'font-size': fs * 0.9, fill: done ? '#f2dca2' : '#d8ccb0', 'text-anchor': anchor, class: 'lbl' }, done ? `${n}/${m} · ${TXT.mapDone}` : `${n}/${m}`);
    if (SYMBOL_URL[key]) add('image', { href: SYMBOL_URL[key], x: cx - 0.25, y: cz - 0.25, width: 0.5, height: 0.5 });
  }
  const counts = WORLD.heaps.map(() => 0);
  for (const r of REC) if ((r.state === ST.LOOSE || r.state === ST.WILD) && r.heap >= 0) counts[r.heap]++;
  WORLD.heaps.forEach((hp, i) => {
    if (hp.crate) add('rect', { x: hp.box.minX, y: hp.box.minZ, width: hp.box.maxX - hp.box.minX, height: hp.box.maxZ - hp.box.minZ, fill: 'rgba(120,80,40,0.7)', stroke: '#c9a35c', 'stroke-width': 0.04 });
    else add('ellipse', { cx: hp.x, cy: hp.z, rx: hp.rx, ry: hp.rz, fill: 'rgba(200,170,110,0.25)', stroke: '#c9a35c', 'stroke-width': 0.05, 'stroke-dasharray': '0.15 0.1' });
  });
  // Heap counts are drawn last (below) as small opaque badges, so a shelf label running across a heap circle can
  // never hide its number.
  const badges = WORLD.heaps.map((hp, i) => {
    // Badge in the lower part of the heap circle: the wall shelf labels run through the circle's middle row.
    const bx = hp.x;
    const bz = hp.crate ? hp.z : hp.z + hp.rz * 0.62;
    const txt = String(counts[i]);
    const w = 0.3 + 0.24 * txt.length;
    return [['rect', { x: bx - w / 2, y: bz - 0.27, width: w, height: 0.54, rx: 0.12, fill: 'rgba(42,28,16,0.92)', stroke: '#c9a35c', 'stroke-width': 0.04 }],
      ['text', { x: bx, y: bz + 0.15, 'font-size': 0.42, fill: '#f2dca2', 'text-anchor': 'middle', 'font-weight': 700 }, txt]];
  });
  // Decor footprints (the twins' automaton, the spiral stair, the törpegolymó display), so nothing surprises the player.
  for (const [x, z, r] of [[TWINS.x, TWINS.z, TWINS.r + 0.08], [STAIR.x, STAIR.z, STAIR.r + 0.1], [6.75, 4.05, 0.72]]) {
    add('circle', { cx: x, cy: z, r, fill: 'rgba(232,38,138,0.22)', stroke: 'rgba(255,122,192,0.6)', 'stroke-width': 0.04 });
  }
  add('circle', { cx: TOWER.x, cy: TOWER.z, r: TOWER.outerR, fill: 'rgba(201,163,92,0.35)', stroke: '#f2dca2', 'stroke-width': GAME.paidBonus.tower ? 0.12 : 0.05 });
  add('text', { x: TOWER.x, y: TOWER.z + 1.5, 'font-size': 0.34, fill: '#f1e8d6', 'text-anchor': 'middle' }, TXT.mapTower);
  for (const [x, z, label] of [[LECTERN.x, LECTERN.z, TXT.mapLectern], [CAULDRON.x, CAULDRON.z, TXT.mapCauldron], [(COUNTER.minX + COUNTER.maxX) / 2, (COUNTER.minZ + COUNTER.maxZ) / 2, TXT.mapCounter]]) {
    add('circle', { cx: x, cy: z, r: 0.28, fill: '#9c7434', stroke: '#f2dca2', 'stroke-width': 0.04 });
    add('text', { x, y: z + 0.7, 'font-size': 0.32, fill: '#bdb098', 'text-anchor': 'middle' }, label);
  }
  const px = PLAYER.pos.x;
  const pz = PLAYER.pos.z;
  const a = -PLAYER.yaw;
  const pts = [[0, -0.55], [0.32, 0.3], [0, 0.12], [-0.32, 0.3]].map(([x, y]) => {
    const c = Math.cos(a);
    const s = Math.sin(a);
    return `${px + x * c - y * s},${pz + x * s + y * c}`;
  }).join(' ');
  // Shelf labels go on top of the heap circles; the heap badges and the player marker go on top of everything.
  for (const n of svg.querySelectorAll('.lbl')) svg.append(n);
  for (const b of badges) for (const [tag, attrs, text] of b) add(tag, attrs, text);
  add('polygon', { points: pts, fill: '#ffe39a', stroke: '#2a1c10', 'stroke-width': 0.05 });
  // "Itt vagy" goes on the side of the arrow that faces the room centre, away from the wall shelf labels.
  const lx = px + (px < -4 ? 0.6 : px > 4 ? -0.6 : 0);
  add('text', { x: lx, y: pz + 0.95, 'font-size': 0.4, fill: '#ffe39a', 'text-anchor': px < -4 ? 'start' : px > 4 ? 'end' : 'middle', 'font-weight': 700, class: 'lbl' }, TXT.mapYou);
  return svg;
}

MENU_BUILDERS.map = (d) => {
  const root = layer('dim');

  panel.style.width = 'min(150vh, 100%)';

  t0.addEventListener('click', () => renderMenu('map', { tab: 0 }));
  t1.addEventListener('click', () => renderMenu('map', { tab: 1 }));
  const head = el('div', 'tabs');
  head.append(el('h2', 'engraved', TXT.mapTitle), tabs);
  tabs.append(glyph('cycle') ? el('span') : el('span'), t0, t1);
  // Keyboard: the arrow keys switch the tabs (Tab / M close the map, as they opened it).
  tabs.firstChild.innerHTML = IN.device === 'pad' ? glyph('cycle') : '<span class="key">←</span>';
  const after = el('span');
  after.innerHTML = IN.device === 'pad' ? '<span class="pad bump">RB</span>' : '<span class="key">→</span>';
  tabs.append(after);
  panel.append(head);
  const items = [];
  if (tab === 0) {
    const wrap = el('div', 'map-wrap');
    wrap.append(mapSvg());

    for (const cat of FIG_CATEGORIES) {
      const row = el('div', 'row');

      dot.innerHTML = symbolImg(cat.key);
      const txt = el('span');
      txt.innerHTML = `<b>${escapeHtml(cat.nameHu)}</b>${escapeHtml(cat.ruleHu || '')}`;
      row.append(dot, txt);
      legend.append(row);
    }
    wrap.append(legend);
    panel.append(wrap);
  } else {
    const ol = el('ol', 'rules');
    for (const r of TXT.rules) ol.append(el('li', '', r));
    panel.append(ol);
  }
  const close = menuItem(escapeHtml(TXT.promptClose), () => closeMenu());
  close.style.width = 'auto';
  items.push(close);
  panel.append(close, hintsRow([['tabs', TXT.promptTabs], ['back', TXT.promptClose]]));
  root.append(panel);
  const fromPause = MENU.stack.length > 0;
  return {
    root, items, blocking: fromPause, onBack: () => closeMenu(),
    onTab: () => renderMenu('map', { tab: tab === 0 ? 1 : 0 }),
    update: () => {},
  };
};

MENU_BUILDERS.missing = () => {
  const root = layer('dim');
  const panel = el('div', 'panel menu');
  panel.style.width = 'min(140vh, 100%)';
  panel.append(el('h2', 'engraved', TXT.missingTitle));
  const list = el('div', 'missing-list scroll');
  list.style.maxHeight = '62vh';
  let any = false;
  for (const cat of FIG_CATEGORIES) {
    const u = WORLD.units[cat.key];
    if (!u) continue;
    let miss = 0;
    const lines = [];
    for (const id of u.slotIds) {
      const s = WORLD.slotById[id];
      const n = s.capacity - s.correct;
      if (n > 0) {
        miss += n;
        lines.push(fmt(TXT.missingItem, { name: s.nameHu, n }));
      }
    }
    if (!miss) continue;
    any = true;
    const box = el('div', 'cat');
    box.innerHTML = `<b>${escapeHtml(fmt(TXT.missingCat, { cat: cat.nameHu, n: miss }))}</b>${lines.map((l) => `<div>${escapeHtml(l)}</div>`).join('')}`;
    list.append(box);
  }
  let towerMiss = 0;
  for (const s of WORLD.slots) if (s.kind === 'tower' || s.kind === 'top') towerMiss += s.capacity - s.correct;

function settingValueText(row) {
  const v = row.key === 'name' ? GAME.name : SETTINGS[row.key];
  if (row.type === 'toggle') return v ? TXT.setOn : TXT.setOff;
  if (row.type === 'choice') return row.names()[row.values.indexOf(v)] ?? '';
  if (row.type === 'range') return row.show(v);
  if (row.type === 'text') return v;
  if (row.key === 'fullscreen') return TXT.setFsAction;
  return '';
}

function adjustSetting(row, dir) {
  if (row.type === 'toggle') SETTINGS[row.key] = !SETTINGS[row.key];
  else if (row.type === 'choice') {
    const i = row.values.indexOf(SETTINGS[row.key]);
    SETTINGS[row.key] = row.values[(i + dir + row.values.length) % row.values.length];
  } else if (row.type === 'range') {
    const v = Math.round((SETTINGS[row.key] + dir * row.step) / row.step) * row.step;
    SETTINGS[row.key] = clampTo(Number(v.toFixed(4)), row.min, row.max);
  } else return;
  onSettingChanged(row.key);
}

/** The personal name is edited in a real text field (the Xbox on-screen keyboard may appear). */
function editName(item, row) {
  // A second activation (A / Enter / click while the field is open) only re-focuses the field, so the
  // on-screen keyboard can be reopened; it must not try to replace the value span a second time.
  const open = item.querySelector('.name-input');
  if (open) {
    open.focus();
    return;
  }
  const val = item.querySelector('.val');
  if (!val) return;
  const input = el('input', 'name-input');
  input.type = 'text';
  input.maxLength = 24;
  input.value = GAME.name;
  val.replaceWith(input);
  input.focus();
  const finish = () => {
    const v = input.value.trim().slice(0, 24) || TXT.setNameDefault;
    GAME.name = v;
    const honor = WORLD.slotById.honor;
    if (honor && honor.plate >= 0) setPlateText(honor.plate, v);
    markDirty();
    const span = el('span', 'val', v);
    input.replaceWith(span);
    UI_DIRTY.stack = true;
    void row;
  };
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === 'Escape') {
      e.preventDefault();
      e.stopPropagation();
      input.blur();
    }
  });
  input.addEventListener('blur', finish, { once: true });
}

/* ---- 70-input.js ---- */
/* ==== 70-input.js — one input layer for gamepad, keyboard and mouse (Xbox Edge rules, DESIGN.md 11 and 16.16) ==== */

const PRESS_NAMES = ['pick', 'place', 'throwStart', 'throwRelease', 'cycle', 'drop', 'interact', 'info', 'map', 'missing', 'spell1', 'spell2', 'spell3',
  'runToggle', 'flourish', 'pause', 'confirm', 'back', 'up', 'down', 'left', 'right', 'tabPrev', 'tabNext', 'any', 'padLost', 'padFound'];

const IN = {
  device: 'kbm', move: { x: 0, y: 0 }, look: { x: 0, y: 0 },
  held: { pick: false, place: false, throw: false, run: false, zoom: false },
  pressed: Object.fromEntries(PRESS_NAMES.map((n) => [n, false])),
  padConnected: false, padId: '', padMapping: '', browsingSuspect: false, locked: false, lockFailed: false,
  consume(name) {
    this.pressed[name] = false;
  },
  poll(dt) {
    pollInput(dt);
  },
};

const KEYS = new Set();
const PENDING = new Set();
const MOUSE = {
  dx: 0, dy: 0, down: false, button: -1, id: -1, lastX: 0, lastY: 0, moved: 0, leftHeld: false, rightHeld: false, wantPause: false, gameUnlock: false,
  buttons: 0, midHeld: false, midDownAt: 0,
};
const PAD = {
  index: -1, prev: new Uint8Array(17), cur: new Uint8Array(17), seen: new Map(), trig: [false, false], menuDownAt: -1, warned: false,
  rampT: 0, ramp: 1, lastSig: new Map(), appearAt: new Map(), lost: false, rsDownAt: -1, rsZoom: false,
};
const NAV = { dir: '', t: 0 };
const BROWSE = { dpad: [], matches: 0, lastDpadT: -1, padBackT: -1e9, popBackT: -1e9 };
/** Arrow keys that Edge's Browsing Controls mode synthesises from a D-pad press; ignored until released. */
const GHOST_ARROWS = new Set();
const DPAD_ARROWS = [[12, 'up', 'ArrowUp'], [13, 'down', 'ArrowDown'], [14, 'left', 'ArrowLeft'], [15, 'right', 'ArrowRight']];
const PAD_PRESS_MAP = [
  [7, 'pick'], [6, 'place'], [4, 'cycle'], [4, 'tabPrev'], [5, 'tabNext'], [0, 'interact'], [0, 'confirm'], [1, 'drop'], [1, 'back'], [2, 'map'], [3, 'info'],
  [14, 'spell1'], [12, 'spell2'], [15, 'spell3'], [13, 'missing'], [10, 'runToggle'],
];
// The right stick click [11] is handled separately: a tap is the flourish (on release), holding it in zooms.
const STICK = { l: { x: 0, y: 0 }, r: { x: 0, y: 0 } };
/** Zoom keys: Z by its position on a US layout and on the Hungarian QWERTZ layout (where the Z key sends KeyY). */
const ZOOM_KEYS = ['KeyZ', 'KeyY'];
const GAME_KEYS = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Backspace', 'PageUp', 'PageDown', 'Tab', 'KeyW', 'KeyA', 'KeyS', 'KeyD',
  'KeyE', 'KeyF', 'KeyG', 'KeyQ', 'KeyR', 'KeyH', 'KeyI', 'KeyM', 'KeyP', 'Digit1', 'Digit2', 'Digit3', 'Enter', 'Escape', 'ShiftLeft', 'ShiftRight',
  ...ZOOM_KEYS]);
let inputNow = 0;

function isTyping(e) {
  const t = e.target;
  return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
}

/** Called synchronously inside every fresh user gesture (key, pointer, gamepad press). */
function onGesture() {
  audioUnlock();
  if (PENDING_FULLSCREEN.v) {
    PENDING_FULLSCREEN.v = false;
    doFullscreenToggle();
  }
}
const PENDING_FULLSCREEN = { v: false };

function onKeyDown(e) {
  if (isTyping(e)) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (GAME_KEYS.has(e.code)) e.preventDefault();
  const now = performance.now();
  const arrow = e.code.startsWith('Arrow');
  // A D-pad press in Browsing Controls mode also arrives as an Arrow key: drop the duplicate before it can flip
  // the device to keyboard or turn the camera through the arrow look keys.
  if (arrow && (GHOST_ARROWS.has(e.code) || now - BROWSE.lastDpadT < 150)) {
    GHOST_ARROWS.add(e.code);
    return;
  }
  IN.device = 'kbm';
  onGesture();
  if (e.repeat) {
    KEYS.add(e.code);
    return;
  }
  KEYS.add(e.code);
  PENDING.add('any');
  switch (e.code) {
    case 'ArrowUp': PENDING.add('up'); break;
    case 'ArrowDown': PENDING.add('down'); break;
    case 'ArrowLeft': PENDING.add('left'); break;
    case 'ArrowRight': PENDING.add('right'); break;
    case 'Enter':
    case 'Space': PENDING.add('confirm'); break;
    case 'Escape': PENDING.add('back'); PENDING.add('pause'); break;
    case 'Backspace': PENDING.add('back'); break;
    case 'KeyP': PENDING.add('pause'); break;
    case 'KeyE': PENDING.add('interact'); break;
    case 'KeyG': PENDING.add('drop'); break;
    case 'KeyQ': PENDING.add('cycle'); PENDING.add('tabPrev'); break;
    case 'KeyR': PENDING.add('flourish'); break;
    case 'KeyH': PENDING.add('missing'); break;
    case 'KeyI': PENDING.add('info'); break;
    case 'KeyM':
    case 'Tab': PENDING.add('map'); PENDING.add('tabNext'); break;
    case 'KeyF': PENDING.add('throwStart'); break;
    case 'Digit1': case 'Numpad1': PENDING.add('spell1'); break;
    case 'Digit2': case 'Numpad2': PENDING.add('spell2'); break;
    case 'Digit3': case 'Numpad3': PENDING.add('spell3'); break;
    case 'ShiftLeft':
    case 'ShiftRight': PENDING.add('runToggle'); break;
    default: break;
  }
}

function onKeyUp(e) {
  KEYS.delete(e.code);
  GHOST_ARROWS.delete(e.code);
  if (e.code === 'KeyF') PENDING.add('throwRelease');
  if (e.code.startsWith('Arrow')) {
    const dir = e.code.slice(5).toLowerCase();
    const now = performance.now();
    const hit = BROWSE.dpad.findIndex((d) => d.dir === dir && now - d.t < 350);
    if (hit >= 0) {
      BROWSE.dpad.splice(hit, 1);
      BROWSE.matches++;
      if (BROWSE.matches >= 2 && !IN.browsingSuspect) {
        IN.browsingSuspect = true;
        UI_DIRTY.browsing = true;
      }
    }
  }
}

/** Bit of a mouse button in `MouseEvent.buttons` (left 1, right 2, middle 4). */
function buttonBit(button) {
  return button === 0 ? 1 : button === 2 ? 2 : button === 1 ? 4 : 0;
}

/**
 * Applies the pointer-locked mouse button state (bit mask): left picks, right places, the middle button zooms while
 * held and is the flourish when only clicked. Handles chorded presses too.
 */
function lockedButtons(b) {
  const down = b & ~MOUSE.buttons;
  const up = MOUSE.buttons & ~b;
  MOUSE.buttons = b;
  const now = inputNow;
  if (down & 1) {
    PENDING.add('pick');
    MOUSE.leftHeld = true;
  }
  if (down & 2) {
    PENDING.add('place');
    MOUSE.rightHeld = true;
  }
  if (down & 4) {
    MOUSE.midHeld = true;
    MOUSE.midDownAt = now;
  }
  if (up & 1) MOUSE.leftHeld = false;
  if (up & 2) MOUSE.rightHeld = false;
  if (up & 4) {
    if (MOUSE.midHeld && now - MOUSE.midDownAt < ZOOM_TUNE.holdS) PENDING.add('flourish');
    MOUSE.midHeld = false;
  }
}

function requestLock() {
  const c = byId('scene');
  if (IN.lockFailed || !c.requestPointerLock) return;
  try {
    const p = c.requestPointerLock();
    if (p && typeof p.catch === 'function') {
      p.catch(() => {
        IN.lockFailed = true;
        notice(TXT.pointerHint);
      });
    }
  } catch {
    IN.lockFailed = true;
    notice(TXT.pointerHint);
  }
}

/** Releases the pointer lock when a menu opens (does not count as a pause request). */
function releaseLock() {
  try {
    if (document.pointerLockElement) {
      MOUSE.gameUnlock = true;
      document.exitPointerLock();
    }
  } catch {
    /* optional */
  }
}

function wireInput() {
  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('keyup', onKeyUp);
  window.addEventListener('blur', () => {
    KEYS.clear();
    MOUSE.leftHeld = false;
    MOUSE.rightHeld = false;
    MOUSE.midHeld = false;
    MOUSE.buttons = 0;
    if (GAME.phase === 'play') PENDING.add('pause');
  });
  const c = byId('scene');
  c.addEventListener('contextmenu', (e) => e.preventDefault());
  c.addEventListener('pointerdown', (e) => {
    IN.device = 'kbm';
    onGesture();
    PENDING.add('any');
    MOUSE.down = true;
    MOUSE.button = e.button;
    MOUSE.id = e.pointerId;
    MOUSE.lastX = e.clientX;
    MOUSE.lastY = e.clientY;
    MOUSE.moved = 0;
    try { c.setPointerCapture(e.pointerId); } catch { /* optional */ }
    if (e.button === 1) e.preventDefault();
    if (IN.locked) lockedButtons(MOUSE.buttons | buttonBit(e.button));
    else if (IN.lockFailed || e.pointerType !== 'mouse') c.classList.add('dragging');
  });
  // No middle-click autoscroll or paste: the middle button is the zoom / flourish button.
  c.addEventListener('mousedown', (e) => {
    if (e.button === 1) e.preventDefault();
  });
  c.addEventListener('auxclick', (e) => e.preventDefault());
  c.addEventListener('pointermove', (e) => {
    if (IN.locked) {
      MOUSE.dx += e.movementX || 0;
      MOUSE.dy += e.movementY || 0;
      // Chorded presses (a second button while one is held) arrive only as a change of `buttons`.
      if (e.pointerType === 'mouse' && e.buttons !== MOUSE.buttons) lockedButtons(e.buttons & 7);
      return;
    }
    if (!MOUSE.down || e.pointerId !== MOUSE.id) return;
    const dx = e.clientX - MOUSE.lastX;
    const dy = e.clientY - MOUSE.lastY;
    MOUSE.lastX = e.clientX;
    MOUSE.lastY = e.clientY;
    MOUSE.moved += Math.abs(dx) + Math.abs(dy);
    if (IN.lockFailed || e.pointerType !== 'mouse' || MOUSE.moved > 6) {
      MOUSE.dx += dx;
      MOUSE.dy += dy;
    }
  });
  const release = (e) => {
    if (e.pointerId !== MOUSE.id) return;
    MOUSE.down = false;
    c.classList.remove('dragging');
    if (IN.locked) lockedButtons(e.type === 'pointerup' ? MOUSE.buttons & ~buttonBit(e.button) : 0);
    if (MOUSE.leftHeld && e.button === 0) MOUSE.leftHeld = false;
    if (MOUSE.rightHeld && e.button === 2) MOUSE.rightHeld = false;
    if (e.type !== 'pointerup' || IN.locked) return;
    if (MOUSE.moved < 6 && GAME.phase === 'play' && !MENU.open) {
      if (!IN.lockFailed && e.pointerType === 'mouse') requestLock();
      else if (e.button === 0) PENDING.add('pick');
      else if (e.button === 2) PENDING.add('place');
    }
  };
  c.addEventListener('pointerup', release);
  c.addEventListener('pointercancel', release);
  c.addEventListener('wheel', (e) => {
    if (GAME.phase === 'play' && !MENU.open) {
      PENDING.add('cycle');
      e.preventDefault();
    }
  }, { passive: false });
  document.addEventListener('pointerlockchange', () => {
    IN.locked = document.pointerLockElement === c;
    c.classList.toggle('locked', IN.locked);
    MOUSE.buttons = 0;
    MOUSE.midHeld = false;
    if (!IN.locked) {
      if (!MOUSE.gameUnlock && GAME.phase === 'play' && !MENU.open) PENDING.add('pause');
      MOUSE.gameUnlock = false;
    }
  });
  document.addEventListener('pointerlockerror', () => {
    IN.lockFailed = true;
    notice(TXT.pointerHint);
  });
  window.addEventListener('gamepadconnected', () => { PAD.lost = false; });
  window.addEventListener('gamepaddisconnected', () => { /* rescanned every frame; this is only a hint */ });
  try {
    navigator.gamepadInputEmulation = 'gamepad';
  } catch {
    /* legacy EdgeHTML hint, harmless when ignored */
  }
}

/** Scaled radial dead zone: keeps the direction and remaps the magnitude from [inner, outer] to [0, 1]. */
function radialDead(x, y, inner, outer, out) {
  const m = Math.hypot(x, y);
  if (m < inner) {
    out.x = 0;
    out.y = 0;
    return out;
  }
  const s = Math.min(1, (Math.min(m, outer) - inner) / (outer - inner)) / m;
  out.x = x * s;
  out.y = y * s;
  return out;
}

const curve = (v) => Math.sign(v) * Math.pow(Math.abs(v), 2.2);

function pollGamepad(dt) {
  let pads = null;
  try {
    if (FAKE_PAD.active && FAKE_PAD.pad) pads = [FAKE_PAD.pad];
    else pads = navigator.getGamepads ? navigator.getGamepads() : null;
  } catch {
    pads = null;
  }
  const now = performance.now();
  let active = null;
  let bestT = -1;
  let anyConnected = false;
  if (pads) {
    for (let i = 0; i < pads.length; i++) {
      const p = pads[i];
      if (!p || !p.connected) continue;
      anyConnected = true;
      if (!PAD.appearAt.has(i)) PAD.appearAt.set(i, now);
      let sig = 0;
      for (let b = 0; b < p.buttons.length && b < 17; b++) if (p.buttons[b] && (p.buttons[b].pressed || p.buttons[b].value > 0.5)) sig |= 1 << b;
      const axSig = Math.round((p.axes[0] || 0) * 4) + Math.round((p.axes[1] || 0) * 4) * 10 + Math.round((p.axes[2] || 0) * 4) * 100 + Math.round((p.axes[3] || 0) * 4) * 1000;
      const key = sig * 10007 + axSig;
      if (PAD.lastSig.get(i) !== key) {
        PAD.lastSig.set(i, key);
        PAD.seen.set(i, now);
      }
      const t = PAD.seen.get(i) || 0;
      if (t > bestT) {
        bestT = t;
        active = p;
      }
    }
  }
  if (!active) {
    if (IN.padConnected && GAME.phase === 'play') PENDING.add('padLost');
    IN.padConnected = false;
    STICK.l.x = STICK.l.y = STICK.r.x = STICK.r.y = 0;
    PAD.cur.fill(0);
    PAD.prev.fill(0);
    return;
  }
  if (!IN.padConnected) PENDING.add('padFound');
  IN.padConnected = anyConnected;
  if (PAD.index !== active.index) {
    PAD.index = active.index;
    PAD.prev.fill(0);
  }
  IN.padId = active.id;
  IN.padMapping = active.mapping;
  if (active.mapping !== 'standard' && !PAD.warned) {
    PAD.warned = true;
    notice(TXT.padNonStandard);
  }
  const b = active.buttons;
  const cur = PAD.cur;
  for (let i = 0; i < 17; i++) {
    const btn = b[i];
    if (!btn) {
      cur[i] = 0;
      continue;
    }
    if (i === 6 || i === 7) {
      const k = i - 6;
      const v = typeof btn.value === 'number' ? btn.value : btn.pressed ? 1 : 0;
      if (!PAD.trig[k] && v > 0.5) PAD.trig[k] = true;
      else if (PAD.trig[k] && v < 0.35) PAD.trig[k] = false;
      cur[i] = PAD.trig[k] ? 1 : 0;
    } else cur[i] = btn.pressed ? 1 : 0;
  }
  const grace = now - (PAD.appearAt.get(active.index) || 0) < 100;
  const edge = (i) => (grace ? 0 : cur[i] && !PAD.prev[i] ? 1 : !cur[i] && PAD.prev[i] ? -1 : 0);
  let anyPress = false;
  for (let i = 0; i < 17; i++) if (i !== 8 && i !== 16 && edge(i) === 1) anyPress = true;
  const ax = active.axes;
  radialDead(ax[0] || 0, ax[1] || 0, SETTINGS.deadL, 0.95, STICK.l);
  radialDead(ax[2] || 0, ax[3] || 0, SETTINGS.deadR, 0.95, STICK.r);
  if (anyPress || Math.hypot(STICK.l.x, STICK.l.y) > 0.3 || Math.hypot(STICK.r.x, STICK.r.y) > 0.3) IN.device = 'pad';
  if (anyPress) {
    onGesture();
    PENDING.add('any');
  }
  // B that already arrived as a browser Back (history sentinel) must not act a second time.
  const bEdge = edge(1) === 1;
  const bGhost = bEdge && now - BROWSE.popBackT < 350;
  if (bEdge) BROWSE.padBackT = now;
  for (let k = 0; k < PAD_PRESS_MAP.length; k++) {
    const i = PAD_PRESS_MAP[k][0];
    if (edge(i) === 1 && !(i === 1 && bGhost)) PENDING.add(PAD_PRESS_MAP[k][1]);
  }
  if (edge(5) === 1) PENDING.add('throwStart');
  if (edge(5) === -1) PENDING.add('throwRelease');
  // Right stick click: a tap is the flourish (fired on release), holding it in zooms like binoculars.
  const rs = edge(11);
  if (rs === 1) {
    PAD.rsDownAt = inputNow;
    PAD.rsZoom = false;
  }
  if (cur[11] && PAD.rsDownAt >= 0 && inputNow - PAD.rsDownAt >= ZOOM_TUNE.holdS) PAD.rsZoom = true;
  if (rs === -1 || (!cur[11] && PAD.rsDownAt >= 0)) {
    if (PAD.rsDownAt >= 0 && !PAD.rsZoom) PENDING.add('flourish');
    PAD.rsDownAt = -1;
    PAD.rsZoom = false;
  }
  // Menu: a tap pauses (a long press is Edge's own mode switch and must never be required).
  const me = edge(9);
  if (me === 1) PAD.menuDownAt = now;
  else if (me === -1 && PAD.menuDownAt >= 0) {
    if (now - PAD.menuDownAt < 600) PENDING.add('pause');
    PAD.menuDownAt = -1;
  }
  for (let k = 0; k < DPAD_ARROWS.length; k++) {
    const [i, dir, code] = DPAD_ARROWS[k];
    if (edge(i) === 1) {
      BROWSE.dpad.push({ dir, t: now });
      if (BROWSE.dpad.length > 8) BROWSE.dpad.shift();
      BROWSE.lastDpadT = now;
      // The synthesised Arrow keydown may have arrived just before this poll: treat it as a ghost from now on.
      if (KEYS.has(code)) {
        KEYS.delete(code);
        GHOST_ARROWS.add(code);
      }
    }
  }
  IN.held.pick = IN.held.pick || !!cur[7];
  IN.held.place = IN.held.place || !!cur[6];
  IN.held.throw = IN.held.throw || !!cur[5];
  IN.held.zoom = IN.held.zoom || PAD.rsZoom;
  PAD.prev.set(cur);
}

function navDirection() {
  if (KEYS.has('ArrowUp')) return 'up';
  if (KEYS.has('ArrowDown')) return 'down';
  if (KEYS.has('ArrowLeft')) return 'left';
  if (KEYS.has('ArrowRight')) return 'right';
  const c = PAD.cur;
  if (c[12]) return 'up';
  if (c[13]) return 'down';
  if (c[14]) return 'left';
  if (c[15]) return 'right';
  const { x, y } = STICK.l;
  if (Math.hypot(x, y) > 0.55) return Math.abs(x) > Math.abs(y) ? (x > 0 ? 'right' : 'left') : (y > 0 ? 'down' : 'up');
  return '';
}

function pollInput(dt) {
  inputNow += dt;
  for (const n of PRESS_NAMES) IN.pressed[n] = false;
  IN.held.pick = MOUSE.leftHeld;
  IN.held.place = MOUSE.rightHeld;
  IN.held.throw = KEYS.has('KeyF');
  IN.held.zoom = KEYS.has(ZOOM_KEYS[0]) || KEYS.has(ZOOM_KEYS[1]) || (MOUSE.midHeld && inputNow - MOUSE.midDownAt >= ZOOM_TUNE.holdS);
  pollGamepad(dt);
  for (const n of PENDING) IN.pressed[n] = true;
  PENDING.clear();
  // Menu navigation with auto-repeat (400 ms, then 120 ms) for held D-pad, stick and arrow keys.
  const dir = navDirection();
  if (dir && dir !== NAV.dir) {
    NAV.dir = dir;
    NAV.t = 0.4;
    IN.pressed[dir] = true;
  } else if (dir) {
    NAV.t -= dt;
    if (NAV.t <= 0) {
      NAV.t = 0.12;
      IN.pressed[dir] = true;
    }
  } else NAV.dir = '';
  // Movement: WASD plus the left stick.
  let mx = (KEYS.has('KeyD') ? 1 : 0) - (KEYS.has('KeyA') ? 1 : 0) + STICK.l.x;
  let my = (KEYS.has('KeyW') ? 1 : 0) - (KEYS.has('KeyS') ? 1 : 0) - STICK.l.y;
  const ml = Math.hypot(mx, my);
  if (ml > 1) {
    mx /= ml;
    my /= ml;
  }
  IN.move.x = mx;
  IN.move.y = my;
  // Look: right stick with a response curve and a full-tilt ramp, mouse deltas, arrow keys.
  const sens = SETTINGS.sensitivity;
  const inv = SETTINGS.invertY ? -1 : 1;
  const rx = STICK.r.x;
  const ry = STICK.r.y;
  if (Math.hypot(rx, ry) > 0.9) PAD.rampT += dt;
  else PAD.rampT = 0;
  const rampK = PAD.rampT > 0.25 ? 1 + 0.6 * clamp01((PAD.rampT - 0.25) / 0.3) : 1;
  const yawRate = Math.PI * sens * rampK;
  let lx = curve(rx) * yawRate * dt;
  let ly = curve(ry) * yawRate * 0.65 * dt * inv;
  lx += MOUSE.dx * 0.0022 * sens;
  ly += MOUSE.dy * 0.0022 * sens * inv;
  MOUSE.dx = 0;
  MOUSE.dy = 0;
  if (!MENU.open) {
    const turn = 2.1 * dt;
    if (KEYS.has('ArrowLeft')) lx -= turn;
    if (KEYS.has('ArrowRight')) lx += turn;
    if (KEYS.has('ArrowUp')) ly -= turn * 0.65 * inv;
    if (KEYS.has('ArrowDown')) ly += turn * 0.65 * inv;
  }
  IN.look.x = lx;
  IN.look.y = ly;
}

/** Optional subtle rumble on a correct placement. */
function rumble() {
  if (!SETTINGS.rumble || PAD.index < 0) return;
  try {
    const pads = navigator.getGamepads ? navigator.getGamepads() : null;
    const p = pads && pads[PAD.index];
    if (p && p.vibrationActuator && p.vibrationActuator.playEffect) {
      p.vibrationActuator.playEffect('dual-rumble', { duration: 60, strongMagnitude: 0.15, weakMagnitude: 0.35 }).catch(() => {});
    }
  } catch {
    /* optional */
  }
}

/** Fullscreen toggle; must run inside a gesture handler (keydown, pointerdown or the poll that saw a press). */
function doFullscreenToggle() {
  try {
    if (document.fullscreenElement) {
      if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
      return;
    }
    if (!document.fullscreenEnabled || !document.documentElement.requestFullscreen) {
      notice(TXT.fullscreenNo);
      return;
    }
    document.documentElement.requestFullscreen().catch(() => notice(TXT.fullscreenDenied));
  } catch {
    notice(TXT.fullscreenDenied);
  }
}

/* ==== 80-save.js — settings (device-local), local save with two rotating slots and a checksum, hot snapshot ==== */

const SETTINGS_DEFAULT = {
  sensitivity: 1, invertY: false, deadL: 0.15, deadR: 0.12, assist: 1, fov: 70, zoomFov: 28, bob: false, rumble: true,
  quality: IS_XBOX || IS_TOUCH ? 'xbox' : 'magas', textSize: 1, contrast: false, music: 0.5, sfx: 0.8, ambient: true,
  bombs: true, wild: true, perf: false, details: true,
};
const SETTINGS = { ...SETTINGS_DEFAULT };

function loadSettings() {
  try {
    const raw = storeGet(SETTINGS_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    for (const k in SETTINGS_DEFAULT) {
      if (typeof s[k] === typeof SETTINGS_DEFAULT[k]) SETTINGS[k] = s[k];
    }
    if (SETTINGS.quality !== 'xbox' && SETTINGS.quality !== 'magas') SETTINGS.quality = SETTINGS_DEFAULT.quality;
  } catch {
    /* defaults stay */
  }
}

function storeSettings() {
  storeSet(SETTINGS_KEY, JSON.stringify(SETTINGS));
}

function resetSettings() {
  const q = SETTINGS.quality;
  Object.assign(SETTINGS, SETTINGS_DEFAULT);
  storeSettings();
  applySettings();
  if (q !== SETTINGS.quality) switchQuality();
}

function applySettings() {
  document.documentElement.style.setProperty('--ts', String(SETTINGS.textSize));
  if (UI.app) {
    UI.app.classList.toggle('hc', SETTINGS.contrast);
  }
  if (UI.perf) UI.perf.hidden = !SETTINGS.perf;
  applyVolumes();
  UI_DIRTY.card = true;
  // Text size moves the HUD panels the hover card is docked between: rebuild (and re-dock) it.
  CARD_STATE.key = '';
}

function onSettingChanged(key) {
  storeSettings();
  if (key === 'quality') switchQuality();
  else applySettings();
}

/* ------------------------------------------------------------------------------------------------
   Save data
   ------------------------------------------------------------------------------------------------ */
const SAVE = { available: true, latest: null, lastSavedAt: 0, seq: 0, nextSlot: 0, lastWrite: 0, error: false, tooNew: false };
const STATE_CODE = { loose: 0, shelfOk: 1, shelfWrong: 2, held: 3, hidden: 4, wild: 5 };

function probeStorage() {
  try {
    const k = '__figurabolt_probe';
    window.localStorage.setItem(k, '1');
    window.localStorage.removeItem(k);
    return true;
  } catch {
    return false;
  }
}

const mm = (v) => Math.round(v * 1000);
const q4 = (v) => Math.round(v * 10000);

function recSaveEntry(rec) {
  let s = STATE_CODE.loose;
  let slotKey = null;
  let pos = -1;
  const st = rec.state;
  if (st === ST.SHELF_OK || st === ST.SHELF_WRONG) {
    s = st === ST.SHELF_OK ? STATE_CODE.shelfOk : STATE_CODE.shelfWrong;
    slotKey = rec.slot ? rec.slot.id : null;
    pos = rec.slotPos;
    if (!rec.slot) s = STATE_CODE.loose;
  } else if (st === ST.SCRIPT && rec.fly && rec.fly.data && rec.fly.data.slot && (rec.fly.kind === 'slot' || rec.fly.kind === 'elf')) {
    // Still flying into its reserved slot: store it as already seated, since the arrival would seat it
    // (a loose pose at the slot's x/z would end up inside the shelf collider and be recovered to a heap).
    const { slot, posIdx } = rec.fly.data;
    s = isCorrectFor(rec, slot) ? STATE_CODE.shelfOk : STATE_CODE.shelfWrong;
    slotKey = slot.id;
    pos = posIdx;
  } else if (st === ST.HELD) {
    s = STATE_CODE.held;
    pos = GAME.stack.indexOf(rec.h);
  } else if (st === ST.HIDDEN) s = rec.wild && rec.wild.kind === 'scurrier' ? STATE_CODE.wild : STATE_CODE.hidden;
  else if (st === ST.WILD) s = STATE_CODE.wild;
  const e = [s, slotKey, pos, rec.paid ? 1 : 0];
  if (s === STATE_CODE.loose || s === STATE_CODE.wild) {
    let p = rec.pos;
    let qq = rec.quat;
    if (st === ST.FLYING || st === ST.SCRIPT) {
      const tgt = st === ST.SCRIPT && rec.fly ? rec.fly.p1 : rec.pos;
      p = tv5.set(tgt.x, groundAt(tgt.x, tgt.z, tgt.y + 0.05), tgt.z);
      qq = tq2.identity();
    }
    e.push(mm(p.x), mm(p.y), mm(p.z), q4(qq.x), q4(qq.y), q4(qq.z), q4(qq.w), rec.spot ? 1 : 0, rec.heap, rec.heap >= 0 ? rec.pileSeq || 0 : 0);
  }
  return e;
}

function makeSaveData() {
  const figs = {};
  for (const rec of REC) {
    if (rec.actor) continue;
    figs[rec.key] = recSaveEntry(rec);
  }
  return {
    seed: GAME.seed, playS: Math.round(GAME.playS * 10) / 10, galleons: GAME.galleons, earned: GAME.earned,
    figs, stack: GAME.stack.map((h) => REC[h].key),
    up: { ...GAME.up }, cd: { lumos: GAME.cd.lumos, invito: GAME.cd.invito, path: GAME.cd.path },
    deck: GAME.deck.slice(), deckPos: GAME.deckPos, boons: { ...GAME.boons }, cards: GAME.cards,
    paidBonus: {
      slots: [...GAME.paidBonus.slots], shelves: [...GAME.paidBonus.shelves], tiers: [], tower: GAME.paidBonus.tower,
      allCards: GAME.paidBonus.allCards, register: GAME.paidBonus.register,
    },
    register: GAME.register, events: { ...GAME.events }, snitch: { caught: GAME.snitch.caught },
    flags: { ...GAME.flags }, stats: { ...GAME.stats }, ach: GAME.ach.slice(),
    cam: { x: Math.round(PLAYER.pos.x * 100) / 100, z: Math.round(PLAYER.pos.z * 100) / 100, yaw: Math.round(PLAYER.yaw * 1000) / 1000, pitch: Math.round(PLAYER.pitch * 1000) / 1000 },
    name: GAME.name, tips: [...GAME.tipsShown], sortedCount: GAME.sorted, elvesT: Math.round(ELVES.t), music: AUDIO.musicMode, musicPick: AUDIO.musicPicked,
    layout: LAYOUT_VERSION,
  };
}

function validSaveData(d) {
  return d && typeof d === 'object' && Number.isFinite(d.seed) && d.figs && typeof d.figs === 'object';
}

/** Reads both slots and returns the newest valid envelope (or null). */
function readSaves() {
  let best = null;
  SAVE.tooNew = false;
  SAVE_KEYS.forEach((key, i) => {
    const raw = storeGet(key);
    if (!raw) return;
    try {
      const env = JSON.parse(raw);
      if (!env || env.schema !== SAVE_SCHEMA || !env.data) return;
      if (env.v > SAVE_VERSION) {
        SAVE.tooNew = true;
        return;
      }
      if (hashString(JSON.stringify(env.data)) !== env.sum) return;
      if (!validSaveData(env.data)) return;
      if (!best || env.seq > best.seq || (env.seq === best.seq && env.savedAt > best.savedAt)) best = { ...env, slot: i };
    } catch {
      /* a broken slot is ignored; the other one is used */
    }
  });
  return best;
}

function saveNow(reason = '') {
  if (!SAVE.available || GAME.phase === 'loading' || !REC.length) return false;
  if (GAME.phase === 'title' && !SAVE.latest && !GAME.dirty) return false;
  const data = makeSaveData();
  const env = { schema: SAVE_SCHEMA, v: SAVE_VERSION, savedAt: Date.now(), seq: SAVE.seq + 1, sum: hashString(JSON.stringify(data)), data };
  const ok = storeSet(SAVE_KEYS[SAVE.nextSlot], JSON.stringify(env));
  if (ok) {
    SAVE.seq = env.seq;
    SAVE.nextSlot = 1 - SAVE.nextSlot;
    SAVE.lastSavedAt = env.savedAt;
    SAVE.latest = env;
    SAVE.error = false;
    GAME.dirty = false;
    if (reason !== 'quiet' && GAME.phase === 'play') showSaveIndicator(TXT.hudSaved);
  } else {
    if (!SAVE.error) toast(TXT.toastSaveFailed, 'bad');
    SAVE.error = true;
    showSaveIndicator(TXT.hudSaveError);
  }
  SAVE.lastWrite = performance.now();
  return ok;
}

/** Autosave cadence: only when something really changed, at most every AUTOSAVE_S seconds while playing. */
function saveTick() {
  if (!GAME.dirty || GAME.phase !== 'play') return;
  if (performance.now() - SAVE.lastWrite < AUTOSAVE_S * 1000) return;
  saveNow('auto');
}

function deleteSaveAndRestart() {
  for (const k of SAVE_KEYS) storeRemove(k);
  SAVE.latest = null;
  SAVE.lastSavedAt = 0;
  SAVE.seq = 0;
  SAVE.nextSlot = 0;
  GAME.dirty = false;
  closeAllMenus();
  toast(TXT.toastDeleted);
  newGame(true);
}

/* ------------------------------------------------------------------------------------------------
   Applying a save (or hot data) to a freshly spawned world
   ------------------------------------------------------------------------------------------------ */

function resetGameState(seed) {
  GAME.seed = seed;
  GAME.playS = 0;
  GAME.galleons = 0;
  GAME.earned = 0;
  for (const k in GAME.up) GAME.up[k] = 0;
  GAME.cd.lumos = GAME.cd.invito = GAME.cd.path = 0;
  GAME.deck = newDeck(seed);
  GAME.deckPos = 0;
  GAME.boons = { capacityPlus: 0, cdCut: 0, lumosLong: false, throwPlus: false, goldDustUntil: 0, nifflerLure: false, candleBonus: false };
  GAME.cards = 0;
  GAME.paidBonus = { slots: new Set(), shelves: new Set(), tiers: new Set(), tower: false, allCards: false, register: false };
  GAME.register = 0;
  GAME.events = { bomb25: false, bomb60: false };
  GAME.snitch = { caught: false };
  GAME.flags = { introSeen: false, finaleDone: false, freePlay: false, mouldCast: null, elvesOn: true };
  GAME.stats = { wrongPlacements: 0, abilityUses: 0, startedAt: Date.now(), elfPlacements: 0 };
  GAME.ach = [];
  GAME.tipsShown = new Set();
  GAME.stack.length = 0;
  affordTipDone = false;
  ELVES.t = 0;
  clearLumos();
  PATH.t = 0;
  INVITO.queue.length = 0;
  BOMB.active = false;
  for (const u of Object.values(WORLD.units)) {
    u.done = false;
    for (const c of u.sconces) c.lit = false;
    setSignGlow(u.cat, 0);
  }
  uBannerGlow.value = 0;
  if (M.towerBulbs) M.towerBulbs.color.setScalar(1);
  for (const c of CARDS.list) {
    c.found = false;
    tm1.compose(c.pos, tq1.setFromEuler(te1.set(0, c.yaw, 0)), ONE3);
    CARDS.mesh.setMatrixAt(c.i, tm1);
  }
  CARDS.mesh.instanceMatrix.needsUpdate = true;
  sweepClones();
  PLAYER.pos.set(START_POSE.x, 0, START_POSE.z);
  PLAYER.yaw = START_POSE.yaw;
  PLAYER.pitch = START_POSE.pitch;
  PLAYER.vx = PLAYER.vz = 0;
}

function applySaveData(d) {
  resetGameState(d.seed >>> 0);
  spawnAll(GAME.seed);
  GAME.playS = +d.playS || 0;
  GAME.galleons = d.galleons | 0;
  GAME.earned = d.earned | 0;
  for (const k in GAME.up) if (d.up && Number.isFinite(d.up[k])) GAME.up[k] = clampTo(d.up[k] | 0, 0, UPGRADES[k].prices.length);
  if (d.cd) for (const k of SPELL_KEYS) GAME.cd[k] = Math.max(0, +d.cd[k] || 0);
  if (Array.isArray(d.deck) && d.deck.length === DECK.length) GAME.deck = d.deck.slice();
  GAME.deckPos = clampTo(d.deckPos | 0, 0, DECK.length);
  if (d.boons) Object.assign(GAME.boons, d.boons);
  GAME.cards = d.cards | 0;
  if (d.paidBonus) {
    GAME.paidBonus.slots = new Set(d.paidBonus.slots || []);
    GAME.paidBonus.shelves = new Set(d.paidBonus.shelves || []);
    GAME.paidBonus.tower = !!d.paidBonus.tower;
    GAME.paidBonus.allCards = !!d.paidBonus.allCards;
    GAME.paidBonus.register = !!d.paidBonus.register;
  }
  GAME.register = d.register | 0;
  if (d.events) Object.assign(GAME.events, d.events);
  if (d.snitch) GAME.snitch.caught = !!d.snitch.caught;
  if (d.flags) Object.assign(GAME.flags, d.flags);
  if (d.stats) Object.assign(GAME.stats, d.stats);
  GAME.ach = Array.isArray(d.ach) ? d.ach.slice() : [];
  GAME.name = typeof d.name === 'string' && d.name ? d.name.slice(0, 24) : TXT.setNameDefault;
  GAME.tipsShown = new Set(Array.isArray(d.tips) ? d.tips : []);
  ELVES.t = +d.elvesT || 0;
  if (Number.isFinite(d.music)) AUDIO.musicMode = clampTo(d.music | 0, 0, MUSIC_OWN);
  AUDIO.musicPicked = !!d.musicPick;
  // The saved mode is applied once the player's own tracks are known (found, or none).
  musicModeRestored();
  // Figurines: shelved ones first (slots), then loose and wild poses, then the stack in order.
  // A save from an older layout (smaller figurines, other heaps) keeps its shelves, stack and progress; its heap
  // figurines, hidden legendary copies and runaways stay where spawnAll() just put them in the new heaps, and
  // figurines the player left elsewhere stand upright at their old floor spot.
  const oldLayout = !(d.layout >= LAYOUT_VERSION);
  // Figurines leave the freshly spawned piles in bulk here; one rebuildPiles() pass settles everything at the end.
  PILE.bulk = true;
  const held = [];
  for (const rec of REC) {
    if (rec.actor) continue;
    const e = d.figs[rec.key];
    if (!Array.isArray(e)) continue;
    const [s, slotKey, pos, paid] = e;
    rec.paid = !!paid;
    if (s === STATE_CODE.shelfOk || s === STATE_CODE.shelfWrong) {
      const slot = WORLD.slotById[slotKey];
      if (slot && pos >= 0 && pos < slot.capacity && slot.occupants[pos] < 0) {
        rec.wild = null;
        rec.spot = false;
        rec.heap = -1;
        seatInSlot(rec, slot, pos);
      }
    } else if (s === STATE_CODE.held) {
      held.push([pos, rec]);
    } else if (s === STATE_CODE.hidden) {
      if (rec.id === 'shopkeeper' || (rec.wild && rec.wild.kind === 'flyer')) continue;
      rec.state = -1;
      setState(rec, ST.HIDDEN);
    } else if (e.length >= 11 && oldLayout) {
      const inHeap = Number.isFinite(e[12]) && e[12] >= 0;
      if (s === STATE_CODE.wild || e[11]) continue;
      if (inHeap) {
        if (rec.spot) {
          // An already found legendary copy that was dropped onto a heap: back onto a heap, not its hiding place.
          rec.spot = false;
          rec.pos.set(0, -1, 0);
          rec.state = ST.LOOSE;
          recoverLost(true);
        }
        continue;
      }
      const x = e[4] / 1000;
      const z = e[6] / 1000;
      tv1.set(0, 0, 1).applyQuaternion(tq1.set(e[7] / 10000, e[8] / 10000, e[9] / 10000, e[10] / 10000).normalize());
      poseUpright(rec, x, groundAt(x, z, e[5] / 1000 + 0.05), z, Math.atan2(tv1.x, tv1.z));
      rec.wild = null;
      rec.spot = false;
      rec.heap = -1;
      rec.state = -1;
      setState(rec, ST.LOOSE);
      syncRec(rec);
      hashUpdate(rec);
    } else if (e.length >= 11) {
      rec.pos.set(e[4] / 1000, e[5] / 1000, e[6] / 1000);
      rec.quat.set(e[7] / 10000, e[8] / 10000, e[9] / 10000, e[10] / 10000).normalize();
      rec.spot = !!e[11];
      rec.heap = Number.isFinite(e[12]) ? e[12] : -1;
      rec.pileSeq = Number.isFinite(e[13]) ? e[13] : 0;
      rec.lying = Math.abs(tv1.set(0, 1, 0).applyQuaternion(rec.quat).y) < 0.7;
      rec.groundY = rec.lying ? Math.max(0, rec.pos.y - rec.met.radius * rec.scale) : rec.pos.y;
      if (s === STATE_CODE.wild && rec.wild && rec.wild.kind === 'scurrier') {
        rec.wild.mode = 'sniff';
        rec.wild.t = 2;
        rec.state = -1;
        setState(rec, ST.WILD);
      } else {
        rec.wild = null;
        rec.state = -1;
        setState(rec, ST.LOOSE);
      }
      syncRec(rec);
      hashUpdate(rec);
    }
  }
  held.sort((a, b) => a[0] - b[0]);
  for (const [, rec] of held) {
    rec.wild = null;
    rec.spot = false;
    if (rec.slot) unseat(rec);
    rec.heap = -1;
    pushStack(rec);
  }
  // Pile links follow the restored poses (old layouts: figurines that rested on shelved or held ones settle down).
  PILE.bulk = false;
  rebuildPiles();
  if (GAME.snitch.caught && SNITCH.rec && SNITCH.rec.state === ST.HIDDEN && !held.some(([, r]) => r === SNITCH.rec)) {
    // The caught Snitch was shelved or dropped; nothing else to do.
  }
  // Visual state of completed things.
  for (const key of GAME.paidBonus.shelves) if (WORLD.units[key]) celebrateShelf(key, false);
  if (GAME.paidBonus.tower) brightenTower();
  for (const c of CARDS.list) if (GAME.cards & (1 << c.i)) hideCard(c.i);
  if (GAME.paidBonus.allCards) revealShopkeeper(false);
  const honor = WORLD.slotById.honor;
  if (honor && honor.plate >= 0) setPlateText(honor.plate, GAME.name);
  if (d.cam) {
    PLAYER.pos.set(+d.cam.x || START_POSE.x, 0, +d.cam.z || START_POSE.z);
    PLAYER.yaw = +d.cam.yaw || 0;
    PLAYER.pitch = clampTo(+d.cam.pitch || 0, -1.3, 1.3);
    resolvePlayer(PLAYER.pos);
  }
  if (GAME.flags.mouldCast && FIG_BY_ID[GAME.flags.mouldCast]) {
    const rec = REC.find((r) => r.id === GAME.flags.mouldCast);
    startCasting(GAME.flags.mouldCast, rec ? rec.scale : 1, false);
  }
  resetSnitch();
  recount();
  checkAffordTip();
  UI_DIRTY.hud = true;
  UI_DIRTY.stack = true;
  UI_DIRTY.spells = true;
  GAME.dirty = false;
}

/* ------------------------------------------------------------------------------------------------
   Hot update (claude.ai artifact only; fully guarded, never required)
   ------------------------------------------------------------------------------------------------ */
function makeHotState() {
  try {
    return { ...makeSaveData(), hot: { phase: GAME.phase, menu: MENU.current ? MENU.current.id : null } };
  } catch {
    return {};
  }
}

function registerHotSnapshot() {
  try {
    const hot = window.claude && window.claude.hot;
    if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => makeHotState());
  } catch {
    /* the artifact runtime is optional */
  }
}

/* ---- 90-main.js ---- */
/* ==== 90-main.js — quality presets, dynamic resolution, main loop, game flow, boot, context loss, debug hook ==== */

const DEBUG = { xbox: false, enabled: false };
/** Glyphs that must be in the loaded font subsets (ő and ű come from latin-ext). */
const FONT_SAMPLE = 'ŐőŰűÁÉÍÓÖÚÜáéíóöúü Weasley';
const LOOP = { last: 0, t: 0, physAcc: 0, renderAcc: 0, frames: 0, fpsAcc: 0, fps: 0, ready: false, firstPlayAt: 0, extDone: false, running: false };
let composer = null;
let composerPromise = null;
let basePR = 1;
let renderScale = 1;
const dyn = { acc: 0, frames: 0, cooldown: 2 };
let renderHold = false;
let qualityJob = 0;

/* ------------------------------------------------------------------------------------------------
   Quality presets and resolution (DESIGN.md 16.17)
   ------------------------------------------------------------------------------------------------ */

function computeBasePixelRatio() {
  const w = Math.max(1, window.innerWidth);
  const h = Math.max(1, window.innerHeight);
  const dpr = window.devicePixelRatio || 1;
  if (SETTINGS.quality === 'xbox') return Math.min(dpr, 1920 / w, 1080 / h);
  return Math.min(dpr, 2, Math.sqrt(MAX_HIGH_PIXELS / (w * h)));
}

function updateRenderSize() {
  const w = Math.max(1, window.innerWidth);
  const h = Math.max(1, window.innerHeight);
  const pr = basePR * renderScale;
  renderer.setPixelRatio(pr);
  renderer.setSize(w, h, false);
  if (composer) {
    composer.setPixelRatio(pr);
    composer.setSize(w, h);
  }
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  updatePointScale();
}

function ensureComposer() {
  if (composerPromise) return composerPromise;
  const promise = Promise.all([
    import('three/addons/postprocessing/EffectComposer.js'),
    import('three/addons/postprocessing/RenderPass.js'),
    import('three/addons/postprocessing/UnrealBloomPass.js'),
    import('three/addons/postprocessing/OutputPass.js'),
  ]).then(([ec, rp, ub, op]) => {
    if (composerPromise !== promise || SETTINGS.quality !== 'magas') return;
    const size = renderer.getDrawingBufferSize(new THREE.Vector2());
    const target = new THREE.WebGLRenderTarget(size.x, size.y, { type: THREE.HalfFloatType, samples: 4 });
    const c = new ec.EffectComposer(renderer, target);
    c.addPass(new rp.RenderPass(scene, camera));
    c.addPass(new ub.UnrealBloomPass(new THREE.Vector2(size.x, size.y), 0.3, 0.5, 1.0));
    c.addPass(new op.OutputPass());
    composer = c;
    updateRenderSize();
  }).catch((err) => {
    console.warn('[render] bloom unavailable', err);
    if (composerPromise === promise) composerPromise = null;
  });
  composerPromise = promise;
  return promise;
}

function disposeComposer() {
  composerPromise = null;
  if (!composer) return;
  for (const p of composer.passes) if (p.dispose) p.dispose();
  composer.dispose();
  composer = null;
}

function applyQuality() {
  const high = SETTINGS.quality === 'magas';
  renderer.shadowMap.enabled = high;
  renderer.shadowMap.needsUpdate = true;
  if (twinSpot) twinSpot.castShadow = high;
  for (const l of highOnlyLights) l.visible = high;
  UI.app.classList.toggle('q-xbox', !high);
  scene.traverse((o) => {
    const m = o.material;
    if (!m) return;
    if (Array.isArray(m)) for (const x of m) x.needsUpdate = true;
    else m.needsUpdate = true;
  });
  if (kit && typeof kit.setQuality === 'function') {
    try {
      kit.setQuality(SETTINGS.quality);
    } catch (err) {
      console.warn('[render] kit quality switch failed', err);
    }
  }
  basePR = computeBasePixelRatio();
  renderScale = 1;
  dyn.cooldown = 2;
  if (high) ensureComposer();
  else disposeComposer();
  updateRenderSize();
}

async function switchQuality() {
  const job = ++qualityJob;
  renderHold = true;
  toast(TXT.toastQuality);
  try {
    await yieldToBrowser();
    if (job !== qualityJob) return;
    applyQuality();
    if (SETTINGS.quality === 'magas') await ensureComposer();
    if (job !== qualityJob) return;
    await renderer.compileAsync(scene, camera);
  } catch (err) {
    console.warn('[render] quality switch', err);
  } finally {
    if (job === qualityJob) renderHold = false;
  }
}

function dynamicResolution(frameS) {
  dyn.acc += frameS;
  dyn.frames++;
  dyn.cooldown -= frameS;
  if (dyn.acc < 0.75) return;
  const avg = dyn.acc / dyn.frames;
  dyn.acc = 0;
  dyn.frames = 0;
  if (dyn.cooldown > 0) return;
  const lo = SETTINGS.quality === 'xbox' ? 0.6 : 0.75;
  if (avg > 0.0205 && renderScale > lo) {
    renderScale = Math.max(lo, renderScale - 0.1);
    updateRenderSize();
    dyn.cooldown = 1.5;
  } else if (avg < 0.0172 && renderScale < 1) {
    renderScale = Math.min(1, renderScale + 0.05);
    updateRenderSize();
    dyn.cooldown = 3;
  }
}

/** Uploads textures now and then drops their CPU-side images (no context restore is attempted). */
/** Estimated GPU bytes of the uploaded textures (RGBA8 plus a third for mipmaps), for the performance report. */
const TEX_STATS = { bytes: 0, count: 0 };

function releaseTextureSources(list) {
  for (const t of list) if (t && t.image) renderer.initTexture(t);
  for (const t of list) {
    if (!t || !t.image) continue;
    const img = t.image;
    TEX_STATS.bytes += (img.width || 0) * (img.height || 0) * 4 * (t.generateMipmaps ? 4 / 3 : 1);
    TEX_STATS.count++;
    t.image = null;
    if (typeof img.close === 'function') img.close();
  }
}

/* ------------------------------------------------------------------------------------------------
   Game flow
   ------------------------------------------------------------------------------------------------ */

function newSeed() {
  try {
    const a = new Uint32Array(1);
    crypto.getRandomValues(a);
    return a[0] >>> 0;
  } catch {
    return (Math.random() * 4294967295) >>> 0;
  }
}

function newGame(skipIntro = false) {
  closeAllMenus();
  resetGameState(newSeed());
  spawnAll(GAME.seed);
  resetSnitch();
  recount();
  GAME.dirty = true;
  startPlay();
  if (!skipIntro) {
    openMenu('letter', { text: TXT.letterIntro, title: TXT.letterTitle, onClose: () => { GAME.flags.introSeen = true; tipOnce('tipPick'); } });
  } else tipOnce('tipPick');
  saveNow('new');
}

function continueGame() {
  closeAllMenus();
  if (SAVE.latest && SAVE.latest.data && SAVE.loadedSeq !== SAVE.latest.seq) {
    applySaveData(SAVE.latest.data);
    SAVE.loadedSeq = SAVE.latest.seq;
  }
  startPlay();
}

function startPlay() {
  GAME.phase = 'play';
  MENU.blocking = false;
  UI.hud.classList.remove('off');
  applyCamera();
  backGuard();
  UI_DIRTY.hud = true;
  UI_DIRTY.stack = true;
  UI_DIRTY.card = true;
  if (!LOOP.firstPlayAt) LOOP.firstPlayAt = performance.now();
  // A save made during the fly-through (tab closed, reload) has every figurine sorted but no finale yet:
  // the finale is otherwise only triggered by a placement, so replay it on continue.
  if (GAME.totalCounted > 0 && GAME.sorted >= GAME.totalCounted && !GAME.flags.finaleDone) startFinale();
}

function resumePlay() {
  UI_DIRTY.card = true;
}

function pauseGame(reason) {
  if (GAME.phase !== 'play' || (MENU.current && MENU.current.id === 'pause')) return;
  closeAllMenus();
  openMenu('pause');
  if (reason === 'pad') notice(TXT.padLost, 6000);
  if (GAME.dirty) saveNow('pause');
}

/** @param {boolean} saved false when the save written on the way out failed or storage is unavailable */
function toTitle(saved = true) {
  GAME.phase = 'title';
  closeAllMenus();
  const stored = SAVE.available ? readSaves() : null;
  if (saved && stored) SAVE.latest = stored;
  else {
    // Nothing could be stored: keep the running shift in memory so 'Folytatás' still resumes it
    // (the seq equals the loaded one, so continueGame() does not re-apply older data).
    SAVE.latest = { seq: SAVE.loadedSeq, slot: SAVE.nextSlot, savedAt: Date.now(), data: { sortedCount: GAME.sorted }, memory: true };
  }
  openMenu('title');
}

let backGuardOn = false;
/**
 * History sentinel: in Edge's Browsing Controls mode B is the browser's Back, so a pushed entry turns it into an
 * in-game back (close the open submenu, or pause during play) instead of leaving the page. Armed at boot and
 * re-armed on the first user input, because Chromium may skip entries pushed before any user activation.
 */
function backGuard(force = false) {
  if (backGuardOn && !force) return;
  try {
    history.pushState({ hv: 1 }, '');
    if (!backGuardOn) window.addEventListener('popstate', onBackNavigation);
    backGuardOn = true;
  } catch {
    /* history may be unavailable in a sandboxed frame */
  }
}

function onBackNavigation() {
  try {
    history.pushState({ hv: 1 }, '');
  } catch {
    /* optional */
  }
  const now = performance.now();
  BROWSE.popBackT = now;
  // The same B press may also have been read through the Gamepad API already.
  if (now - BROWSE.padBackT < 350) return;
  const m = MENU.current;
  if (m) {
    if (m.id !== 'title' && m.onBack) {
      sfx('back');
      m.onBack();
    }
    return;
  }
  if (GAME.phase === 'play') pauseGame('back');
}

/* ------------------------------------------------------------------------------------------------
   Per-frame update
   ------------------------------------------------------------------------------------------------ */

function handleGlobalInput() {
  const P = IN.pressed;
  if (P.any && !GAME.firstInput) {
    GAME.firstInput = true;
    backGuard(true);
    if (MENU.current && MENU.current.id === 'title') renderMenu('title', {}, MENU.current.index);
  }
  if (P.padFound && GAME.phase === 'play') toast(TXT.padConnected);
  if (GAME.phase !== 'play' || MENU.open) return;
  if (P.padLost) {
    pauseGame('pad');
    return;
  }
  if (P.pause) {
    IN.consume('pause');
    IN.consume('back');
    pauseGame('menu');
    return;
  }
  // Consume the opening press: menuInput runs later in the same tick and would otherwise treat the same X / Tab
  // press as "close the map" (the map opened and closed in one frame).
  if (P.map) {
    IN.consume('map');
    IN.consume('tabNext');
    openMenu('map', { tab: 0 });
    return;
  }
  if (P.missing) {
    IN.consume('missing');
    IN.consume('down');
    openMenu('missing');
    return;
  }
}

function handleActions() {
  if (GAME.phase !== 'play' || MENU.open) return;
  const P = IN.pressed;
  if (P.info) {
    SETTINGS.details = !SETTINGS.details;
    storeSettings();
    UI_DIRTY.card = true;
    CARD_STATE.key = '';
  }
  if (P.interact && AIM.inter) interact(AIM.inter);
  if (P.pick) actionPick();
  if (P.place) actionPlace();
  if (P.throwRelease) actionThrow();
  if (P.drop) actionDrop();
  if (P.cycle) actionCycle();
  if (P.flourish) actionFlourish();
  if (P.spell1) castSpell('lumos');
  if (P.spell2) castSpell('invito');
  if (P.spell3) castSpell('path');
  if (P.throwStart && GAME.stack.length) tipOnce('tipThrow');
}

const TITLE_CAM = { t: 0 };
function updateTitleCamera(dt) {
  TITLE_CAM.t += dt;
  const a = TITLE_CAM.t * 0.045;
  camera.position.set(Math.sin(a) * 3.2 + 0.5, 2.65 + Math.sin(a * 1.7) * 0.15, 2.4 + Math.cos(a) * 1.5);
  tm1.lookAt(camera.position, tv1.set(0, 1.9, -2.2), UP_AXIS);
  camera.quaternion.setFromRotationMatrix(tm1);
  ZOOM.k = 0;
  if (camera.fov !== SETTINGS.fov) {
    camera.fov = SETTINGS.fov;
    camera.updateProjectionMatrix();
    if (kit && kit.setLodZoom) kit.setLodZoom(1);
  }
  camera.updateMatrixWorld();
}

function simulate(dt) {
  const t = LOOP.t;
  const playing = GAME.phase === 'play';
  const paused = MENU.open && MENU.blocking;
  if (playing && !paused) {
    GAME.playS += dt;
    handleActions();
    updatePlayer(dt, true);
    applyCamera();
    updateAim();
    LOOP.physAcc += dt;
    let steps = 0;
    while (LOOP.physAcc >= 1 / 60 && steps < 5) {
      stepPhysics(1 / 60);
      LOOP.physAcc -= 1 / 60;
      steps++;
    }
    if (steps >= 5) LOOP.physAcc = 0;
    updateScripts(dt);
    updateInvito(dt);
    updateNifflers(dt, t);
    updateSnitch(dt, t);
    updateWaterBomb(dt, t);
    updateElves(dt);
    updateSpells(dt, t);
    updateRecovery(dt);
    updateShudders(dt);
    updateFlourish(dt);
    updateCasting(dt);
  } else if (playing && paused) {
    applyCamera();
  } else if (GAME.phase === 'title') {
    updateTitleCamera(dt);
    updateSnitch(dt, t);
    updateNifflers(dt, t);
  } else if (GAME.phase === 'finale') {
    updateFinale(dt);
    updateScripts(dt);
    updateSnitch(dt, t);
  }
  updateShimmer(dt);
  updateStackView(t, dt);
  updateHighlight(dt, t);
  updateGlints(t);
  updatePuffs(dt);
  updateAimFx(t, dt);
  updateMarkers();
  updateBlobs();
}

function updatePerf(dt) {
  LOOP.fpsAcc += dt;
  LOOP.frames++;
  if (LOOP.fpsAcc < 0.5) return;
  LOOP.fps = Math.round(LOOP.frames / LOOP.fpsAcc);
  LOOP.fpsAcc = 0;
  LOOP.frames = 0;
  if (!SETTINGS.perf) return;
  const i = renderer.info;
  const c = renderer.domElement;
  UI.perf.textContent = `${LOOP.fps} fps\n${i.render.calls} rajzhívás\n${(i.render.triangles / 1000).toFixed(0)} ezer háromszög\n${c.width}×${c.height} (${Math.round(renderScale * 100)} %)\n${i.memory.geometries} geometria · ${i.memory.textures} textúra`;
}

function frame() {
  const now = performance.now();
  const raw = LOOP.last ? (now - LOOP.last) / 1000 : 1 / 60;
  LOOP.last = now;
  tick(Math.min(raw, 0.1), true, raw);
}

/** Counts exceptions caught by the frame loop; only the first few are logged so a recurring error cannot flood the console. */
const LOOP_ERRORS = { count: 0 };

function loopError(stage, err) {
  LOOP_ERRORS.count++;
  if (LOOP_ERRORS.count <= 5) console.warn(`[loop] ${stage} failed (the game keeps running)`, err);
}

// Every stage is guarded: three.js only requests the next animation frame after the callback returns,
// so a single uncaught exception would freeze the game for good (fatal on a controller-only Xbox).
function tick(dt, doRender, raw = dt) {
  LOOP.t += dt;
  try {
    IN.poll(dt);
    handleGlobalInput();
    if (MENU.open) menuInput(dt);
  } catch (err) {
    loopError('input', err);
  }
  try {
    simulate(dt);
    saveTick();
    animateWorld(LOOP.t, dt);
    updateExternal();
    if (kit) kit.update(LOOP.t, camera);
    audioTick(dt);
  } catch (err) {
    loopError('simulation', err);
  }
  if (doRender && !renderHold) {
    LOOP.renderAcc += raw;
    if (LOOP.renderAcc >= 1 / 60 - 0.004 || raw > 1 / 75) {
      LOOP.renderAcc = Math.min(LOOP.renderAcc - 1 / 60, 1 / 60);
      if (LOOP.renderAcc < 0) LOOP.renderAcc = 0;
      try {
        renderer.info.reset();
        if (SETTINGS.quality === 'magas' && composer) composer.render(dt);
        else renderer.render(scene, camera);
        dynamicResolution(Math.max(raw, 1 / 60));
        updatePerf(Math.max(raw, 1 / 60));
      } catch (err) {
        loopError('render', err);
      }
    }
  }
  try {
    updateHud(dt);
  } catch (err) {
    loopError('hud', err);
  }
  if (GAME.phase === 'play' && !LOOP.ready) {
    LOOP.ready = true;
    DEBUG_API.ready = true;
  }
  if (LOOP.ready && !LOOP.extDone && performance.now() - LOOP.firstPlayAt > 2000) {
    LOOP.extDone = true;
    loadExternalModelsOnce().catch((err) => console.warn('[figures] external loading', err));
  }
  if (!AUDIO.hinted && GAME.firstInput && AUDIO.ctx && AUDIO.ctx.state === 'suspended' && LOOP.t > 8) {
    AUDIO.hinted = true;
    notice(TXT.audioHint);
  }
}

    };

  step(n = 1, dt = 1 / 60) {

    PLAYER.pos.set(x, 0, z);
    PLAYER.yaw = yaw;
